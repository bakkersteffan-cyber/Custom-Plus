/* ---------- zendingen (De Reis) ---------- */
function shipmentSubLine(s, events){
  var SHIP = window.CP_SHIPPING;
  var tpl = SHIP.milestonesFor(s.type);
  var evByKey = {};
  events.forEach(function(ev){ evByKey[ev.milestoneKey] = ev; });
  var last = null;
  tpl.forEach(function(ms){ if(evByKey[ms.key]) last = ms; });
  var parts = [ last ? 'Laatste mijlpaal: ' + last.label : 'Nog geen mijlpaal afgevinkt' ];
  if(s.blNumber) parts.push('B/L ' + s.blNumber);
  if(!s.deliveredAt && s.etaWindowStart && s.etaWindowEnd){
    parts.push('ETA ' + fmtDate(s.etaWindowStart) + ' – ' + fmtDate(s.etaWindowEnd));
  }
  return parts.join(' · ');
}
function buildShipmentAdminCard(pid, project, client, s, events){
  var SHIP = window.CP_SHIPPING;
  var tpl = SHIP.milestonesFor(s.type);
  var evByKey = {};
  events.forEach(function(ev){ evByKey[ev.milestoneKey] = ev; });
  var nextIdx = -1;
  for(var i=0;i<tpl.length;i++){ if(!evByKey[tpl[i].key]){ nextIdx = i; break; } }
  var doneCount = tpl.filter(function(ms){ return !!evByKey[ms.key]; }).length;

  var carrier = SHIP.CARRIERS[s.carrierCode] || null;
  var nr = s.containerNumber || s.trackingNumber;
  var title = SHIP.typeLabel(s.type) + (carrier ? ' · ' + carrier.name : '') + (nr ? ' · ' + nr : '');

  var det = el('details', { class:'shipdet' });
  if(!s.deliveredAt) det.open = true;
  det.appendChild(el('summary', { class:'rowitem' }, [
    el('span', { class:'chip ' + (s.deliveredAt ? 'done' : 'current'), text: s.deliveredAt ? 'Geleverd' : 'Actief' }),
    el('div', { class:'rowmain' }, [
      el('div', { class:'rowtitle', text:title }),
      el('div', { class:'rowsub', text: shipmentSubLine(s, events) })
    ]),
    el('span', { class:'rowmeta', text: doneCount + '/' + tpl.length })
  ]));

  tpl.forEach(function(ms, idx){
    var ev = evByKey[ms.key];
    if(ev){
      var metaParts = [ fmtDate(ev.occurredAt) ];
      if(ev.location) metaParts.push(ev.location);
      det.appendChild(el('div', { class:'shiprow' }, [
        el('span', { class:'chip done', text:'✓' }),
        el('span', { class:'ms-label', text: ms.label + (ev.note ? ' — ' + ev.note : '') }),
        el('span', { class:'ms-meta', text: metaParts.join(' · ') })
      ]));
    } else if(idx===nextIdx && !s.deliveredAt){
      var dt = el('input', { class:'input dt', type:'date', value:todayISO(), 'aria-label':'Datum van ' + ms.label });
      var loc = el('input', { class:'input loc', type:'text', placeholder:'Locatie (optioneel)', 'aria-label':'Locatie bij ' + ms.label });
      var nt = el('input', { class:'input nt', type:'text', placeholder:'Notitie (optioneel)', 'aria-label':'Notitie bij ' + ms.label });
      var btn = el('button', { type:'button', class:'btn small', text:'Vink af' });
      btn.addEventListener('click', function(){
        btn.disabled = true;
        var locVal = loc.value.trim();
        DS.addShipmentEvent(pid, s.id, {
          milestoneKey: ms.key, label: ms.label,
          occurredAt: dt.value || todayISO(), location: locVal, note: nt.value.trim()
        }).then(function(){
          notifyClient({
            client: client, projectName: project.name, projectCode: project.code,
            page: 'zendingen', portalLabel: 'Volg je zending',
            subject: 'Je zending is een stap verder — ' + ms.label,
            bodyLine: 'Nieuwe mijlpaal: ' + ms.label + (locVal ? ' · ' + locVal : '') + '.'
          });
          refresh();
        }).catch(function(ex){ btn.disabled = false; showError(ex); });
      });
      det.appendChild(el('div', { class:'shipcheck' }, [
        el('span', { style:'flex:0 1 auto;font-weight:600;font-size:13.5px;', text:ms.label }),
        dt, loc, nt, btn
      ]));
    } else {
      det.appendChild(el('div', { class:'shiprow openms' }, [
        el('span', { class:'chip', text:('0' + (idx+1)).slice(-2) }),
        el('span', { class:'ms-label', text:ms.label })
      ]));
    }
  });

  var foot = el('div', { class:'shipfoot' });
  var etaTxt;
  if(s.deliveredAt) etaTxt = 'Geleverd op ' + fmtDate(s.deliveredAt);
  else if(s.etaWindowStart && s.etaWindowEnd){
    etaTxt = 'ETA: ' + fmtDate(s.etaWindowStart) + ' – ' + fmtDate(s.etaWindowEnd)
      + (s.etaNote ? ' · ' + s.etaNote : '')
      + (s.etaUpdatedAt ? ' · bijgewerkt ' + fmtDate(s.etaUpdatedAt) : '');
  } else etaTxt = 'Nog geen ETA ingevuld';
  foot.appendChild(el('span', { class:'rowsub', style:'flex:1 1 220px;min-width:0;', text:etaTxt }));
  if(!s.deliveredAt){
    foot.appendChild(el('button', { type:'button', class:'btn ghost small', text:'ETA bijwerken', onclick:function(){ openEtaModal(s); } }));
  }
  if(nr){
    var track = (carrier && carrier.trackUrl) ? carrier : SHIP.CARRIERS.anders;
    foot.appendChild(el('a', {
      class:'btn ghost small', href:track.trackUrl(nr),
      target:'_blank', rel:'noopener noreferrer', text:'Bekijk bij de vervoerder'
    }));
  }
  det.appendChild(foot);

  return el('div', { class:'card', style:'margin-bottom:12px;' }, det);
}
function openEtaModal(shipment){
  var m = openModal('ETA bijwerken', 'Altijd een weekvenster, nooit een dagbelofte');
  var start = el('input', { class:'input', type:'date', value: shipment.etaWindowStart || '' });
  var end = el('input', { class:'input', type:'date', value: shipment.etaWindowEnd || '' });
  var note = el('input', { class:'input', type:'text', value: shipment.etaNote || '', placeholder:'bv. onder voorbehoud van de douane' });
  var err = el('p', { class:'formerr' });
  var form = el('form', { onsubmit:function(e){
    e.preventDefault();
    err.classList.remove('show');
    if(!start.value || !end.value){ err.textContent = 'Vul beide datums van het venster in.'; err.classList.add('show'); return; }
    if(end.value < start.value){ err.textContent = 'Het einde van het venster ligt vóór het begin.'; err.classList.add('show'); return; }
    DS.updateShipmentEta(shipment.id, {
      etaWindowStart: start.value, etaWindowEnd: end.value, etaNote: note.value.trim()
    }).then(function(){ closeModal(); refresh(); })
      .catch(function(ex){ err.textContent = ex.message||String(ex); err.classList.add('show'); });
  } }, [
    el('div', { class:'formrow' }, [ field('Venster van', start), field('Venster tot', end) ]),
    field('Notitie (optioneel)', note),
    err,
    el('div', { class:'modal-actions' }, [
      el('button', { type:'button', class:'btn ghost', text:'Annuleren', onclick:closeModal }),
      el('button', { type:'submit', class:'btn', text:'ETA opslaan' })
    ])
  ]);
  m.body.appendChild(form);
}
function openShipmentModal(projectId, samples, project, client){
  var SHIP = window.CP_SHIPPING;
  var m = openModal('Zending toevoegen', 'Het type bepaalt het mijlpaalsjabloon');

  var type = el('select', { class:'input' });
  SHIP.TYPES.forEach(function(t){ type.appendChild(option(t.key, t.label, t.key==='koerier')); });
  var tplInfo = el('p', { class:'kicker', style:'margin:-6px 0 14px;' });
  function syncTpl(){
    var list = SHIP.milestonesFor(type.value);
    tplInfo.textContent = list.length + ' mijlpalen · ' + list[0].label + ' → ' + list[list.length-1].label;
  }
  type.addEventListener('change', syncTpl);
  syncTpl();

  var carrier = el('select', { class:'input' });
  SHIP.CARRIER_ORDER.forEach(function(code){
    var c = SHIP.CARRIERS[code];
    carrier.appendChild(option(code, c.name + (code==='anders' ? ' (vangnet)' : ''), code==='dhl'));
  });

  var nr = el('input', { class:'input', type:'text', placeholder:'bv. MSKU1234565 of een koeriernummer' });
  var nrHint = el('p', { class:'nrhint', 'aria-live':'polite' });
  nr.addEventListener('input', function(){
    var v = nr.value.trim();
    nrHint.classList.remove('ok');
    nrHint.classList.remove('bad');
    if(!v){ nrHint.textContent = ''; return; }
    if(SHIP.isContainerFormat(v)){
      if(SHIP.isoCheck(v)){
        nrHint.textContent = 'Containernummer — controlecijfer klopt (ISO 6346)';
        nrHint.classList.add('ok');
      } else {
        nrHint.textContent = 'Containernummer — controlecijfer klopt niet (ISO 6346)';
        nrHint.classList.add('bad');
      }
    } else {
      nrHint.textContent = 'Herkend als trackingnummer (geen container)';
    }
  });

  var bl = el('input', { class:'input', type:'text', placeholder:'Alleen bij zeevracht' });
  var sampleSel = el('select', { class:'input' });
  sampleSel.appendChild(option('', 'Geen sampleronde', true));
  (samples||[]).slice().sort(function(a,b){ return String(a.roundDate).localeCompare(String(b.roundDate)); }).forEach(function(sm){
    sampleSel.appendChild(option(sm.id, sm.roundLabel + ' · ' + fmtDate(sm.roundDate)));
  });
  var etaStart = el('input', { class:'input', type:'date' });
  var etaEnd = el('input', { class:'input', type:'date' });
  var etaNote = el('input', { class:'input', type:'text', placeholder:'bv. onder voorbehoud van de douane' });
  var err = el('p', { class:'formerr' });

  var form = el('form', { onsubmit:function(e){
    e.preventDefault();
    err.classList.remove('show');
    var rawNr = nr.value.trim();
    var isCont = SHIP.isContainerFormat(rawNr);
    if((etaStart.value && !etaEnd.value) || (!etaStart.value && etaEnd.value)){
      err.textContent = 'Vul het ETA venster met twee datums, of laat beide leeg.'; err.classList.add('show'); return;
    }
    if(etaStart.value && etaEnd.value < etaStart.value){
      err.textContent = 'Het einde van het ETA venster ligt vóór het begin.'; err.classList.add('show'); return;
    }
    DS.addShipment(projectId, {
      type: type.value,
      carrierCode: carrier.value,
      trackingNumber: isCont ? '' : rawNr,
      containerNumber: isCont ? SHIP.normalize(rawNr) : '',
      blNumber: bl.value.trim(),
      sampleRoundId: sampleSel.value || null,
      etaWindowStart: etaStart.value || null,
      etaWindowEnd: etaEnd.value || null,
      etaNote: etaNote.value.trim()
    }).then(function(){
      notifyClient({
        client: client, projectName: project.name, projectCode: project.code,
        page: 'zendingen', portalLabel: 'Volg je zending',
        subject: 'Er staat een zending voor je klaar — ' + project.name,
        bodyLine: 'Steffan heeft een ' + (SHIP.typeLabel ? SHIP.typeLabel(type.value) : type.value) + ' aangemaakt. Je kunt de reis vanaf nu volgen in je portaal.'
      });
      closeModal(); refresh();
    }).catch(function(ex){ err.textContent = ex.message||String(ex); err.classList.add('show'); });
  } }, [
    el('div', { class:'formrow' }, [ field('Type', type), field('Vervoerder', carrier) ]),
    tplInfo,
    field('Tracking of containernummer', nr),
    nrHint,
    el('div', { class:'formrow' }, [ field('B/L nummer (optioneel)', bl), field('Sampleronde (optioneel)', sampleSel) ]),
    el('div', { class:'formrow' }, [ field('ETA venster van', etaStart), field('ETA venster tot', etaEnd) ]),
    field('ETA notitie (optioneel)', etaNote),
    err,
    el('div', { class:'modal-actions' }, [
      el('button', { type:'button', class:'btn ghost', text:'Annuleren', onclick:closeModal }),
      el('button', { type:'submit', class:'btn', text:'Zending toevoegen' })
    ])
  ]);
  m.body.appendChild(form);
}

function renderFactories(){
  return DS.listFactories().then(function(factories){
    content.appendChild(el('div', { class:'pagehead' }, [
      el('div', null, [
        el('span', { class:'kicker', text:'Partnernetwerk' }),
        el('h1', { text:'Fabrieken' })
      ])
    ]));
    content.appendChild(el('p', {
      style:'font-size:14px;color:var(--gray-69);margin:-8px 0 18px;max-width:64ch;',
      text:'De stad bepaalt de pin op de kaart in het klantportaal — alleen stadsniveau, nooit een adres. Laat leeg om geen pin te tonen.'
    }));

    var cities = Object.keys(window.CP_CITY_COORDS || {});
    var list = el('div', { class:'card rowlist' });
    if(!factories.length){
      list.appendChild(el('div', { class:'empty', text:'Nog geen fabrieken in het netwerk.' }));
    }
    factories.forEach(function(f){
      var sel = el('select', { class:'input', style:'width:210px;flex:0 0 210px;', 'aria-label':'Stad van ' + f.name });
      sel.appendChild(option('', 'Geen stad op de kaart', !f.city));
      cities.forEach(function(c){ sel.appendChild(option(c, c, f.city===c)); });
      /* een stad buiten de preset (bv. uit oudere data) niet stilletjes weggooien */
      if(f.city && cities.indexOf(f.city)===-1){
        sel.appendChild(option(f.city, f.city + ' (geen kaartpositie)', true));
      }
      var flash = el('span', { class:'saveflash', text:'Opgeslagen' });
      sel.addEventListener('change', function(){
        DS.setFactoryCity(f.id, sel.value).then(function(){
          f.city = sel.value; /* zodat een latere mislukte poging naar de laatst opgeslagen stad terugvalt */
          flash.classList.add('show');
          setTimeout(function(){ flash.classList.remove('show'); }, 1600);
        }).catch(function(ex){
          sel.value = f.city || '';
          showError(ex);
        });
      });
      var subParts = [];
      if(f.region) subParts.push(f.region);
      if(f.nnnSignedAt) subParts.push('NNN getekend ' + fmtDate(f.nnnSignedAt));
      list.appendChild(el('div', { class:'rowitem' }, [
        el('div', { class:'rowmain' }, [
          el('div', { class:'rowtitle', text:f.name }),
          el('div', { class:'rowsub', text:subParts.join(' · ') || '—' })
        ]),
        flash,
        sel
      ]));
    });
    content.appendChild(el('div', { class:'section' }, list));
  });
}

function renderQuestions(){
  return Promise.all([
    DS.listQuestions(), DS.listAllProjects(), DS.listClients(), DS.listAllMedia()
  ]).then(function(res){
    var questions = res[0], projects = res[1], clients = res[2], media = res[3];
    var pmap = {}, cmap = {}, mmap = {};
    projects.forEach(function(p){ pmap[p.id]=p; });
    clients.forEach(function(c){ cmap[c.id]=c; });
    media.forEach(function(mrow){ mmap[mrow.id]=mrow; });

    function ctxLine(q){
      var p = pmap[q.projectId];
      var c = p ? cmap[p.clientId] : null;
      var parts = [];
      if(p) parts.push(p.name);
      if(c) parts.push(c.company);
      if(q.stageKey) parts.push(stageLabel(q.stageKey));
      return parts.join(' · ');
    }
    function thumbFor(q){
      var mrow = q.mediaId ? mmap[q.mediaId] : null;
      if(!mrow) return null;
      var img = el('img', { class:'qthumb', alt:'' });
      DS.mediaUrl(mrow).then(function(u){ if(u) img.src=u; });
      return img;
    }
    /* herbestelaanvragen uit "Mijn Producten" (portal) beginnen met een
       vast voorvoegsel en krijgen hier een groene badge */
    function reorderChip(q){
      if(String(q.question||'').indexOf('HERBESTELLING:')!==0) return null;
      return el('span', { class:'chip done', text:'Herbestelling' });
    }

    var open = questions.filter(function(q){ return !q.answeredAt; })
      .sort(function(a,b){ return String(b.askedAt).localeCompare(String(a.askedAt)); });
    var answered = questions.filter(function(q){ return q.answeredAt; })
      .sort(function(a,b){ return String(b.answeredAt).localeCompare(String(a.answeredAt)); });

    content.appendChild(el('div', { class:'pagehead' }, [
      el('div', null, [
        el('span', { class:'kicker', text:'Van klanten, over foto’s en fases' }),
        el('h1', { text:'Vragen' })
      ])
    ]));

    if(!open.length){
      content.appendChild(el('div', { class:'card empty section', text:'Geen openstaande vragen. Alles is beantwoord.' }));
    }
    open.forEach(function(q){
      var ta = el('textarea', { class:'input', 'aria-label':'Antwoord op vraag', placeholder:'Je antwoord aan de klant' });
      var err = el('p', { class:'formerr' });
      var card = el('div', { class:'card qcard', style:'margin-bottom:14px;' }, [
        el('div', { class:'qhead' }, [
          thumbFor(q),
          el('div', { class:'rowmain' }, [
            el('div', { style:'display:flex;align-items:center;gap:8px;flex-wrap:wrap;' }, [
              el('span', { class:'kicker', text:ctxLine(q) + ' · ' + fmtDateTime(q.askedAt) }),
              reorderChip(q)
            ]),
            el('div', { class:'qtext', text:q.question })
          ])
        ]),
        el('div', { class:'qanswer' }, [
          ta, err,
          el('div', { style:'margin-top:10px;display:flex;justify-content:flex-end;' },
            el('button', { type:'button', class:'btn small', text:'Beantwoord', onclick:function(){
              var a = ta.value.trim();
              if(!a){ err.textContent = 'Schrijf eerst een antwoord.'; err.classList.add('show'); return; }
              DS.answerQuestion(q.id, a).then(function(){
                var p = pmap[q.projectId];
                var c = p ? cmap[p.clientId] : null;
                if(p && c){
                  notifyClient({
                    client: c, projectName: p.name, projectCode: p.code,
                    page: 'updates', portalLabel: 'Bekijk het antwoord',
                    subject: 'Antwoord op je vraag — ' + p.name,
                    bodyLine: 'Steffan heeft gereageerd op je vraag: “' + q.question + '”'
                  });
                }
                refresh();
              }).catch(function(ex){ err.textContent = ex.message||String(ex); err.classList.add('show'); });
            } }))
        ])
      ]);
      content.appendChild(card);
    });

    if(answered.length){
      var det = el('details', { class:'answered card', style:'margin-top:22px;' });
      det.appendChild(el('summary', null, 'Beantwoorde vragen (' + answered.length + ')'));
      var inner = el('div', { style:'padding:0 18px 18px;' });
      answered.forEach(function(q){
        inner.appendChild(el('div', { style:'padding:14px 0;border-top:1px solid var(--line);' }, [
          el('div', { style:'display:flex;align-items:center;gap:8px;flex-wrap:wrap;' }, [
            el('span', { class:'kicker', text:ctxLine(q) + ' · gevraagd ' + fmtDateTime(q.askedAt) }),
            reorderChip(q)
          ]),
          el('div', { class:'qtext', style:'font-size:14.5px;', text:q.question }),
          el('div', { class:'qanswered' }, [
            el('span', { class:'kicker', text:'Antwoord · ' + fmtDateTime(q.answeredAt) }),
            el('div', { style:'margin-top:4px;', text:q.answer })
          ])
        ]));
      });
      det.appendChild(inner);
      content.appendChild(det);
    }
  });
}

         storage-sleutel geven waarschuwingen en token-refresh-races */
      if(!window.__cpSb) window.__cpSb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
      sb = window.__cpSb;
      return sb.auth.signInWithPassword({ email: email.value.trim(), password: pass.value });
    }).then(function(res){
      if(res.error){
        var msg = /invalid login credentials/i.test(res.error.message||'')
          ? 'E-mail of wachtwoord klopt niet.'
          : 'Inloggen lukte niet: ' + res.error.message;
        throw new Error(msg);
      }
      var userId = res.data.user.id;
      return sb.from('staff_users').select('user_id').eq('user_id', userId).maybeSingle().then(function(staffRes){
        if(staffRes.error) throw new Error('Kon de beheerrechten niet controleren: ' + staffRes.error.message);
        if(!staffRes.data){
          return sb.auth.signOut().then(function(){
            throw new Error('Dit account heeft geen beheerrechten.');
          });
        }
        DS = makeSupaService(sb, res.data.user);
        enterApp();
      });
    }).catch(function(ex){
      err.textContent = ex.message || String(ex);
      err.classList.add('show');
    }).then(function(){ submit.disabled = false; });
  } }, [
    field('E-mail', email),
    field('Wachtwoord', pass),
    submit,
    err
  ]);
  loginBody.appendChild(el('p', { text:'Log in met je beheeraccount.' }));
  loginBody.appendChild(form);
}
document.getElementById('logoutBtn').addEventListener('click', function(){
  DS = null;
  /* in Supabase-modus ook écht uitloggen: anders blijft het staff-token
     in localStorage staan na "Uitloggen" */
  if(!IS_DEMO && window.__cpSb) window.__cpSb.auth.signOut();
  appEl.hidden = true;
  loginEl.hidden = false;
  if(IS_DEMO) buildDemoLogin(); else buildSupaLogin();
});
document.querySelectorAll('.navbtn').forEach(function(b){
  b.addEventListener('click', function(){
    var nav = b.getAttribute('data-nav');
    go({ name:nav==='clients' ? 'clients' : nav });
  });
});

if(IS_DEMO) buildDemoLogin(); else buildSupaLogin();
})();
</script>
</body>
</html>
