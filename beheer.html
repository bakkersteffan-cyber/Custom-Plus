function renderClient(clientId){
  return Promise.all([
    DS.getClient(clientId), DS.listClientProjects(clientId), DS.listQuestions(),
    DS.listMailLog ? DS.listMailLog() : Promise.resolve([]),
    DS.listAllInvoices(), DS.listAllShipments(), DS.listLog(null),
    DS.listContactMoments ? DS.listContactMoments(clientId) : Promise.resolve([]),
    DS.getSettings(),
    DS.listContacts ? DS.listContacts(clientId) : Promise.resolve([])
  ]).then(function(res){
    var c = res[0], projects = res[1], questions = res[2] || [], mailRows = res[3] || [];
    var allInvoices = res[4] || [], allShipments = res[5] || [], logRows = res[6] || [];
    var moments = res[7] || [], settings = res[8], contacts = res[9] || [];
    adminSettings = settings;
    if(!c){
      content.appendChild(el('p', { text:'Klant niet gevonden.' }));
      return;
    }
    /* openstaande herbestelaanvragen (uit "Mijn Producten" in de portal)
       per project van deze klant — groene badge op de klantkaart */
    var reorderByProject = {};
    var pidSet = {};
    projects.forEach(function(p){ pidSet[p.id] = true; });
    questions.forEach(function(q){
      if(pidSet[q.projectId] && !q.answeredAt && String(q.question||'').indexOf('HERBESTELLING:')===0){
        reorderByProject[q.projectId] = true;
      }
    });
    var hasReorder = Object.keys(reorderByProject).length > 0;

    /* gezondheid + lifecycle (functies 23/25) */
    var health = computeClientHealth(c, projects, questions, allInvoices, logRows, moments, mailRows);
    /* nieuw-apparaat-signalering (functie 33): alleen op echte apparaatinfo
       uit het toegangslogboek; regels zonder apparaatinfo tellen niet mee */
    var devices = computeNewDevices(logRows, projects);
    var newDevice = devices.perClient[clientId] || null;
    var overrides = settings.lifecycleOverrides || {};
    var lc = clientLifecycle(c, projects, health, overrides);

    /* lifecycle handmatig overschrijfbaar (23) */
    var lcSel = el('select', { class:'input ownersel', 'aria-label':'Lifecycle-status van deze klant' });
    lcSel.appendChild(option('', 'Automatisch (' + lifecycleLabel(clientLifecycle(c, projects, health, {}).key) + ')', !lc.manual));
    LIFECYCLES.forEach(function(l){ lcSel.appendChild(option(l.key, l.label, lc.manual && lc.key===l.key)); });
    lcSel.addEventListener('change', function(){
      var next = clone(overrides);
      if(lcSel.value) next[clientId] = lcSel.value;
      else delete next[clientId];
      DS.saveSetting('lifecycleOverrides', next).then(function(){
        if(adminSettings) adminSettings.lifecycleOverrides = next;
        refresh();
      }).catch(showError);
    });

    content.appendChild(el('button', { type:'button', class:'backbtn', text:'← Alle klanten', onclick:function(){ go({ name:'clients' }); } }));
    content.appendChild(el('div', { class:'pagehead' }, [
      el('div', null, [
        el('span', { class:'kicker', text:'Klant sinds ' + fmtDate(c.createdAt) }),
        el('h1', { text:c.company })
      ]),
      el('div', { style:'display:flex;gap:8px;align-items:center;flex-wrap:wrap;' }, [
        hasReorder ? el('span', { class:'chip done', text:'Herbestelling' }) : null,
        /* nieuw-apparaat-badge (functie 33): alleen bij een echt signaal
           uit de laatste 14 dagen */
        newDevice ? el('span', { class:'chip awaiting', title:'Onbekende apparaat/regio-combinatie: ' + newDevice.combo, text:'Nieuw apparaat' }) : null,
        el('span', { class:'chip' + (lc.key==='actief' ? ' done' : ''), text: lifecycleLabel(lc.key) + (lc.manual ? ' ✎' : '') }),
        lcSel,
        /* golf 7 — bewerk-alles: bedrijf/contact/e-mail/telefoon nabewerken */
        el('button', { type:'button', class:'btn ghost small', text:'Bewerk', onclick:function(){ openClientEditModal(c); } }),
        /* bekijk als klant (functie 46) */
        el('button', { type:'button', class:'btn ghost small', text:'Bekijk als klant', onclick:function(){ openViewAsClient(c); } })
      ])
    ]));

    function scrollToId(id){
      return function(){
        var t = document.getElementById(id);
        if(t) t.scrollIntoView({ block:'start' });
      };
    }

    /* klantkop-samenvatting (functie 24): live berekend, elke waarde klikt door */
    var activeN = projects.filter(function(p){ return p.status!=='archived'; }).length;
    var openTxt = Object.keys(health.openSum).map(function(cur){ return fmtMoneyCur(health.openSum[cur], cur); }).join(' + ') || '—';
    var todayIso = todayISO();
    var nextEta = null, pastEta = null;
    allShipments.forEach(function(s){
      if(!pidSet[s.projectId] || s.deliveredAt || !s.etaWindowEnd) return;
      var end = String(s.etaWindowEnd).slice(0,10);
      if(end >= todayIso){ if(!nextEta || end < String(nextEta.etaWindowEnd).slice(0,10)) nextEta = s; }
      else { if(!pastEta || end > String(pastEta.etaWindowEnd).slice(0,10)) pastEta = s; }
    });
    var etaTxt = nextEta
      ? fmtDate(nextEta.etaWindowStart) + ' – ' + fmtDate(nextEta.etaWindowEnd)

        'Het portaal opent standaard in deze taal; klantmails uit de sjablonenbibliotheek gebruiken automatisch NL of EN. Een uitgezette mailcategorie wordt gelogd als “niet verstuurd (voorkeur uit)” — er verdwijnt nooit stil iets.' }),

/* ============================================================
   golf 6 — toegangsherstel + sessies intrekken (functie 32)
   Geen wachtwoorden in het beheer: herstel loopt via de reset-mail van
   Supabase Auth (anon-key-pad), intrekken via een Netlify-functie met de
   service-role key (netlify/functions/admin-revoke-sessions.mjs) — de
   admin-API-sleutel hoort nooit in de browser.
   ============================================================ */
function openAccessRecoveryModal(client){
  var m = openModal('Toegangsherstel', 'Stuurt de klant een wachtwoordherstel-link — jij ziet nooit een wachtwoord');
  if(IS_DEMO){
    m.body.appendChild(el('p', { style:'font-size:14px;color:var(--gray-69);max-width:64ch;', text:
      'In demomodus bestaat er geen echt inlogaccount, dus er valt niets te herstellen. Live werkt dit zo: Supabase Auth mailt de klant een beveiligde herstel-link (geldig ~1 uur); de verzending wordt gelogd in het mail-logboek. Kopieer alvast de portal-link voor je klantcommunicatie:' }));
    var linkRow = el('input', { class:'input mono', type:'text', readonly:'readonly', value: PORTAL_BASE, 'aria-label':'Portal-link' });
    var copyBtn = el('button', { type:'button', class:'btn ghost small', text:'Kopieer link' });
    copyBtn.addEventListener('click', function(){ copyToClipboard(PORTAL_BASE, copyBtn); });
    m.body.appendChild(el('div', { style:'display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap;' }, [ linkRow, copyBtn ]));
    m.body.appendChild(el('div', { class:'modal-actions' },
      el('button', { type:'button', class:'btn', text:'Sluiten', onclick:closeModal })));
    return;
  }
  m.body.appendChild(el('p', { style:'font-size:14px;max-width:64ch;', text:
    'Er gaat een wachtwoordherstel-mail naar ' + client.email + '. De link is beperkt geldig en werkt maar één keer.' }));
  var err = el('p', { class:'formerr' });
  m.body.appendChild(err);
  var sendBtn = el('button', { type:'button', class:'btn', text:'Verstuur herstel-mail' });
  sendBtn.addEventListener('click', function(){
    sendBtn.disabled = true;
    if(!window.__cpSb){ err.textContent = 'Geen live verbinding.'; err.classList.add('show'); sendBtn.disabled = false; return; }
    window.__cpSb.auth.resetPasswordForEmail(client.email, { redirectTo: PORTAL_BASE })
      .then(function(res){
        if(res.error) throw new Error(res.error.message);
        /* gelogd in het mail-logboek (mail komt van Supabase Auth, niet Resend) */
        var logP = DS.addMailLog ? DS.addMailLog({
          clientId: client.id, to: client.email, subject:'Wachtwoordherstel — CUSTOM+ portaal',
          category:'relatie', projectName:'', bodyLine:'Herstel-link via Supabase Auth',
          mode:'live', status:'verzonden', messageId:'', note:'via Supabase Auth (geen Resend-id)'
        }).catch(function(){}) : Promise.resolve();
        return logP.then(function(){
          return auditLog({ kind:'toegang', clientId: client.id, detail:'Toegangsherstel-mail verstuurd naar ' + client.email });
        });
      })
      .then(function(){ closeModal(); refresh(); })
      .catch(function(ex){ sendBtn.disabled = false; err.textContent = ex.message||String(ex); err.classList.add('show'); });
  });
  m.body.appendChild(el('div', { class:'modal-actions' }, [
    el('button', { type:'button', class:'btn ghost', text:'Annuleren', onclick:closeModal }),
    sendBtn
  ]));
}
function openRevokeSessionsModal(client){
  var m = openModal('Sessies intrekken', 'Logt de klant op alle apparaten uit — bij een gelekte laptop of vertrokken medewerker');
  if(IS_DEMO){
    m.body.appendChild(el('p', { style:'font-size:14px;color:var(--gray-69);max-width:64ch;', text:
      'In demomodus zijn er geen echte sessies. Live werkt dit zo: een beveiligde serverfunctie (netlify/functions/admin-revoke-sessions.mjs, met de Supabase service-role key die nooit in de browser komt) trekt alle refresh-tokens van dit account in. Op elk apparaat is de klant dan binnen ~een uur uitgelogd; inloggen kan daarna alleen met het (eventueel herstelde) wachtwoord.' }));
    m.body.appendChild(el('div', { class:'modal-actions' },
      el('button', { type:'button', class:'btn', text:'Sluiten', onclick:closeModal })));
    return;
  }
  if(!client.authUserId){
    m.body.appendChild(el('p', { style:'font-size:14px;color:var(--gray-69);max-width:64ch;', text:
      'Aan deze klant is nog geen inlogaccount gekoppeld (auth_user_id is leeg) — er zijn dus geen sessies om in te trekken.' }));
    m.body.appendChild(el('div', { class:'modal-actions' },
      el('button', { type:'button', class:'btn', text:'Sluiten', onclick:closeModal })));
    return;
  }
  m.body.appendChild(el('p', { style:'font-size:14px;max-width:64ch;', text:
    'Alle actieve sessies van ' + client.email + ' worden ingetrokken. Lopende schermen werken nog tot het huidige toegangstoken verloopt (maximaal ~een uur); daarna is overal opnieuw inloggen nodig.' }));
  var err = el('p', { class:'formerr' });
  m.body.appendChild(err);
  var goBtn = el('button', { type:'button', class:'btn danger', text:'Trek alle sessies in' });
  goBtn.addEventListener('click', function(){
    goBtn.disabled = true;
    revokeClientSessions(client)
      .then(function(){ closeModal(); refresh(); })
      .catch(function(ex){ goBtn.disabled = false; err.textContent = ex.message||String(ex); err.classList.add('show'); });
  });
  m.body.appendChild(el('div', { class:'modal-actions' }, [
    el('button', { type:'button', class:'btn ghost', text:'Annuleren', onclick:closeModal }),
    goBtn
  ]));
}
/* het daadwerkelijke intrekken — gedeeld door functie 32 en offboarding (35) */
function revokeClientSessions(client){
  if(!CFG.notifySharedSecret) return Promise.reject(new Error('De serverfunctie is niet geconfigureerd (notifySharedSecret ontbreekt in portal/config.js).'));
  if(!client.authUserId) return Promise.reject(new Error('Geen inlogaccount gekoppeld aan deze klant.'));
  return fetch('/.netlify/functions/admin-revoke-sessions', {
    method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ secret: CFG.notifySharedSecret, userId: client.authUserId })
  }).then(function(r){
    return r.json().then(function(j){ return j; }, function(){ return {}; }).then(function(j){
      if(!r.ok) throw new Error('Intrekken mislukte (' + r.status + ')' + (j && j.error ? ' — ' + j.error : ''));
      return auditLog({ kind:'toegang', clientId: client.id, detail:'Alle sessies ingetrokken voor ' + client.email });
    });
  });
}
/* ============================================================

   Elke stap expliciet aangevinkt; niets gebeurt stil.

function openOffboardModal(client, projects, lc){
  var activeProjects = (projects||[]).filter(function(p){ return p.status!=='archived'; });
  var lang = clientMailLang(client);
  var m = openModal('Klant afronden', client.company + ' — kies wat er gebeurt; elke stap is los aan of uit');
  function stepLine(chk, labelTxt, subTxt){
    return el('div', { style:'margin-bottom:10px;' }, [
      el('label', { class:'checkline' }, [ chk, el('span', { text: labelTxt }) ]),
      subTxt ? el('p', { class:'kicker', style:'margin:2px 0 0 26px;', text: subTxt }) : null
    ]);
  }
  var chkArch = el('input', { type:'checkbox', checked: activeProjects.length>0, disabled: !activeProjects.length });
  var chkRevoke = el('input', { type:'checkbox', checked: !IS_DEMO && !!client.authUserId, disabled: IS_DEMO || !client.authUserId });
  var chkExport = el('input', { type:'checkbox', checked:true });
  var chkMail = el('input', { type:'checkbox', checked:true });
  var chkLc = el('input', { type:'checkbox', checked:true });
  m.body.appendChild(stepLine(chkArch,
    activeProjects.length ? ('Archiveer ' + activeProjects.length + (activeProjects.length===1 ? ' actief project' : ' actieve projecten')) : 'Alle projecten zijn al gearchiveerd',
    activeProjects.length ? activeProjects.map(function(p){ return p.name; }).join(' · ') : null));
  m.body.appendChild(stepLine(chkRevoke,
    'Trek portaaltoegang in',
    IS_DEMO ? 'Demomodus: geen echt account — deze stap bestaat alleen live.'
      : (client.authUserId ? 'Koppelt het inlogaccount los én trekt alle sessies in. Het Auth-account zelf verwijder je desgewenst in het Supabase-dashboard.' : 'Geen inlogaccount gekoppeld — niets in te trekken.')));
  m.body.appendChild(stepLine(chkExport, 'Stel het exportpakket samen',
    'Printbare dossierpagina over alle projecten (fasepad, foto’s, documenten, facturen, rapporten, zendingen) + downloadlijst.'));
  m.body.appendChild(stepLine(chkMail, 'Verstuur de afscheidsmail (' + lang.toUpperCase() + ')',
    'Sjabloon “afscheid” in de portaaltaal van de klant; verschijnt in het mail-logboek.'));
  m.body.appendChild(stepLine(chkLc, 'Zet de klant op Gearchiveerd', 'Handmatige lifecycle-status; altijd terug te draaien op de klantkaart.'));
  var err = el('p', { class:'formerr' });
  m.body.appendChild(err);
  var goBtn = el('button', { type:'button', class:'btn danger', text:'Rond klant af' });
  goBtn.addEventListener('click', function(){
    goBtn.disabled = true;
    err.classList.remove('show');
    var chain = Promise.resolve();
    if(chkArch.checked && activeProjects.length){
      activeProjects.forEach(function(p){
        chain = chain.then(function(){ return DS.archiveProject(p.id); });
      });
      chain = chain.then(function(){
        return auditLog({ kind:'offboarding', clientId: client.id, detail:'Offboarding: ' + activeProjects.length + ' project(en) gearchiveerd' });
      });
    }
    if(chkRevoke.checked && !IS_DEMO && client.authUserId){
      chain = chain
        .then(function(){ return revokeClientSessions(client).catch(function(){ /* intrekken van sessies mag de rest niet blokkeren; de losgekoppelde klantrij is de harde grens */ }); })
        .then(function(){ return DS.revokePortalAccess ? DS.revokePortalAccess(client.id) : null; })
        .then(function(){ return auditLog({ kind:'offboarding', clientId: client.id, detail:'Offboarding: portaaltoegang ingetrokken voor ' + client.email }); });
    }
    if(chkLc.checked){
      chain = chain.then(function(){
        var next = clone((adminSettings && adminSettings.lifecycleOverrides) || {});
        next[client.id] = 'gearchiveerd';
        if(adminSettings) adminSettings.lifecycleOverrides = next;
        return DS.saveSetting('lifecycleOverrides', next);
      });
    }
    if(chkMail.checked){
      chain = chain.then(function(){
        var tpl = getMailTemplate('afscheid', lang);
        var lastProj = (projects||[]).slice().sort(function(a,b){ return String(b.createdAt||'').localeCompare(String(a.createdAt||'')); })[0];
        var vars = {
          naam: (client.contactName||'').split(' ')[0] || client.contactName || '',
          bedrijf: client.company || '',
          project: lastProj ? lastProj.name : (lang==='en' ? 'your product' : 'je product')
        };
        return notifyClient({
          client: client, projectName: lastProj ? lastProj.name : 'CUSTOM+', projectCode:'',
          page:'producten', portalLabel: lang==='en' ? 'View your file' : 'Bekijk je dossier',
          category:'relatie',
          subject: fillTemplate(tpl.subject, vars),
          bodyLine: fillTemplate(tpl.body, vars)
        });
      }).then(function(){
        return auditLog({ kind:'offboarding', clientId: client.id, detail:'Offboarding: afscheidsmail verstuurd' });
      });
    }
    chain.then(function(){
      closeModal();
      if(chkExport.checked) openDossierExport(client, (projects||[]).map(function(p){ return p.id; }));
      refresh();
    }).catch(function(ex){
      goBtn.disabled = false;
      err.textContent = ex.message||String(ex);
      err.classList.add('show');
    });
  });
  m.body.appendChild(el('div', { class:'modal-actions' }, [
    el('button', { type:'button', class:'btn ghost', text:'Annuleren', onclick:closeModal }),
    goBtn
  ]));
}

/* ============================================================
   golf 6 — projectdossier-export (functie 60)
   Eén printvriendelijke pagina (window.print → PDF) met alles uit de
   bestaande datastructuren: fasepad, foto's met herkomst, documenten,
   facturen, samples, inspecties, disclosures en zendingen. Niets wordt
   bijgemaakt; wat er niet is, staat er ook niet in.
   ============================================================ */
function elDoc(doc, tag, attrs, children){
  var n = doc.createElement(tag);
  if(attrs){
    Object.keys(attrs).forEach(function(k){
      var v = attrs[k];
      if(v==null) return;
      if(k==='class') n.className = v;
      else if(k==='text') n.textContent = v;
      else n.setAttribute(k, v);
    });
  }
  if(children!=null){
    (Array.isArray(children)?children:[children]).forEach(function(c){
      if(c==null) return;
      n.appendChild(typeof c==='string' ? doc.createTextNode(c) : c);
    });
  }
  return n;
}
var DOSSIER_CSS = [
  'body{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;color:#111;margin:0;padding:32px;max-width:880px;margin:0 auto;}',
  'h1{font-size:24px;margin:0 0 4px;} h2{font-size:17px;margin:28px 0 8px;border-bottom:1px solid #ddd;padding-bottom:4px;page-break-after:avoid;}',
  'h3{font-size:14px;margin:18px 0 6px;page-break-after:avoid;}',
  '.kick{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#696969;font-family:ui-monospace,Menlo,monospace;}',
  'table{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0 12px;} th,td{text-align:left;padding:5px 8px;border-bottom:1px solid #eee;vertical-align:top;} th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#696969;}',
  '.fotos{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 12px;} .foto{width:158px;page-break-inside:avoid;} .foto img{width:158px;height:110px;object-fit:cover;border-radius:6px;border:1px solid #e4e0db;} .foto p{font-size:10.5px;margin:3px 0 0;color:#333;line-height:1.35;}',
  '.noprint{margin:0 0 22px;padding:12px 14px;background:#f6f4f1;border-radius:10px;font-size:13px;}',
  '.proj{page-break-before:always;} .proj:first-of-type{page-break-before:auto;}',
  'a{color:#1B6E45;} @media print{.noprint{display:none;}}'
].join('\n');
function openDossierExport(client, projectIds){
  if(!projectIds || !projectIds.length){ return; }
  var w = window.open('', '_blank');
  if(!w){ showError(new Error('Popup geblokkeerd — sta pop-ups toe voor deze pagina om het dossier te openen.')); return; }
  var wd = w.document;
  wd.title = 'Dossier — ' + (client ? client.company : 'project');
  var style = wd.createElement('style');
  style.textContent = DOSSIER_CSS;
  wd.head.appendChild(style);
  wd.body.appendChild(elDoc(wd, 'p', { class:'noprint', text:'Dossier wordt samengesteld…' }));

  function absUrl(u){
    if(!u) return null;
    try{ return new URL(u, location.href).href; }catch(e){ return u; }
  }
  var loads = projectIds.map(function(pid){
    return Promise.all([
      DS.getProject(pid), DS.listMedia(pid), DS.listDocuments(pid),
      DS.listInvoices(pid), DS.listSamples(pid), DS.listInspections(pid),
      DS.listDisclosures(pid), DS.listShipments(pid)
    ]).then(function(res){
      return DS.listShipmentEvents(res[7].map(function(s){ return s.id; })).then(function(events){
        /* beeld-URL's en (live) documentlinks vooraf ophalen */
        var media = res[1];
        var docs = res[2];
        return Promise.all([
          Promise.all(media.map(function(mm){ return DS.mediaUrl(mm).catch(function(){ return null; }); })),
          Promise.all(docs.map(function(dd){ return DS.docUrl ? DS.docUrl(dd).catch(function(){ return null; }) : Promise.resolve(null); }))
        ]).then(function(urls){
          return { project: res[0], media: media, mediaUrls: urls[0], docs: docs, docUrls: urls[1],
            invoices: res[3], samples: res[4], inspections: res[5], disclosures: res[6],
            shipments: res[7], events: events };
        });
      });
    });
  });
  Promise.all([ Promise.all(loads), DS.listFactories() ]).then(function(all){
    var bundles = all[0], factories = all[1];
    while(wd.body.firstChild) wd.body.removeChild(wd.body.firstChild);
    /* functie 64: het afzenderblok komt uit Instellingen → Bedrijf &
       standaarden (met fallback op de standaardwaarden) — precies wat
       dat instellingenblok belooft */
    var prof = bedrijfProfiel();
    var profLine = [prof.adres, prof.kvk ? 'KvK ' + prof.kvk : '', prof.btw ? 'Btw ' + prof.btw : '', prof.replyTo].filter(Boolean).join(' · ');
    var head = elDoc(wd, 'div', null, [
      elDoc(wd, 'span', { class:'kick', text: prof.naam + ' · projectdossier · samengesteld ' + fmtDate(todayISO()) }),
      elDoc(wd, 'h1', { text: client ? client.company : (bundles[0].project ? bundles[0].project.name : 'Dossier') }),
      client ? elDoc(wd, 'p', { style:'font-size:13px;color:#555;margin:2px 0 0;', text:[client.contactName, client.email, client.phone].filter(Boolean).join(' · ') }) : null,
      profLine ? elDoc(wd, 'p', { style:'font-size:12px;color:#777;margin:4px 0 0;', text: prof.naam + ' · ' + profLine }) : null
    ]);
    wd.body.appendChild(head);
    var bar = elDoc(wd, 'div', { class:'noprint' }, [
      'Printvriendelijke samenstelling uit het beheer. ',
      elDoc(wd, 'button', { type:'button', text:'Print / bewaar als PDF' }),
      IS_DEMO ? elDoc(wd, 'span', { text:' Demomodus: alleen documenten met een echt geüpload bestand krijgen een downloadlink, en die werkt zolang dit venster open is; live staan er beveiligde downloadlinks (15 minuten geldig).' })
              : elDoc(wd, 'span', { text:' Downloadlinks bij documenten zijn 15 minuten geldig — daarna het dossier opnieuw samenstellen.' })
    ]);
    bar.querySelector('button').addEventListener('click', function(){ w.print(); });
    wd.body.appendChild(bar);

    bundles.forEach(function(b){
      if(!b.project) return;
      var p = b.project;
      var sec = elDoc(wd, 'div', { class:'proj' });
      sec.appendChild(elDoc(wd, 'h2', { text: p.name + (p.code ? ' · ' + p.code : '') + (p.status==='archived' ? ' (gearchiveerd)' : '') }));
      /* fasepad */
      sec.appendChild(elDoc(wd, 'h3', { text:'Fasepad' }));
      var ft = elDoc(wd, 'table', null, elDoc(wd, 'tbody', null,
        (p.stages||[]).slice().sort(function(a,b2){ return a.position-b2.position; }).map(function(s){
          return elDoc(wd, 'tr', null, [
            elDoc(wd, 'td', { text:('0'+s.position).slice(-2) }),
            elDoc(wd, 'td', { text: stageLabel(s.stageKey) }),
            elDoc(wd, 'td', { text: stageStatusLabel(s.status) }),
            elDoc(wd, 'td', { text: s.paymentPct ? s.paymentPct + '%' : '' }),
            elDoc(wd, 'td', { text: s.approvedAt ? 'afgerond ' + fmtDate(s.approvedAt) : '' })
          ]);
        })));
      sec.appendChild(ft);
      /* foto's met herkomst */
      if(b.media.length){
        sec.appendChild(elDoc(wd, 'h3', { text:'Foto’s (' + b.media.length + ') — met herkomst' }));
        var fg = elDoc(wd, 'div', { class:'fotos' });
        b.media.forEach(function(mm, i2){
          var u = absUrl(b.mediaUrls[i2]);
          var f = factories.find(function(x){ return x.id===mm.factoryId; });
          var box = elDoc(wd, 'div', { class:'foto' });
          if(u) box.appendChild(elDoc(wd, 'img', { src:u, alt:mm.caption||'Projectfoto' }));
          box.appendChild(elDoc(wd, 'p', { text:(mm.caption||'') + ' — ' + (f ? f.name : prof.naam) + ' · ' + fmtDate(mm.capturedAt) + (isConcept(mm) ? ' · concept' : '') }));
          fg.appendChild(box);
        });
        sec.appendChild(fg);
      }
      /* documenten + downloadlijst */
      if(b.docs.length){
        sec.appendChild(elDoc(wd, 'h3', { text:'Documenten (' + b.docs.length + ')' }));
        sec.appendChild(elDoc(wd, 'table', null, [
          elDoc(wd, 'thead', null, elDoc(wd, 'tr', null, ['Type','Titel','Fase','Datum','Download'].map(function(h){ return elDoc(wd, 'th', { text:h }); }))),
          elDoc(wd, 'tbody', null, b.docs.map(function(dd, i2){
            var link = b.docUrls[i2];
            return elDoc(wd, 'tr', null, [
              elDoc(wd, 'td', { text: docTypeLabel(dd.docType) }),
              elDoc(wd, 'td', { text: dd.title + (dd.version>1 ? ' (v'+dd.version+')' : '') + (isConcept(dd) ? ' · concept' : '') }),
              elDoc(wd, 'td', { text: stageLabel(dd.stageKey) }),
              elDoc(wd, 'td', { text: fmtDate(dd.createdAt) }),
              elDoc(wd, 'td', null, link ? elDoc(wd, 'a', { href:link, target:'_blank', rel:'noopener', text:'download' }) : elDoc(wd, 'span', { text: IS_DEMO ? 'demo' : '—' }))
            ]);
          }))
        ]));
      }
      /* facturen — zonder concepten (golf 8): het dossier is een
         klantdocument en een concept bestaat voor de klant niet */
      var dosInvs = b.invoices.filter(function(i2){ return !isConcept(i2); });
      if(dosInvs.length){
        sec.appendChild(elDoc(wd, 'h3', { text:'Facturen (' + dosInvs.length + ')' }));
        sec.appendChild(elDoc(wd, 'table', null, [
          elDoc(wd, 'thead', null, elDoc(wd, 'tr', null, ['Nummer','Omschrijving','Bedrag','Status','Aangemaakt','Betaald'].map(function(h){ return elDoc(wd, 'th', { text:h }); }))),
          elDoc(wd, 'tbody', null, dosInvs.map(function(inv){
            return elDoc(wd, 'tr', null, [
              elDoc(wd, 'td', { text: inv.invoiceNumber||'' }),
              elDoc(wd, 'td', { text: inv.label }),
              elDoc(wd, 'td', { text: fmtMoneyCur(inv.amountCents, inv.currency) }),
              elDoc(wd, 'td', { text: inv.status==='paid' ? 'betaald' : (inv.status==='void' ? 'vervallen' : 'open') }),
              elDoc(wd, 'td', { text: fmtDate(inv.createdAt) }),
              elDoc(wd, 'td', { text: inv.paidAt ? fmtDate(inv.paidAt) : '' })
            ]);
          }))
        ]));
      }
      /* samples */
      if(b.samples.length){
        sec.appendChild(elDoc(wd, 'h3', { text:'Samplerondes (' + b.samples.length + ')' }));
        sec.appendChild(elDoc(wd, 'table', null, elDoc(wd, 'tbody', null, b.samples.slice().sort(function(a,b2){ return String(a.roundDate).localeCompare(String(b2.roundDate)); }).map(function(s){
          return elDoc(wd, 'tr', null, [
            elDoc(wd, 'td', { text:s.roundLabel }),
            elDoc(wd, 'td', { text: fmtDate(s.roundDate) }),
            elDoc(wd, 'td', { text: sampleStatusLabel(s.status) }),
            elDoc(wd, 'td', { text: s.note||'' })
          ]);
        }))));
      }
      /* inspecties */
      if(b.inspections.length){
        sec.appendChild(elDoc(wd, 'h3', { text:'Inspecties (' + b.inspections.length + ')' }));
        b.inspections.slice().sort(function(a,b2){ return String(a.reportDate).localeCompare(String(b2.reportDate)); }).forEach(function(r){
          sec.appendChild(elDoc(wd, 'p', { style:'font-size:12.5px;margin:8px 0 2px;font-weight:600;', text:
            String(r.checkpoint||'').toUpperCase() + ' · ' + fmtDate(r.reportDate) + ' · ' + (r.aqlNorm||'') + ' · steekproef ' + (r.sampleSize||0) + ' · ' + (r.passed ? 'geslaagd' : 'afgekeurd') }));
          if((r.defects||[]).length){
            sec.appendChild(elDoc(wd, 'table', null, elDoc(wd, 'tbody', null, r.defects.map(function(d){
              return elDoc(wd, 'tr', null, [
                elDoc(wd, 'td', { text: severityLabel(d.severity) }),
                elDoc(wd, 'td', { text: (d.count||0) + '×' }),
                elDoc(wd, 'td', { text: d.note||'' })
              ]);
            }))));
          }
        });
      }
      /* disclosures */
      if(b.disclosures.length){
        sec.appendChild(elDoc(wd, 'h3', { text:'Gedeeld met fabrieken (' + b.disclosures.length + ')' }));
        sec.appendChild(elDoc(wd, 'table', null, elDoc(wd, 'tbody', null, b.disclosures.map(function(d){
          var f = factories.find(function(x){ return x.id===d.factoryId; });
          return elDoc(wd, 'tr', null, [
            elDoc(wd, 'td', { text: fmtDate(d.disclosedAt) }),
            elDoc(wd, 'td', { text: d.what || 'Bestanden gedeeld' }),
            elDoc(wd, 'td', { text: f ? f.name : 'Partner' }),
            elDoc(wd, 'td', { text: d.underNnn ? 'onder NNN' : 'zonder NNN' })
          ]);
        }))));
      }
      /* zendingen */
      if(b.shipments.length){
        sec.appendChild(elDoc(wd, 'h3', { text:'Zendingen (' + b.shipments.length + ')' }));
        b.shipments.forEach(function(s){
          var evs = (b.events||[]).filter(function(ev){ return ev.shipmentId===s.id; });
          sec.appendChild(elDoc(wd, 'p', { style:'font-size:12.5px;margin:8px 0 2px;font-weight:600;', text:
            shipmentTitle(s) + (s.deliveredAt ? ' · geleverd ' + fmtDate(s.deliveredAt) : (s.etaWindowEnd ? ' · ETA ' + fmtDate(s.etaWindowStart) + ' – ' + fmtDate(s.etaWindowEnd) : '')) }));
          if(evs.length){
            sec.appendChild(elDoc(wd, 'table', null, elDoc(wd, 'tbody', null, evs.map(function(ev){
              return elDoc(wd, 'tr', null, [
                elDoc(wd, 'td', { text: fmtDate(ev.occurredAt) }),
                elDoc(wd, 'td', { text: ev.milestoneKey }),
                elDoc(wd, 'td', { text: [ev.location, ev.note].filter(Boolean).join(' · ') })
              ]);
            }))));
          }
        });
      }
      wd.body.appendChild(sec);
    });
    auditLog({ kind:'overig', clientId: client ? client.id : null,
      detail:'Dossier-export samengesteld (' + bundles.length + ' project' + (bundles.length===1?'':'en') + ')' });
  }).catch(function(ex){
    while(wd.body.firstChild) wd.body.removeChild(wd.body.firstChild);
    wd.body.appendChild(elDoc(wd, 'p', { text:'Het dossier kon niet worden samengesteld: ' + ((ex && ex.message) || String(ex)) }));
  });
}

function openNewProjectModal(clientId){
  var m = openModal('Nieuw project', 'De zes fases worden automatisch klaargezet');
  var name = el('input', { class:'input', type:'text', required:'required' });
  var code = el('input', { class:'input', type:'text', placeholder:'bv. REQ 0829' });
  var err = el('p', { class:'formerr' });
  /* projectsjablonen per producttype (golf 6, functie 40): het sjabloon
     seedt de fase-verdeling, zet documentslots klaar (functie 52) en
     bewaart AQL + inspectiereeks als projectkeuze voor het rapportmodal.
     'Standaard' blijft de gewone 6-fasen-seed. Beheer: Instellingen →
     Projectsjablonen. */
  var tplDefs = (adminSettings && Array.isArray(adminSettings.projectSjablonen)) ? adminSettings.projectSjablonen : [];
  var tplSel = el('select', { class:'input', 'aria-label':'Projectsjabloon' });
  tplSel.appendChild(option('', 'Standaard (6 fasen)', true));
  tplDefs.forEach(function(t){
    tplSel.appendChild(option(t.id, t.naam + ' — ' + (Array.isArray(t.pct) ? t.pct.join('/') : '') + (t.slots && t.slots.length ? ' · ' + t.slots.length + ' documentslot' + (t.slots.length===1?'':'s') : '')));
  });
  /* zelfde als vorige keer (functie 41): structuurkopie van het laatste
     project van deze klant — de fase-indeling met betaalpercentages, zonder
     inhoud. Fabriek, documentslots en AQL bestaan (nog) niet als
     projectstructuur; zodra latere golven die velden toevoegen lift deze
     kopie automatisch mee via hetzelfde sjabloon. De checkbox staat vanaf
     het begin (verborgen) in het formulier zodat het conceptbehoud stabiele
     veldposities houdt. */
  var copyChk = el('input', { type:'checkbox' });
  var copyLine = el('label', { class:'checkline' }, [ copyChk, el('span', { text:'Zelfde als vorige keer' }) ]);
  /* sjabloon en structuurkopie sluiten elkaar uit: wie er één kiest,
     schakelt de ander stil uit — nooit twee fase-bronnen tegelijk */
  tplSel.addEventListener('change', function(){ if(tplSel.value) copyChk.checked = false; });
  copyChk.addEventListener('change', function(){ if(copyChk.checked) tplSel.value = ''; });
  copyLine.hidden = true;
  var copySub = el('p', { class:'kicker', style:'margin:-8px 0 14px;' });
  copySub.hidden = true;
  var lastProject = null;
  DS.listClientProjects(clientId).then(function(list){
    if(!list || !list.length) return;
    lastProject = list.slice().sort(function(a,b){
      return String(b.createdAt||'').localeCompare(String(a.createdAt||''));
    })[0];
    var pcts = (lastProject.stages||[]).slice()
      .sort(function(a,b){ return (a.position||0)-(b.position||0); })
      .map(function(s){ return (typeof s.paymentPct==='number' ? s.paymentPct : 0); })
      .join('/');
    copySub.textContent = 'Neemt de fase-indeling (' + pcts + ') over van “' + lastProject.name + '” — zonder inhoud.';
    copyLine.hidden = false;
    copySub.hidden = false;
  }).catch(function(){});
  var form = el('form', { onsubmit:function(e){
    e.preventDefault();
    var tplDef = tplSel.value ? tplDefs.find(function(t){ return t.id===tplSel.value; }) : null;
    var tpl = null;
    if(copyChk.checked && lastProject) tpl = { stages: lastProject.stages };
    else if(tplDef && Array.isArray(tplDef.pct) && tplDef.pct.length===STAGES.length){
      tpl = { stages: STAGES.map(function(s, i){
        return { stageKey:s.key, position:i+1, paymentPct: parseInt(tplDef.pct[i],10)||0 };
      }) };
    }
    DS.createProject(clientId, name.value.trim(), code.value.trim(), tpl).then(function(p){
      /* sjabloon (functie 40): documentslots klaarzetten (functie 52) en
         AQL + inspectiereeks als projectkeuze bewaren — geen inhoud, alleen
         structuur */
      var after = Promise.resolve();
      if(tplDef){
        var extras = [];
        if(Array.isArray(tplDef.slots) && tplDef.slots.length && DS.addDocSlots){
          extras.push(DS.addDocSlots(p.id, tplDef.slots.map(function(sl){
            return { docType: sl.docType, stageKey: sl.stageKey };
          })));
        }
        var pd = clone((adminSettings && adminSettings.projectDefaults) || {});
        pd[p.id] = { sjabloon: tplDef.naam, aql: tplDef.aql || '', reeks: Array.isArray(tplDef.reeks) ? tplDef.reeks.slice() : [] };
        extras.push(DS.saveSetting('projectDefaults', pd).then(function(){
          if(adminSettings) adminSettings.projectDefaults = pd;
        }));
        after = Promise.all(extras);
      }
      return after.then(function(){
        draft.clear();
        closeModal();
        go({ name:'project', projectId:p.id, clientId:clientId });
      });
    }).catch(function(ex){ err.textContent = ex.message||String(ex); err.classList.add('show'); });
  } }, [
    field('Projectnaam', name),
    field('Code', code),
    tplDefs.length ? field('Sjabloon', tplSel) : null,
    copyLine,
    copySub,
    err,
    el('div', { class:'modal-actions' }, [
      el('button', { type:'button', class:'btn ghost', text:'Annuleren', onclick:closeModal }),
      el('button', { type:'submit', class:'btn', text:'Project aanmaken' })
    ])
  ]);
  var actionsRow = form.querySelector('.modal-actions');
  actionsRow.insertBefore(missingHint(form, [
    { input:name, label:'projectnaam' }
  ]), actionsRow.firstChild);
  m.body.appendChild(form);
  var draft = attachDraft(m, form, 'project', clientId);
}

/* ============================================================
   deel 2 — projectdetail
   ============================================================ */
function renderProject(projectId){
  return Promise.all([
    DS.getProject(projectId),
    DS.listMedia(projectId),
    DS.listDocuments(projectId),
    DS.listInvoices(projectId),
    DS.listSamples(projectId),
    DS.listInspections(projectId),
    DS.listDisclosures(projectId),
    DS.listFactories(),
    DS.listShipments(projectId)
  ]).then(function(res){
    var project = res[0];
    if(!project){
      content.appendChild(el('p', { text:'Project niet gevonden.' }));
      return;
    }
    var media = res[1], docs = res[2], invoices = res[3], samples = res[4],
        inspections = res[5], disclosures = res[6], factories = res[7], shipments = res[8];
    return Promise.all([
      DS.getClient(project.clientId),
      DS.listShipmentEvents(shipments.map(function(s){ return s.id; })),
      DS.listQuestions(),
      /* golf 6: documentslots (52) + toegangslog voor de onboarding-checklist (37) */
      DS.listDocSlots ? DS.listDocSlots(projectId) : Promise.resolve([]),
      DS.listLog(projectId)
    ]).then(function(res2){
      buildProjectView(project, res2[0], media, docs, invoices, samples, inspections, disclosures, factories, shipments, res2[1], res2[2], res2[3], res2[4]);
    });
  });
}
function factoryName(factories, id){
  if(!id) return null;
  var f = factories.find(function(x){ return x.id===id; });
  return f ? f.name : null;
}
function chipClassForStage(status){
  if(status==='done') return 'done';
  if(status==='current') return 'current';
  if(status==='awaiting_approval') return 'awaiting';
  return '';
}
function sectionBlock(kicker, title, actionBtn, body){
  var head = el('div', { class:'sectionhead' }, [
    el('div', null, [
      el('span', { class:'kicker', text:kicker }),
      el('h2', { text:title })
    ]),
    actionBtn
  ]);
  return el('div', { class:'section' }, [ head, body ]);
}
function buildProjectView(project, client, media, docs, invoices, samples, inspections, disclosures, factories, shipments, shipmentEvents, allQuestions, docSlots, projectLog){
  var pid = project.id;
  docSlots = docSlots || [];
  projectLog = projectLog || [];
  /* een documentslot (functie 52) is open zolang er geen bestaand document
     aan hangt — een verwijderd document maakt het slot vanzelf weer open */
  function slotIsOpen(sl){
    if(!sl.documentId) return true;
    return !docs.some(function(d){ return d.id===sl.documentId; });
  }
  var openSlots = docSlots.filter(slotIsOpen);

  content.appendChild(el('button', {
    type:'button', class:'backbtn', text:'← ' + (client ? client.company : 'Klant'),
    onclick:function(){ go({ name:'client', clientId:project.clientId }); }
  }));
  var headChips = [];
  if(project.status==='archived') headChips.push(el('span', { class:'chip', text:'Gearchiveerd' }));
  /* actiebalk (golf 3 + 5): nieuwe update (composer, 43) · bekijk-als-klant
     (46) · publiceer-n-concepten (42/44) */
  var conceptItems = [];
  /* geplande items (45) blijven buiten de directe publiceerknop — die
     hebben al een moment; annuleren kan in de Wachtrij */
  media.forEach(function(m){ if(isConcept(m) && !m.scheduledAt) conceptItems.push({ kind:'media', row:m }); });
  docs.forEach(function(d){ if(isConcept(d) && !d.scheduledAt) conceptItems.push({ kind:'document', row:d }); });
  if(project.status!=='archived' && client){
    headChips.push(el('button', {
      type:'button', class:'btn small', text:'Nieuwe update',
      onclick:function(){ openUpdateComposer(project, client, media, factories); }
    }));
  }
  headChips.push(el('button', {
    type:'button', class:'btn ghost small', text:'Bekijk als klant',
    onclick:function(){ openViewAsClient(client); }
  }));
  if(conceptItems.length && client){
    headChips.push(el('button', {
      type:'button', class:'btn small',
      text:'Publiceer (' + conceptItems.length + (conceptItems.length===1 ? ' concept)' : ' concepten)'),
      onclick:function(){ openPublishModal(project, client, conceptItems); }
    }));
  }
  /* projectdossier-export (functie 60): printvriendelijke samenstelling */
  headChips.push(el('button', {
    type:'button', class:'btn ghost small', text:'Dossier-export',
    onclick:function(){ openDossierExport(client, [pid]); }
  }));
  /* herbestelling in één klik omzetten: naam + ' — batch 2' (of batch n+1),
     zelfde klant, verse fases, geen media of documenten mee */
  headChips.push(el('button', {
    type:'button', class:'btn ghost small', text:'Dupliceer als nieuw project',
    onclick:function(){ duplicateAsNewProject(project); }
  }));
  content.appendChild(el('div', { class:'pagehead' }, [
    el('div', null, [
      el('span', { class:'kicker', text:(project.code ? project.code + ' · ' : '') + 'Gestart ' + fmtDate(project.createdAt) }),
      el('div', { style:'display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;' }, [
        el('h1', { text:project.name }),
        /* golf 7 — bewerk-alles: potloodje op de projectkop (naam/code) */
        el('button', { type:'button', class:'btn ghost small', text:'✎',
          title:'Naam of code aanpassen', 'aria-label':'Projectnaam en code bewerken',
          onclick:function(){ openProjectEditModal(project); } })
      ])
    ]),
    el('div', { style:'display:flex;gap:8px;align-items:center;flex-wrap:wrap;' }, headChips)
  ]));

  /* kopregel 'volgende actie van jou' (functie 36): dezelfde berekening als
     de projectenlijst, over alleen de records van dit project */
  if(project.status!=='archived'){
    var miniSig = computeSignals({
      clients: client ? [client] : [], projects: [project],
      questions: (allQuestions||[]).filter(function(q){ return q.projectId===pid; }),
      invoices: invoices, shipments: shipments, samples: samples,
      media: media, logRows: [], events: shipmentEvents,
      settings: adminSettings || settingsDefaults()
    });
    var act = nextActionFor(pid, miniSig, conceptItems.length);
    content.appendChild(el('div', { class:'card', style:'padding:12px 18px;margin-bottom:22px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;' }, [
      el('span', { class:'kicker', text:'Volgende actie van jou' }),
      el('span', { style:'font-size:14px;font-weight:600;' + (act && act.crit ? 'color:var(--critical);' : (act ? '' : 'color:var(--gray-9);font-weight:400;')),
        text: act ? act.text : 'Geen open actie — het project loopt.' })
    ]));
  }

  /* onboarding-checklist (functie 37): vinkt zichzelf af op echte data;
     volledig af = balk klapt in tot één regel */
  if(project.status!=='archived'){
    var obItems = [
      { label:'NNN getekend', done: docs.some(function(d){ return d.docType==='nnn'; }),
        hint:'vinkt af zodra er een NNN-document in het project staat' },
      { label:'Offerte gedeeld', done: docs.some(function(d){ return d.docType==='quote'; }),
        hint:'vinkt af zodra er een offerte-document in het project staat' },
      { label:'Aanbetaling ontvangen', done: invoices.some(function(i2){ return i2.status==='paid'; }),
        hint:'vinkt af zodra de eerste factuur op betaald staat' },
      { label:'Contactpersoon ingesteld', done: !!(client && client.contactName && client.email),
        hint:'naam + e-mail op de klantkaart' },
      { label:'Uitnodiging verstuurd', done: !!(client && client.invitedAt),
        hint:'via Toegang & veiligheid op de klantkaart' },
      { label:'Eerste portaalactiviteit', done: projectLog.some(function(r){ return r.actor==='client'; }),
        hint:'vinkt af bij de eerste klantregel in het toegangslogboek van dit project' }
    ];
    var obDone = obItems.filter(function(it){ return it.done; }).length;
    var obAll = obDone===obItems.length;
    var obDet = el('details', { class:'answered card', style:'margin-bottom:22px;' });
    if(!obAll) obDet.setAttribute('open', '');
    obDet.appendChild(el('summary', null, [
      el('span', { class:'chip ' + (obAll ? 'done' : 'current'), text: obDone + '/' + obItems.length }),
      document.createTextNode(obAll ? '  Onboarding compleet' : '  Onboarding — wat er nog mist, vinkt zichzelf af')
    ]));
    var obInner = el('div', { style:'padding:4px 18px 16px;' });
    obItems.forEach(function(it){
      obInner.appendChild(el('div', { class:'hfact' }, [
        el('span', { class:'kicker', text: it.done ? '✓ klaar' : 'open' }),
        el('span', null, [
          document.createTextNode(it.label + ' '),
          it.done ? null : el('span', { class:'kicker', text:'— ' + it.hint })
        ])
      ]));
    });
    obDet.appendChild(obInner);
    content.appendChild(obDet);
  }

  /* a. fasebalk — met projectwaarde en zelfrekenende fasebedragen (38/39) */
  var stageCard = el('div', { class:'card rowlist stagegrid' });
  var stageAmountRows = [];   /* betaalfases waarvan het bedrag live meebeweegt */
  var factBtns = [];          /* factureer-knoppen: alleen zichtbaar mét waarde */
  var liveValueCents = (typeof project.valueCents==='number' && project.valueCents>0) ? project.valueCents : null;
  (project.stages||[]).slice().sort(function(a,b){ return a.position-b.position; }).forEach(function(s){
    var sel = el('select', { class:'input stagesel', 'aria-label':'Status van fase ' + stageLabel(s.stageKey) });
    STAGE_STATUS.forEach(function(st){ sel.appendChild(option(st.key, st.label, st.key===s.status)); });
    sel.addEventListener('change', function(){
      var newStatus = sel.value;
      DS.setStageStatus(pid, s.stageKey, newStatus).then(function(){
        /* golf 8: betaalfase op 'wacht op akkoord' → automatische
           conceptfactuur (instelbaar), vóór de mailkeuze zodat de refresh
           erna hem meteen toont in facturenlijst, Wachtrij en Vandaag */
        return newStatus==='awaiting_approval' ? autoConceptInvoice(pid, s.stageKey) : null;
      }).then(function(){
        if((newStatus === 'done' || newStatus === 'awaiting_approval') && client){
          /* mail-preview vlak vóór echte verzending (functies 44/67): de
             status staat al om, de klantmail eerst exact zien en dan pas
             kiezen tussen versturen of stil laten */
          openMailChoiceModal({
            client: client,
            projectName: project.name, projectCode: project.code,
            page: 'mijlpalen', portalLabel: 'Bekijk het mijlpalenpad',
            subject: mailSubject(newStatus === 'done' ? 'faseDone' : 'faseAwaiting',
              { fase: stageLabel(s.stageKey), project: project.name }),
            /* zelfde zin als de cockpit van de klant: één statusmotor */
            bodyLine: window.CP_STATUS.fill(
              newStatus === 'done' ? window.CP_STATUS.templates.stageDone : window.CP_STATUS.templates.stageAwaiting,
              { fase: stageLabel(s.stageKey) })
          }, {
            title:'Klantmail bij deze fasewissel',
            kicker:'De status staat al om — kies of de klant een mail krijgt',
            sendLabel:'Verstuur klantmail', silentLabel:'Geen mail (stil)',
            onDismiss:function(){ refresh(); }
          });
          return;
        }
        refresh();
      }).catch(function(ex){
        sel.value = s.status;
        showError(ex);
      });
    });
    var subParts = [];
    if(s.paymentPct) subParts.push(s.paymentPct + '% betaalmoment');
    if(s.approvedAt) subParts.push('afgerond ' + fmtDate(s.approvedAt));
    var small = el('small', { text: subParts.join(' · ') || ' ' });
    var rowKids = [
      el('span', { class:'stagenum', text:('0' + s.position).slice(-2) }),
      el('div', { class:'stagename' }, [
        document.createTextNode(stageLabel(s.stageKey)),
        small
      ]),
      el('span', { class:'chip ' + chipClassForStage(s.status), text:stageStatusLabel(s.status) })
    ];
    /* factureer-deze-fase (functie 39): alleen bij een betaalfase zonder
       bestaande factuur en met een ingevulde projectwaarde */
    if(s.paymentPct > 0 && !invoices.some(function(i2){ return i2.stageKey===s.stageKey; })){
      var factBtn = el('button', { type:'button', class:'btn ghost small', text:'Factureer', onclick:function(){
        var v = liveValueCents!=null ? liveValueCents : (project.valueCents || null);
        if(!v){ return; }
        openInvoiceModal(pid, {
          stageKey: s.stageKey,
          amountCents: Math.round(v * s.paymentPct / 100),
          currency: project.valueCurrency,
          label: 'Fase ' + s.position + ' — ' + stageLabel(s.stageKey) + ', ' + s.paymentPct + '%'
        });
      } });
      factBtns.push(factBtn);
      rowKids.push(factBtn);
    }
    /* golf 7 — bewerk-alles: bij een afgeronde fase is de goedkeuringsdatum
       bewerkbaar (correctie, stil — de status blijft onaangeroerd) */
    if(s.status==='done' && s.approvedAt){
      rowKids.push(el('button', { type:'button', class:'btn ghost small', text:'✎',
        title:'Goedkeuringsdatum aanpassen (' + fmtDate(s.approvedAt) + ')',
        'aria-label':'Goedkeuringsdatum van ' + stageLabel(s.stageKey) + ' aanpassen',
        onclick:function(){ openStageDateModal(project, s); } }));
    }
    rowKids.push(sel);
    stageCard.appendChild(el('div', { class:'stagerow' }, rowKids));
    if(s.paymentPct > 0) stageAmountRows.push({ pct: s.paymentPct, small: small, base: subParts.slice() });
  });
  /* projectwaarde met zelfrekenende fasebedragen (functie 38) */
  function paintStageAmounts(){
    var v = liveValueCents;
    stageAmountRows.forEach(function(r){
      var parts = r.base.slice();
      if(v!=null && v>0) parts.splice(1, 0, fmtMoneyCur(Math.round(v * r.pct / 100), valCurSel.value));
      r.small.textContent = parts.join(' · ') || ' ';
    });
    factBtns.forEach(function(b){ b.hidden = !(v!=null && v>0); });
  }
  var valInput = el('input', { class:'input', type:'text', inputmode:'decimal', style:'max-width:150px;',
    placeholder:'bv. 12.500,00', 'aria-label':'Projectwaarde' });
  if(typeof project.valueCents==='number' && project.valueCents>0){
    valInput.value = (project.valueCents/100).toLocaleString('nl-NL', { minimumFractionDigits:2, maximumFractionDigits:2 });
  }
  var valCurSel = el('select', { class:'input', style:'max-width:90px;', 'aria-label':'Valuta van de projectwaarde' });
  CURRENCIES.forEach(function(c2){ valCurSel.appendChild(option(c2, c2, (project.valueCurrency||'EUR')===c2)); });
  var valFlash = el('span', { class:'saveflash', text:'Opgeslagen' });
  var valErr = el('span', { class:'kicker', style:'color:var(--critical);', 'aria-live':'polite' });
  valInput.addEventListener('input', function(){
    var raw = valInput.value.trim();
    valErr.textContent = '';
    if(!raw){ liveValueCents = null; paintStageAmounts(); return; }
    var cents = parseEuro(raw);
    if(isNaN(cents)){ valErr.textContent = 'Bedrag niet herkend'; return; }

/* ---------- dupliceren als nieuw project (herbestelling → batch 2) ---------- */
function duplicateAsNewProject(project){
  var base = project.name || 'Project';
  var mt = /^(.*) — batch (\d+)$/.exec(base);
  var newName = mt ? (mt[1] + ' — batch ' + (parseInt(mt[2],10)+1)) : (base + ' — batch 2');
  /* createProject zet verse fases klaar; media en documenten gaan bewust
     niet mee — het dossier blijft bij batch 1. De fase-indeling (met
     betaalpercentages) reist wél mee als structuur (functie 41). */
  DS.createProject(project.clientId, newName, '', { stages: project.stages }).then(function(p){
    go({ name:'project', projectId:p.id, clientId:project.clientId });
  }).catch(showError);
}

/* ---------- kopieer naar ander project (golf 6, functie 51) ----------
   Selectie van documenten en/of foto's + één doelproject; de kopie landt
   als CONCEPT in het doelproject zodat je daar bewust publiceert.
