function openEtaModal(shipment, project, client){
  var m = openModal('ETA bijwerken', 'Altijd een weekvenster, nooit een dagbelofte');
  var startSd = smartDateField(shipment.etaWindowStart || '', 'Venster van');
  var endSd = smartDateField(shipment.etaWindowEnd || '', 'Venster tot');
  var note = el('input', { class:'input', type:'text', value: shipment.etaNote || '', placeholder:'bv. onder voorbehoud van de douane' });
  var err = el('p', { class:'formerr' });
  /* plausibiliteit (18): een venster in het verleden ziet de klant direct */
  var etaWarn = warnHint();
  function checkEta(){
    var s = startSd.get(), e2 = endSd.get();
    if(s && e2 && e2 < s) setWarn(etaWarn, 'Het einde van het venster ligt vóór het begin.');
    else if(e2 && e2 < todayISO()) setWarn(etaWarn, 'Dit venster ligt in het verleden — de klant ziet direct een verlopen ETA.');
    else setWarn(etaWarn, '');
  }
  startSd.input.addEventListener('input', checkEta);
  endSd.input.addEventListener('input', checkEta);
  checkEta();
  var form = el('form', { onsubmit:function(e){
    e.preventDefault();
    err.classList.remove('show');
    if(startSd.invalid() || endSd.invalid()){ err.textContent = 'Datum niet herkend — probeer vr, +3 of 12/9.'; err.classList.add('show'); return; }
    var startVal = startSd.get(), endVal = endSd.get();
    if(!startVal || !endVal){ err.textContent = 'Vul beide datums van het venster in.'; err.classList.add('show'); return; }
    if(endVal < startVal){ err.textContent = 'Het einde van het venster ligt vóór het begin.'; err.classList.add('show'); return; }
    DS.updateShipmentEta(shipment.id, {
      etaWindowStart: startVal, etaWindowEnd: endVal, etaNote: note.value.trim()
    }).then(function(){
      /* de klant hoort het vóór zijn portaal een verlopen ETA toont */
      if(project && client){
        notifyClient({
          client: client, projectName: project.name, projectCode: project.code,
          page:'zendingen', portalLabel:'Volg je zending',
          subject: mailSubject('eta', { project: project.name }),
          bodyLine:'Het ETA-venster van je zending is bijgewerkt: ' + fmtDate(startVal) + ' – ' + fmtDate(endVal) + '.'
        });
      }
      draft.clear();
      closeModal(); refresh();
    }).catch(function(ex){ err.textContent = ex.message||String(ex); err.classList.add('show'); });
  } }, [
    el('div', { class:'formrow' }, [ field('Venster van', startSd.node), field('Venster tot', endSd.node) ]),
    etaWarn,
    field('Notitie (optioneel)', note),
    err,
    el('div', { class:'modal-actions' }, [
      el('button', { type:'button', class:'btn ghost', text:'Annuleren', onclick:closeModal }),
      el('button', { type:'submit', class:'btn', text:'ETA opslaan' })
    ])
  ]);
  var actionsRow = form.querySelector('.modal-actions');
  actionsRow.insertBefore(missingHint(form, [
    { get:startSd.get, label:'venster van' },
    { get:endSd.get, label:'venster tot' }
  ]), actionsRow.firstChild);
  m.body.appendChild(form);
  var draft = attachDraft(m, form, 'eta', shipment.id);
}
function openShipmentModal(projectId, samples, project, client, shipments, editOpts){
  var SHIP = window.CP_SHIPPING;
  /* editOpts (golf 7 — bewerk-alles): { ship, hasEvents } → zelfde modal,
     voorgevuld. Bewerken is stil; ETA en mijlpalen houden hun eigen knoppen
     op de zendingkaart, en het type ligt vast zodra er mijlpalen zijn
     afgevinkt (anders raakt het sjabloon zoek). */
  var editShip = editOpts && editOpts.ship ? editOpts.ship : null;
  var editLocked = !!(editOpts && editOpts.hasEvents);
  var m = openModal(editShip ? 'Zending bewerken' : 'Zending toevoegen',
    editShip ? 'Stil — een correctie stuurt geen klantmail' : 'Het type bepaalt het mijlpaalsjabloon');

  var type = el('select', { class:'input' });
  SHIP.TYPES.forEach(function(t){ type.appendChild(option(t.key, t.label, t.key===(editShip ? editShip.type : 'koerier'))); });
  if(editShip && editLocked) type.disabled = true;
  var tplInfo = el('p', { class:'kicker', style:'margin:-6px 0 14px;' });
  function syncTpl(){
    var list = SHIP.milestonesFor(type.value);
    tplInfo.textContent = list.length + ' mijlpalen · ' + list[0].label + ' → ' + list[list.length-1].label;
  }
  type.addEventListener('change', syncTpl);
  syncTpl();

  /* standaardduur per type (functie 20): geladen uit Instellingen → Zendingen */
  var duurByType = { koerier:5, luchtvracht:10, zeevracht:35 };
  DS.getSettings().then(function(st){
    if(st && st.zendingsduurDagen && typeof st.zendingsduurDagen==='object'){
      Object.keys(duurByType).forEach(function(k){
        if(typeof st.zendingsduurDagen[k]==='number') duurByType[k] = st.zendingsduurDagen[k];
      });
    }
    refreshEtaVoorstel();
  }).catch(function(){});

  var carrier = el('select', { class:'input' });
  var carrierSelected = editShip
    ? ((editShip.carrierCode && SHIP.CARRIERS[editShip.carrierCode]) ? editShip.carrierCode : 'anders')
    : 'dhl';
  SHIP.CARRIER_ORDER.forEach(function(code){
    var c = SHIP.CARRIERS[code];
    carrier.appendChild(option(code, c.name + (code==='anders' ? ' (vangnet)' : ''), code===carrierSelected));
  });

  var nr = el('input', { class:'input', type:'text', placeholder:'bv. MSKU1234565 of een koeriernummer',
    value: editShip ? (editShip.containerNumber || editShip.trackingNumber || '') : '' });
  var nrHint = el('p', { class:'nrhint', 'aria-live':'polite' });
  nr.addEventListener('input', function(){
    var v = nr.value.trim();
    nrHint.classList.remove('ok');
    nrHint.classList.remove('bad');
    if(!v){ nrHint.textContent = ''; return; }
    if(SHIP.isContainerFormat(v)){
      if(SHIP.isoCheck(v)){
        nrHint.textContent = 'Containernummer — controlecijfer klopt (ISO 6346)';
        nrHint.classList.add('ok');
      } else {
        nrHint.textContent = 'Containernummer — controlecijfer klopt niet (ISO 6346)';
        nrHint.classList.add('bad');
      }
    } else {
      nrHint.textContent = 'Herkend als trackingnummer (geen container)';
    }
  });

  var bl = el('input', { class:'input', type:'text', placeholder:'Alleen bij zeevracht',
    value: editShip ? (editShip.blNumber || '') : '' });
  var sampleSel = el('select', { class:'input' });
  sampleSel.appendChild(option('', 'Geen sampleronde', !(editShip && editShip.sampleRoundId)));
  (samples||[]).slice().sort(function(a,b){ return String(a.roundDate).localeCompare(String(b.roundDate)); }).forEach(function(sm){
    sampleSel.appendChild(option(sm.id, sm.roundLabel + ' · ' + fmtDate(sm.roundDate), !!(editShip && editShip.sampleRoundId===sm.id)));
  });
  var etaStartSd = smartDateField('', 'ETA venster van');
  var etaEndSd = smartDateField('', 'ETA venster tot');
  var etaNote = el('input', { class:'input', type:'text', placeholder:'bv. onder voorbehoud van de douane' });
  var err = el('p', { class:'formerr' });

  /* ETA-voorstel (functie 20): zolang beide venstervelden leeg zijn, stelt
     de standaardduur van het gekozen type een weekvenster voor */
  var propStart = null, propEnd = null;
  var propTxt = el('span', { class:'kicker' });
  var propBtn = el('button', { type:'button', class:'btn ghost small', text:'Neem venster over' });
  var propLine = el('div', { style:'margin:-6px 0 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;' }, [ propTxt, propBtn ]);
  function refreshEtaVoorstel(){
    if(etaStartSd.input.value.trim() || etaEndSd.input.value.trim()){ propLine.hidden = true; return; }
    var d = duurByType[type.value] || 7;
    propStart = addDaysISO(todayISO(), d);
    propEnd = addDaysISO(todayISO(), d + 6);
    propTxt.textContent = 'Voorstel (' + SHIP.typeLabel(type.value) + ', standaardduur ' + d + ' dgn): ' + fmtDate(propStart) + ' – ' + fmtDate(propEnd);
    propLine.hidden = false;
  }
  propBtn.addEventListener('click', function(){
    if(!propStart || !propEnd) return;
    etaStartSd.set(propStart);
    etaEndSd.set(propEnd);
    propLine.hidden = true;
    form.dispatchEvent(new Event('input'));
    checkEta();
  });
  type.addEventListener('change', refreshEtaVoorstel);
  etaStartSd.input.addEventListener('input', refreshEtaVoorstel);
  etaEndSd.input.addEventListener('input', refreshEtaVoorstel);
  /* startdatum gekozen en einde nog leeg → weekvenster voorstellen (20);
     op 'change' (blur), niet per toetsaanslag, zodat half getypte datums
     nooit een einddatum voorstellen */
  etaStartSd.input.addEventListener('change', function(){
    var s = etaStartSd.get();
    if(s && !etaEndSd.input.value.trim()){
      etaEndSd.set(addDaysISO(s, 6));
      setWarn(etaWarn, 'Einddatum voorgesteld als weekvenster (+6 dagen) — pas aan waar nodig.');
    }
  });
  /* plausibiliteit (18): venster in het verleden of einde vóór begin */
  var etaWarn = warnHint();
  function checkEta(){
    var s = etaStartSd.get(), e2 = etaEndSd.get();
    if(s && e2 && e2 < s) setWarn(etaWarn, 'Het einde van het ETA venster ligt vóór het begin.');
    else if(e2 && e2 < todayISO()) setWarn(etaWarn, 'Dit venster ligt in het verleden — de klant ziet direct een verlopen ETA.');
    else setWarn(etaWarn, '');
  }
  etaStartSd.input.addEventListener('input', checkEta);
  etaEndSd.input.addEventListener('input', checkEta);

  /* zending zoals de vorige (functie 58): type, vervoerder en ETA-notitie
     van de laatste zending van dit project (of anders van deze klant);
     het ETA-venster wordt voorgesteld op de werkelijke doorlooptijd van die
     zending — voorstel, geen aanname: overnemen is een aparte klik.
     Route- of ISO-antwoordvelden bestaan niet in het zendingmodel; de
     ISO-check leeft als live controle op het (nieuwe, unieke) nummer. */
  var prevNote = el('span', { class:'kicker', text:'' });
  function applyPrev(prev){
    type.value = prev.type || type.value;
    syncTpl();
    if(prev.carrierCode && SHIP.CARRIERS[prev.carrierCode]) carrier.value = prev.carrierCode;
    etaNote.value = prev.etaNote || '';
    var days = null;
    if(prev.deliveredAt){
      var c0 = asDate(prev.createdAt), d0 = asDate(prev.deliveredAt);
      if(c0 && d0 && !isNaN(c0.getTime()) && !isNaN(d0.getTime())){
        days = Math.round((d0.getTime() - c0.getTime()) / 86400000);
      }
    }
    if(days!=null && days>=1 && !etaStartSd.input.value.trim() && !etaEndSd.input.value.trim()){
      propStart = addDaysISO(todayISO(), Math.max(0, days-3));
      propEnd = addDaysISO(todayISO(), days+3);
      propTxt.textContent = 'Vorige zending deed er ' + days + ' dagen over — voorstel: ' + fmtDate(propStart) + ' – ' + fmtDate(propEnd);
      propLine.hidden = false;
    } else refreshEtaVoorstel();
    prevNote.textContent = 'Type, vervoerder en ETA-notitie overgenomen van: ' + shipmentTitle(prev) + '. Nummers en datums vul je zelf in.';
    form.dispatchEvent(new Event('input'));
  }
  var lastShip = null;
  (shipments||[]).forEach(function(s){
    if(!lastShip || String(s.createdAt) > String(lastShip.createdAt)) lastShip = s;
  });
  var prevBtn = el('button', { type:'button', class:'btn ghost small', text:'Zoals de vorige' });
  prevBtn.addEventListener('click', function(){
    if(lastShip){ applyPrev(lastShip); return; }
    /* geen eerdere zending in dit project: kijk bij de andere projecten van deze klant */
    prevBtn.disabled = true;
    Promise.all([
      DS.listAllShipments(),
      (project && project.clientId) ? DS.listClientProjects(project.clientId) : Promise.resolve([])
    ]).then(function(res){
      prevBtn.disabled = false;
      var mine = {};
      res[1].forEach(function(p){ mine[p.id] = true; });
      var cand = null;
      res[0].forEach(function(s){
        if(mine[s.projectId] && (!cand || String(s.createdAt) > String(cand.createdAt))) cand = s;
      });
      if(cand) applyPrev(cand);
      else prevNote.textContent = 'Geen eerdere zending gevonden voor deze klant.';
    }).catch(function(){
      prevBtn.disabled = false;
      prevNote.textContent = 'Kon eerdere zendingen niet ophalen.';
    });
  });
  var prevWrap = el('div', { style:'margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;' }, [ prevBtn, prevNote ]);

  var form = el('form', { onsubmit:function(e){
    e.preventDefault();
    err.classList.remove('show');
    var rawNr = nr.value.trim();
    var isCont = SHIP.isContainerFormat(rawNr);
    /* golf 7 — bewerkmodus: stil opslaan met auditregel en undo-toast;
       ETA en mijlpalen blijven bij hun eigen knoppen op de kaart */
    if(editShip){
      var prevShip = { type: editShip.type, carrierCode: editShip.carrierCode||'',
        trackingNumber: editShip.trackingNumber||'', containerNumber: editShip.containerNumber||'',
        blNumber: editShip.blNumber||'', sampleRoundId: editShip.sampleRoundId||null };
      var updShip = {
        type: type.value, carrierCode: carrier.value,
        trackingNumber: isCont ? '' : rawNr,
        containerNumber: isCont ? SHIP.normalize(rawNr) : '',
        blNumber: bl.value.trim(),
        sampleRoundId: sampleSel.value || null
      };
      DS.updateShipment(editShip.id, updShip).then(function(){
        draft.clear();
        return finishEdit({
          clientId: project ? project.clientId : null, projectId: projectId,
          detail: 'Zending bewerkt: ' + shipmentTitle(updShip),
          toast: 'Zending bewerkt',
          restore: function(){ return DS.updateShipment(editShip.id, prevShip); }
        });
      }).catch(function(ex){ err.textContent = ex.message||String(ex); err.classList.add('show'); });
      return;
    }
    if(etaStartSd.invalid() || etaEndSd.invalid()){
      err.textContent = 'ETA-datum niet herkend — probeer vr, +3 of 12/9.'; err.classList.add('show'); return;
    }
    var etaStartVal = etaStartSd.get(), etaEndVal = etaEndSd.get();
    if((etaStartVal && !etaEndVal) || (!etaStartVal && etaEndVal)){
      err.textContent = 'Vul het ETA venster met twee datums, of laat beide leeg.'; err.classList.add('show'); return;
    }
    if(etaStartVal && etaEndVal < etaStartVal){
      err.textContent = 'Het einde van het ETA venster ligt vóór het begin.'; err.classList.add('show'); return;
    }
    DS.addShipment(projectId, {
      type: type.value,
      carrierCode: carrier.value,
      trackingNumber: isCont ? '' : rawNr,
      containerNumber: isCont ? SHIP.normalize(rawNr) : '',
      blNumber: bl.value.trim(),
      sampleRoundId: sampleSel.value || null,
      etaWindowStart: etaStartVal || null,
      etaWindowEnd: etaEndVal || null,
      etaNote: etaNote.value.trim()
    }).then(function(){
      notifyClient({
        client: client, projectName: project.name, projectCode: project.code,
        page: 'zendingen', portalLabel: 'Volg je zending',
        subject: mailSubject('zending', { project: project.name }),
        bodyLine: 'Steffan heeft een ' + (SHIP.typeLabel ? SHIP.typeLabel(type.value) : type.value) + ' aangemaakt. Je kunt de reis vanaf nu volgen in je portaal.'
      });
      draft.clear();
      closeModal(); refresh();
    }).catch(function(ex){ err.textContent = ex.message||String(ex); err.classList.add('show'); });
  } }, [
    editShip ? null : prevWrap,
    editShip ? el('p', { class:'kicker', style:'margin:0 0 10px;', text:
      (editLocked ? 'Type ligt vast — er zijn al mijlpalen afgevinkt. ' : '') +
      'ETA en mijlpalen pas je aan op de zendingkaart zelf.' }) : null,
    el('div', { class:'formrow' }, [ field('Type', type), field('Vervoerder', carrier) ]),
    tplInfo,
    field('Tracking of containernummer', nr),
    nrHint,
    el('div', { class:'formrow' }, [ field('B/L nummer (optioneel)', bl), field('Sampleronde (optioneel)', sampleSel) ]),
    editShip ? null : el('div', { class:'formrow' }, [ field('ETA venster van', etaStartSd.node), field('ETA venster tot', etaEndSd.node) ]),
    editShip ? null : propLine,
    editShip ? null : etaWarn,
    editShip ? null : field('ETA notitie (optioneel)', etaNote),
    err,
    el('div', { class:'modal-actions' }, [
      el('button', { type:'button', class:'btn ghost', text:'Annuleren', onclick:closeModal }),
      el('button', { type:'submit', class:'btn', text: editShip ? 'Opslaan' : 'Zending toevoegen' })
    ])
  ]);
  if(!editShip) refreshEtaVoorstel();
  if(editShip && nr.value) nr.dispatchEvent(new Event('input')); /* nummerhint direct tonen */
  m.body.appendChild(form);
  var draft = attachDraft(m, form, 'zending', editShip ? ('edit:' + editShip.id) : projectId);
}

/* ============================================================
   golf 7 — bewerk-alles: kleine bewerkmodals
   ============================================================
   Alles wat de klant in het portaal ziet, is vanuit het beheer aan te
   passen. Eén vast patroon: zelfde velden en validatie als bij toevoegen,

/* foto bewerken: zelfde veldcomponenten als de batchtoevoeging (fase,
   fabriek, slimme datum, onderschrift), maar als éénitemsformulier — de
   batchmodal is een uploader en bewerken raakt het beeld zelf nooit aan */

  var m = openModal('Foto bewerken', 'Stil — een correctie stuurt geen klantmail');

  factories.forEach(function(f){ fac.appendChild(option(f.id, f.name + (f.region ? ' — ' + f.region : ''), mrow.factoryId===f.id)); });
  var dateSd = smartDateField(String(mrow.capturedAt||'').slice(0,10), 'Datum van deze foto');

    e.preventDefault();

    if(!capVal){ err.textContent = 'Het onderschrift mag niet leeg zijn.'; err.classList.add('show'); return; }
    var prev = { stageKey: mrow.stageKey, caption: mrow.caption, factoryId: mrow.factoryId||null, capturedAt: mrow.capturedAt };
    DS.updateMedia(mrow.id, { stageKey: stage.value, caption: capVal, factoryId: fac.value||null, capturedAt: dateVal }).then(function(){
      draft.clear();
      return finishEdit({
        clientId: project ? project.clientId : null, projectId: mrow.projectId,
        detail: 'Media bewerkt: ' + capVal,
        toast: 'Foto bewerkt',
        restore: function(){ return DS.updateMedia(mrow.id, prev); }
      });
    }).catch(function(ex){ err.textContent = ex.message||String(ex); err.classList.add('show'); });
  } }, [
    el('div', { style:'display:flex;gap:14px;align-items:center;margin-bottom:14px;flex-wrap:wrap;' }, [
      img,
      isConcept(mrow)
        ? el('span', { class:'chip awaiting', text:'Concept — blijft concept tot je publiceert' })
        : el('span', { class:'chip done', text:'Gepubliceerd — blijft gepubliceerd' })
    ]),
    field('Onderschrift', cap),
    el('div', { class:'formrow' }, [ field('Fase', stage), field('Fabriek', fac) ]),
    field('Datum', dateSd.node),
    err,
    el('div', { class:'modal-actions' }, [
      el('button', { type:'button', class:'btn ghost', text:'Annuleren', onclick:closeModal }),
      el('button', { type:'submit', class:'btn', text:'Opslaan' })
    ])
  ]);
  var actionsRow = form.querySelector('.modal-actions');
  actionsRow.insertBefore(missingHint(form, [
    { input:cap, label:'onderschrift' },
    { get:dateSd.get, label:'datum' }
  ]), actionsRow.firstChild);
  m.body.appendChild(form);
  var draft = attachDraft(m, form, 'media-bewerk', mrow.id);
}

/* mijlpaalregel bewerken of weghalen: datum/locatie/notitie zijn de velden
   van het afvinkformulier; verwijderen vraagt bevestiging (opnieuw afvinken
   kan altijd — de undo-toast kan een verwijderde regel niet herbouwen
   zonder een dubbele klantlogregel te maken, dus hier bewust een confirm) */
function openMilestoneEditModal(pid, project, ev, msLabel){
  var m = openModal('Mijlpaal bewerken', msLabel + ' — stil, een correctie stuurt geen klantmail');
  var dt = el('input', { class:'input', type:'date', value: String(ev.occurredAt||'').slice(0,10), 'aria-label':'Datum van ' + msLabel });
  var loc = el('input', { class:'input', type:'text', value: ev.location || '', placeholder:'Locatie (optioneel)' });
  var nt = el('input', { class:'input', type:'text', value: ev.note || '', placeholder:'Notitie (optioneel)' });
  var err = el('p', { class:'formerr' });
  var delBtn = el('button', { type:'button', class:'btn ghost', text:'Verwijder' });
  delBtn.addEventListener('click', function(){
    confirmDialog('Mijlpaal verwijderen',
      '“' + msLabel + '” verdwijnt dan ook uit De Reis in het portaal van de klant. Opnieuw afvinken kan altijd.',
      'Verwijder')
      .then(function(ok){
        if(!ok) return;
        DS.deleteShipmentEvent(ev.id).then(function(){
          return auditLog({ kind:'bewerking', clientId: project ? project.clientId : null, projectId: pid,
            detail:'Zendingmijlpaal verwijderd: ' + msLabel });
        }).then(refresh).catch(showError);
      });
  });
  var form = el('form', { onsubmit:function(e){
    e.preventDefault();
    err.classList.remove('show');
    if(!dt.value){ err.textContent = 'Vul de datum in.'; err.classList.add('show'); return; }
    var prev = { occurredAt: ev.occurredAt, location: ev.location || '', note: ev.note || '' };
    DS.updateShipmentEvent(ev.id, { occurredAt: dt.value, location: loc.value.trim(), note: nt.value.trim() }).then(function(){
      return finishEdit({
        clientId: project ? project.clientId : null, projectId: pid,
        detail: 'Zendingmijlpaal bewerkt: ' + msLabel,
        toast: 'Mijlpaal bewerkt',
        restore: function(){ return DS.updateShipmentEvent(ev.id, prev); }
      });
    }).catch(function(ex){ err.textContent = ex.message||String(ex); err.classList.add('show'); });
  } }, [
    el('div', { class:'formrow' }, [ field('Datum', dt), field('Locatie', loc) ]),
    field('Notitie', nt),
    err,
    el('div', { class:'modal-actions' }, [
      delBtn,
      el('button', { type:'button', class:'btn ghost', text:'Annuleren', onclick:closeModal }),
      el('button', { type:'submit', class:'btn', text:'Opslaan' })
    ])
  ]);
  m.body.appendChild(form);
}

function openFactoryEditModal(f){
  var m = openModal('Fabriek bewerken', 'Naam en regio — de stad kies je in de lijst zelf');
  var name = el('input', { class:'input', type:'text', required:'required', value: f.name || '' });
  var region = el('input', { class:'input', type:'text', value: f.region || '', placeholder:'bv. Guangdong' });
  var err = el('p', { class:'formerr' });
  var form = el('form', { onsubmit:function(e){
    e.preventDefault();
    err.classList.remove('show');
    var nm = name.value.trim();
    if(!nm){ err.textContent = 'De naam mag niet leeg zijn.'; err.classList.add('show'); return; }
    var prev = { name: f.name, region: f.region || '' };
    DS.updateFactory(f.id, { name: nm, region: region.value.trim() }).then(function(){
      draft.clear();
      return finishEdit({
        detail: 'Fabriek bewerkt: ' + nm,
        toast: 'Fabriek bewerkt',
        restore: function(){ return DS.updateFactory(f.id, prev); }
      });
    }).catch(function(ex){ err.textContent = ex.message||String(ex); err.classList.add('show'); });
  } }, [
    el('div', { class:'formrow' }, [ field('Naam', name), field('Regio', region) ]),
    err,
    el('div', { class:'modal-actions' }, [
      el('button', { type:'button', class:'btn ghost', text:'Annuleren', onclick:closeModal }),
      el('button', { type:'submit', class:'btn', text:'Opslaan' })
    ])
  ]);
  var actionsRow = form.querySelector('.modal-actions');
  actionsRow.insertBefore(missingHint(form, [ { input:name, label:'naam' } ]), actionsRow.firstChild);
  m.body.appendChild(form);
  var draft = attachDraft(m, form, 'fabriek-bewerk', f.id);
}

/* ============================================================
   deel 2b — fabrieken (Fabriek op de Kaart)
   Eén optioneel veld per fabriek: de stad, gekozen uit de vaste
   presetlijst CP_CITY_COORDS in portal/config.js. De klant ziet de
   fabriek dan als pin op de vereenvoudigde China-kaart in de portal —
   alleen stadsniveau, nooit een adres. Leeg = geen pin.
   ============================================================ */
function renderFactories(){
  return DS.listFactories().then(function(factories){
    content.appendChild(el('div', { class:'pagehead' }, [
      el('div', null, [
        el('span', { class:'kicker', text:'Partnernetwerk' }),
        el('h1', { text:'Fabrieken' })
      ])
    ]));
    content.appendChild(el('p', {
      style:'font-size:14px;color:var(--gray-69);margin:-8px 0 18px;max-width:64ch;',
      text:'De stad bepaalt de pin op de kaart in het klantportaal — alleen stadsniveau, nooit een adres. Laat leeg om geen pin te tonen.'
    }));

    var cities = Object.keys(window.CP_CITY_COORDS || {});
    var list = el('div', { class:'card rowlist' });
    if(!factories.length){
      list.appendChild(el('div', { class:'empty', text:'Nog geen fabrieken in het netwerk.' }));
    }
    factories.forEach(function(f){
      var sel = el('select', { class:'input', style:'width:210px;flex:0 0 210px;', 'aria-label':'Stad van ' + f.name });
      sel.appendChild(option('', 'Geen stad op de kaart', !f.city));
      cities.forEach(function(c){ sel.appendChild(option(c, c, f.city===c)); });
      /* een stad buiten de preset (bv. uit oudere data) niet stilletjes weggooien */
      if(f.city && cities.indexOf(f.city)===-1){
        sel.appendChild(option(f.city, f.city + ' (geen kaartpositie)', true));
      }
      var flash = el('span', { class:'saveflash', text:'Opgeslagen' });
      sel.addEventListener('change', function(){
        DS.setFactoryCity(f.id, sel.value).then(function(){
          f.city = sel.value; /* zodat een latere mislukte poging naar de laatst opgeslagen stad terugvalt */
          flash.classList.add('show');
          setTimeout(function(){ flash.classList.remove('show'); }, 1600);
        }).catch(function(ex){
          sel.value = f.city || '';
          showError(ex);
        });
      });
      var subParts = [];
      if(f.region) subParts.push(f.region);
      if(f.nnnSignedAt) subParts.push('NNN getekend ' + fmtDate(f.nnnSignedAt));
      list.appendChild(el('div', { class:'rowitem' }, [
        el('div', { class:'rowmain' }, [
          el('div', { class:'rowtitle', text:f.name }),
          el('div', { class:'rowsub', text:subParts.join(' · ') || '—' })
        ]),
        /* golf 7 — bewerk-alles: naam/regio nabewerken */
        el('button', { type:'button', class:'btn ghost small', text:'Bewerk', onclick:function(){ openFactoryEditModal(f); } }),
        flash,
        sel
      ]));
    });
    content.appendChild(el('div', { class:'section' }, list));
  });
}

/* ============================================================
   deel 3 — vragen
   ============================================================ */
function renderQuestions(){
  return Promise.all([
    DS.listQuestions(), DS.listAllProjects(), DS.listClients(), DS.listAllMedia()
  ]).then(function(res){
    var questions = res[0], projects = res[1], clients = res[2], media = res[3];
    var pmap = {}, cmap = {}, mmap = {};
    projects.forEach(function(p){ pmap[p.id]=p; });
    clients.forEach(function(c){ cmap[c.id]=c; });
    media.forEach(function(mrow){ mmap[mrow.id]=mrow; });

    function ctxLine(q){
      var p = pmap[q.projectId];
      var c = p ? cmap[p.clientId] : null;
      var parts = [];
      if(p) parts.push(p.name);
      if(c) parts.push(c.company);
      if(q.stageKey) parts.push(stageLabel(q.stageKey));
      return parts.join(' · ');
    }
    function thumbFor(q){
      var mrow = q.mediaId ? mmap[q.mediaId] : null;
      if(!mrow) return null;
      var img = el('img', { class:'qthumb', alt:'' });
      DS.mediaUrl(mrow).then(function(u){ if(u) img.src=u; });
      return img;
    }
    /* herbestelaanvragen uit "Mijn Producten" (portal) beginnen met een
       vast voorvoegsel en krijgen hier een groene badge */
    function reorderChip(q){
      if(String(q.question||'').indexOf('HERBESTELLING:')!==0) return null;
      return el('span', { class:'chip done', text:'Herbestelling' });
    }

    /* open herbestelaanvragen leven onder Aanvragen; hier alleen echte vragen.
       De antwoordklok (1-werkdag-belofte) sorteert rood bovenaan. */
    var open = questions.filter(function(q){ return !q.answeredAt && !isReorderQuestion(q); });
    open.forEach(function(q){ q._klok = klokInfo(q.askedAt); });
    open.sort(function(a,b){ return (a._klok?a._klok.sort:0) - (b._klok?b._klok.sort:0); });
    var answered = questions.filter(function(q){ return q.answeredAt; })
      .sort(function(a,b){ return String(b.answeredAt).localeCompare(String(a.answeredAt)); });

    content.appendChild(el('div', { class:'pagehead' }, [
      el('div', null, [
        el('span', { class:'kicker', text:'Van klanten, over foto’s en fases' }),
        el('h1', { text:'Vragen' })
      ])
    ]));

    if(!open.length){
      content.appendChild(el('div', { class:'card empty section', text:'Geen openstaande vragen. Alles is beantwoord.' }));
    }
    open.forEach(function(q){
      var ta = el('textarea', { class:'input', 'aria-label':'Antwoord op vraag', placeholder:'Je antwoord aan de klant' });
      var err = el('p', { class:'formerr' });
      var card = el('div', { class:'card qcard', style:'margin-bottom:14px;' }, [
        el('div', { class:'qhead' }, [
          thumbFor(q),
          el('div', { class:'rowmain' }, [
            el('div', { style:'display:flex;align-items:center;gap:8px;flex-wrap:wrap;' }, [
              el('span', { class:'kicker', text:ctxLine(q) + ' · ' + fmtDateTime(q.askedAt) }),
              q._klok ? el('span', { class:'chip ' + q._klok.cls, text:q._klok.label }) : null,
              reorderChip(q)
            ]),
            el('div', { class:'qtext', text:q.question })
          ])
        ]),
        el('div', { class:'qanswer' }, [
          ta, err,
          el('div', { style:'margin-top:10px;display:flex;justify-content:flex-end;' },
            el('button', { type:'button', class:'btn small', text:'Beantwoord', onclick:function(){
              var a = ta.value.trim();
              if(!a){ err.textContent = 'Schrijf eerst een antwoord.'; err.classList.add('show'); return; }
              DS.answerQuestion(q.id, a).then(function(){
                var p = pmap[q.projectId];
                var c = p ? cmap[p.clientId] : null;
                if(p && c){
                  notifyClient({
                    client: c, projectName: p.name, projectCode: p.code,
                    page: 'updates', portalLabel: 'Bekijk het antwoord',
                    subject: mailSubject('antwoord', { project: p.name }),
                    bodyLine: 'Steffan heeft gereageerd op je vraag: “' + q.question + '”'
                  });
                }
                refresh();
              }).catch(function(ex){ err.textContent = ex.message||String(ex); err.classList.add('show'); });
            } }))
        ])
      ]);
      /* lijstsneltoetsen (functie 14): Enter opent het project, A focust het antwoordveld */
      kbRegister(card, {
        open: function(){
          var p = pmap[q.projectId];
          if(p) go({ name:'project', projectId:p.id, clientId:p.clientId });
        },
        answer: function(){ ta.focus(); }
      });
      content.appendChild(card);
    });

    if(answered.length){
      var det = el('details', { class:'answered card', style:'margin-top:22px;' });
      det.appendChild(el('summary', null, 'Beantwoorde vragen (' + answered.length + ')'));
      var inner = el('div', { style:'padding:0 18px 18px;' });
      answered.forEach(function(q){
        inner.appendChild(el('div', { style:'padding:14px 0;border-top:1px solid var(--line);' }, [
          el('div', { style:'display:flex;align-items:center;gap:8px;flex-wrap:wrap;' }, [
            el('span', { class:'kicker', text:ctxLine(q) + ' · gevraagd ' + fmtDateTime(q.askedAt) }),
            reorderChip(q)
          ]),
          el('div', { class:'qtext', style:'font-size:14.5px;', text:q.question }),
          el('div', { class:'qanswered' }, [
            el('div', { style:'display:flex;align-items:center;gap:10px;flex-wrap:wrap;' }, [
              el('span', { class:'kicker', text:'Antwoord · ' + fmtDateTime(q.answeredAt) }),
              /* golf 7 — bewerk-alles: antwoord nabewerken (stil) */
              el('button', { type:'button', class:'btn ghost small', text:'Bewerk antwoord', onclick:function(){
                openAnswerEditModal(q, pmap[q.projectId] || null);
              } })
            ]),
            el('div', { style:'margin-top:4px;', text:q.answer })
          ])
        ]));
      });
      det.appendChild(inner);
      content.appendChild(det);
    }
  });
}

/* ============================================================
   deel 4 — logboek
   ============================================================ */
function renderLog(){
  return Promise.all([ DS.listAllProjects(), DS.listClients() ]).then(function(res){
    var projects = res[0], clients = res[1];
    var cmap = {}; clients.forEach(function(c){ cmap[c.id]=c; });
    var pmap = {}; projects.forEach(function(p){ pmap[p.id]=p; });

    content.appendChild(el('div', { class:'pagehead' }, [
      el('div', null, [
        el('span', { class:'kicker', text: logTab==='mail'
          ? 'Elke klantmail, met Resend-status als bewijs'
          : (logTab==='systeem'
            ? 'Alles wat het beheer automatisch namens jou deed'
            : 'Alles wat is bekeken, gedownload en gedeeld') }),
        el('h1', { text:'Logboek' })
      ])
    ]));

    /* tabblad-balk: Klanttoegang (bestaand) + Mail (functie 62) +
       Systeem-auditlog (functie 63, golf 6) */
    function tabBtn(key, labelTxt){
      return el('button', {
        type:'button', class:'tabbtn' + (logTab===key ? ' active' : ''), role:'tab',
        'aria-selected': logTab===key ? 'true' : 'false', text:labelTxt,
        onclick:function(){ if(logTab!==key){ logTab = key; refresh(); } }
      });
    }
    content.appendChild(el('div', { class:'tabbar', role:'tablist', 'aria-label':'Logboeken' }, [
      tabBtn('toegang', 'Klanttoegang'),
      tabBtn('mail', 'Mail'),
      tabBtn('systeem', 'Systeem')
    ]));

    /* --- tabblad Systeem (functie 63): auditregels + automatische mails
       uit het mail-logboek, samengevoegd — nooit dubbel opgeslagen --- */
    if(logTab==='systeem'){
      return Promise.all([
        DS.listAudit ? DS.listAudit() : Promise.resolve([]),
        DS.listMailLog ? DS.listMailLog() : Promise.resolve([])
      ]).then(function(res2){
        var kinds = [
          ['', 'Alle actietypes'], ['mail', 'Klantmails'], ['publicatie', 'Geplande publicaties'],
          ['bewerking', 'Bewerkingen'], /* golf 7 — bewerk-alles */
          ['preview', 'Voorvertoningen'], ['toegang', 'Toegang & veiligheid'], ['offboarding', 'Offboarding'],
          ['overig', 'Overig']
        ];
        var rows3 = (res2[0]||[]).map(function(a){
          return { kind: a.kind || 'overig', clientId: a.clientId, projectId: a.projectId,
            detail: a.detail || '', createdAt: a.createdAt };
        });
        /* mails zijn al volledig gelogd in het mail-logboek; hier alleen
           samengevoegd weergegeven met status en ontvanger in de regel */
        (res2[1]||[]).forEach(function(r){
          rows3.push({ kind:'mail', clientId: r.clientId, projectId: null,
            detail: (r.subject || '—') + ' → ' + (r.to || '') + ' (' + mailStatusLabel(r.status).toLowerCase() + (r.note ? ' — ' + r.note : '') + ')',
            createdAt: r.createdAt });
        });
        rows3.sort(function(a,b){ return String(b.createdAt).localeCompare(String(a.createdAt)); });

        var ksel = el('select', { class:'input', style:'max-width:260px;', 'aria-label':'Filter op actietype' });
        kinds.forEach(function(pair){ ksel.appendChild(option(pair[0], pair[1], sysLogKindFilter===pair[0])); });
        ksel.addEventListener('change', function(){ sysLogKindFilter = ksel.value; refresh(); });
        var csel3 = el('select', { class:'input', style:'max-width:280px;', 'aria-label':'Filter op klant' });
        csel3.appendChild(option('', 'Alle klanten', sysLogClientFilter===''));
        clients.forEach(function(c2){ csel3.appendChild(option(c2.id, c2.company, sysLogClientFilter===c2.id)); });
        csel3.addEventListener('change', function(){ sysLogClientFilter = csel3.value; refresh(); });
        content.appendChild(el('div', { class:'field', style:'margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap;' }, [ ksel, csel3 ]));

        var shown = rows3.filter(function(r){
          if(sysLogKindFilter && r.kind!==sysLogKindFilter) return false;
          if(sysLogClientFilter){
            var cid = r.clientId || (r.projectId && pmap[r.projectId] ? pmap[r.projectId].clientId : null);
            if(cid!==sysLogClientFilter) return false;
          }
          return true;
        }).slice(0, 300);
        var kindLabels = {};
        kinds.forEach(function(pair){ if(pair[0]) kindLabels[pair[0]] = pair[1]; });
        var listEl3 = el('div', { class:'card rowlist' });
        if(!shown.length) listEl3.appendChild(el('div', { class:'empty', text:'Nog geen systeemacties gelogd. Automatische mails, geplande publicaties en voorvertoningen verschijnen hier vanzelf.' }));
        shown.forEach(function(r){
          var p2 = r.projectId ? pmap[r.projectId] : null;
          var c2 = r.clientId ? cmap[r.clientId] : (p2 ? cmap[p2.clientId] : null);
          listEl3.appendChild(el('div', { class:'logrow' }, [
            el('span', { class:'logwhen', text: fmtDateTime(r.createdAt) }),
            el('span', { class:'logactor' }, el('span', { class:'chip', text: kindLabels[r.kind] || r.kind })),
            el('span', { class:'logdetail', text: r.detail }),
            el('span', { class:'logproj', text: [c2 ? c2.company : null, p2 ? p2.name : null].filter(Boolean).join(' · ') })
          ]));
        });
        content.appendChild(listEl3);
      });
    }

    /* --- tabblad Mail (functie 62) --- */
    if(logTab==='mail'){
      return (DS.listMailLog ? DS.listMailLog() : Promise.resolve([])).then(function(mailRows){
        return DS.listClients().then(function(clients2){
          var csel = el('select', { class:'input', style:'max-width:340px;', 'aria-label':'Filter op klant' });
          csel.appendChild(option('', 'Alle klanten', mailLogClientFilter===''));
          clients2.forEach(function(c2){
            csel.appendChild(option(c2.id, c2.company, mailLogClientFilter===c2.id));
          });
          csel.addEventListener('change', function(){ mailLogClientFilter = csel.value; refresh(); });
          content.appendChild(el('div', { class:'field', style:'margin-bottom:16px;' }, csel));

          var rows2 = mailRows.filter(function(r){ return !mailLogClientFilter || r.clientId===mailLogClientFilter; });
          var listEl2 = el('div', { class:'card rowlist' });
          if(!rows2.length) listEl2.appendChild(el('div', { class:'empty', text:'Nog geen klantmails gelogd. Elke verzending via het beheer verschijnt hier automatisch.' }));
          rows2.forEach(function(r){
            var subParts3 = [ r.to ];
            if(r.category) subParts3.push(r.category);
            if(r.projectName) subParts3.push(r.projectName);
            if(r.note) subParts3.push(r.note);
            /* eerlijk labelen: een geaccepteerde mail is nog geen bezorgde mail —
               we tonen het message-id als bewijs en 'bezorgstatus nog onbekend'
               zolang die niet is opgevraagd (geen stille aannames) */
            if(r.status==='verzonden'){
              subParts3.push(r.messageId ? 'Resend-id ' + r.messageId : 'zonder message-id');
              subParts3.push('bezorgstatus nog onbekend');
            }
            listEl2.appendChild(el('div', { class:'rowitem' }, [
              el('span', { class:'chip' + (r.status==='verzonden' ? ' done' : (r.status==='fout' ? ' crit' : '')), text: mailStatusLabel(r.status) }),
              el('div', { class:'rowmain' }, [
                el('div', { class:'rowtitle', text: r.subject || '—' }),
                el('div', { class:'rowsub', text: subParts3.filter(Boolean).join(' · ') })
              ]),
              el('span', { class:'rowmeta', text: fmtDateTime(r.createdAt) })
            ]));
          });
          content.appendChild(listEl2);
        });
      });
    }

    /* --- tabblad Klanttoegang (bestaand; klantfilter lift mee met functie 31) --- */
    var sel = el('select', { class:'input', style:'max-width:340px;', 'aria-label':'Filter op project' });
    sel.appendChild(option('', 'Alle projecten', logFilter===''));
    projects.forEach(function(p){
      var c = cmap[p.clientId];
      sel.appendChild(option(p.id, p.name + (c ? ' — ' + c.company : ''), logFilter===p.id));
    });
    sel.addEventListener('change', function(){ logFilter = sel.value; refresh(); });
    var csel2 = el('select', { class:'input', style:'max-width:280px;', 'aria-label':'Filter op klant' });
    csel2.appendChild(option('', 'Alle klanten', logClientFilter===''));
    clients.forEach(function(c2){
      csel2.appendChild(option(c2.id, c2.company, logClientFilter===c2.id));
    });
    csel2.addEventListener('change', function(){ logClientFilter = csel2.value; refresh(); });
    content.appendChild(el('div', { class:'field', style:'margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap;' }, [ sel, csel2 ]));

    /* alle regels laden (niet per project) zodat de nieuw-apparaat-analyse
       (functie 33) over de volledige klantgeschiedenis rekent; het
       projectfilter is daarna puur weergave */
    return DS.listLog(null).then(function(allRows){
      var devices = computeNewDevices(allRows, projects);
      var logRows = allRows.filter(function(r){
        if(logFilter && r.projectId!==logFilter) return false;
        if(logClientFilter){
          var p = pmap[r.projectId];
          if(!p || p.clientId!==logClientFilter) return false;
        }
        return true;
      });
      logRows.sort(function(a,b){ return String(b.createdAt).localeCompare(String(a.createdAt)); });
      var listEl = el('div', { class:'card rowlist' });
      if(!logRows.length) listEl.appendChild(el('div', { class:'empty', text:'Nog geen logregels — activiteit van klant en beheer verschijnt hier vanzelf.' }));
      logRows.forEach(function(r){
        var p = pmap[r.projectId];
        /* apparaatinfo (functie 33): uit het detail gelicht en apart
           getoond; een combinatie die deze klant nog niet eerder
           gebruikte krijgt een markering */
        var device = deviceTagOf(r);
        var detailKids = [ document.createTextNode(stripDeviceTag(r.detail) || r.action) ];
        if(device){
          detailKids.push(el('span', { class:'kicker', style:'display:inline-block;margin-left:8px;', text: device }));
          if(devices.flaggedRowIds[r.id]){
            detailKids.push(el('span', { class:'chip awaiting', style:'margin-left:8px;', text:'Nieuw apparaat' }));
          }
        }
        listEl.appendChild(el('div', { class:'logrow' }, [
          el('span', { class:'logwhen', text:fmtDateTime(r.createdAt) }),
          el('span', { class:'logactor' }, el('span', { class:'chip' + (r.actor==='client' ? ' current' : ''), text:actorLabel(r.actor) })),
          el('span', { class:'logdetail' }, detailKids),
          el('span', { class:'logproj', text:p ? p.name : '' })
        ]));
      });
      content.appendChild(listEl);
    });
  });
}

/* ============================================================
   modusbanner + health (functie 16)
   Permanente indicator: demo of Supabase-live; bij live een stip die
   vertelt of database en mailfunctie bereikbaar zijn. Klikken toont de
   detailstatus én de ingang naar de go-live-checklist (functie 70).
   ============================================================ */
var modeBar = document.getElementById('modeBar');
var modeDot = document.getElementById('modeDot');
var modeText = document.getElementById('modeText');
var health = { db:'', mail:'', checkedAt:null };

function paintModeBar(){
  if(!DS) return;
  if(DS.mode==='demo'){
    modeDot.className = 'dot ok';
    modeText.textContent = 'Demomodus — wijzigingen blijven lokaal in deze browser';
    return;
  }
  var cls = 'ok';
  if(health.db==='fout') cls = 'bad';
  else if(health.db==='bezig' || health.mail==='bezig' || health.mail==='fout' || health.mail==='uit' || health.mail==='halfaf') cls = 'warn';
  modeDot.className = 'dot ' + cls;
  modeText.textContent = 'Live — Supabase' + (health.db==='fout' ? ' · database niet bereikbaar' : '');
}
function runHealthChecks(){
  if(!DS) return Promise.resolve();
  health.checkedAt = new Date();
  if(DS.mode==='demo'){
    health.db = 'demo';
    health.mail = 'demo';
    paintModeBar();
    return Promise.resolve();
  }
  health.db = 'bezig'; health.mail = 'bezig';
  paintModeBar();
  var dbCheck;
  if(window.__cpSb){
    dbCheck = window.__cpSb.from('staff_users').select('user_id', { head:true, count:'exact' })
      .then(function(res){ health.db = res.error ? 'fout' : 'ok'; }, function(){ health.db = 'fout'; });
  } else {
    health.db = 'fout';
    dbCheck = Promise.resolve();
  }
  var mailCheck;
  if(!CFG.notifySharedSecret){
    health.mail = 'uit';
    mailCheck = Promise.resolve();
  } else {
    /* de functie antwoordt op GET eerlijk met {configured:true/false}
       zonder iets te versturen — zo kan de stip niet groen zijn terwijl
       elke echte mail op 503 zou stranden. 404 = niet uitgerold; een
       oudere functieversie zonder JSON-antwoord telt als 'bereikbaar'. */
    mailCheck = fetch('/.netlify/functions/notify-client', { method:'GET' })
      .then(function(r){
        if(r.status===404){ health.mail = 'fout'; return; }
        return r.json().then(function(j){
          health.mail = (j && j.configured===false) ? 'halfaf' : 'ok';
        }, function(){ health.mail = 'ok'; });
      }, function(){ health.mail = 'fout'; });
  }
  return Promise.all([dbCheck, mailCheck]).then(paintModeBar);
}
function healthLabel(kind, v){
  if(kind==='db'){
    if(v==='demo') return 'Lokaal in deze browser (localStorage)';
    if(v==='ok') return 'Bereikbaar';
    if(v==='fout') return 'Niet bereikbaar';
    if(v==='bezig') return 'Wordt gecontroleerd…';
    return '—';
  }
  if(v==='demo') return 'Uit in demomodus — er gaan geen echte mails';
  if(v==='uit') return 'Niet geconfigureerd (notifySharedSecret is leeg)';
  if(v==='halfaf') return 'Bereikbaar, maar de env vars op Netlify ontbreken (RESEND_API_KEY / RESEND_FROM / NOTIFY_SHARED_SECRET) — mails stranden op 503';
  if(v==='ok') return 'Functie bereikbaar';
  if(v==='fout') return 'Niet bereikbaar';
  if(v==='bezig') return 'Wordt gecontroleerd…';
  return '—';
}
function openModeStatusModal(){
  var m = openModal('Omgeving & status', DS.mode==='demo' ? 'Demomodus' : 'Live — Supabase');
  var wrap = el('div');
  function fill(){
    clearNode(wrap);
    wrap.appendChild(el('div', { class:'statusline' }, [
      el('span', { class:'kicker', text:'Omgeving' }),
      el('span', { text: DS.mode==='demo' ? 'Demomodus' : 'Live — Supabase' })
    ]));
    wrap.appendChild(el('div', { class:'statusline' }, [
      el('span', { class:'kicker', text:'Database' }),
      el('span', { text: healthLabel('db', health.db), style: health.db==='fout' ? 'color:var(--critical);' : '' })
    ]));
    wrap.appendChild(el('div', { class:'statusline' }, [
      el('span', { class:'kicker', text:'Mailfunctie' }),
      el('span', { text: healthLabel('mail', health.mail), style: health.mail==='fout' ? 'color:var(--critical);' : '' })
    ]));
    wrap.appendChild(el('div', { class:'statusline' }, [
      el('span', { class:'kicker', text:'Laatst gecontroleerd' }),
      el('span', { text: health.checkedAt ? fmtDateTime(health.checkedAt.toISOString()) : '—' })
    ]));
  }
  fill();
  m.body.appendChild(wrap);
  var again = el('button', { type:'button', class:'btn ghost', text:'Opnieuw controleren' });
  again.addEventListener('click', function(){
    again.disabled = true;
    runHealthChecks().then(function(){ again.disabled = false; fill(); });
  });
  /* go-live-checklist (golf 6, functie 70): de banner is de ingang */
  var glBtn = el('button', { type:'button', class:'btn ghost', text:'Go-live-checklist' });
  glBtn.addEventListener('click', function(){
    closeModal();
    settingsFocusGoLive = true;
    go({ name:'settings' });
  });
  m.body.appendChild(el('div', { class:'modal-actions' }, [
    glBtn,
    again,
    el('button', { type:'button', class:'btn', text:'Sluiten', onclick:closeModal })
  ]));
}
modeBar.addEventListener('click', function(){ if(DS) openModeStatusModal(); });

/* ============================================================
   login en opstart
   ============================================================ */
var loginEl = document.getElementById('login');
var appEl = document.getElementById('app');
var loginBody = document.getElementById('loginBody');

/* ochtendmail (functie 7): dezelfde aggregatie als de samenvattingskop, als
   mail naar Steffan zelf via de bestaande mail-infra. Er draait geen server,
   dus eerlijk: verzonden bij de eerste keer openen na 7:00, één keer per dag. */
function maybeSendMorningMail(){
  if(!DS) return;
  DS.getSettings().then(function(st){
    var om = st.ochtendmail || {};
    var today = todayISO();
    if(!om.aan || om.laatst===today || new Date().getHours() < 7) return;
    return Promise.all([
      DS.listClients(), DS.listAllProjectsWithStages(), DS.listQuestions(),
      DS.listAllInvoices(), DS.listAllShipments(), DS.listAllSamples(),
      DS.listAllMedia(), DS.listLog(null),
      DS.listContactMoments ? DS.listContactMoments() : Promise.resolve([])
    ]).then(function(res){
      return DS.listShipmentEvents(res[4].map(function(s){ return s.id; })).then(function(events){
        var d = { clients:res[0], projects:res[1], questions:res[2], invoices:res[3],
          shipments:res[4], samples:res[5], media:res[6], logRows:res[7], settings:st, events:events };
        var sig = computeSignals(d);
        var counts = computeCounts(d, sig);
        var reminders = (res[8]||[]).filter(function(mnt){
          return mnt.remindAt && !mnt.remindDone && String(mnt.remindAt).slice(0,10) <= today;
        });
        var total = sig.items.length + reminders.length;
        var mailP = Promise.resolve();
        if(DS.staffEmail){
          mailP = notifyClient({
            client: { id:null, email: DS.staffEmail, contactName: DS.staffName },
            projectName: 'CUSTOM+ Beheer', projectCode: '',
            /* 'Open het beheer' moet ook echt het BEHEER openen — zonder
               adminUrl viel de knop terug op de klantportaal-link */
            adminUrl: location.origin + '/beheer.html',
            page:'', portalLabel:'Open het beheer', category:'ochtend',
            subject:'Ochtendoverzicht — ' + total + (total===1 ? ' open punt' : ' open punten'),
            bodyLine: countsLine(counts, total)
          });
        }
        return mailP.then(function(){
          var next = { aan:true, laatst: today };
          if(adminSettings) adminSettings.ochtendmail = next;
          return DS.saveSetting('ochtendmail', next);
        });
      });
    });
  }).catch(function(){ /* de ochtendmail mag het opstarten nooit blokkeren */ });
}
function enterApp(){
  document.getElementById('whoName').textContent = DS.staffName;
  document.getElementById('whoMail').textContent = DS.staffEmail;
  paintModeBar();
  runHealthChecks();
  /* cache voor fasesjabloon/AQL/snippets/sjablonen (golf 3 + 5), daarna de
     geplande-publicatie-check (functie 45): vervallen momenten flippen en
     versturen hun bundelmail bij dit bezoek — eerlijk, er draait geen server */
  refreshAdminSettings().then(function(){
    return checkScheduledPublications();
  }).then(function(flipped){
    if(flipped){ updateBadge(); refresh(); }
  });
  maybeSendMorningMail(); /* functie 7: dagoverzicht naar mijzelf, indien aan */
  loginEl.hidden = true;
  appEl.hidden = false;
  go({ name:'vandaag' });
}
function buildDemoLogin(){
  clearNode(loginBody);
  loginBody.appendChild(el('p', { text:'Er is nog geen Supabase-project gekoppeld. Je kunt het beheer volledig proberen met voorbeelddata; wijzigingen blijven lokaal in deze browser.' }));
  loginBody.appendChild(el('button', { type:'button', class:'btn wide', text:'Open het demobeheer', onclick:function(){
    DS = makeDemoService();
    enterApp();
  } }));
}
function buildSupaLogin(){
  clearNode(loginBody);
  var email = el('input', { class:'input', type:'email', required:'required', autocomplete:'username' });
  var pass = el('input', { class:'input', type:'password', required:'required', autocomplete:'current-password' });
  var err = el('p', { class:'login-error' });
  var submit = el('button', { type:'submit', class:'btn wide', text:'Inloggen' });
  var form = el('form', { onsubmit:function(e){
    e.preventDefault();
    err.classList.remove('show');
    submit.disabled = true;
    var sb = null;
    loadSupabaseLib().then(function(){
      /* één client per pagina: meerdere GoTrueClient-instanties op dezelfde
         storage-sleutel geven waarschuwingen en token-refresh-races */
      if(!window.__cpSb) window.__cpSb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
      sb = window.__cpSb;
      return sb.auth.signInWithPassword({ email: email.value.trim(), password: pass.value });
    }).then(function(res){
      if(res.error){
        var msg = /invalid login credentials/i.test(res.error.message||'')
          ? 'E-mail of wachtwoord klopt niet.'
          : 'Inloggen lukte niet: ' + res.error.message;
        throw new Error(msg);
      }
      var userId = res.data.user.id;
      return sb.from('staff_users').select('user_id').eq('user_id', userId).maybeSingle().then(function(staffRes){
        if(staffRes.error) throw new Error('Kon de beheerrechten niet controleren: ' + staffRes.error.message);
        if(!staffRes.data){
          return sb.auth.signOut().then(function(){
            throw new Error('Dit account heeft geen beheerrechten.');
          });
        }
        DS = makeSupaService(sb, res.data.user);
        enterApp();
      });
    }).catch(function(ex){
      err.textContent = ex.message || String(ex);
      err.classList.add('show');
    }).then(function(){ submit.disabled = false; });
  } }, [
    field('E-mail', email),
    field('Wachtwoord', pass),
    submit,
    err
  ]);
  loginBody.appendChild(el('p', { text:'Log in met je beheeraccount.' }));
  loginBody.appendChild(form);
}
document.getElementById('logoutBtn').addEventListener('click', function(){
  DS = null;
  /* in Supabase-modus ook écht uitloggen: anders blijft het staff-token
     in localStorage staan na "Uitloggen" */
  if(!IS_DEMO && window.__cpSb) window.__cpSb.auth.signOut();
  appEl.hidden = true;
  loginEl.hidden = false;
  if(IS_DEMO) buildDemoLogin(); else buildSupaLogin();
});
document.querySelectorAll('.navbtn').forEach(function(b){
  b.addEventListener('click', function(){
    var nav = b.getAttribute('data-nav');
    go({ name:nav==='clients' ? 'clients' : nav });
  });
});

if(IS_DEMO) buildDemoLogin(); else buildSupaLogin();
})();
