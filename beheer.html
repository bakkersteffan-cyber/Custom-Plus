  var m = openModal('Kopieer naar ander project', 'De kopie landt als concept — publiceren doe je daar bewust');
  var err = el('p', { class:'formerr' });
  var checks = []; /* { chk, kind, id, label } */
  function checkRow(kind, id, labelTxt, subTxt){
    var chk = el('input', { type:'checkbox' });
    checks.push({ chk: chk, kind: kind, id: id });
    return el('label', { class:'checkline', style:'margin-bottom:8px;' }, [
      chk,
      el('span', null, [
        document.createTextNode(labelTxt + ' '),
        subTxt ? el('span', { class:'kicker', text:'— ' + subTxt }) : null
      ])
    ]);
  }
  if(docItems.length){
    m.body.appendChild(el('span', { class:'kicker', style:'display:block;margin-bottom:8px;', text:'Documenten' }));
    docItems.slice().sort(function(a,b){ return String(a.createdAt||'').localeCompare(String(b.createdAt||'')); }).forEach(function(d){
      m.body.appendChild(checkRow('document', d.id, d.title || 'Document', docTypeLabel(d.docType)));
    });
  }
  if(mediaItems.length){
    m.body.appendChild(el('span', { class:'kicker', style:'display:block;margin:10px 0 8px;', text:'Foto’s' }));
    mediaItems.slice().sort(function(a,b){ return String(a.capturedAt||'').localeCompare(String(b.capturedAt||'')); }).forEach(function(mm){
      m.body.appendChild(checkRow('media', mm.id, mm.caption || 'Foto', fmtDate(mm.capturedAt)));
    });
  }
  var targetSel = el('select', { class:'input', 'aria-label':'Doelproject' });
  targetSel.appendChild(option('', 'Kies een doelproject…', true));
  var goBtn = el('button', { type:'button', class:'btn', text:'Kopieer als concept', disabled:'disabled' });
  Promise.all([ DS.listAllProjects(), DS.listClients() ]).then(function(res){
    var cmap = {};
    (res[1]||[]).forEach(function(c){ cmap[c.id] = c; });
    (res[0]||[]).filter(function(p){ return p.id!==project.id && p.status!=='archived'; })
      .sort(function(a,b){ return String(a.name).localeCompare(String(b.name)); })
      .forEach(function(p){
        var c = cmap[p.clientId];
        targetSel.appendChild(option(p.id, p.name + (c ? ' — ' + c.company : '')));
      });
    if(targetSel.options.length===1){
      err.textContent = 'Er is geen ander actief project om naar te kopiëren.';
      err.classList.add('show');
    }
  }).catch(function(){});
  function syncBtn(){
    var any = checks.some(function(c){ return c.chk.checked; });
    goBtn.disabled = !(any && targetSel.value);
  }
  checks.forEach(function(c){ c.chk.addEventListener('change', syncBtn); });
  targetSel.addEventListener('change', syncBtn);
  m.body.appendChild(el('div', { style:'margin-top:12px;' }, field('Doelproject', targetSel)));
  m.body.appendChild(err);
  goBtn.addEventListener('click', function(){
    var picked = checks.filter(function(c){ return c.chk.checked; });
    if(!picked.length || !targetSel.value) return;
    goBtn.disabled = true;
    var chain = Promise.resolve();
    picked.forEach(function(c){
      chain = chain.then(function(){
        return c.kind==='media'
          ? DS.copyMediaToProject(c.id, targetSel.value)
          : DS.copyDocumentToProject(c.id, targetSel.value);
      });
    });
    chain.then(function(){
      return auditLog({ kind:'overig', clientId: project.clientId, projectId: project.id,
        detail: picked.length + ' item(s) als concept gekopieerd naar een ander project' });
    }).then(function(){
      closeModal();
      updateBadge(); /* wachtrij-teller: de kopieën zijn concepten */
      refresh();
    }).catch(function(ex){
      goBtn.disabled = false;
      err.textContent = ex.message||String(ex);
      err.classList.add('show');
    });
  });
  m.body.appendChild(el('div', { class:'modal-actions' }, [
    el('button', { type:'button', class:'btn ghost', text:'Annuleren', onclick:closeModal }),
    goBtn
  ]));
}

/* ---------- modals projectdetail ---------- */
function stageSelect(selected){
  var sel = el('select', { class:'input' });
  STAGES.forEach(function(s){ sel.appendChild(option(s.key, s.label, s.key===selected)); });
  return sel;
}
/* batchupload met gedeelde metadata (functie 47), dropzone/plakken (48) en
   EXIF-datumdefaults (49). Eén modal voor 1..n foto's: fase, fabriek,
   standaarddatum en een optionele onderschrift-prefix vul je één keer in;
   per foto alleen het onderschrift-verschil (verplicht blijft verplicht).
   Opslaan schrijft losse media-items via de bestaande DS.addMedia en stuurt
   één gebundelde klantmail i.p.v. n losse. */
var mediaBatchApi = null; /* open batchmodal — plakken/droppen voegt dan toe */
function openMediaModal(projectId, factories, project, client, initialFiles, defaultVis){
  var m = openModal('Foto’s toevoegen', IS_DEMO
    ? 'Demomodus: eigen foto’s (kiezen, slepen of plakken — verkleind bewaard in deze browser) of sitebeelden'
    : 'Meerdere tegelijk: gedeelde herkomst, per foto alleen het onderschrift', { wide:true });

  var rows = [];
  var form = el('form');

  /* --- gedeelde metadata (47) --- */
  var stage = stageSelect('concept');
  var fac = el('select', { class:'input' });
  fac.appendChild(option('', 'Geen fabriek (CUSTOM+)', true));
  factories.forEach(function(f){ fac.appendChild(option(f.id, f.name + (f.region ? ' — ' + f.region : ''))); });
  var sharedDate = smartDateField(todayISO(), 'Standaarddatum voor de batch');
  var prefix = el('input', { class:'input', type:'text', placeholder:'bv. Fabrieksbezoek Shenzhen — ' });
  /* conceptstand (functie 42): direct publiceren blijft de standaard —
     als concept bewaren stuurt niets naar de klant tot je publiceert */
  var visSel = el('select', { class:'input', 'aria-label':'Zichtbaarheid' });
  visSel.appendChild(option('publish', 'Direct publiceren', defaultVis!=='concept'));
  visSel.appendChild(option('concept', 'Als concept in de wachtrij (geen mail)', defaultVis==='concept'));
  /* onderschrift-snippets (functie 50): {fase}/{fabriek}/{datum} worden
     per foto ingevuld vanuit de metadata */
  var snippets = (adminSettings && Array.isArray(adminSettings.snippets)) ? adminSettings.snippets : [];
  var snipSel = null;
  if(snippets.length){
    snipSel = el('select', { class:'input', 'aria-label':'Snippet voor onderschriften' });
    snippets.forEach(function(s2, i2){ snipSel.appendChild(option(String(i2), s2, i2===0)); });
  }
  function snippetTextFor(row){
    var tplTxt = snippets[parseInt(snipSel ? snipSel.value : '0', 10)] || '';
    var facName = 'CUSTOM+';
    if(fac.value){
      var f2 = factories.find(function(f){ return f.id===fac.value; });
      if(f2 && f2.name) facName = f2.name;
    }
    return tplTxt
      .replace(/\{fase\}/g, stageLabel(stage.value))
      .replace(/\{fabriek\}/g, facName)
      .replace(/\{datum\}/g, fmtDate(row.date.value || todayISO()));
  }

  /* --- batch-controlelijst --- */
  var listWrap = el('div');
  var listEmpty = el('p', { class:'drophint', text:'Nog geen foto’s in de batch — kies, sleep of plak (Cmd+V).' });
  listWrap.appendChild(listEmpty);

  function stageWarnFor(iso){
    /* functie 49: zachte waarschuwing als de fotodatum vóór de afronding
       van de vorige fase ligt — de portal toont herkomst prominent, dus een
       foute datum valt de klant direct op */
    if(!iso || !project || !project.stages) return '';
    var sorted = project.stages.slice().sort(function(a,b){ return a.position-b.position; });
    var idx = -1;
    sorted.forEach(function(s, i2){ if(s.stageKey===stage.value) idx = i2; });
    if(idx < 1) return '';
    var prev = sorted[idx-1];
    if(prev.approvedAt && iso < String(prev.approvedAt).slice(0,10)){
      return 'Datum ligt vóór de afronding van ' + stageLabel(prev.stageKey) + ' (' + fmtDate(prev.approvedAt) + ') — klopt dat?';
    }
    return '';
  }
  function syncRowWarn(row){
    row.warn.textContent = stageWarnFor(row.date.value || null);
  }
  function removeRow(row){
    var i = rows.indexOf(row);
    if(i>-1) rows.splice(i,1);
    if(row.objUrl){ try{ URL.revokeObjectURL(row.objUrl); }catch(e2){} row.objUrl = null; }
    if(row.node.parentNode) row.node.parentNode.removeChild(row.node);
    listEmpty.hidden = rows.length>0;
    calcMiss();
  }
  var pickerMap = {}; /* demo-sitebeelden: src → rij */
  function unpressPicker(src){
    var btns = form.querySelectorAll('.imgpick');
    DEMO_IMAGES.forEach(function(src2, i2){
      if(src2===src && btns[i2]) btns[i2].setAttribute('aria-pressed','false');
    });
  }
  function addRow(item){
    /* item: {src, thumb} (sitebeeld/dataURL) of {file} */
    var row = { src: item.src||null, file: item.file||null, dateSource:'gedeeld', objUrl:null };
    var img = el('img', { class:'batchthumb', alt:'' });
    if(item.thumb) img.src = item.thumb;
    else if(item.file){
      try{ row.objUrl = URL.createObjectURL(item.file); img.src = row.objUrl; }catch(e2){}
    }
    row.img = img;
    row.cap = el('input', { class:'input', type:'text', placeholder:'Onderschrift', 'aria-label':'Onderschrift bij deze foto' });
    row.date = el('input', { class:'input', type:'date', value: sharedDate.get() || todayISO(), 'aria-label':'Datum van deze foto' });
    row.tag = el('span', { class:'batchtag', text:'' });
    row.warn = el('span', { class:'batchwarn', text:'' });
    row.date.addEventListener('input', function(){ row.dateSource = 'hand'; syncRowWarn(row); });
    var rm = el('button', { type:'button', class:'batchrm', text:'×', 'aria-label':'Foto uit de batch halen' });
    rm.addEventListener('click', function(){
      removeRow(row);
      if(row.src && pickerMap[row.src]){ pickerMap[row.src] = null; unpressPicker(row.src); }
    });
    /* snippet met één klik in dít onderschriftveld (functie 50) */
    var snipBtn = null;
    if(snipSel){
      snipBtn = el('button', { type:'button', class:'dup', text:'Snippet', 'aria-label':'Gekozen snippet invoegen in dit onderschrift' });
      snipBtn.addEventListener('click', function(){
        var filled = snippetTextFor(row);
        if(!filled) return;
        row.cap.value = row.cap.value.trim() ? (row.cap.value.replace(/\s+$/, '') + ' ' + filled) : filled;
        row.cap.dispatchEvent(new Event('input', { bubbles:true }));
        row.cap.focus();
      });
    }
    row.node = el('div', { class:'batchrow' }, [
      img,
      el('div', { class:'batchfields' }, [
        row.cap,
        el('div', { class:'batchmeta' }, [ row.date, snipBtn, row.tag, row.warn ])
      ]),
      rm
    ]);
    rows.push(row);
    listWrap.appendChild(row.node);
    listEmpty.hidden = true;
    /* EXIF-datum (49): stil, en alleen als er echt iets gevonden is */
    if(item.file){
      readExifDate(item.file).then(function(iso){
        if(iso){
          row.date.value = iso;
          row.dateSource = 'exif';
          row.tag.textContent = 'EXIF';
        }
        syncRowWarn(row);
      });
    } else syncRowWarn(row);
    calcMiss();
    return row;
  }
  function addFiles(files){
    var imgs = [];
    Array.prototype.forEach.call(files||[], function(f){
      if(f && f.type && f.type.indexOf('image/')===0) imgs.push(f);
    });
    imgs.forEach(function(f){
      if(IS_DEMO){
        /* demomodus (golf uploads): verkleind als blob naar IndexedDB bij
           opslaan; de EXIF-lezing uit addRow loopt op het ORIGINELE bestand
           en de voorvertoning blijft de objectURL van dat origineel */
        var row = addRow({ file: f });
        row.fileName = f.name || '';
        row.tag.textContent = 'verwerken…';
        fileToDemoBlob(f).then(function(blob){
          if(blob){
            row.demoBlob = blob;
            row.file = null; /* de EXIF-lezing uit addRow loopt intussen gewoon door */
            if(row.tag.textContent==='verwerken…') row.tag.textContent = '';
          } else {
            removeRow(row);
          }
        });
      } else addRow({ file: f });
    });
  }

  /* --- invoerbronnen --- */
  var srcWrap = el('div');
  if(IS_DEMO){
    var grid = el('div', { class:'imgpickgrid', role:'group', 'aria-label':'Beschikbare sitebeelden' });
    DEMO_IMAGES.forEach(function(src){
      var b = el('button', { type:'button', class:'imgpick', 'aria-pressed':'false', 'aria-label':src.replace('images/','') },
        el('img', { src:src, alt:'' }));
      b.addEventListener('click', function(){
        if(pickerMap[src]){
          var old = pickerMap[src];
          pickerMap[src] = null;
          removeRow(old);
          b.setAttribute('aria-pressed','false');
        } else {
          pickerMap[src] = addRow({ src:src, thumb:src });
          b.setAttribute('aria-pressed','true');
        }
      });
      grid.appendChild(b);
    });
    /* golf uploads: óók in demomodus een echte bestandskiezer, naast de
       sitebeelden — zelfde addFiles-pad als slepen/plakken */
    var demoFileInput = el('input', { class:'input', type:'file', accept:'image/*', multiple:'multiple' });
    demoFileInput.addEventListener('change', function(){
      addFiles(demoFileInput.files);
      demoFileInput.value = '';
    });
    srcWrap.appendChild(field('Eigen foto’s (meerdere tegelijk — bewaard in deze browser)', demoFileInput));
    srcWrap.appendChild(field('Of sitebeelden (klik om te selecteren)', grid));
  } else {
    var fileInput = el('input', { class:'input', type:'file', accept:'image/*', multiple:'multiple' });
    fileInput.addEventListener('change', function(){
      addFiles(fileInput.files);
      fileInput.value = '';
    });
    srcWrap.appendChild(field('Bestanden (meerdere tegelijk)', fileInput));
  }

  /* gedeelde datum → rijen zonder eigen (EXIF/handmatige) datum lopen mee */
  sharedDate.input.addEventListener('input', function(){
    var iso = sharedDate.get();
    if(!iso) return;
    rows.forEach(function(row){
      if(row.dateSource==='gedeeld'){ row.date.value = iso; syncRowWarn(row); }
    });
  });
  stage.addEventListener('change', function(){ rows.forEach(syncRowWarn); });

  var err = el('p', { class:'formerr' });
  /* FIXRONDE R0-4: plek voor de terugrolknop bij een half gelukte batch */
  var rollbackWrap = el('div', { style:'margin:-6px 0 12px;' });
  var submitBtn = el('button', { type:'submit', class:'btn', text:'Toevoegen' });
  var missTxt = el('span', { class:'misshint', 'aria-live':'polite' });
  function calcMiss(){
    var miss = [];
    if(!rows.length) miss.push('minstens één foto');
    var capMiss = 0, dateMiss = 0;
    rows.forEach(function(row){
      if(!(prefix.value + row.cap.value).trim()) capMiss++;
      if(!row.date.value) dateMiss++;
    });
    if(capMiss) miss.push('onderschrift bij ' + capMiss + (capMiss===1 ? ' foto' : ' foto’s'));
    if(dateMiss) miss.push('datum bij ' + dateMiss + (dateMiss===1 ? ' foto' : ' foto’s'));
    missTxt.textContent = miss.length ? 'Nog: ' + miss.join(', ') : '';
    submitBtn.textContent = rows.length>1 ? 'Voeg ' + rows.length + ' foto’s toe' : 'Toevoegen';
  }
  form.addEventListener('input', calcMiss);
  form.addEventListener('change', calcMiss);

  form.appendChild(srcWrap);
  form.appendChild(el('div', { class:'formrow' }, [ field('Fase', stage), field('Fabriek', fac) ]));
  form.appendChild(el('div', { class:'formrow' }, [
    field('Standaarddatum', sharedDate.node),
    field('Onderschrift-prefix (optioneel)', prefix)
  ]));
  form.appendChild(snipSel
    ? el('div', { class:'formrow' }, [ field('Zichtbaarheid', visSel), field('Snippet (knop per foto)', snipSel) ])
    : field('Zichtbaarheid', visSel));
  form.appendChild(field('Batch', listWrap));
  form.appendChild(err);
  form.appendChild(rollbackWrap);
  form.appendChild(el('div', { class:'modal-actions' }, [
    missTxt,
    el('button', { type:'button', class:'btn ghost', text:'Annuleren', onclick:closeModal }),
    submitBtn
  ]));

  form.addEventListener('submit', function(e){
    e.preventDefault();
    err.classList.remove('show');
    clearNode(rollbackWrap);
    if(!rows.length){ err.textContent = 'Voeg eerst minstens één foto toe.'; err.classList.add('show'); return; }
    var payloads = [];
    for(var i=0;i<rows.length;i++){
      var row = rows[i];
      var capv = (prefix.value + row.cap.value).trim();
      if(!capv){ err.textContent = 'Elke foto heeft een onderschrift nodig (de prefix telt mee).'; err.classList.add('show'); row.cap.focus(); return; }
      if(!row.date.value){ err.textContent = 'Elke foto heeft een datum nodig.'; err.classList.add('show'); row.date.focus(); return; }
      if(IS_DEMO && !row.src && !row.demoBlob){ err.textContent = 'Een van de foto’s wordt nog verwerkt — probeer het zo opnieuw.'; err.classList.add('show'); return; }
      var pl = { stageKey: stage.value, caption: capv, factoryId: fac.value || null, capturedAt: row.date.value,
        publishStatus: visSel.value==='concept' ? 'concept' : 'published' };
      if(IS_DEMO){
        /* sitebeeld → src; eigen foto → verkleinde blob naar IndexedDB
           (addMedia zet hem om in een fileRef; QuotaExceeded = nette fout,
           geen record) */
        if(row.src) pl.src = row.src;
        else { pl.blob = row.demoBlob; pl.fileName = row.fileName || ''; }
      }
      else pl.file = row.file;
      payloads.push(pl);
    }
    submitBtn.disabled = true;
    /* na elkaar opslaan: geen races op de gedeelde demo-opslag of het logboek.
       FIXRONDE R0-4: een fout halverwege (bv. QuotaExceeded bij de derde van
       vijf) liet de al opgeslagen foto's staan terwijl de rijenlijst
       onveranderd bleef — opnieuw op Opslaan klikken maakte dan duplicaten.
       Nu: elke gelukte rij verdwijnt meteen uit de batch, de melding zegt
       exact wat wél en niet is opgeslagen, en er staat een knop om de
       zojuist toegevoegde foto's terug te rollen. */
    var chain = Promise.resolve();
    var savedRows = [];
    var rowSnapshot = rows.slice(); /* payload i hoort bij rowSnapshot[i] */
    payloads.forEach(function(pl, idx){
      chain = chain.then(function(){
        return DS.addMedia(projectId, pl).then(function(created){
          savedRows.push({ row: rowSnapshot[idx], created: created || null, caption: pl.caption });
        });
      });
    });
    chain.then(function(){
      mediaBatchApi = null;
      closeModal();
      updateBadge();
      refresh();
      /* conceptstand (42): concepten wachten stil in de Wachtrij */
      if(visSel.value==='concept' || !client) return;
      /* publiceer-flow (44): eerst de klantmail exact zien, dan kiezen
         tussen mailen of stil laten — één gebundelde mail voor de batch (47) */
      openMailChoiceModal({
        client: client, projectName: project.name, projectCode: project.code,
        page: 'updates', portalLabel: 'Bekijk de update', category:'publicatie',
        subject: mailSubject('publicatie', { project: project.name }),
        bodyLine: payloads.length===1
          ? 'Er staat een nieuwe foto bij ' + stageLabel(stage.value) + ': ' + payloads[0].caption
          : 'Er staan ' + payloads.length + ' nieuwe foto’s bij ' + stageLabel(stage.value) + '.'
      }, {
        title:'Klantmail bij deze update',
        kicker:'De foto’s staan al live — kies of de klant een mail krijgt',
        sendLabel:'Verstuur klantmail', silentLabel:'Publiceer stil (geen mail)'
      });
    }).catch(function(ex){
      submitBtn.disabled = false;
      /* de gelukte rijen uit de batch halen: opnieuw op Opslaan klikken
         bewaart dan precies de rest, nooit een duplicaat */
      savedRows.forEach(function(s){ if(s.row) removeRow(s.row); });
      clearNode(rollbackWrap);
      var faalTekst = ex && ex.message ? ex.message : String(ex);
      if(!savedRows.length){
        err.textContent = 'Er is niets opgeslagen: ' + faalTekst;
      } else {
        var restCount = rows.length;
        err.textContent = savedRows.length + ' van de ' + payloads.length + ' foto’s '
          + (savedRows.length===1 ? 'is' : 'zijn') + ' opgeslagen ('
          + savedRows.map(function(s){ return s.caption; }).join(', ') + '). '
          + (restCount ? (restCount===1 ? 'De overige foto staat ' : 'De overige ' + restCount + ' staan ')
              + 'nog in de batch en ' + (restCount===1 ? 'is' : 'zijn') + ' NIET opgeslagen. ' : '')
          + 'Reden: ' + faalTekst;
        var rbBtn = el('button', { type:'button', class:'btn ghost small',
          text: savedRows.length===1
            ? 'Rol de zojuist toegevoegde foto terug'
            : 'Rol de ' + savedRows.length + ' zojuist toegevoegde foto’s terug' });
        rbBtn.addEventListener('click', function(){
          rbBtn.disabled = true;
          var undo = Promise.resolve();
          savedRows.slice().forEach(function(s){
            if(!s.created || !s.created.id) return;
            undo = undo.then(function(){ return DS.deleteMedia(s.created.id); });
          });
          undo.then(function(){
            savedRows = [];
            clearNode(rollbackWrap);
            err.textContent = 'De zojuist toegevoegde foto’s zijn teruggerold. De batch bevat nu alleen wat nog niet is opgeslagen.';
            updateBadge();
            refresh();
          }).catch(function(ex2){
            rbBtn.disabled = false;
            err.textContent = 'Terugrollen mislukte: ' + (ex2.message || String(ex2));
          });
        });
        rollbackWrap.appendChild(rbBtn);
      }
      err.classList.add('show');
    });
  });

  m.body.appendChild(form);
  /* geen conceptbehoud hier: gekozen bestanden zijn niet herstelbaar uit
     localStorage — de dubbele-Esc-bescherming (19) vangt de misklik op */
  m.setDirty(function(){ return rows.length>0 || !!prefix.value.trim(); });
  m.onDismiss(function(){
    mediaBatchApi = null;
    rows.forEach(function(row){ if(row.objUrl){ try{ URL.revokeObjectURL(row.objUrl); }catch(e2){} } });
  });
  mediaBatchApi = { projectId: projectId, addFiles: addFiles };
  calcMiss();
  if(initialFiles && initialFiles.length) addFiles(initialFiles);
}
/* korte, herkenbare regel voor een zending in een kiezer */
function shipmentOptionLabel(s){
  var SHIP = window.CP_SHIPPING;
  var nr = s.containerNumber || s.trackingNumber;
  var parts = [ SHIP.typeLabel(s.type) ];
  if(nr) parts.push(nr);
  else if(s.blNumber) parts.push('B/L ' + s.blNumber);
  parts.push(s.deliveredAt ? 'geleverd' : 'actief');
  return parts.join(' · ');
}
function openDocumentModal(projectId, project, client, shipments, invoices, docSlots, opts){
  /* docSlots + opts (golf 6, functie 52): vanuit een 'verwacht'-slot opent
     dit modal met type en fase van dat slot voorgevuld; opslaan vult het
     slot. Zonder expliciet slot vult een passend open slot (zelfde type)
     zichzelf — uploaden = een slot vullen. */
  docSlots = docSlots || [];
  opts = opts || {};
  /* golf 7 — bewerk-alles: opts.edit = bestaand document → zelfde modal,
     voorgevuld. Bewerken is stil (geen klantmail), het bestand en de
     conceptstand blijven onaangeroerd. */
  var editDoc = opts.edit || null;
  var m = openModal(editDoc ? 'Document bewerken' : 'Document toevoegen',
    editDoc ? 'Stil — een correctie stuurt geen klantmail'
            : (IS_DEMO ? 'Demomodus: het bestand wordt in deze browser bewaard (max 10 MB)' : 'Upload naar de beveiligde opslag'));
  var title = el('input', { class:'input', type:'text', required:'required', value: editDoc ? (editDoc.title||'') : '' });
  var stage = stageSelect(editDoc ? editDoc.stageKey : (opts.stageKey || 'concept'));
  var type = el('select', { class:'input' });
  DOC_TYPES.forEach(function(t){ type.appendChild(option(t.key, t.label, t.key===(editDoc ? editDoc.docType : opts.docType))); });
  var version = el('input', { class:'input', type:'number', min:'1', step:'1', value: editDoc ? String(editDoc.version||1) : '1' });
  /* golf uploads: ook demomodus krijgt een echte bestandskiezer (elk type,
     max 10 MB, blob naar IndexedDB). In demo blijft het bestand optioneel
     zodat de bestaande kale-recordflow blijft bestaan; live is het verplicht. */
  var DEMO_FILE_MAX = 10 * 1024 * 1024;
  var fileInput = editDoc ? null : el('input', { class:'input', type:'file', required: IS_DEMO ? null : 'required' });
  /* conceptstand (functie 42) */
  var visSel = el('select', { class:'input', 'aria-label':'Zichtbaarheid' });
  visSel.appendChild(option('publish', 'Direct publiceren', true));
  visSel.appendChild(option('concept', 'Als concept in de wachtrij (geen mail)'));
  var err = el('p', { class:'formerr' });

  /* 'Hoort bij' — optionele koppelaars: hang het document aan een zending
     (downloadchip op de zendingkaart in de portal) en/of wijs het als
     factuurdocument aan een factuur toe (documents.shipment_id uit 0002,
     invoices.document_id uit 0004_links.sql) */
  var shipSel = null, invSel = null, linkBlock = null, invNote = null, syncInvOptions = null;
  if((shipments||[]).length || (invoices||[]).length){
    var linkRows = [];
    if((shipments||[]).length){
      shipSel = el('select', { class:'input' });
      shipSel.appendChild(option('', 'Geen zending', true));
      shipments.slice().sort(function(a,b){ return String(a.createdAt).localeCompare(String(b.createdAt)); }).forEach(function(s){
        shipSel.appendChild(option(s.id, shipmentOptionLabel(s)));
      });
      linkRows.push(field('Zending', shipSel));
    }
    if((invoices||[]).length){
      invSel = el('select', { class:'input' });
      /* FIXRONDE R0-7: hier lag de enige route naar een halve klantstaat —
         een GEPUBLICEERD document aan een CONCEPTfactuur hangen (of andersom).
         De klant zag dan 'Factuur CP-…' in zijn documenten terwijl die
         factuur op het betaalpad onzichtbaar was. De kiezer toont daarom
         alleen facturen met dezelfde zichtbaarheid als het document dat je
         opslaat; wisselt de zichtbaarheid, dan herbouwt de lijst zich. De
         al gekoppelde factuur blijft altijd zichtbaar (oude data), gemarkeerd
         als 'zichtbaarheid wijkt af' zodat je het bewust kunt losmaken. */
      invNote = el('p', { class:'kicker', style:'margin:6px 0 0;' });
      syncInvOptions = function(){
        var docConcept = editDoc ? isConcept(editDoc) : (visSel.value==='concept');
        var keep = invSel.value;
        var curLinked = editDoc ? (invoices||[]).find(function(inv){ return inv.documentId===editDoc.id; }) : null;
        clearNode(invSel);
        invSel.appendChild(option('', 'Geen factuur', !keep));
        var hidden = 0;
        (invoices||[]).forEach(function(inv){
          var invConcept = isConcept(inv);
          var isLinked = !!(curLinked && curLinked.id===inv.id);
          if(invConcept !== docConcept && !isLinked){ hidden++; return; }
          var suffix = '';
          if(isLinked) suffix = ' — nu gekoppeld';
          else if(inv.documentId) suffix = ' — vervangt huidige koppeling';
          if(invConcept !== docConcept) suffix += ' — zichtbaarheid wijkt af';
          else if(invConcept) suffix += ' · concept';
          invSel.appendChild(option(inv.id, inv.label + ' · ' + fmtMoney(inv.amountCents) + suffix,
            keep === inv.id));
        });
        invNote.textContent = 'Alleen facturen met dezelfde zichtbaarheid als dit document'
          + (hidden ? ' — ' + hidden + (hidden===1 ? ' factuur' : ' facturen') + ' verborgen' : '')
          + '. Een gepubliceerd document bij een conceptfactuur zou de klant een halve staat tonen.';
      };
      linkRows.push(field('Factuur', el('div', null, [ invSel, invNote ])));
    }
    linkBlock = el('div', null, [
      el('span', { class:'kicker', style:'display:block;margin:4px 0 10px;', text:'Hoort bij (optioneel)' }),
      linkRows.length===2 ? el('div', { class:'formrow' }, linkRows) : linkRows[0]
    ]);
  }
  /* bewerkmodus: bestaande koppelingen voorvullen */
  if(syncInvOptions){
    syncInvOptions();
    /* FIXRONDE R0-7: nieuwe documenten kunnen nog van zichtbaarheid wisselen —
       de factuurkiezer loopt mee zodat er geen halve combinatie overblijft */
    if(!editDoc) visSel.addEventListener('change', function(){ syncInvOptions(); });
  }
  if(editDoc){
    if(shipSel && editDoc.shipmentId) shipSel.value = editDoc.shipmentId;
    if(invSel){
      var curInv = (invoices||[]).find(function(inv){ return inv.documentId===editDoc.id; });
      if(curInv) invSel.value = curInv.id;
    }
  }

  /* documenttype- en koppelherkenning (golf 6, functie 53): patronen in de
     bestandsnaam (demo: de titel) stellen type + de meest waarschijnlijke
     zending of factuur VOOR. Altijd een expliciete voorstelregel bovenin —
     overnemen of wegklikken, nooit een stille aanname. */
  var suggestBar = el('div', {
    class:'card', hidden:'hidden',
    style:'padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--gray-f9);'
  });
  var suggestDismissed = false;
  function paintSuggest(name){
    if(suggestDismissed) return;
    clearNode(suggestBar);
    var sg = docSuggestFor(name);
    if(!sg || sg.docType===type.value){ suggestBar.hidden = true; return; }
    var parts = ['type “' + sg.label + '”'];
    var linkShip = null, linkInv = null;
    if(sg.link==='shipment' && shipSel && (shipments||[]).length){
      linkShip = shipments.slice().sort(function(a,b){ return String(b.createdAt).localeCompare(String(a.createdAt)); })[0];
      parts.push('koppeling aan de laatste zending');
    }
    if(sg.link==='invoice' && invSel && (invoices||[]).length){
      /* FIXRONDE R0-7: alleen voorstellen wat de kiezer óók toont — een
         factuur met een andere zichtbaarheid staat er niet in en zou dus
         stil op 'Geen factuur' blijven staan */
      var wantConcept = editDoc ? isConcept(editDoc) : (visSel.value==='concept');
      linkInv = invoices.slice().sort(function(a,b){ return String(b.createdAt).localeCompare(String(a.createdAt)); })
        .filter(function(inv){ return !inv.documentId && isConcept(inv)===wantConcept; })[0] || null;

    }
    var applyBtn = el('button', { type:'button', class:'btn small', text:'Neem over' });
    applyBtn.addEventListener('click', function(){
      type.value = sg.docType;
      if(linkShip && shipSel) shipSel.value = linkShip.id;
      if(linkInv && invSel) invSel.value = linkInv.id;
      suggestBar.hidden = true;
    });
    var awayBtn = el('button', { type:'button', class:'btn ghost small', text:'×', 'aria-label':'Voorstel wegklikken' });
    awayBtn.addEventListener('click', function(){ suggestDismissed = true; suggestBar.hidden = true; });
    suggestBar.appendChild(el('span', { style:'font-size:13.5px;flex:1;min-width:0;', text:'Herkend in de naam: ' + parts.join(' + ') + '.' }));
    suggestBar.appendChild(applyBtn);
    suggestBar.appendChild(awayBtn);
    suggestBar.hidden = false;
  }
  if(fileInput){
    fileInput.addEventListener('change', function(){
      var f = fileInput.files && fileInput.files[0];
      if(f && IS_DEMO && f.size > DEMO_FILE_MAX){
        /* eerlijke grens: de demo-opslag is browseropslag, geen server */
        err.textContent = 'Dit bestand is ' + (f.size/1048576).toFixed(1) + ' MB — de demo-opslag in de browser bewaart bestanden tot 10 MB. Kies een kleiner bestand.';
        err.classList.add('show');
        fileInput.value = '';
        return;
      }
      err.classList.remove('show');
      if(f){
        paintSuggest(f.name);
        if(!title.value.trim()) title.value = f.name.replace(/\.[a-z0-9]{2,5}$/i, '');
      }
    });
  }
  if(!editDoc) title.addEventListener('change', function(){ paintSuggest(title.value); });

  var form = el('form', { onsubmit:function(e){
    e.preventDefault();
    /* golf 7 — bewerkmodus: stil opslaan met auditregel en undo-toast;
       conceptstand, bestand en documentslots blijven onaangeroerd */
    if(editDoc){
      var prevDoc = { title: editDoc.title, stageKey: editDoc.stageKey, docType: editDoc.docType,
        version: editDoc.version||1, shipmentId: editDoc.shipmentId||null };
      var prevInvRow = (invoices||[]).find(function(inv){ return inv.documentId===editDoc.id; }) || null;
      var prevInvId = prevInvRow ? prevInvRow.id : null;
      var newInvId = (invSel && invSel.value) ? invSel.value : null;
      /* FIXRONDE R0-3: de nieuw gekozen factuur kan zélf al een document
         hebben ('— vervangt huidige koppeling'). Die koppeling wordt door
         het omhangen weggeschreven, dus we leggen hem vast en zetten hem bij
         'Maak ongedaan' terug — anders verliest de klant permanent de
         factuurdocument-chip op zijn betaalpad, zonder één signaal. */
      var newInvRow = newInvId ? ((invoices||[]).find(function(inv){ return inv.id===newInvId; }) || null) : null;
      var newInvPrevDocId = newInvRow ? (newInvRow.documentId || null) : null;
      var payloadE = {
        title: title.value.trim(), stageKey: stage.value,
        docType: type.value, version: parseInt(version.value, 10) || 1,
        shipmentId: (shipSel && shipSel.value) ? shipSel.value : null
      };
      DS.updateDocument(editDoc.id, payloadE).then(function(){
        var chain = Promise.resolve();
        if(newInvId !== prevInvId){
          if(prevInvId) chain = chain.then(function(){ return DS.linkInvoiceDocument(prevInvId, null); });
          if(newInvId) chain = chain.then(function(){ return DS.linkInvoiceDocument(newInvId, editDoc.id); });
        }
        return chain;
      }).then(function(){
        draft.clear();
        return finishEdit({
          clientId: project ? project.clientId : null, projectId: projectId,
          detail: 'Document bewerkt: ' + payloadE.title,
          toast: 'Document bewerkt',
          restore: function(){
            return DS.updateDocument(editDoc.id, prevDoc).then(function(){
              var ch2 = Promise.resolve();
              if(newInvId !== prevInvId){
                /* beide kanten terug: de nieuw gekozen factuur krijgt zijn
                   éigen vorige documentkoppeling terug (niet null), de oude
                   factuur krijgt dit document terug */
                if(newInvId) ch2 = ch2.then(function(){ return DS.linkInvoiceDocument(newInvId, newInvPrevDocId); });
                if(prevInvId) ch2 = ch2.then(function(){ return DS.linkInvoiceDocument(prevInvId, editDoc.id); });
              }
              return ch2;
            });
          }
        });
      }).catch(function(ex){ err.textContent = ex.message||String(ex); err.classList.add('show'); });
      return;
    }
    if(IS_DEMO && fileInput && fileInput.files && fileInput.files.length && fileInput.files[0].size > DEMO_FILE_MAX){
      err.textContent = 'Dit bestand is groter dan 10 MB — de demo-opslag in de browser bewaart bestanden tot 10 MB. Kies een kleiner bestand.';
      err.classList.add('show');
      return;
    }
    var payload = {
      title: title.value.trim(), stageKey: stage.value,
      docType: type.value, version: parseInt(version.value, 10) || 1,
      shipmentId: (shipSel && shipSel.value) ? shipSel.value : null,
      publishStatus: visSel.value==='concept' ? 'concept' : 'published'
    };
    if(fileInput && fileInput.files && fileInput.files.length) payload.file = fileInput.files[0];
    DS.addDocument(projectId, payload).then(function(d){
      var chain = Promise.resolve();
      /* factuur → nieuw document: demo muteert de state, Supabase doet
         een update ná de insert (het document-id bestaat pas dan) */
      if(invSel && invSel.value && d && d.id){
        chain = chain.then(function(){ return DS.linkInvoiceDocument(invSel.value, d.id); });
      }
      /* documentslot vullen (functie 52): expliciet gekozen slot, anders
         het eerste open slot met hetzelfde documenttype */
      if(d && d.id && DS.fillDocSlot){
        var slot = opts.slotId
          ? docSlots.find(function(sl){ return sl.id===opts.slotId; })
          : docSlots.find(function(sl){ return !sl.documentId && sl.docType===payload.docType; });
        if(slot) chain = chain.then(function(){ return DS.fillDocSlot(slot.id, d.id); });
      }
      return chain;
    }).then(function(){
      draft.clear();
      closeModal();
      updateBadge();
      refresh();
      /* conceptstand (42): een concept wacht stil in de Wachtrij;
         gepubliceerd → publiceer-flow met mailvoorbeeld (44) */
      if(payload.publishStatus==='concept' || !client) return;
      openMailChoiceModal({
        client: client, projectName: project.name, projectCode: project.code,
        page: 'documenten', portalLabel: 'Bekijk het document', category:'document',
        subject: mailSubject('document', { project: project.name }),
        bodyLine: 'Er is een nieuw document geplaatst: ' + payload.title + '.'
      }, {
        title:'Klantmail bij dit document',
        kicker:'Het document staat al live — kies of de klant een mail krijgt',
        sendLabel:'Verstuur klantmail', silentLabel:'Publiceer stil (geen mail)'
      });
    }).catch(function(ex){ err.textContent = ex.message||String(ex); err.classList.add('show'); });
  } }, [
    editDoc ? null : suggestBar,
    opts.slotId ? el('p', { class:'kicker', style:'margin:0 0 10px;', text:'Vult het slot “' + docTypeLabel(opts.docType) + ' — ' + stageLabel(opts.stageKey) + '”.' }) : null,
    /* bewerkmodus: conceptstand blijft leidend en het bestand blijft staan */
    editDoc ? el('p', { class:'kicker', style:'margin:0 0 10px;', text:
      (isConcept(editDoc) ? 'Concept — blijft concept tot je publiceert. ' : 'Gepubliceerd — blijft gepubliceerd. ') +
      ((!IS_DEMO || editDoc.fileRef) ? 'Het bestand zelf blijft staan; een ander bestand = verwijderen en opnieuw uploaden.' : '') }) : null,
    field('Titel', title),
    el('div', { class:'formrow' }, [ field('Fase', stage), field('Type', type) ]),
    editDoc ? field('Versie', version) : el('div', { class:'formrow' }, [ field('Versie', version), field('Zichtbaarheid', visSel) ]),
    fileInput ? field(IS_DEMO ? 'Bestand (optioneel — blijft in deze browser, max 10 MB)' : 'Bestand', fileInput) : null,
    linkBlock,
    err,
    el('div', { class:'modal-actions' }, [
      el('button', { type:'button', class:'btn ghost', text:'Annuleren', onclick:closeModal }),
      el('button', { type:'submit', class:'btn', text: editDoc ? 'Opslaan' : 'Toevoegen' })
    ])
  ]);
  /* live veldvalidatie (18): wat mist er nog voor opslaan kan */
  var missItems = [{ input:title, label:'titel' }];
  /* demo: bestand is optioneel, dus telt daar niet mee in de mist-nog-hint */
  if(fileInput && !IS_DEMO) missItems.push({ get:function(){ return (fileInput.files && fileInput.files.length) ? 'x' : ''; }, label:'bestand' });
  var actionsRow = form.querySelector('.modal-actions');
  actionsRow.insertBefore(missingHint(form, missItems), actionsRow.firstChild);
  m.body.appendChild(form);
  /* bewerkmodus krijgt een eigen conceptsleutel per item, zodat de
     voorvulling nooit het concept van "nieuw document" vervuilt */
  var draft = attachDraft(m, form, 'document', editDoc ? ('edit:' + editDoc.id) : projectId);
}
function openInvoiceModal(projectId, prefill, editInv){

  var m = openModal(editInv ? 'Factuur bewerken' : 'Nieuwe factuur',
    editInv ? 'Stil — een correctie stuurt geen klantmail; status en betaaldatum blijven staan'

    placeholder: editInv ? '' : 'automatisch uit de reeks' });

  if(prefill.label) label.value = prefill.label;
  var amount = el('input', { class:'input', type:'text', required:'required', inputmode:'decimal', placeholder:'3.125,00' });
  if(typeof prefill.amountCents==='number'){
    amount.value = (prefill.amountCents/100).toLocaleString('nl-NL', { minimumFractionDigits:2, maximumFractionDigits:2 });
  }
  var stage = stageSelect(prefill.stageKey || 'concept');
  var curSel = el('select', { class:'input', 'aria-label':'Valuta' });
  CURRENCIES.forEach(function(c2){ curSel.appendChild(option(c2, c2, c2===(prefill.currency||'EUR'))); });
  var vatSel = el('select', { class:'input', 'aria-label':'Btw-behandeling' });
  VAT_MODES.forEach(function(v){ vatSel.appendChild(option(v.key, v.label, v.key===(editInv ? (editInv.vatMode||'verlegd') : 'verlegd'))); });
  var err = el('p', { class:'formerr' });
  /* automatische nummering (functie 65) — FIXRONDE R0-1/R1-1: het nummer
     wordt PAS bij opslaan uitgegeven, atomair via claimInvoiceNumber().
     Dit formulier reserveert dus niets bij openen: een openstaand modal kan
     nooit meer met een verouderd nummer submitten, en 'Zet terug' uit het
     conceptbehoud herstelt hooguit een leeg veld. Hieronder staat alleen een
     KIJKJE — wat de reeks nú zou geven. Laat je het veld leeg, dan pakt de
     reeks het eerstvolgende vrije nummer; typ je zelf een nummer, dan blijft
     de teller onaangeroerd (en waakt de duplicaatcontrole in de datalaag).
     In bewerkmodus blijft de teller volledig buiten beeld. */
  var nrHint = editInv ? null : el('p', { class:'kicker', style:'margin:-6px 0 12px;', 'aria-live':'polite',
    text:'Leeg laten = automatisch het eerstvolgende nummer uit de reeks, pas bij opslaan vastgelegd.' });
  if(!editInv) DS.getSettings().then(function(st){
    adminSettings = st;
    var peek = invoiceNumberFor(st.factuurReeks);
    if(nrHint) nrHint.textContent = 'Leeg laten = automatisch uit de reeks. Nu zou dat ' + peek.text
      + ' worden; het definitieve nummer valt pas bij opslaan.';
    if(st.factuurStandaard){
      if(!prefill.currency && CURRENCIES.indexOf(st.factuurStandaard.valuta) > -1) curSel.value = st.factuurStandaard.valuta;
      if(VAT_MODES.some(function(v){ return v.key===st.factuurStandaard.btwMode; })) vatSel.value = st.factuurStandaard.btwMode;
      syncVatLine();
    }
  }).catch(function(){});
  /* plausibiliteitshints (18) + live btw-regel en totaal (65) */
  var amountWarn = warnHint();
  var vatLine = el('p', { class:'kicker', style:'margin:-6px 0 12px;', 'aria-live':'polite' });

    if(isNaN(cents)){ vatLine.textContent = ''; return; }
    var vat = vatCentsFor(cents, vatSel.value);
    var parts = [];
    if(vatSel.value==='verlegd') parts.push('btw verlegd');
    else parts.push('btw ' + vatSel.value + '%: ' + fmtMoneyCur(vat, curSel.value));
    parts.push('totaal ' + fmtMoneyCur(cents + vat, curSel.value));
    vatLine.textContent = parts.join(' · ');
  }
  amount.addEventListener('input', function(){

    else if(cents===0) setWarn(amountWarn, 'Bedrag is € 0,00 — klopt dat?');
    else setWarn(amountWarn, '');

  vatSel.addEventListener('change', syncVatLine);

        if(sync && sync.docSynced && sync.docSynced.length){

          toast: 'Factuur bewerkt' + docNote,
          restore: function(){ return DS.updateInvoice(editInv.id, prevInv); }
        });

    numberStep.then(function(num){
      return DS.addInvoice(projectId, {

function nextRoundLabel(samples){
  var max = -1;
  samples.forEach(function(s){
    var mt = /^T(\d+)$/.exec(s.roundLabel||'');
    if(mt){ var n = parseInt(mt[1],10); if(n>max) max = n; }
  });
  return 'T' + (max+1);
}
function openSampleModal(projectId, samples, media, project, client, editSample){
  /* editSample (golf 7 — bewerk-alles): bestaande ronde → zelfde modal,
     voorgevuld; opslaan is stil (geen klantmail) met auditregel en undo */
  var m = openModal(editSample ? 'Ronde bewerken' : 'Ronde toevoegen',
    editSample ? 'Stil — een correctie stuurt geen klantmail' : 'Een goedgekeurde ronde vervangt eerdere goedkeuringen');

    value: editSample ? (editSample.roundLabel||'') : nextRoundLabel(samples) });
  var mediaSel = el('select', { class:'input' });
  mediaSel.appendChild(option('', 'Geen foto gekoppeld', !(editSample && editSample.mediaId)));
  media.forEach(function(mm){
    var cap = (mm.caption||'').length > 46 ? mm.caption.slice(0,46) + '…' : (mm.caption||'Foto');
    mediaSel.appendChild(option(mm.id, cap + ' · ' + fmtDate(mm.capturedAt), !!(editSample && editSample.mediaId===mm.id)));
  });
  var status = el('select', { class:'input' });
  SAMPLE_STATUS.forEach(function(s){ status.appendChild(option(s.key, s.label, s.key===(editSample ? editSample.status : 'reviewed'))); });
  var note = el('textarea', { class:'input', placeholder:'Wat is er aangepast in deze ronde' });
  if(editSample) note.value = editSample.note || '';
  var dateSd = smartDateField(editSample ? String(editSample.roundDate||'').slice(0,10) : todayISO(), 'Datum van de ronde');
  var err = el('p', { class:'formerr' });

  /* nieuwe ronde op basis van de vorige (functie 57): omschrijving/specs
     vooringevuld, T-nummer is al opgehoogd — je typt alleen het verschil */
  var tplWrap = null;
  var latest = null;
  (samples||[]).forEach(function(s){
    if(!latest || String(s.roundDate) > String(latest.roundDate)) latest = s;
  });
  if(latest && !editSample){
    tplWrap = el('div', { style:'margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;' }, [
      el('button', { type:'button', class:'btn ghost small', text:'Nieuwe ronde op basis van ' + latest.roundLabel, onclick:function(){
        note.value = latest.note || '';
        note.dispatchEvent(new Event('input', { bubbles:true }));
        note.focus();
        try{ note.setSelectionRange(note.value.length, note.value.length); }catch(e2){}
      } }),
      el('span', { class:'kicker', text:'Neemt de omschrijving over — je typt alleen het verschil' })
    ]);
  }

  var form = el('form', { onsubmit:function(e){
    e.preventDefault();
    err.classList.remove('show');
    var roundDateVal = dateSd.get();
    if(!roundDateVal){ err.textContent = dateSd.invalid() ? 'Datum niet herkend — probeer vr, +3 of 12/9.' : 'Vul een datum in.'; err.classList.add('show'); return; }
    var roundLabelVal = label.value.trim();
    /* golf 7 — bewerkmodus: stil opslaan met auditregel en undo-toast */
    if(editSample){
      var prevSmp = { projectId: projectId, roundLabel: editSample.roundLabel,
        mediaId: editSample.mediaId||null, status: editSample.status,
        note: editSample.note||'', roundDate: editSample.roundDate,
        /* FIXRONDE R0-2/R1-3: herstellen zet exact de oude stand terug en
           mag zelf niets nieuws verdringen */
        noSupersede: true };
      DS.updateSample(editSample.id, {
        projectId: projectId, roundLabel: roundLabelVal, mediaId: mediaSel.value || null,
        status: status.value, note: note.value.trim(), roundDate: roundDateVal
      }).then(function(res){
        draft.clear();
        /* FIXRONDE R0-2/R1-3: deze bewerking kan eerdere goedkeuringen
           verdrongen hebben ('superseded'). De undo moet ÁLLE
           nevenwijzigingen terugdraaien, anders houdt het project stil geen
           goedgekeurde ronde meer over — de golden sample verdwijnt dan uit
           de portal zonder één foutmelding. */
        var superseded = (res && res.superseded) || [];
        var supNote = superseded.length
          ? ' (' + superseded.length + ' eerdere goedkeuring' + (superseded.length===1 ? '' : 'en') + ' verdrongen)'
          : '';
        return finishEdit({
          clientId: project ? project.clientId : null, projectId: projectId,
          detail: 'Sampleronde bewerkt: ' + roundLabelVal + supNote,
          toast: 'Sampleronde bewerkt' + supNote,
          restore: function(){
            /* eerst de bewerkte rij terug (die valt daarmee uit 'approved'),
               daarna de verdrongen rondes — noSupersede houdt de cascade uit
               zodat het herstel niets nieuws omver duwt */
            return DS.updateSample(editSample.id, prevSmp).then(function(){
              var chain = Promise.resolve();
              superseded.forEach(function(sid){
                chain = chain.then(function(){
                  return DS.updateSample(sid, { projectId: projectId, status:'approved', noSupersede: true });
                });
              });
              return chain;
            });
          }
        });
      }).catch(function(ex){ err.textContent = ex.message||String(ex); err.classList.add('show'); });
      return;
    }
    DS.addSample(projectId, {
      roundLabel: roundLabelVal, mediaId: mediaSel.value || null,
      status: status.value, note: note.value.trim(), roundDate: roundDateVal
    }).then(function(){
      notifyClient({
        client: client, projectName: project.name, projectCode: project.code,
        page: 'samples', portalLabel: 'Bekijk de sample-ronde',
        subject: mailSubject('sample', { project: project.name }),
        bodyLine: 'Ronde ' + roundLabelVal + ' is beschikbaar' + (status.value === 'approved' ? ' en goedgekeurd.' : '.')
      });
      draft.clear();
      closeModal(); refresh();
    }).catch(function(ex){ err.textContent = ex.message||String(ex); err.classList.add('show'); });
  } }, [
    tplWrap,
    el('div', { class:'formrow' }, [ field('Label', label), field('Datum', dateSd.node) ]),
    field('Gekoppelde foto', mediaSel),
    field('Status', status),
    field('Notitie', note),
    err,
    el('div', { class:'modal-actions' }, [
      el('button', { type:'button', class:'btn ghost', text:'Annuleren', onclick:closeModal }),
      el('button', { type:'submit', class:'btn', text: editSample ? 'Opslaan' : 'Ronde toevoegen' })
    ])
  ]);
  var actionsRow = form.querySelector('.modal-actions');
  actionsRow.insertBefore(missingHint(form, [
    { input:label, label:'label' },
    { get:dateSd.get, label:'datum' }
  ]), actionsRow.firstChild);
  m.body.appendChild(form);
  var draft = attachDraft(m, form, 'sample', editSample ? ('edit:' + editSample.id) : projectId);
}

function openInspectionModal(projectId, project, client, inspections, editInsp){
  /* editInsp (golf 7 — bewerk-alles): bestaand rapport → zelfde modal,
     voorgevuld incl. defectrijen; fotokoppelingen (mediaId) reizen per rij
     mee. Opslaan is stil (geen klantmail) met auditregel en undo. */
  var m = openModal(editInsp ? 'Rapport bewerken' : 'Rapport toevoegen',
    editInsp ? 'Stil — een correctie stuurt geen klantmail' : 'Kwaliteitscontrole');
  /* projectsjabloon-keuzes (golf 6, functie 40): AQL en inspectiereeks van
     het bij aanmaak gekozen sjabloon; zonder sjabloon de gewone standaarden */
  var pd = (adminSettings && adminSettings.projectDefaults && adminSettings.projectDefaults[projectId]) || null;
  var nextCp = null;
  if(pd && Array.isArray(pd.reeks)){
    nextCp = pd.reeks.find(function(k){
      return !(inspections||[]).some(function(r){ return r.checkpoint===k; });
    }) || null;
  }
  var checkpoint = el('select', { class:'input' });
  CHECKPOINTS.forEach(function(c){ checkpoint.appendChild(option(c.key, c.label, c.key===(editInsp ? editInsp.checkpoint : nextCp))); });
  /* standaard AQL-norm: eerst het projectsjabloon (40), dan
     Instellingen → Bedrijf & standaarden (functie 64) */
  var norm = el('input', { class:'input', type:'text', value: editInsp
    ? (editInsp.aqlNorm || '')
    : ((pd && pd.aql) || (adminSettings && adminSettings.standaardAql) || 'ANSI/ASQ Z1.4 II') });
  var size = el('input', { class:'input', type:'number', min:'1', step:'1', required:'required' });
  if(editInsp && editInsp.sampleSize) size.value = String(editInsp.sampleSize);
  var context = el('input', { class:'input', type:'text', placeholder:'Korte context voor de klant',
    value: editInsp ? (editInsp.contextLine||'') : '' });
  var dateSd = smartDateField(editInsp ? String(editInsp.reportDate||'').slice(0,10) : todayISO(), 'Rapportdatum');
  var passed = el('input', { type:'checkbox', checked: editInsp ? !!editInsp.passed : true });
  var err = el('p', { class:'formerr' });

  /* defectbibliotheek (functie 55): autocomplete uit alle eerder ingevoerde
     defectomschrijvingen, over projecten heen — consistente defecttaal
     zonder apart beheerscherm */
  var defectList = el('datalist', { id:'defectLib' });
  DS.listAllInspections().then(function(all){
    var seen = {};
    (all||[]).slice().sort(function(a,b){ return String(b.reportDate||'').localeCompare(String(a.reportDate||'')); })
      .forEach(function(r){
        (r.defects||[]).forEach(function(d){
          var noteTxt = String((d && d.note)||'').trim();
          if(!noteTxt) return;
          var k = noteTxt.toLowerCase();
          if(seen[k]) return;
          seen[k] = true;
          defectList.appendChild(el('option', { value:noteTxt }));
        });
      });
  }).catch(function(){});

  var defWrap = el('div');
  var defWarn = warnHint();
  function rowsOf(){ return defWrap.querySelectorAll('.defform'); }
  function recalcDefWarn(){
    var total = 0, empty = 0;
    Array.prototype.forEach.call(rowsOf(), function(r){
      var got = r._get ? r._get() : null;
      if(got) total += got.count;
      else empty++;
    });
    var ss = parseInt(size.value, 10);
    var msgs = [];
    if(!isNaN(ss) && ss > 0 && total > ss) msgs.push('Meer defecten (' + total + ') dan de steekproef (' + ss + ') — klopt dat?');
    if(empty) msgs.push(empty + (empty===1 ? ' rij zonder aantal wordt' : ' rijen zonder aantal worden') + ' niet opgeslagen.');
    setWarn(defWarn, msgs.join(' '));
  }
  function addDefectRow(prefill){
    prefill = prefill || {};
    /* golf 7 — bewerk-alles: een bestaande fotokoppeling (functie 56) reist
       stil met de rij mee; 'Dup' en verse rijen beginnen zonder foto */
    var rowMediaId = prefill.mediaId || null;
    var sev = el('select', { class:'input', 'aria-label':'Ernst' });
    SEVERITIES.forEach(function(s){ sev.appendChild(option(s.key, s.label, s.key===prefill.severity)); });
    var cnt = el('input', { class:'input cnt', type:'number', min:'1', step:'1',
      value:(prefill.count!==undefined ? String(prefill.count) : '1'), 'aria-label':'Aantal' });
    var note = el('input', { class:'input note', type:'text', placeholder:'Omschrijving', list:'defectLib',
      value: prefill.note||'', 'aria-label':'Omschrijving van de afwijking' });
    var dup = el('button', { type:'button', class:'dup', text:'Dup', title:'Dupliceer deze rij met leeg aantal', 'aria-label':'Rij dupliceren met leeg aantal' });
    var rowEl = el('div', { class:'defform' }, [
      sev, cnt, note, dup,
      el('button', { type:'button', class:'rm', 'aria-label':'Rij verwijderen', text:'×', onclick:function(){ defWrap.removeChild(rowEl); recalcDefWarn(); } })
    ]);
    dup.addEventListener('click', function(){
      /* defectrij dupliceren (functie 55): kopie met leeg aantal */
      var copy = addDefectRow({ severity: sev.value, note: note.value, count:'' });
      defWrap.insertBefore(copy.node, rowEl.nextSibling);
      copy.cnt.focus();
      recalcDefWarn();
    });
    rowEl._get = function(){
      /* leeg aantal = rij niet opslaan: nooit een verzonnen '1' in het rapport */
      var rawCnt = cnt.value.trim();
      if(rawCnt==='') return null;
      var n = parseInt(rawCnt, 10);
      if(isNaN(n) || n < 1) return null;
      var got = { severity:sev.value, count:n, note:note.value.trim() };
      if(rowMediaId) got.mediaId = rowMediaId;
      return got;
    };
    defWrap.appendChild(rowEl);
    return { node:rowEl, sev:sev, cnt:cnt, note:note };
  }
  /* modal-focusstroom (functie 19): Enter in de laatste defectcel maakt een
     nieuwe rij; elders springt Enter naar het volgende veld — nooit per
     ongeluk het hele formulier submitten vanuit een defectrij */
  defWrap.addEventListener('keydown', function(e){
    if(e.key!=='Enter' || e.metaKey || e.ctrlKey) return;
    var t = e.target;
    if(!t || !t.closest) return;
    var rowEl = t.closest('.defform');
    if(!rowEl) return;
    e.preventDefault();
    var rowsNow = rowsOf();
    var lastRow = rowsNow.length ? rowsNow[rowsNow.length-1] : null;
    if(rowEl===lastRow && t.classList.contains('note')){
      addDefectRow().sev.focus();
      return;
    }
    var focusables = defWrap.querySelectorAll('select, input');
    for(var i=0;i<focusables.length;i++){
      if(focusables[i]===t && i+1<focusables.length){ focusables[i+1].focus(); return; }
    }
  });

  /* vorig rapport als sjabloon (functie 54): structuur kopiëren, nooit
     uitkomsten — aantallen leeg, datum en resultaat blijven van dit rapport */
  var latestInsp = null;
  (inspections||[]).forEach(function(r){
    if(!latestInsp || String(r.reportDate) > String(latestInsp.reportDate)) latestInsp = r;
  });
  var tplWrap = null;
  if(latestInsp && !editInsp){
    var tplNote = el('span', { class:'kicker', text:'' });
    tplWrap = el('div', { style:'margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;' }, [
      el('button', { type:'button', class:'btn ghost small', text:'Neem instellingen van vorig rapport over', onclick:function(){
        checkpoint.value = latestInsp.checkpoint || checkpoint.value;
        norm.value = latestInsp.aqlNorm || '';
        size.value = latestInsp.sampleSize ? String(latestInsp.sampleSize) : '';
        clearNode(defWrap);
        (latestInsp.defects||[]).forEach(function(d){
          addDefectRow({ severity:d.severity, note:d.note, count:'' });
        });
        tplNote.textContent = 'Structuur van ' + fmtDate(latestInsp.reportDate) + ' overgenomen — aantallen vul je zelf in.';
        form.dispatchEvent(new Event('input'));
        recalcDefWarn();
      } }),
      tplNote
    ]);
  }

  var form = el('form', { onsubmit:function(e){
    e.preventDefault();
    err.classList.remove('show');
    var reportDateVal = dateSd.get();
    if(!reportDateVal){ err.textContent = dateSd.invalid() ? 'Datum niet herkend — probeer vr, +3 of 12/9.' : 'Vul een datum in.'; err.classList.add('show'); return; }
    var defects = [];
    defWrap.querySelectorAll('.defform').forEach(function(r){
      var got = r._get ? r._get() : null;
      if(got) defects.push(got);
    });
    var checkpointVal = checkpoint.value;
    /* golf 7 — bewerkmodus: stil opslaan met auditregel en undo-toast */
    if(editInsp){
      var prevInsp = { checkpoint: editInsp.checkpoint, aqlNorm: editInsp.aqlNorm,
        sampleSize: editInsp.sampleSize, defects: clone(editInsp.defects||[]),
        contextLine: editInsp.contextLine||'', reportDate: editInsp.reportDate,
        passed: !!editInsp.passed };
      DS.updateInspection(editInsp.id, {
        checkpoint: checkpointVal, aqlNorm: norm.value.trim() || 'ANSI/ASQ Z1.4 II',
        sampleSize: parseInt(size.value,10)||0, defects: defects,
        contextLine: context.value.trim(), reportDate: reportDateVal, passed: passed.checked
      }).then(function(){
        draft.clear();
        return finishEdit({
          clientId: project ? project.clientId : null, projectId: projectId,
          detail: 'Inspectierapport bewerkt: ' + String(checkpointVal||'').toUpperCase(),
          toast: 'Rapport bewerkt',
          restore: function(){ return DS.updateInspection(editInsp.id, prevInsp); }
        });
      }).catch(function(ex){ err.textContent = ex.message||String(ex); err.classList.add('show'); });
      return;
    }
    DS.addInspection(projectId, {
      checkpoint: checkpointVal, aqlNorm: norm.value.trim() || 'ANSI/ASQ Z1.4 II',
      sampleSize: parseInt(size.value,10)||0, defects: defects,
      contextLine: context.value.trim(), reportDate: reportDateVal, passed: passed.checked
    }).then(function(){
      notifyClient({
        client: client, projectName: project.name, projectCode: project.code,
        page: 'kwaliteit', portalLabel: 'Bekijk het rapport',
        subject: mailSubject('inspectie', { project: project.name }),
        bodyLine: 'Het ' + checkpointVal.toUpperCase() + '-rapport staat klaar' + (passed.checked ? ', binnen norm.' : '.')
      });
      draft.clear();
      closeModal(); refresh();
    }).catch(function(ex){ err.textContent = ex.message||String(ex); err.classList.add('show'); });
  } }, [
    tplWrap,
    defectList,
    el('div', { class:'formrow' }, [ field('Checkpoint', checkpoint), field('Datum', dateSd.node) ]),
    el('div', { class:'formrow' }, [ field('Norm', norm), field('Steekproefgrootte', size) ]),
    field('Afwijkingen', el('div', null, [
      defWrap,
      el('button', { type:'button', class:'btn ghost small', text:'Rij toevoegen', onclick:function(){ addDefectRow(); } })
    ])),
    defWarn,
    field('Contextregel', context),
    el('label', { class:'checkline' }, [ passed, document.createTextNode('Geslaagd') ]),
    err,
    el('div', { class:'modal-actions' }, [
      el('button', { type:'button', class:'btn ghost', text:'Annuleren', onclick:closeModal }),
      el('button', { type:'submit', class:'btn', text: editInsp ? 'Opslaan' : 'Rapport opslaan' })
    ])
  ]);
  form.addEventListener('input', recalcDefWarn);
  form.addEventListener('change', recalcDefWarn);
  var actionsRow = form.querySelector('.modal-actions');
  actionsRow.insertBefore(missingHint(form, [
    { input:size, label:'steekproefgrootte' },
    { get:dateSd.get, label:'datum' }
  ]), actionsRow.firstChild);
  /* bewerkmodus: bestaande defectrijen voorgevuld — mét aantallen, dit is
     een correctie van een echt rapport, geen structuurkopie */
  if(editInsp){
    (editInsp.defects||[]).forEach(function(d){
      addDefectRow({ severity: d.severity, note: d.note, count: d.count, mediaId: d.mediaId });
    });
    recalcDefWarn();
  }
  m.body.appendChild(form);
  /* conceptbehoud (17) mét de dynamische defectrijen: het concept onthoudt
     hoeveel rijen er stonden en zet ze eerst terug */
  var draft = attachDraft(m, form, 'inspectie', editInsp ? ('edit:' + editInsp.id) : projectId, {
    meta: function(){ return { rijen: rowsOf().length }; },
    prepare: function(meta){
      var want = (meta && meta.rijen) || 0;
      while(rowsOf().length < want) addDefectRow();
    }
  });
}
function openDisclosureModal(projectId, factories){

  var fac = el('select', { class:'input' });
  factories.forEach(function(f){ fac.appendChild(option(f.id, f.name + (f.region ? ' — ' + f.region : ''))); });

      factoryId: fac.value, what: what.value.trim(),

    }).then(function(){ draft.clear(); closeModal(); refresh(); })
      .catch(function(ex){ err.textContent = ex.message||String(ex); err.classList.add('show'); });
  } }, [
    field('Fabriek', fac),

    err,
    el('div', { class:'modal-actions' }, [

      el('button', { type:'submit', class:'btn', text:'Vastleggen' })
    ])
  ]);

  actionsRow.insertBefore(missingHint(form, [
    { input:what, label:'wat is gedeeld' },

/* ---------- zendingen (De Reis) ---------- */
/* per zending-id de door de beheerder gekozen open/dicht-stand,
   zodat refresh() de accordeon niet terugklapt (per sessie) */
var shipOpenState = {};
function shipmentSubLine(s, events){
  var SHIP = window.CP_SHIPPING;
  var tpl = SHIP.milestonesFor(s.type);
  var evByKey = {};
  events.forEach(function(ev){ evByKey[ev.milestoneKey] = ev; });
  var last = null;
  tpl.forEach(function(ms){ if(evByKey[ms.key]) last = ms; });
  var parts = [ last ? 'Laatste mijlpaal: ' + last.label : 'Nog geen mijlpaal afgevinkt' ];
  if(s.blNumber) parts.push('B/L ' + s.blNumber);
  if(!s.deliveredAt && s.etaWindowStart && s.etaWindowEnd){
    parts.push('ETA ' + fmtDate(s.etaWindowStart) + ' – ' + fmtDate(s.etaWindowEnd));
  }
  return parts.join(' · ');
}
function buildShipmentAdminCard(pid, project, client, s, events, docs, samples, shipments){
  var SHIP = window.CP_SHIPPING;
  var tpl = SHIP.milestonesFor(s.type);
  var evByKey = {};
  events.forEach(function(ev){ evByKey[ev.milestoneKey] = ev; });
  var nextIdx = -1;
  for(var i=0;i<tpl.length;i++){ if(!evByKey[tpl[i].key]){ nextIdx = i; break; } }
  var doneCount = tpl.filter(function(ms){ return !!evByKey[ms.key]; }).length;

  var carrier = SHIP.CARRIERS[s.carrierCode] || null;
  var nr = s.containerNumber || s.trackingNumber;
  var title = SHIP.typeLabel(s.type) + (carrier ? ' · ' + carrier.name : '') + (nr ? ' · ' + nr : '');

  var det = el('details', { class:'shipdet' });
  det.setAttribute('data-sid', s.id);
  /* open-staat overleeft een refresh(): wie een geleverde zending openklapt
     om er een B/L aan te koppelen, ziet na het koppelen de bevestiging in
     de nog steeds geopende kaart i.p.v. een dichtgeklapte lijst */
  det.open = shipOpenState.hasOwnProperty(s.id) ? shipOpenState[s.id] : !s.deliveredAt;
  det.addEventListener('toggle', function(){ shipOpenState[s.id] = det.open; });
  det.appendChild(el('summary', { class:'rowitem' }, [
    el('span', { class:'chip ' + (s.deliveredAt ? 'done' : 'current'), text: s.deliveredAt ? 'Geleverd' : 'Actief' }),
    el('div', { class:'rowmain' }, [
      el('div', { class:'rowtitle', text:title }),
      el('div', { class:'rowsub', text: shipmentSubLine(s, events) })
    ]),
    el('span', { class:'rowmeta', text: doneCount + '/' + tpl.length })
  ]));

  tpl.forEach(function(ms, idx){
    var ev = evByKey[ms.key];
    if(ev){
      var metaParts = [ fmtDate(ev.occurredAt) ];
      if(ev.location) metaParts.push(ev.location);
      det.appendChild(el('div', { class:'shiprow' }, [
        el('span', { class:'chip done', text:'✓' }),
        el('span', { class:'ms-label', text: ms.label + (ev.note ? ' — ' + ev.note : '') }),
        el('span', { class:'ms-meta', text: metaParts.join(' · ') }),
        /* golf 7 — bewerk-alles: datum/locatie/notitie van deze mijlpaal
           corrigeren of de regel weghalen (stil, met auditregel) */
        el('button', { type:'button', class:'btn ghost small', text:'Bewerk', onclick:function(){
          openMilestoneEditModal(pid, project, ev, ms.label);
        } })
      ]));
    } else if(idx===nextIdx && !s.deliveredAt){
      var dt = el('input', { class:'input dt', type:'date', value:todayISO(), 'aria-label':'Datum van ' + ms.label });
      var loc = el('input', { class:'input loc', type:'text', placeholder:'Locatie (optioneel)', 'aria-label':'Locatie bij ' + ms.label });
      var nt = el('input', { class:'input nt', type:'text', placeholder:'Notitie (optioneel)', 'aria-label':'Notitie bij ' + ms.label });
      var btn = el('button', { type:'button', class:'btn small', text:'Vink af' });
      btn.addEventListener('click', function(){
        btn.disabled = true;
        var locVal = loc.value.trim();
        DS.addShipmentEvent(pid, s.id, {
          milestoneKey: ms.key, label: ms.label,
          occurredAt: dt.value || todayISO(), location: locVal, note: nt.value.trim()
        }).then(function(){
          notifyClient({
            client: client, projectName: project.name, projectCode: project.code,
            page: 'zendingen', portalLabel: 'Volg je zending',
            subject: mailSubject('mijlpaal', { mijlpaal: ms.label, project: project.name }),
            bodyLine: 'Nieuwe mijlpaal: ' + ms.label + (locVal ? ' · ' + locVal : '') + '.'
          });
          refresh();
        }).catch(function(ex){ btn.disabled = false; showError(ex); });
      });
      det.appendChild(el('div', { class:'shipcheck' }, [
        el('span', { style:'flex:0 1 auto;font-weight:600;font-size:13.5px;', text:ms.label }),
        dt, loc, nt, btn
      ]));
    } else {
      det.appendChild(el('div', { class:'shiprow openms' }, [
        el('span', { class:'chip', text:('0' + (idx+1)).slice(-2) }),
        el('span', { class:'ms-label', text:ms.label })
      ]));
    }
  });

  var foot = el('div', { class:'shipfoot' });
  var etaTxt;
  if(s.deliveredAt) etaTxt = 'Geleverd op ' + fmtDate(s.deliveredAt);
  else if(s.etaWindowStart && s.etaWindowEnd){
    etaTxt = 'ETA: ' + fmtDate(s.etaWindowStart) + ' – ' + fmtDate(s.etaWindowEnd)
      + (s.etaNote ? ' · ' + s.etaNote : '')
      + (s.etaUpdatedAt ? ' · bijgewerkt ' + fmtDate(s.etaUpdatedAt) : '');
  } else etaTxt = 'Nog geen ETA ingevuld';
  foot.appendChild(el('span', { class:'rowsub', style:'flex:1 1 220px;min-width:0;', text:etaTxt }));
  if(!s.deliveredAt){
    foot.appendChild(el('button', { type:'button', class:'btn ghost small', text:'ETA bijwerken', onclick:function(){ openEtaModal(s, project, client); } }));
  }
  /* mijlpaal-inhaalmodus (functie 59): meerdere mijlpalen tegelijk afvinken,
     elk met eigen werkelijke datum, met één gebundelde klantmail */
  if(!s.deliveredAt && (tpl.length - doneCount) >= 2){
    foot.appendChild(el('button', { type:'button', class:'btn ghost small', text:'Inhaalmodus', onclick:function(){
      openCatchupModal(pid, project, client, s, events);
    } }));
  }
  foot.appendChild(el('button', { type:'button', class:'btn ghost small', text:'Document koppelen', onclick:function(){ openShipmentDocModal(s, docs); } }));
  /* golf 7 — bewerk-alles: zelfde modal als toevoegen, voorgevuld (stil) */
  foot.appendChild(el('button', { type:'button', class:'btn ghost small', text:'Bewerk', onclick:function(){
    openShipmentModal(pid, samples||[], project, client, shipments||[], { ship: s, hasEvents: (events||[]).length>0 });
  } }));
  if(nr){
    var track = (carrier && carrier.trackUrl) ? carrier : SHIP.CARRIERS.anders;
    foot.appendChild(el('a', {
      class:'btn ghost small', href:track.trackUrl(nr),
      target:'_blank', rel:'noopener noreferrer', text:'Bekijk bij de vervoerder'
    }));
  }
  det.appendChild(foot);

  return el('div', { class:'card', style:'margin-bottom:12px;' }, det);
}
/* mijlpaal-inhaalmodus met bundelmail (functie 59): na een drukke week
   meerdere mijlpalen tegelijk afvinken, elk met de werkelijke datum. Elke
   afvink gaat door de bestaande mijlpaal-logica (logboek, deliveredAt),
   maar de klant krijgt één gebundelde mail in plaats van een mailsalvo. */
function openCatchupModal(pid, project, client, shipment, events){
  var SHIP = window.CP_SHIPPING;
  var tpl = SHIP.milestonesFor(shipment.type);
  var done = {};
  (events||[]).forEach(function(ev){ done[ev.milestoneKey] = true; });
  var open = tpl.filter(function(ms){ return !done[ms.key]; });
  if(!open.length) return;
  var m = openModal('Inhaalmodus', 'Vink meerdere mijlpalen af, elk met de werkelijke datum — één bundelmail', { wide:true });
  var rows = [];
  var listWrap = el('div');
  open.forEach(function(ms, i){
    var cb = el('input', { type:'checkbox', checked: i===0 });
    var dt = el('input', { class:'input', type:'date', value: todayISO(), style:'max-width:170px;', 'aria-label':'Datum van ' + ms.label });
    rows.push({ ms: ms, cb: cb, dt: dt });
    listWrap.appendChild(el('div', { class:'comp-row' }, [
      el('label', { class:'checkline', style:'margin:0;flex:1;min-width:0;' }, [
        cb, el('span', { text: ms.label })
      ]),
      dt
    ]));
  });
  var hint = el('p', { style:'font-size:12.5px;color:var(--gray-69);margin-top:10px;max-width:64ch;', text:
    'De mijlpalen worden in de volgorde van het sjabloon afgevinkt. Elke regel landt in het klantlogboek; alleen de mail wordt gebundeld.' });
  var err = el('p', { class:'formerr' });
  var submitBtn = el('button', { type:'submit', class:'btn', text:'Vink af + bundelmail' });
  var form = el('form', { onsubmit:function(e){
    e.preventDefault();
    err.classList.remove('show');
    var sel = rows.filter(function(r){ return r.cb.checked; });
    if(!sel.length){ err.textContent = 'Vink minstens één mijlpaal aan.'; err.classList.add('show'); return; }
    for(var i=0;i<sel.length;i++){
      if(!sel[i].dt.value){ err.textContent = 'Elke aangevinkte mijlpaal heeft een werkelijke datum nodig.'; err.classList.add('show'); sel[i].dt.focus(); return; }
    }
    submitBtn.disabled = true;
    var chain = Promise.resolve();
    sel.forEach(function(r){
      chain = chain.then(function(){
        return DS.addShipmentEvent(pid, shipment.id, {
          milestoneKey: r.ms.key, label: r.ms.label,
          occurredAt: r.dt.value, location:'', note:''
        });
      });
    });
    chain.then(function(){
      closeModal();
      if(!client){ refresh(); return; }
      var parts = sel.map(function(r){ return r.ms.label + ' (' + fmtDate(r.dt.value) + ')'; });
      var bodyLine = (sel.length===1 ? 'Nieuwe mijlpaal: ' : sel.length + ' stappen afgerond: ') + parts.join(' · ') + '.';
      openMailChoiceModal({
        client: client, projectName: project.name, projectCode: project.code,
        page:'zendingen', portalLabel:'Volg je zending', category:'zending',
        subject: sel.length===1
          ? mailSubject('mijlpaal', { mijlpaal: sel[0].ms.label, project: project.name })
          : mailSubject('mijlpalen', { n: sel.length, project: project.name }),
        bodyLine: bodyLine.length > 290 ? bodyLine.slice(0, 287) + '…' : bodyLine
      }, {
        title:'Bundelmail bij deze inhaalronde',
        kicker:'De mijlpalen staan al afgevinkt — kies of de klant één bundelmail krijgt',
        sendLabel:'Verstuur bundelmail', silentLabel:'Geen mail (stil)',
        onDismiss:function(){ refresh(); }
      });
    }).catch(function(ex){ submitBtn.disabled = false; err.textContent = ex.message||String(ex); err.classList.add('show'); });
  } }, [
    listWrap,
    hint,
    err,
    el('div', { class:'modal-actions' }, [
      el('button', { type:'button', class:'btn ghost', text:'Annuleren', onclick:closeModal }),
      submitBtn
    ])
  ]);
  m.body.appendChild(form);
}
