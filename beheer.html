    /* golf 7 — bewerk-alles: samplerij nabewerken. Wie een ronde alsnog op
       'approved' zet, verdringt eerdere goedkeuringen — dezelfde regel als
       bij toevoegen. FIXRONDE R0-2/R1-3: de verdrongen rondes worden
       teruggegeven, zodat de undo van de bewerking ook die kan herstellen
       en het project nooit stil zonder golden sample achterblijft.
       data.noSupersede = herstelstand: alleen deze rij zetten, niets
       verdringen. */
    updateSample: function(id, data){
      var s = state.samples.find(function(x){ return x.id===id; });
      var superseded = [];
      if(s){
        if(data.status==='approved' && s.status!=='approved' && !data.noSupersede){
          state.samples.forEach(function(other){
            if(other.projectId===s.projectId && other.id!==s.id && other.status==='approved'){
              other.status='superseded';
              superseded.push(other.id);
            }
          });
        }
        if(data.roundLabel!==undefined) s.roundLabel = data.roundLabel;
        if(data.mediaId!==undefined) s.mediaId = data.mediaId || null;
        if(data.status!==undefined) s.status = data.status;
        if(data.note!==undefined) s.note = data.note || '';
        if(data.roundDate!==undefined) s.roundDate = data.roundDate;
        save();
      }
      return Promise.resolve({ superseded: superseded });
    },

/* ============================================================
   dataservice — Supabase-modus
   ============================================================ */
function loadSupabaseLib(){
  return new Promise(function(resolve, reject){
    if(window.supabase && window.supabase.createClient) return resolve();
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    s.onload = function(){ resolve(); };
    s.onerror = function(){ reject(new Error('Kon de Supabase-bibliotheek niet laden. Controleer je verbinding.')); };
    document.head.appendChild(s);
  });
}
function toCamelKey(k){ return k.replace(/_([a-z])/g, function(m, c){ return c.toUpperCase(); }); }
function camelRow(r){
  var out = {};
  Object.keys(r).forEach(function(k){ out[toCamelKey(k)] = r[k]; });
  return out;
}
function makeSupaService(sb, staffUser){
  function unwrap(res){
    if(res && res.error) throw new Error(res.error.message || 'Er ging iets mis bij het ophalen van gegevens.');
    return res ? res.data : null;
  }
  function rows(res){ return (unwrap(res)||[]).map(camelRow); }
  function row(res){ var d = unwrap(res); return d ? camelRow(d) : null; }
  function log(projectId, entry){
    return sb.from('access_log').insert({
      project_id: projectId, actor: entry.actor, asset_kind: entry.assetKind,
      asset_id: entry.assetId || null, action: entry.action, detail: entry.detail || ''
    }).then(function(){ /* een logfout mag de actie niet blokkeren */ }, function(){});
  }
  function fileExt(name){
    var i = String(name||'').lastIndexOf('.');
    var ext = i > -1 ? String(name).slice(i+1).toLowerCase().replace(/[^a-z0-9]/g,'') : '';
    return ext || 'bin';
  }
  /* FIXRONDE R1-1: de unique index op invoices.invoice_number (0005_admin.sql,
     FIXRONDE-blok) is het laatste vangnet tegen een dubbel factuurnummer.
     Vertaal zijn 23505 naar gewone taal in plaats van een rauwe Postgres-fout. */
  function invoiceWriteError(e){
    var msg = (e && (e.message || e.details)) || '';
    if((e && e.code==='23505') || /duplicate key|unique constraint/i.test(msg)){

    /* FIXRONDE R0-1/R1-1 — factuurnummer: ÉÉN atomaire uitgifte.
       Eerste keus is de rij-vergrendelde SQL-functie claim_invoice_number()
       uit 0005_admin.sql: die leest, hoogt op en schrijft terug binnen één
       transactie mét 'for update', dus twee gelijktijdige claims kunnen daar
       nooit hetzelfde nummer geven. Is dat blok nog niet gedraaid, dan valt
       hij terug op een compare-and-set met retry: de teller wordt alléén
       opgehoogd zolang hij nog op de gelezen waarde staat, en een nummer dat
       al op een factuur staat wordt overgeslagen. */
    claimInvoiceNumber: function(){
      function fromRpc(){
        return sb.rpc('claim_invoice_number').then(function(res){
          if(res && res.error) throw new Error(res.error.message || 'rpc mislukt');
          var v = res && res.data;
          if(!v || !v.text) throw new Error('leeg antwoord');
          return v;
        });
      }
      function cas(tries){
        if(tries > 6) return Promise.reject(new Error('Het factuurnummer kon niet worden vastgelegd — er werd tegelijk een ander nummer uitgegeven. Probeer het opnieuw.'));
        return Promise.all([
          sb.from('admin_settings').select('value').eq('key', 'factuur_reeks').maybeSingle(),
          sb.from('invoices').select('invoice_number')
        ]).then(function(r){
          var cur = (r[0] && r[0].data && r[0].data.value) || null;
          var used = {};
          ((r[1] && r[1].data) || []).forEach(function(x){ if(x && x.invoice_number) used[x.invoice_number] = true; });
          var claim = invoiceNumberFor(cur);
          var guard = 0;
          while(used[claim.text] && guard++ < 10000){
            claim = invoiceNumberFor({ prefix: claim.prefix, jaar: claim.jaar, volgende: claim.volgende + 1 });
          }
          var next = { prefix: claim.prefix, jaar: claim.jaar, volgende: claim.volgende + 1 };
          var stamp = new Date().toISOString();
          if(!cur){
            /* nog geen tellerrij: de primary key op 'key' is hier de
               compare-and-set — verliest deze insert, dan opnieuw lezen */
            return sb.from('admin_settings').insert({ key:'factuur_reeks', value: next, updated_at: stamp })
              .then(function(res){
                if(res && res.error) return cas(tries+1);
                return claim;
              }, function(){ return cas(tries+1); });
          }
          if(typeof cur.volgende !== 'number'){
            /* teller staat op een onbruikbare waarde: er valt niets te
               vergelijken, dus gewoon herstellen naar een geldige stand */
            return sb.from('admin_settings').update({ value: next, updated_at: stamp })
              .eq('key', 'factuur_reeks').then(unwrap).then(function(){ return claim; });
          }
          return sb.from('admin_settings').update({ value: next, updated_at: stamp })
            .eq('key', 'factuur_reeks')
            .eq('value->>volgende', String(cur.volgende))
            .select()
            .then(function(res){
              if(res && res.error) throw new Error(res.error.message);
              if(!res || !res.data || !res.data.length) return cas(tries+1); /* teller was intussen opgehoogd */
              return claim;
            });
        });
      }
      return fromRpc().catch(function(){ return cas(0); });
    },

    /* golf 7 — bewerk-alles: factuurvelden nabewerken; status/betaaldatum
       en de documentKOPPELING blijven onaangeroerd. FIXRONDE R1-2: het
       gekoppelde documentRECORD loopt wél mee (titel + fase), anders toont
       de portal twee nummers voor één factuur. De PDF kunnen we niet
       herschrijven — hangt er een bestand aan, dan markeert file_stale het
       record als verouderd zodat de beheerlijst dat eerlijk toont. */
    updateInvoice: function(id, data){
      var upd = {};
      if(data.label!==undefined) upd.label = data.label;
      if(data.amountCents!==undefined) upd.amount_cents = data.amountCents;
      if(data.stageKey!==undefined) upd.stage_key = data.stageKey;
      if(data.currency!==undefined) upd.currency = CURRENCIES.indexOf(data.currency) > -1 ? data.currency : 'EUR';
      if(data.invoiceNumber!==undefined) upd.invoice_number = data.invoiceNumber || '';
      if(data.vatMode!==undefined) upd.vat_mode = data.vatMode || 'verlegd';
      if(data.vatCents!==undefined) upd.vat_cents = data.vatCents || 0;
      if(data.totalCents!==undefined) upd.total_cents = data.totalCents || data.amountCents || 0;
      if(!Object.keys(upd).length) return Promise.resolve(null);
      return sb.from('invoices').select('*').eq('id', id).maybeSingle()
        .then(function(res){ return (res && res.data) ? camelRow(res.data) : null; }, function(){ return null; })
        .then(function(before){
          return sb.from('invoices').update(upd).eq('id', id).then(function(res){
            if(res && res.error) throw invoiceWriteError(res.error);
            return before;
          });
        })
        .then(function(before){
          if(!before || !before.documentId) return null;
          var newNum = (upd.invoice_number!==undefined) ? upd.invoice_number : (before.invoiceNumber || '');
          var newStage = (upd.stage_key!==undefined) ? upd.stage_key : before.stageKey;
          var numChanged = newNum !== (before.invoiceNumber || '');
          var stageChanged = newStage !== before.stageKey;
          if(!numChanged && !stageChanged) return null;
          return sb.from('documents').select('*').eq('id', before.documentId).maybeSingle()
            .then(function(res){ return (res && res.data) || null; }, function(){ return null; })
            .then(function(d){
              if(!d) return null;
              var core = {}, changed = [];
              if(numChanged && /^Factuur(\s|$)/.test(String(d.title||''))){
                core.title = 'Factuur ' + (newNum || before.label || '');
                changed.push('titel');
              }
              if(stageChanged){ core.stage_key = newStage; changed.push('fase'); }
              if(!changed.length) return null;
              var stale = numChanged && !!d.storage_path;
              return updateDocTolerant(before.documentId, core, stale ? { file_stale: true } : null)
                .then(function(){ return { docSynced: changed, docStale: stale }; });
            });
        });
    },

/* context van het geopende projectdetail — voor plakken vanaf het klembord
   (functie 48): de paste-listener staat alleen aan op projectdetail zodat
   je nooit in het verkeerde project plakt */
var projectPageCtx = null;

var content = document.getElementById('content');
var qBadge = document.getElementById('qBadge');
var aBadge = document.getElementById('aBadge');
var wBadge = document.getElementById('wBadge');

function go(v){
  view = v;
  render().then(function(){ window.scrollTo(0, 0); });
}
function refresh(){
  var y = window.scrollY;
  return render().then(function(){ window.scrollTo(0, y); });
}
function setNavActive(){
  var name = view.name;
  var navKey = name;
  if(name==='client') navKey = 'clients';
  else if(name==='project') navKey = 'projects';
  document.querySelectorAll('.navbtn').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-nav')===navKey);
  });

function updateBadge(){
  if(!DS) return;
  Promise.all([
    DS.listQuestions(),
    DS.listRequests ? DS.listRequests() : Promise.resolve([])
  ]).then(function(res){
    var qs = res[0];
    var open = qs.filter(function(q){ return !q.answeredAt; });
    var reorders = 0;
    open.forEach(function(q){ if(isReorderQuestion(q)) reorders++; });
    var normal = open.length - reorders;
    qBadge.textContent = String(normal);
    qBadge.hidden = normal===0;
    /* herbestelaanvragen én onbehandelde site-briefs (functie 21) tellen
       op Aanvragen, niet op Vragen */
    var briefs = (res[1]||[]).filter(function(r){ return r.status!=='omgezet'; }).length;
    var aCount = reorders + briefs;
    aBadge.textContent = String(aCount);
    aBadge.hidden = aCount===0;
  }).catch(function(){});
  /* de Wachtrij telt concepten (functies 42/61) + conceptfacturen (golf 8);
     het gegenereerde factuurdocument van een conceptfactuur telt niet
     dubbel — dat hoort bij de factuurrij */
  if(DS.listConcepts){
    Promise.all([ DS.listConcepts(), DS.listAllInvoices() ]).then(function(res){
      var invConcepts = (res[1]||[]).filter(isConcept);
      var invDocIds = {};
      invConcepts.forEach(function(inv){ if(inv.documentId) invDocIds[inv.documentId] = true; });
      var n = res[0].filter(function(it){ return !(it.kind==='document' && invDocIds[it.row.id]); }).length
        + invConcepts.length;
      wBadge.textContent = String(n);
      wBadge.hidden = n===0;
    }).catch(function(){});
  }
}
/* portal-tab schreef onder dezelfde sleutel (vraag/logregel): neem de
   toevoegingen op en ververs badge + eventueel de open vragenlijst.
   'storage' vuurt alleen cross-tab, dus eigen writes lussen niet. */
window.addEventListener('storage', function(e){
  if(!e || e.key !== DEMO_KEY) return;
  if(!DS || !DS.absorbExternal) return;
  DS.absorbExternal().then(function(changed){
    if(!changed) return;
    updateBadge();
    if(view && (view.name === 'questions' || view.name === 'log' ||
                view.name === 'vandaag' || view.name === 'aanvragen')) refresh();
  });
});
/* plakken vanaf klembord (functie 48): alleen actief op projectdetail.
   Tekst in een veld plakken blijft gewoon werken — we reageren uitsluitend
   op afbeeldingsbestanden (bv. een WeChat-screenshot). */
document.addEventListener('paste', function(e){
  if(!DS || !view || view.name!=='project' || !projectPageCtx) return;
  var files = e.clipboardData && e.clipboardData.files;
  if(!files || !files.length) return;
  var hasImg = false;
  Array.prototype.forEach.call(files, function(f){
    if(f && f.type && f.type.indexOf('image/')===0) hasImg = true;
  });
  if(!hasImg) return;
  e.preventDefault();
  if(activeModal){
    /* alleen aan een open batchlijst van HETZELFDE project toevoegen;
       andere modals worden nooit gekaapt */
    if(mediaBatchApi && mediaBatchApi.projectId===projectPageCtx.projectId) mediaBatchApi.addFiles(files);
    return;
  }
  openMediaModal(projectPageCtx.projectId, projectPageCtx.factories, projectPageCtx.project, projectPageCtx.client, files);
});
/* ============================================================
   golf 4 — Cmd+K-springbalk + lijstsneltoetsen (functie 14)
   j/k bewegen, Enter openen, A antwoorden, S snoozen, M mijlpaal afvinken.
   Lijstschermen registreren hun rijen per render; '?' toont alles.
   ============================================================ */
var kbRows = [], kbIdx = -1;
function kbReset(){
  kbRows.forEach(function(r){ r.el.classList.remove('kbsel'); });
  kbRows = [];
  kbIdx = -1;
}
function kbRegister(elm, handlers){
  if(elm) kbRows.push({ el: elm, h: handlers || {} });
}
function kbSelect(i){
  if(!kbRows.length) return;
  if(kbIdx > -1 && kbRows[kbIdx]) kbRows[kbIdx].el.classList.remove('kbsel');
  kbIdx = Math.max(0, Math.min(i, kbRows.length - 1));
  var r = kbRows[kbIdx];
  r.el.classList.add('kbsel');
  if(r.el.scrollIntoView) r.el.scrollIntoView({ block:'nearest' });
}
function inEditable(){
  var t = document.activeElement;
  if(!t) return false;
  var tag = t.tagName;
  return tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT' || t.isContentEditable;
}
document.addEventListener('keydown', function(e){
  /* geen enkele sneltoets — ook ⌘/Ctrl+K niet — mag een open modal
     vernietigen (halve foto-batch, mail-keuzedialoog) of in een
     invoerveld grijpen; de guard staat daarom VÓÓR de springbalk.
     Snelzoeken vanuit een modal is geen use-case. */
  if(!DS || activeModal || inEditable()) return;
  if((e.metaKey || e.ctrlKey) && (e.key==='k' || e.key==='K')){
    e.preventDefault();
    openJumpBar();
    return;
  }
  if(e.altKey || e.metaKey || e.ctrlKey) return;
  if(e.key==='?'){ e.preventDefault(); openShortcutHelp(); return; }
  if(!kbRows.length) return;
  if(e.key==='j'){ e.preventDefault(); kbSelect(kbIdx + 1); return; }
  if(e.key==='k'){ e.preventDefault(); kbSelect(kbIdx <= 0 ? 0 : kbIdx - 1); return; }
  if(kbIdx < 0 || !kbRows[kbIdx]) return;
  var h = kbRows[kbIdx].h;
  if(e.key==='Enter' && h.open){ e.preventDefault(); h.open(); }
  else if((e.key==='a' || e.key==='A') && h.answer){ e.preventDefault(); h.answer(); }
  else if((e.key==='s' || e.key==='S') && h.snooze){ e.preventDefault(); h.snooze(); }
  else if((e.key==='m' || e.key==='M') && h.milestone){ e.preventDefault(); h.milestone(); }
});
/* springbalk: klant- of projectnaam typen → direct naar detail */
function openJumpBar(){
  var m = openModal('Spring naar', 'Typ een klant- of projectnaam · Enter opent');
  var input = el('input', { class:'input', type:'text', autocomplete:'off',
    placeholder:'bv. Atelier Noor of Diffuser', 'aria-label':'Zoek klant of project' });
  var list = el('div', { style:'margin-top:12px;max-height:320px;overflow-y:auto;' });
  var entries = [], hits = [], sel = 0;
  Promise.all([ DS.listClients(), DS.listAllProjects() ]).then(function(res){
    res[0].forEach(function(c){
      entries.push({ label:c.company, sub:[c.contactName, 'klant'].filter(Boolean).join(' · '),
        go:function(){ closeModal(); go({ name:'client', clientId:c.id }); } });
    });
    var cById = {};
    res[0].forEach(function(c){ cById[c.id] = c; });
    res[1].forEach(function(p){
      var c = cById[p.clientId];
      entries.push({ label:p.name, sub:[c?c.company:null, p.code||null, 'project'].filter(Boolean).join(' · '),
        go:function(){ closeModal(); go({ name:'project', projectId:p.id, clientId:p.clientId }); } });
    });
    paint();
  }).catch(function(){});
  function paint(){
    clearNode(list);
    var q = input.value.trim().toLowerCase();
    hits = entries.filter(function(en){
      return !q || (en.label + ' ' + en.sub).toLowerCase().indexOf(q) > -1;
    }).slice(0, 12);
    if(sel >= hits.length) sel = Math.max(0, hits.length - 1);
    if(!hits.length){
      list.appendChild(el('p', { class:'empty', text:'Niets gevonden — probeer een kortere zoekterm of een klantnaam.' }));
      return;
    }
    hits.forEach(function(en, i){
      var b = el('button', { type:'button', class:'jumprow' + (i===sel ? ' sel' : ''), onclick:en.go }, [
        el('span', { class:'jr-main', text:en.label }),
        el('span', { class:'jr-sub', text:en.sub })
      ]);
      list.appendChild(b);
    });
  }
  input.addEventListener('input', function(){ sel = 0; paint(); });
  input.addEventListener('keydown', function(e){
    if(e.key==='ArrowDown'){ e.preventDefault(); sel = Math.min(sel+1, hits.length-1); paint(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); sel = Math.max(sel-1, 0); paint(); }
    else if(e.key==='Enter'){ e.preventDefault(); if(hits[sel]) hits[sel].go(); }
  });
  m.body.appendChild(input);
  m.body.appendChild(list);
  paint();
  setTimeout(function(){ input.focus(); }, 40);
}
function openShortcutHelp(){
  var m = openModal('Sneltoetsen', 'Werken overal, behalve in invoervelden');
  [
    ['⌘/Ctrl + K', 'Springbalk: klant of project zoeken en openen'],
    ['j / k', 'Omlaag / omhoog bewegen in een lijst'],
    ['Enter', 'Geselecteerde rij openen'],
    ['A', 'Antwoorden (bij een vraagrij)'],
    ['S', 'Snoozen (bij een Vandaag-rij)'],
    ['M', 'Eerstvolgende mijlpaal afvinken (bij een zendingrij)'],
    ['⌘/Ctrl + Enter', 'Formulier in een venster opslaan'],
    ['Esc', 'Venster sluiten (met bevestiging bij invoer)'],
    ['?', 'Dit overzicht']
  ].forEach(function(pair){
    m.body.appendChild(el('div', { class:'statusline' }, [
      el('span', { class:'mono', style:'font-size:12.5px;font-weight:600;', text:pair[0] }),
      el('span', { style:'font-size:13.5px;color:var(--gray-69);text-align:right;', text:pair[1] })
    ]));
  });

    el('button', { type:'button', class:'btn', text:'Sluiten', onclick:closeModal })));
}

/* ============================================================
   golf 4 — itemstatus per Vandaag-item (functies 5/6/12)
   Eén klein key/value-blok in de beheerinstellingen (sleutel per item):
   snoozedUntil/snoozeReason (5), owner/ownerSince (6), pinned/pinnedAt (12).
   Geen kolommen op vijf tabellen — dit is de eenmanszaak-versie, identiek
   in demo- en Supabase-modus via de bestaande settings-opslag.
   ============================================================ */
function itemStates(){
  return (adminSettings && adminSettings.itemState && typeof adminSettings.itemState==='object')
    ? adminSettings.itemState : {};
}
function saveItemState(key, patch){
  var blob = clone(itemStates());
  var cur = blob[key] || {};
  Object.keys(patch).forEach(function(k){
    var v = patch[k];
    if(v===null || v==='' || v===false || v===undefined) delete cur[k];
    else cur[k] = v;
  });
  if(Object.keys(cur).length) blob[key] = cur; else delete blob[key];
  if(adminSettings) adminSettings.itemState = blob;
  return DS.saveSetting('itemState', blob);
}
function saveItemStates(patchByKey){
  var blob = clone(itemStates());
  Object.keys(patchByKey).forEach(function(key){
    var cur = blob[key] || {};
    var patch = patchByKey[key];
    Object.keys(patch).forEach(function(k){
      var v = patch[k];
      if(v===null || v==='' || v===false || v===undefined) delete cur[k];
      else cur[k] = v;
    });
    if(Object.keys(cur).length) blob[key] = cur; else delete blob[key];
  });
  if(adminSettings) adminSettings.itemState = blob;
  return DS.saveSetting('itemState', blob);
}
/* snooze met reden en terugkeerdatum (functie 5) */
function openSnoozeModal(key, titleTxt){
  var m = openModal('Snooze', titleTxt || 'Verdwijnt uit Vandaag en keert op de gekozen dag bovenaan terug');
  var dateSd = smartDateField(addDaysISO(todayISO(), 1), 'Terugkeerdatum');
  var reason = el('input', { class:'input', type:'text', list:'snoozeRedenen',
    placeholder:'bv. wacht op fabriek', 'aria-label':'Reden' });
  var dl = el('datalist', { id:'snoozeRedenen' });
  ['Wacht op fabriek','Wacht op klant','Wacht op betaling','Wacht op vervoerder'].forEach(function(r){
    dl.appendChild(el('option', { value:r }));
  });
  var err = el('p', { class:'formerr' });
  var form = el('form', { onsubmit:function(e){
    e.preventDefault();
    err.classList.remove('show');
    var iso = dateSd.get();
    if(!iso){ err.textContent = dateSd.invalid() ? 'Datum niet herkend — probeer vr, +3 of 12/9.' : 'Kies een terugkeerdatum.'; err.classList.add('show'); return; }
    if(iso <= todayISO()){ err.textContent = 'Kies een datum na vandaag — anders staat het item er direct weer.'; err.classList.add('show'); return; }
    saveItemState(key, { snoozedUntil: iso, snoozeReason: reason.value.trim(), pinned:false, pinnedAt:null })
      .then(function(){ closeModal(); refresh(); })
      .catch(function(ex){ err.textContent = ex.message||String(ex); err.classList.add('show'); });
  } }, [
    dl,
    el('div', { class:'formrow' }, [ field('Terug op', dateSd.node), field('Reden', reason) ]),
    err,
    el('div', { class:'modal-actions' }, [
      el('button', { type:'button', class:'btn ghost', text:'Annuleren', onclick:closeModal }),
      el('button', { type:'submit', class:'btn', text:'Snooze' })
    ])
  ]);
  m.body.appendChild(form);
}

function showError(err){
  clearNode(content);
  content.appendChild(el('div', { class:'card', style:'padding:22px;' }, [
    el('span', { class:'kicker', text:'Er ging iets mis' }),
    el('p', { text: (err && err.message) || String(err), style:'margin-top:8px;font-size:14px;' }),
    el('div', { style:'margin-top:16px;' },
      el('button', { type:'button', class:'btn ghost small', text:'Opnieuw proberen', onclick:function(){ render(); } }))
  ]));
}
function render(){
  setNavActive();
  updateBadge();
  clearNode(content);
  projectPageCtx = null;
  kbReset(); /* lijstsneltoetsen (functie 14): elke view registreert opnieuw */
  var p;
  if(view.name==='vandaag') p = renderVandaag();
  else if(view.name==='aanvragen') p = renderAanvragen();
  else if(view.name==='clients') p = renderClients();
  else if(view.name==='client') p = renderClient(view.clientId);
  else if(view.name==='projects') p = renderProjectsList();
  else if(view.name==='project') p = renderProject(view.projectId);
  else if(view.name==='wachtrij') p = renderWachtrij();
  else if(view.name==='factories') p = renderFactories();
  else if(view.name==='questions') p = renderQuestions();
  else if(view.name==='log') p = renderLog();
  else if(view.name==='settings') p = renderSettings();
  else p = Promise.resolve();
  return p.catch(showError);
}

/* ============================================================
   deel 0 — Vandaag (cockpit, functies 1/2/3/4/10/11)
   Eén leeg te werken actielijst over alle klanten en projecten heen.
   Puur een filter-/sorteerlaag op bestaande records — geen eigen opslag,
   identiek in demo- en Supabase-modus.
   ============================================================ */
function renderVandaag(){
  return Promise.all([
    DS.listClients(),
    DS.listAllProjectsWithStages(),
    DS.listQuestions(),
    DS.listAllInvoices(),
    DS.listAllShipments(),
    DS.listAllSamples(),
    DS.listAllMedia(),
    DS.listLog(null),
    DS.getSettings(),
    DS.listContactMoments ? DS.listContactMoments() : Promise.resolve([])
  ]).then(function(res){
    var shipments = res[4];
    return DS.listShipmentEvents(shipments.map(function(s){ return s.id; })).then(function(events){
      buildVandaag({
        clients:res[0], projects:res[1], questions:res[2], invoices:res[3],
        shipments:shipments, samples:res[5], media:res[6], logRows:res[7],
        settings:res[8], moments:res[9], events:events
      });
    });
  });
}
/* gedeelde signaalberekening (functies 1/2/9/10/11): één keer geschreven,
   hergebruikt door de cockpit, de samenvattingskop en ochtendmail (7), het
   weekbord (8), de projectenlijst met volgende-actie (36) en de kopregel op
   projectdetail — exact dezelfde aggregatie, geen dubbele logica. Elk item
   krijgt een stabiele sleutel voor snooze/bal-ligt-bij/pin (5/6/12). */
function computeSignals(d){
  var pmap = {};
  d.projects.forEach(function(p){ pmap[p.id] = p; });

  /* 1. open vragen, gesorteerd op antwoordklok (rood bovenaan) */
  var vragen = [];
  (d.questions||[]).forEach(function(q){
    if(q.answeredAt) return;
    q._klok = klokInfo(q.askedAt);
    vragen.push({ type:'vraag', key:'q:'+q.id, projectId:q.projectId, q:q });
  });
  vragen.sort(function(a,b){ return (a.q._klok?a.q._klok.sort:0) - (b.q._klok?b.q._klok.sort:0); });

  /* 2. fases op 'wacht op akkoord' — de klant is aan zet; de ouderdom komt
     uit de bestaande logregel van de statuswissel (geen verzonnen datum) */
  var fases = [];
  d.projects.forEach(function(p){
    if(p.status==='archived') return;
    (p.stages||[]).forEach(function(s){
      if(s.status!=='awaiting_approval') return;
      var detail = 'Fasestatus gewijzigd: ' + stageLabel(s.stageKey) + ' → ' + stageStatusLabel('awaiting_approval');
      var since = null;
      (d.logRows||[]).forEach(function(r){
        if(r.projectId===p.id && r.detail===detail && (!since || String(r.createdAt) > String(since))) since = r.createdAt;
      });
      fases.push({ type:'fase', key:'stage:'+p.id+':'+s.stageKey, projectId:p.id, project:p, stage:s, since:since });
    });
  });

  /* 3. geld: open facturen, oudste eerst — conceptfacturen (golf 8) horen
     hier niet: die zijn nog niet verstuurd en krijgen een eigen blok */
  var geld = [];
  (d.invoices||[]).forEach(function(inv){
    if(inv.status!=='open' || isConcept(inv)) return;
    var age = daysSince(inv.createdAt);
    if(age==null) age = 0;
    geld.push({ type:'factuur', key:'inv:'+inv.id, projectId:inv.projectId, inv:inv, age:age });
  });
  geld.sort(function(a,b){ return String(a.inv.createdAt||'').localeCompare(String(b.inv.createdAt||'')); });

  /* 4. zendingsignalen: ETA-verloop (11) en stille zendingen (10) */
  var evByShip = {};
  (d.events||[]).forEach(function(ev){ (evByShip[ev.shipmentId] = evByShip[ev.shipmentId] || []).push(ev); });
  var lastMediaByProject = {};
  (d.media||[]).forEach(function(m){
    var cur = lastMediaByProject[m.projectId];
    if(!cur || String(m.capturedAt) > String(cur)) lastMediaByProject[m.projectId] = m.capturedAt;
  });
  var drempel = (d.settings && typeof d.settings.stilteDrempelDagen==='number') ? d.settings.stilteDrempelDagen : 5;
  var eta = [], stil = [];
  (d.shipments||[]).forEach(function(s){
    if(s.deliveredAt) return;
    var p = pmap[s.projectId];
    if(p && p.status==='archived') return;
    var evs = (evByShip[s.id]||[]).slice().sort(function(a,b){ return String(a.occurredAt).localeCompare(String(b.occurredAt)); });
    if(evs.some(function(ev){ return ev.milestoneKey==='geleverd'; })) return;
    /* 11. einde ETA-venster binnen 48 uur of gepasseerd, zonder levering */
    if(s.etaWindowEnd){
      var end = asDate(s.etaWindowEnd);
      if(end && !isNaN(end.getTime())){
        var msLeft = end.getTime() + 86400000 - Date.now(); /* tot einde van de dag */
        if(msLeft < 48*3600000){
          eta.push({ type:'eta', key:'ship:'+s.id, projectId:s.projectId, shipment:s, events:evs, passed: msLeft < 0 });
          return; /* niet óók in de stiltelijst */
        }
      }
    }
    /* 10. geen nieuwe mijlpaal én geen nieuwe media in X dagen */
    var lastMove = s.createdAt;
    evs.forEach(function(ev){ if(String(ev.occurredAt) > String(lastMove)) lastMove = ev.occurredAt; });
    var moveDays = daysSince(lastMove);
    var lastMedia = lastMediaByProject[s.projectId] || null;
    var mediaDays = lastMedia ? daysSince(lastMedia) : null;
    if(moveDays!=null && moveDays >= drempel && (mediaDays==null || mediaDays >= drempel)){
      stil.push({ type:'stil', key:'ship:'+s.id, projectId:s.projectId, shipment:s, events:evs,
        stilDays: (mediaDays==null ? moveDays : Math.min(moveDays, mediaDays)) });
    }
  });

  /* 5. samplerondes die op een beslissing wachten: nieuwste ronde 'reviewed' */
  var latestSample = {};
  (d.samples||[]).forEach(function(sm){
    var cur = latestSample[sm.projectId];
    if(!cur || String(sm.roundDate) > String(cur.roundDate)) latestSample[sm.projectId] = sm;
  });
  var samples = [];
  Object.keys(latestSample).forEach(function(pid){
    var sm = latestSample[pid];
    var p = pmap[sm.projectId];
    if(sm.status==='reviewed' && p && p.status!=='archived'){
      samples.push({ type:'sample', key:'smp:'+sm.id, projectId:sm.projectId, sm:sm });
    }
  });
  samples.sort(function(a,b){ return String(a.sm.roundDate).localeCompare(String(b.sm.roundDate)); });

  return {
    vragen:vragen, fases:fases, geld:geld, eta:eta, stil:stil, samples:samples,
    items: vragen.concat(fases, geld, eta, stil, samples)
  };
}
/* telblok-cijfers (functie 7): dezelfde aggregatie voor de samenvattingskop
   én de ochtendmail */
function computeCounts(d, sig){
  var week7 = addDaysISO(todayISO(), 7);
  var deliveredEv = {};
  (d.events||[]).forEach(function(ev){ if(ev.milestoneKey==='geleverd') deliveredEv[ev.shipmentId] = true; });
  var pmap = {};
  d.projects.forEach(function(p){ pmap[p.id] = p; });
  var etaWeek = 0;
  (d.shipments||[]).forEach(function(s){
    if(s.deliveredAt || deliveredEv[s.id]) return;
    var p = pmap[s.projectId];
    if(p && p.status==='archived') return;
    if(s.etaWindowEnd && String(s.etaWindowEnd).slice(0,10) <= week7) etaWeek++;
  });
  return {
    vragen: sig.vragen.length,
    fases: sig.fases.length,
    fact30: sig.geld.filter(function(it){ return it.age >= 30; }).length,
    etaWeek: etaWeek,
    rood: sig.vragen.filter(function(it){ return it.q._klok && it.q._klok.state==='rood'; }).length
  };
}
function countsLine(counts, total){
  return counts.vragen + (counts.vragen===1 ? ' open vraag' : ' open vragen')
    + ' · ' + counts.fases + ' op akkoord'
    + ' · ' + counts.fact30 + ' facturen 30+'
    + ' · ' + counts.etaWeek + ' ETA’s deze week'
    + ' · ' + counts.rood + (counts.rood===1 ? ' rode klok' : ' rode klokken')
    + ' — samen ' + total + (total===1 ? ' open punt.' : ' open punten.');
}
function buildVandaag(d){
  adminSettings = d.settings; /* verse instellingen (o.a. itemState) meteen in de cache */
  var cmap = {}, pmap = {};
  d.clients.forEach(function(c){ cmap[c.id] = c; });
  d.projects.forEach(function(p){ pmap[p.id] = p; });
  function ctx(projectId){
    var p = pmap[projectId];
    var c = p ? cmap[p.clientId] : null;
    return { p:p, c:c, line:[c?c.company:null, p?p.name:null].filter(Boolean).join(' · ') };
  }
  function openProjectBtn(projectId){
    return el('button', { type:'button', class:'btn ghost small', text:'Open project', onclick:function(){
      var p = pmap[projectId];
      if(p) go({ name:'project', projectId:p.id, clientId:p.clientId });
    } });
  }
  function goProject(projectId){
    var p = pmap[projectId];
    if(p) go({ name:'project', projectId:p.id, clientId:p.clientId });
  }

  var sig = computeSignals(d);
  var states = (d.settings && d.settings.itemState && typeof d.settings.itemState==='object') ? d.settings.itemState : {};
  var today = todayISO();

  /* itemstatus toepassen (functies 5/6/12): snooze, bal-ligt-bij, pin */
  sig.items.forEach(function(it){
    var st = states[it.key] || null;
    it._st = st;
    it._pinned = !!(st && st.pinned);
    it._snoozed = !!(st && st.snoozedUntil && st.snoozedUntil > today);
    it._terug = !!(st && st.snoozedUntil && st.snoozedUntil <= today);
    it._owner = (st && st.owner) || 'mij';
    it._ownerDays = (st && st.ownerSince) ? daysSince(st.ownerSince) : null;
  });
  var pinned = [], terug = [], najagen = [], elders = [], uitgesteld = [], rest = [];
  sig.items.forEach(function(it){
    if(it._pinned) pinned.push(it);
    else if(it._snoozed) uitgesteld.push(it);
    else if(it._terug) terug.push(it);
    else if(it._owner==='fabriek' && it._ownerDays!=null && it._ownerDays > 3) najagen.push(it);
    else if(it._owner==='klant' || it._owner==='fabriek') elders.push(it);
    else rest.push(it);
  });
  var restBy = { vraag:[], fase:[], factuur:[], eta:[], stil:[], sample:[] };
  rest.forEach(function(it){ restBy[it.type].push(it); });

  /* follow-up-herinneringen uit contactmomenten (functie 27) */
  var reminders = (d.moments||[]).filter(function(mnt){
    return mnt.remindAt && !mnt.remindDone && String(mnt.remindAt).slice(0,10) <= today;
  });

  var counts = computeCounts(d, sig);
  /* golf 8: conceptfacturen (automatisch klaargezet) zijn open punten van
     Steffan — ze tellen mee in de kop en krijgen hieronder een eigen blok */
  var conceptInvs = (d.invoices||[]).filter(function(inv){
    var p = pmap[inv.projectId];
    return isConcept(inv) && (!p || p.status!=='archived');
  }).sort(function(a,b){ return String(a.createdAt||'').localeCompare(String(b.createdAt||'')); });
  var openCount = pinned.length + terug.length + najagen.length + rest.length + reminders.length + conceptInvs.length;

  content.appendChild(el('div', { class:'pagehead' }, [
    el('div', null, [
      el('span', { class:'kicker', text: fmtDate(today) + ' · ' + (openCount===1 ? '1 open punt' : openCount + ' open punten') }),
      el('h1', { text:'Vandaag' })
    ]),
    /* dagafsluiting (functie 13) */
    el('button', { type:'button', class:'btn ghost small', text:'Dag afsluiten', onclick:function(){ openDayCloseModal(); } })
  ]));

  /* samenvattingskop (functie 7): elke regel klikt door naar de lijst */
  var statWrap = el('div', { class:'card statgrid' });
  function statBtn(n, label, targetId, crit){
    return el('button', { type:'button', class:'statbtn', onclick:function(){
      if(vandaagTab!=='dag'){ vandaagTab = 'dag'; refresh(); return; }
      var t = targetId ? document.getElementById(targetId) : null;
      if(t) t.scrollIntoView({ block:'start' });
    } }, [
      el('div', { class:'num' + ((crit && n>0) ? ' crit' : ''), text:String(n) }),
      el('div', { class:'lbl', text:label })
    ]);
  }
  statWrap.appendChild(statBtn(counts.vragen, 'open vragen', 'vd-vragen'));
  statWrap.appendChild(statBtn(counts.fases, 'fases op akkoord', 'vd-fases'));
  statWrap.appendChild(statBtn(counts.fact30, 'facturen 30+', 'vd-geld', true));
  statWrap.appendChild(statBtn(counts.etaWeek, 'eta’s deze week', 'vd-zendingen'));
  statWrap.appendChild(statBtn(counts.rood, 'rode klokken', 'vd-vragen', true));
  content.appendChild(statWrap);

  /* tabblad Vandaag / Deze week (functie 8) */
  function vdTabBtn(key, labelTxt){
    return el('button', {
      type:'button', class:'tabbtn' + (vandaagTab===key ? ' active' : ''), role:'tab',
      'aria-selected': vandaagTab===key ? 'true' : 'false', text:labelTxt,
      onclick:function(){ if(vandaagTab!==key){ vandaagTab = key; refresh(); } }
    });
  }
  content.appendChild(el('div', { class:'tabbar', role:'tablist', 'aria-label':'Vandaag-weergave' }, [
    vdTabBtn('dag', 'Vandaag'), vdTabBtn('week', 'Deze week')
  ]));

  if(vandaagTab==='week'){
    buildWeekBoard();
    return;
  }

  /* ---------- rijbouwers + itemknoppen (5/6/12/14) ---------- */
  function itemTitle(it){
    if(it.type==='vraag') return isReorderQuestion(it.q) ? String(it.q.question||'').replace(/^HERBESTELLING:\s*/, '') : it.q.question;
    if(it.type==='fase') return stageLabel(it.stage.stageKey);
    if(it.type==='factuur') return (it.inv.invoiceNumber ? it.inv.invoiceNumber + ' · ' : '') + it.inv.label;
    if(it.type==='eta' || it.type==='stil') return shipmentTitle(it.shipment);
    if(it.type==='sample') return 'Sample ' + it.sm.roundLabel;
    return '';
  }
  function itemControls(it){
    var pinBtn = el('button', { type:'button', class:'vd-mini' + (it._pinned ? ' on' : ''),
      text: it._pinned ? 'Los pin' : 'Pin',
      'aria-label': it._pinned ? 'Pin losmaken' : 'Pin bovenaan Vandaag' });
    pinBtn.addEventListener('click', function(){
      if(!it._pinned && pinned.length >= 5){
        var mm = openModal('Maximaal 5 pins', 'Een korte pinlijst is de kracht ervan');
        mm.body.appendChild(el('p', { style:'font-size:14px;color:var(--gray-69);', text:'Maak eerst een bestaande pin los voordat je deze rij pint.' }));
        mm.body.appendChild(el('div', { class:'modal-actions' },
          el('button', { type:'button', class:'btn', text:'Sluiten', onclick:closeModal })));
        return;
      }
      saveItemState(it.key, it._pinned
        ? { pinned:false, pinnedAt:null }
        : { pinned:true, pinnedAt:today, snoozedUntil:null, snoozeReason:null })
        .then(refresh).catch(showError);
    });
    var snoozeBtn = el('button', { type:'button', class:'vd-mini', text:'Snooze', 'aria-label':'Snooze met terugkeerdatum' });
    snoozeBtn.addEventListener('click', function(){ openSnoozeModal(it.key, itemTitle(it)); });
    var ownerSel = el('select', { class:'input ownersel', 'aria-label':'Bij wie ligt de bal' });
    [['mij','Bal: mij'],['klant','Bal: klant'],['fabriek','Bal: fabriek']].forEach(function(pair){
      ownerSel.appendChild(option(pair[0], pair[1], it._owner===pair[0]));
    });
    ownerSel.addEventListener('change', function(){
      var v = ownerSel.value;
      saveItemState(it.key, v==='mij' ? { owner:null, ownerSince:null } : { owner:v, ownerSince:today })
        .then(refresh).catch(showError);
    });
    return [ ownerSel, snoozeBtn, pinBtn ];
  }
  function kbBase(it){
    return {
      open: function(){ goProject(it.projectId); },
      snooze: function(){ openSnoozeModal(it.key, itemTitle(it)); }
    };
  }
  /* vraagrij met inline beantwoorden (3) */
  function rowVraag(it, feedRows, extras){
    var q = it.q;
    var c = ctx(it.projectId);
    var idx = feedRows ? feedRows.length : -1;
    var row, area = null, ta = null;
    function openAnswer(){
      if(area){ area.hidden = false; ta.focus(); return; }
      ta = el('textarea', { class:'input', 'aria-label':'Antwoord aan de klant', placeholder:'Je antwoord aan de klant' });
      var errEl = el('p', { class:'formerr' });
      var send = el('button', { type:'button', class:'btn small', text:'Verstuur antwoord' });
      send.addEventListener('click', function(){
        var a = ta.value.trim();
        if(!a){ errEl.textContent = 'Schrijf eerst een antwoord.'; errEl.classList.add('show'); return; }
        send.disabled = true;
        DS.answerQuestion(q.id, a).then(function(){
          if(c.p && c.c){
            notifyClient({
              client:c.c, projectName:c.p.name, projectCode:c.p.code,
              page:'updates', portalLabel:'Bekijk het antwoord',
              subject: mailSubject('antwoord', { project: c.p.name }),
              bodyLine:'Steffan heeft gereageerd op je vraag: “' + q.question + '”'
            });
          }
          updateBadge();
          /* rij verdwijnt, focus springt naar de volgende open vraag */
          if(row.parentNode) row.parentNode.removeChild(row);
          var next = null, j;
          if(feedRows){
            for(j=idx+1; j<feedRows.length && !next; j++){ if(feedRows[j].alive()) next = feedRows[j]; }
            for(j=0; j<idx && !next; j++){ if(feedRows[j].alive()) next = feedRows[j]; }
          }
          if(next) next.open();
          else refresh();
        }).catch(function(ex){ send.disabled = false; errEl.textContent = ex.message||String(ex); errEl.classList.add('show'); });
      });
      area = el('div', { class:'inlineform' }, [
        ta, errEl,
        el('div', { class:'modal-actions' }, [
          el('button', { type:'button', class:'btn ghost small', text:'Sluit', onclick:function(){ area.hidden = true; } }),
          send
        ])
      ]);
      row.appendChild(area);
      ta.focus();
    }
    var inner = el('div', { class:'rowitem' }, [
      q._klok ? el('span', { class:'chip ' + q._klok.cls, text:q._klok.label }) : null,
      isReorderQuestion(q) ? el('span', { class:'chip done', text:'Herbestelling' }) : null,
      el('div', { class:'rowmain' }, [
        el('div', { class:'rowtitle', text: itemTitle(it) }),
        el('div', { class:'rowsub', text: c.line + (q.stageKey ? ' · ' + stageLabel(q.stageKey) : '') + ' · gesteld ' + fmtDateTime(q.askedAt) })
      ]),
      el('div', { class:'vd-actions' }, [
        openProjectBtn(it.projectId),
        el('button', { type:'button', class:'btn small', text:'Beantwoord', onclick:openAnswer })
      ].concat(itemControls(it), extras||[]))
    ]);
    row = el('div', null, inner);
    var kb = kbBase(it); kb.answer = openAnswer;
    kbRegister(inner, kb);
    if(feedRows) feedRows.push({ alive:function(){ return !!row.parentNode; }, open:openAnswer });
    return row;
  }
  function rowFase(it, extras){
    var c = ctx(it.projectId);
    var age = it.since ? daysSince(it.since) : null;
    var ageTxt = '';
    if(age!=null) ageTxt = ' · ligt ' + (age===0 ? 'sinds vandaag' : age + (age===1 ? ' dag' : ' dagen')) + ' bij de klant';
    var row = el('div', { class:'rowitem' }, [
      el('span', { class:'chip awaiting', text:'Wacht op akkoord' }),
      el('div', { class:'rowmain' }, [
        el('div', { class:'rowtitle', text: stageLabel(it.stage.stageKey) }),
        el('div', { class:'rowsub', text: c.line + ageTxt })
      ]),
      el('div', { class:'vd-actions' }, [ openProjectBtn(it.projectId) ].concat(itemControls(it), extras||[]))
    ]);
    kbRegister(row, kbBase(it));
    return row;
  }
  function rowFactuur(it, extras){
    var inv = it.inv;
    var c = ctx(it.projectId);
    var age = it.age;
    var chip = el('span', { class:'chip' + (age>=30 ? ' crit' : (age>=15 ? ' awaiting' : '')), text: age + (age===1 ? ' dag open' : ' dgn open') });
    var paidBtn = el('button', { type:'button', class:'btn small', text:'Markeer betaald' });
    paidBtn.addEventListener('click', function(){
      paidBtn.disabled = true;
      DS.markInvoicePaid(inv.id).then(refresh).catch(function(ex){ paidBtn.disabled = false; showError(ex); });
    });
    var actions = [ openProjectBtn(it.projectId) ];
    if(c.p && c.c){
      actions.push(el('button', { type:'button', class:'btn ghost small', text:'Stuur herinnering', onclick:function(){
        openReminderModal(inv, c.p, c.c);
      } }));
    }
    actions.push(paidBtn);
    var row = el('div', { class:'rowitem' }, [
      chip,
      el('div', { class:'rowmain' }, [
        el('div', { class:'rowtitle', text: itemTitle(it) }),
        el('div', { class:'rowsub', text: c.line + ' · ' + fmtMoneyCur(inv.amountCents, inv.currency) })
      ]),
      el('div', { class:'vd-actions' }, actions.concat(itemControls(it), extras||[]))
    ]);
    kbRegister(row, kbBase(it));
    return row;
  }
  function rowEta(it, extras){
    var node = vandaagEtaRow(it, ctx, itemControls(it).concat(extras||[]));
    var kb = kbBase(it);
    kb.milestone = function(){
      var c = ctx(it.projectId);
      openMilestonePop(it.shipment, { key:'geleverd', label: window.CP_SHIPPING.milestoneLabel(it.shipment.type, 'geleverd') }, c.p, c.c);
    };
    kbRegister(node, kb);
    return node;
  }
  function rowStil(it, extras){
    var node = vandaagSilentRow(it, ctx, itemControls(it).concat(extras||[]));
    var SHIP = window.CP_SHIPPING;
    var tpl = SHIP.milestonesFor(it.shipment.type);
    var done = {};
    it.events.forEach(function(ev){ done[ev.milestoneKey] = true; });
    var next = null;
    for(var i=0;i<tpl.length;i++){ if(!done[tpl[i].key]){ next = tpl[i]; break; } }
    var kb = kbBase(it);
    if(next) kb.milestone = function(){
      var c = ctx(it.projectId);
      openMilestonePop(it.shipment, next, c.p, c.c);
    };
    kbRegister(node, kb);
    return node;
  }
  function rowSample(it, extras){
    var sm = it.sm;
    var c = ctx(it.projectId);
    var age = daysSince(sm.roundDate);
    var row = el('div', { class:'rowitem' }, [
      el('span', { class:'chip current', text:'Wacht op beslissing' }),
      el('div', { class:'rowmain' }, [
        el('div', { class:'rowtitle', text: 'Sample ' + sm.roundLabel + (sm.note ? ' — ' + sm.note : '') }),
        el('div', { class:'rowsub', text: c.line + ' · ronde van ' + fmtDate(sm.roundDate) + (age!=null && age>0 ? ' (' + age + (age===1?' dag':' dagen') + ' geleden)' : '') })
      ]),
      el('div', { class:'vd-actions' }, [ openProjectBtn(it.projectId) ].concat(itemControls(it), extras||[]))
    ]);
    kbRegister(row, kbBase(it));
    return row;
  }
  function buildRow(it, extras){
    if(it.type==='vraag') return rowVraag(it, null, extras);
    if(it.type==='fase') return rowFase(it, extras);
    if(it.type==='factuur') return rowFactuur(it, extras);
    if(it.type==='eta') return rowEta(it, extras);
    if(it.type==='stil') return rowStil(it, extras);
    if(it.type==='sample') return rowSample(it, extras);
    return el('div', { class:'rowitem' }, el('div', { class:'rowmain' }, el('div', { class:'rowtitle', text:itemTitle(it) })));

    var row = el('div', { class:'rowitem' }, (chips||[]).concat([

  /* --- geld: factuur-ouderdomstrap met herinneringsknop (functie 9) ---

      var row = el('div', { class:'rowitem' }, chips.concat([
        el('div', { class:'rowmain' }, [

            + (st2 ? ('0'+st2.position).slice(-2) + ' — ' : '') + stageLabel(inv.stageKey) }),
          el('div', { class:'rowsub', text: c.line + ' · ' + (inv.invoiceNumber || inv.label)
            + (inv.amountCents > 0 ? ' · ' + fmtMoneyCur(inv.amountCents, inv.currency) : '') })
        ]),
        el('div', { class:'vd-actions' }, [
          openProjectBtn(inv.projectId),

    elders.forEach(function(it){
      eldersInner.appendChild(rowGeneric(it, [

      ], [ openProjectBtn(it.projectId) ].concat(itemControls(it))));

      return String(a._st.snoozedUntil).localeCompare(String(b._st.snoozedUntil));
    }).forEach(function(it){

      wisBtn.addEventListener('click', function(){
        saveItemState(it.key, { snoozedUntil:null, snoozeReason:null }).then(refresh).catch(showError);
      });
      var chips = [ el('span', { class:'chip', text:'Terug ' + fmtDate(it._st.snoozedUntil) }) ];
      var row = rowGeneric(it, chips, [ openProjectBtn(it.projectId), wisBtn ]);
      if(it._st.snoozeReason){
        var sub = row.querySelector('.rowsub');
        if(sub) sub.textContent = sub.textContent + ' · ' + it._st.snoozeReason;

  /* ---------- dagafsluiting (functie 13) ---------- */
  function openDayCloseModal(){
    var doneLog = (d.logRows||[]).filter(function(r){
      return r.actor!=='client' && String(r.createdAt).slice(0,10)===today;
    }).sort(function(a,b){ return String(b.createdAt).localeCompare(String(a.createdAt)); });
    var answeredToday = (d.questions||[]).filter(function(q){
      return q.answeredAt && String(q.answeredAt).slice(0,10)===today;
    });
    var openLeft = terug.concat(rest);
    var m = openModal('Dag afsluiten', 'Wat is gedaan, wat gaat door naar morgen', { wide:true });

    m.body.appendChild(el('span', { class:'flabel', text:'Vandaag afgehandeld (uit het logboek)' }));
    var doneWrap = el('div', { style:'margin-bottom:16px;max-height:200px;overflow-y:auto;' });
    if(!doneLog.length && !answeredToday.length){
      doneWrap.appendChild(el('p', { class:'empty', style:'padding:12px 0;text-align:left;', text:'Nog geen geregistreerde acties vandaag.' }));
    }
    answeredToday.forEach(function(q){
      doneWrap.appendChild(el('div', { class:'statusline' }, [
        el('span', { style:'font-size:13px;', text:'Vraag beantwoord: ' + q.question }),
        el('span', { class:'rowmeta', text: fmtDateTime(q.answeredAt) })
      ]));
    });
    doneLog.slice(0, 15).forEach(function(r){
      doneWrap.appendChild(el('div', { class:'statusline' }, [
        el('span', { style:'font-size:13px;', text: r.detail || r.action }),
        el('span', { class:'rowmeta', text: fmtDateTime(r.createdAt) })
      ]));
    });
    if(doneLog.length > 15) doneWrap.appendChild(el('p', { class:'kicker', style:'margin-top:6px;', text:'+ ' + (doneLog.length-15) + ' meer regels in het logboek' }));
    m.body.appendChild(doneWrap);

    var snoozeChk = el('input', { type:'checkbox', checked: openLeft.length>0 });
    if(openLeft.length){
      m.body.appendChild(el('label', { class:'checkline' }, [
        snoozeChk,
        el('span', { text:'Snooze de ' + openLeft.length + ' open ' + (openLeft.length===1?'punt':'punten') + ' naar morgen — de morgenlijst staat dan klaar' })
      ]));
    } else {
      m.body.appendChild(el('p', { style:'font-size:14px;color:var(--green);margin-bottom:14px;', text:'Alles is leeggewerkt — niets om door te schuiven.' }));
    }

    var pinChecks = [];
    if(pinned.length){
      m.body.appendChild(el('span', { class:'flabel', text:'Pins — mee naar morgen?' }));
      pinned.forEach(function(it){
        var cb = el('input', { type:'checkbox', checked:true });
        pinChecks.push({ cb:cb, it:it });
        m.body.appendChild(el('label', { class:'checkline' }, [ cb, el('span', { text: itemTitle(it) }) ]));
      });
    }

    var err = el('p', { class:'formerr' });
    m.body.appendChild(err);
    var confirmBtn = el('button', { type:'button', class:'btn', text:'Sluit de dag af' });
    confirmBtn.addEventListener('click', function(){
      confirmBtn.disabled = true;
      var tomorrow = addDaysISO(today, 1);
      var patch = {};
      if(snoozeChk.checked){
        openLeft.forEach(function(it){
          patch[it.key] = { snoozedUntil: tomorrow, snoozeReason:'Dagafsluiting', pinned:false, pinnedAt:null };
        });
      }
      pinChecks.forEach(function(pc){
        if(!pc.cb.checked) patch[pc.it.key] = { pinned:false, pinnedAt:null };
      });
      var p = Object.keys(patch).length ? saveItemStates(patch) : Promise.resolve();
      p.then(function(){ closeModal(); refresh(); })
        .catch(function(ex){ confirmBtn.disabled = false; err.textContent = ex.message||String(ex); err.classList.add('show'); });
    });
    m.body.appendChild(el('div', { class:'modal-actions' }, [
      el('button', { type:'button', class:'btn ghost', text:'Annuleren', onclick:closeModal }),
      confirmBtn
    ]));
  }

  /* ---------- deze-week-planbord (functie 8): pure projectie ---------- */
  function buildWeekBoard(){
    var ws = weekMondayISO();
    var days = [];
    for(var i=0;i<7;i++) days.push(addDaysISO(ws, i));
    var byDay = {};
    days.forEach(function(iso){ byDay[iso] = []; });
    function pushEntry(iso, kind, label, onGo, crit){
      if(!iso) return;
      iso = String(iso).slice(0,10);
      if(byDay[iso]) byDay[iso].push({ kind:kind, label:label, go:onGo, crit:!!crit });
    }
    /* ETA-vensters van actieve zendingen */
    var deliveredEv = {};
    (d.events||[]).forEach(function(ev){ if(ev.milestoneKey==='geleverd') deliveredEv[ev.shipmentId] = true; });
    (d.shipments||[]).forEach(function(s){
      if(s.deliveredAt || deliveredEv[s.id]) return;
      var p = pmap[s.projectId];
      if(p && p.status==='archived') return;
      pushEntry(s.etaWindowEnd, 'ETA-venster eindigt', shipmentTitle(s) + ' · ' + ctx(s.projectId).line,
        function(){ goProject(s.projectId); }, String(s.etaWindowEnd).slice(0,10) < today);
    });
    /* antwoordklok-deadlines van open vragen */
    sig.vragen.forEach(function(it){
      var dl = answerDeadline(it.q.askedAt);
      if(dl) pushEntry(sdToIso(dl), 'Antwoordklok', itemTitle(it),
        function(){ vandaagTab = 'dag'; refresh(); }, it.q._klok && it.q._klok.state==='rood');
    });
    /* factuurvervaldata — projectie: aanmaak + 30 dagen (de 30+-grens) */
    sig.geld.forEach(function(it){
      pushEntry(invoiceDueISO(it.inv), 'Factuur wordt 30+', itemTitle(it) + ' · ' + ctx(it.projectId).line,
        function(){ goProject(it.projectId); }, it.age >= 30);
    });
    /* snooze-terugkeerdata */
    Object.keys(states).forEach(function(key){
      var st = states[key];
      if(!st || !st.snoozedUntil) return;
      var it = null;
      for(var j=0;j<sig.items.length;j++){ if(sig.items[j].key===key){ it = sig.items[j]; break; } }
      pushEntry(st.snoozedUntil, 'Terug uit uitstel', (it ? itemTitle(it) : key) + (st.snoozeReason ? ' · ' + st.snoozeReason : ''),
        function(){ vandaagTab = 'dag'; refresh(); });
    });
    /* follow-up-herinneringen (27) */
    (d.moments||[]).forEach(function(mnt){
      if(!mnt.remindAt || mnt.remindDone) return;
      var c2 = cmap[mnt.clientId];
      pushEntry(mnt.remindAt, 'Herinnering', (mnt.note || 'Contactmoment') + (c2 ? ' · ' + c2.company : ''),
        function(){ go({ name:'client', clientId:mnt.clientId }); });
    });

    var grid = el('div', { class:'weekgrid' });
    days.forEach(function(iso, i){
      var col = el('div', { class:'weekday' + (iso===today ? ' today' : '') });
      var dObj = asDate(iso);
      col.appendChild(el('div', { class:'wd-head', text: WEEKDAY_LABELS[i].slice(0,2) + ' ' + (dObj ? dObj.getDate() + '/' + (dObj.getMonth()+1) : '') + (iso===today ? ' · vandaag' : '') }));
      var entries = byDay[iso];
      if(!entries.length){
        col.appendChild(el('p', { style:'font-size:12px;color:var(--gray-9);', text:'—' }));
      }
      entries.forEach(function(en){
        col.appendChild(el('button', { type:'button', class:'weekitem' + (en.crit ? ' crit' : ''), onclick:en.go }, [
          el('span', { class:'wi-kind', text:en.kind }),
          document.createTextNode(en.label)
        ]));
      });
      grid.appendChild(col);
    });
    content.appendChild(el('div', { class:'section' }, grid));
    content.appendChild(el('p', { style:'font-size:12.5px;color:var(--gray-69);', text:
      'Pure projectie van bestaande datums: ETA-vensters, antwoordklokken, de 30-dagengrens van open facturen, snooze-terugkeerdata en follow-up-herinneringen. Klik op een item om ernaartoe te springen.' }));
  }
}
/* generieke chase-tekst (functie 6) voor niet-zending-items */
function openGenericChase(it, c){
  var lines = [];
  lines.push('Hi, could you give us an update on the item below?');
  lines.push('');
  if(c && c.p) lines.push('Project: ' + c.p.name + (c.p.code ? ' (' + c.p.code + ')' : ''));
  lines.push('Item: ' + (it.type==='vraag' ? it.q.question
    : it.type==='factuur' ? it.inv.label
    : it.type==='fase' ? stageLabel(it.stage.stageKey)
    : it.type==='sample' ? 'Sample ' + it.sm.roundLabel
    : it.key));
  if(it._st && it._st.ownerSince) lines.push('Waiting since: ' + it._st.ownerSince);
  lines.push('');
  lines.push('What is the current status and the expected next step? Thank you.');
  lines.push('');
  lines.push('Best regards,');
  lines.push(bedrijfProfiel().afzender); /* functie 64: afzenderblok uit Instellingen */

/* stille-zending-detector (10): 'Loopt dit nog?' met chase-tekst en de
   eerstvolgende mijlpaal als afvinkknop (4) */
function vandaagSilentRow(item, ctx, extras){
  var s = item.shipment;
  var c = ctx(s.projectId);
  var SHIP = window.CP_SHIPPING;
  var tpl = SHIP.milestonesFor(s.type);
  var done = {};
  item.events.forEach(function(ev){ done[ev.milestoneKey] = true; });
  var next = null;
  for(var i=0;i<tpl.length;i++){ if(!done[tpl[i].key]){ next = tpl[i]; break; } }
  var actions = [
    el('button', { type:'button', class:'btn ghost small', text:'Chase-tekst', onclick:function(){ openChaseModal(s, item.events, c); } })
  ];
  if(next){
    actions.push(el('button', { type:'button', class:'btn small', text:'Vink af: ' + next.label, onclick:function(){
      openMilestonePop(s, next, c.p, c.c);
    } }));
  }
  return el('div', { class:'rowitem' }, [
    el('span', { class:'chip klok-oranje', text:'Loopt dit nog?' }),
    el('div', { class:'rowmain' }, [
      el('div', { class:'rowtitle', text: shipmentTitle(s) }),
      el('div', { class:'rowsub', text: c.line + ' · ' + item.stilDays + ' dagen geen beweging' })
    ]),
    el('div', { class:'vd-actions' }, actions.concat(extras||[]))
  ]);
}

/* chase-tekst (10): kopieerbaar, met alle zendinggegevens. NL om zelf te
   lezen, plus een Engelse versie voor fabriek of vervoerder. */
function openChaseModal(shipment, events, c){
  var SHIP = window.CP_SHIPPING;
  var evs = (events||[]).slice().sort(function(a,b){ return String(a.occurredAt).localeCompare(String(b.occurredAt)); });
  var last = evs.length ? evs[evs.length-1] : null;
  var nr = shipment.containerNumber || shipment.trackingNumber || '';
  var carrier = SHIP.CARRIERS[shipment.carrierCode] || null;
  var EN_TYPES = { koerier:'Courier', zeevracht:'Sea freight', luchtvracht:'Air freight' };

  var nl = [];
  nl.push('Hoi, kunnen jullie een update geven over deze zending?');
  nl.push('');
  nl.push('Zending: ' + SHIP.typeLabel(shipment.type) + (carrier ? ' via ' + carrier.name : ''));
  if(nr) nl.push('Nummer: ' + nr);
  if(shipment.blNumber) nl.push('B/L: ' + shipment.blNumber);
  if(last) nl.push('Laatste mijlpaal: ' + SHIP.milestoneLabel(shipment.type, last.milestoneKey) + ' op ' + fmtDate(last.occurredAt) + (last.location ? ' (' + last.location + ')' : ''));
  if(shipment.etaWindowStart && shipment.etaWindowEnd) nl.push('ETA-venster: ' + fmtDate(shipment.etaWindowStart) + ' – ' + fmtDate(shipment.etaWindowEnd));
  if(c && c.p) nl.push('Project: ' + c.p.name + (c.p.code ? ' (' + c.p.code + ')' : ''));
  nl.push('');
  nl.push(last
    ? 'Sindsdien zien wij geen nieuwe beweging. Wat is de huidige status en de verwachte volgende stap?'
    : 'Wij zien nog geen enkele mijlpaal op deze zending. Wat is de huidige status en de verwachte volgende stap?');
  nl.push('');
  nl.push('Groet,');
  nl.push(bedrijfProfiel().afzender); /* functie 64: afzenderblok uit Instellingen */

  var en = [];
  en.push('Hi, could you give us a status update on this shipment?');
  en.push('');
  en.push('Shipment: ' + (EN_TYPES[shipment.type] || shipment.type) + (carrier ? ' via ' + carrier.name : ''));
  if(nr) en.push('Number: ' + nr);
  if(shipment.blNumber) en.push('B/L: ' + shipment.blNumber);
  if(last) en.push('Last movement on our side: ' + String(last.occurredAt) + (last.location ? ' (' + last.location + ')' : ''));
  if(shipment.etaWindowStart && shipment.etaWindowEnd) en.push('Expected arrival window: ' + shipment.etaWindowStart + ' to ' + shipment.etaWindowEnd);
  en.push('');
  en.push(last
    ? 'We have not seen any new movement since then. Could you confirm the current status and the next step? Thank you.'
    : 'We have not seen any milestone on this shipment yet. Could you confirm the current status and the next step? Thank you.');
  en.push('');
  en.push('Best regards,');
  en.push(bedrijfProfiel().afzender); /* functie 64: afzenderblok uit Instellingen */

  var m = openModal('Chase-tekst', 'Kopieer en plak in je mail of chat');
  m.body.appendChild(copyBlock('Nederlands', nl.join('\n')));
  m.body.appendChild(copyBlock('Engels — voor fabriek of vervoerder', en.join('\n')));
  m.body.appendChild(el('div', { class:'modal-actions' },
    el('button', { type:'button', class:'btn ghost', text:'Sluiten', onclick:closeModal })));
}
function copyBlock(labelText, text){
  var ta = el('textarea', { class:'input', readonly:'readonly', 'aria-label':labelText });
  ta.value = text;
  var btn = el('button', { type:'button', class:'btn ghost small', text:'Kopieer' });
  btn.addEventListener('click', function(){ ta.select(); copyToClipboard(text, btn); });

    el('span', { class:'flabel', text:labelText }),
    ta,
    el('div', { style:'margin-top:8px;display:flex;justify-content:flex-end;' }, btn)
  ]);
}

/* ============================================================
   golf 8 — automatische factuurmaker
   buildInvoiceDoc rendert een printklare factuur in de huisstijl:
   bedrijfsprofiel + KvK/btw + betaalvoorwaarden uit Instellingen,
   klantgegevens, nummer uit de jaarteller, omschrijving met fase en
   project, en de btw-behandeling van het factuurrecord (bij 21% mét
   btw-regel en totaal). printInvoiceDoc toont hem via een verborgen
   printcontainer + window.print — 'Bewaar als PDF' in het printvenster.
   Bij het genereren ontstaat eenmalig een documentrecord (docType
   'invoice') dat via invoice.documentId aan de factuur hangt, zodat de
   klant de factuur in zijn documenten en op het betaalpad ziet. Er is
   GEEN serverside PDF-generatie: live upload je de zelf bewaarde PDF in
   dat record; in demomodus toont de portal zijn demo-sheet. En:
   autoConceptInvoice zet (instelbaar, standaard aan) automatisch een
   CONCEPTfactuur klaar zodra een betaalfase op 'wacht op akkoord' gaat —
   publiceren en mailen blijft altijd een handmatige keuze.
   ============================================================ */
function invoiceDueOf(inv){
  return (typeof inv.totalCents==='number' && inv.totalCents) ? inv.totalCents : (inv.amountCents||0) + (inv.vatCents||0);
}
function buildInvoiceDoc(invoice, project, client){
  var prof = bedrijfProfiel();
  var voorwaarden = (adminSettings && typeof adminSettings.betaalvoorwaarden==='string')
    ? adminSettings.betaalvoorwaarden : 'Betaling binnen 14 dagen.';
  var cur = invoice.currency || 'EUR';
  var vatMode = invoice.vatMode || 'verlegd';
  var vat = invoice.vatCents || 0;
  var total = invoiceDueOf(invoice);
  var vanLines = [prof.adres, prof.kvk ? 'KvK ' + prof.kvk : null, prof.btw ? 'Btw ' + prof.btw : null, prof.replyTo || null].filter(Boolean);
  var aanLines = client ? [client.contactName || null, client.email || null].filter(Boolean) : [];
  var faseLine = stageLabel(invoice.stageKey)
    + (project ? ' — ' + project.name + (project.code ? ' (' + project.code + ')' : '') : '');

  var head = el('div', { class:'inv-head' }, [
    el('div', null, [
      el('div', { class:'inv-mark' }, [ 'CUSTOM', el('em', { text:'+' }) ]),
      (prof.naam && prof.naam!=='CUSTOM+') ? el('div', { class:'kicker', style:'margin-top:3px;', text:prof.naam }) : null
    ]),
    el('div', { class:'inv-doctype' }, [
      document.createTextNode('Factuur'),
      el('small', { text: invoice.invoiceNumber || '' })
    ])
  ]);
  var parties = el('div', { class:'inv-parties' }, [
    el('div', { class:'inv-party' }, [
      el('span', { class:'kicker', text:'Van' }),
      el('strong', { text: prof.naam })
    ].concat(vanLines.map(function(l){ return el('div', { text:l }); }))),
    el('div', { class:'inv-party' }, [
      el('span', { class:'kicker', text:'Aan' }),
      el('strong', { text: client ? client.company : '—' })
    ].concat(aanLines.map(function(l){ return el('div', { text:l }); })))
  ]);
  var meta = el('div', { class:'inv-meta' }, [
    el('div', null, [ el('span', { class:'kicker', text:'Factuurnummer' }), el('span', { class:'mono', text: invoice.invoiceNumber || '—' }) ]),
    el('div', null, [ el('span', { class:'kicker', text:'Factuurdatum' }), el('span', { text: fmtDate(invoice.createdAt) || fmtDate(todayISO()) }) ]),
    el('div', null, [ el('span', { class:'kicker', text:'Project' }), el('span', { text: project ? (project.code || project.name) : '—' }) ])
  ]);
  var table = el('table', null, [
    el('thead', null, el('tr', null, [
      el('th', { text:'Omschrijving' }),
      el('th', { class:'num', text:'Bedrag' })
    ])),
    el('tbody', null, el('tr', null, [
      el('td', null, [ document.createTextNode(invoice.label || ''), el('small', { text: faseLine }) ]),
      el('td', { class:'num', text: fmtMoneyCur(invoice.amountCents||0, cur) })
    ]))
  ]);
  /* bij 21% de btw-regel en het totaal; verlegd/0% houdt één te-betalen-regel
     en legt de behandeling uit in de voettekst — geen verzonnen btw */
  var totRows = [];
  if(vatMode==='21'){
    totRows.push(el('div', { class:'trow' }, [ el('span', { text:'Subtotaal (excl. btw)' }), el('span', { class:'num', text: fmtMoneyCur(invoice.amountCents||0, cur) }) ]));
    totRows.push(el('div', { class:'trow' }, [ el('span', { text:'Btw 21%' }), el('span', { class:'num', text: fmtMoneyCur(vat, cur) }) ]));
  }
  totRows.push(el('div', { class:'trow grand' }, [ el('span', { text:'Te betalen' }), el('span', { class:'num', text: fmtMoneyCur(total, cur) }) ]));
  var footLines = [];
  if(voorwaarden) footLines.push(voorwaarden);
  if(vatMode==='verlegd') footLines.push('Btw verlegd naar de afnemer.');
  else if(vatMode==='0') footLines.push('Btw 0% (export).');
  if(invoice.invoiceNumber) footLines.push('Vermeld bij betaling het factuurnummer ' + invoice.invoiceNumber + '.');
  var profLine = [prof.naam, prof.kvk ? 'KvK ' + prof.kvk : null, prof.btw ? 'Btw ' + prof.btw : null].filter(Boolean).join(' · ');
  return el('div', { class:'invdoc' }, [
    head, parties, meta, table,
    el('div', { class:'inv-totals' }, totRows),
    el('div', { class:'inv-foot' }, footLines.map(function(l){ return el('p', { text:l }); }).concat([ el('p', { text: profLine }) ]))
  ]);
}
var invoicePrintHost = null;
function printInvoiceDoc(invoice, project, client){
  if(!invoicePrintHost || !invoicePrintHost.parentNode){
    invoicePrintHost = el('div', { id:'invoiceprint' });
    document.body.appendChild(invoicePrintHost);
  }
  clearNode(invoicePrintHost);
  invoicePrintHost.appendChild(buildInvoiceDoc(invoice, project, client));
  document.body.classList.add('print-invoice');
  function done(){
    document.body.classList.remove('print-invoice');
    window.removeEventListener('afterprint', done);
  }
  window.addEventListener('afterprint', done);
  window.print();
  setTimeout(done, 1500); /* vangnet: niet elke browser vuurt afterprint */
}
/* koppeling (golf 8): eenmalig een documentrecord bij de factuur — de klant
   ziet hem daardoor in zijn documenten én als chip op het betaalpad. Het
   record volgt de conceptstand van de factuur, zodat een concept nooit via
   de documentenlijst lekt. */
function ensureInvoiceDocument(invoice, project){
  if(invoice.documentId) return Promise.resolve(invoice.documentId);
  return DS.addDocument(project.id, {
    stageKey: invoice.stageKey, docType:'invoice',
    title:'Factuur ' + (invoice.invoiceNumber || invoice.label || ''),
    version: 1,
    publishStatus: isConcept(invoice) ? 'concept' : 'published'
  }).then(function(d){
    if(!d || !d.id) return null;
    var chain = DS.linkInvoiceDocument(invoice.id, d.id).then(function(){ invoice.documentId = d.id; });
    /* een open factuurslot (functie 52) meteen vullen — zelfde regel als de
       gewone documentupload */
    if(DS.fillDocSlot && DS.listDocSlots){
      chain = chain.then(function(){
        return DS.listDocSlots(project.id).then(function(slots){
          var slot = (slots||[]).find(function(sl){ return !sl.documentId && sl.docType==='invoice'; });
          if(slot) return DS.fillDocSlot(slot.id, d.id);
        }, function(){});
      });
    }
    return chain.then(function(){ return d.id; });
  });
}
/* het factuurdocument-venster: voorvertoning, print/PDF en (live) de

    var koppelNote = el('p', { style:'font-size:13px;color:var(--gray-69);max-width:64ch;margin-bottom:12px;' });
    function syncKoppelNote(){
      if(!invoice.documentId){
        koppelNote.textContent = 'Bij printen ontstaat automatisch een documentrecord “Factuur ' + (invoice.invoiceNumber || '…')
          + '” in dit project, gekoppeld aan de factuur — de klant ziet hem dan in zijn documenten en op het betaalpad'
          + (concept ? ' (pas ná publiceren)' : '') + '.';
      } else if(IS_DEMO){
        koppelNote.textContent = 'Documentrecord gekoppeld. Bewaar de PDF zelf (Print → Bewaar als PDF) en upload hem hieronder — hij wordt dan in deze browser bewaard en de klant kan hem in het portaal echt downloaden.';
      } else {
        koppelNote.textContent = 'Documentrecord gekoppeld. Er is nog geen serverside PDF-generatie: bewaar de PDF zelf (Print → Bewaar als PDF) en upload hem hieronder, dan kan de klant hem echt downloaden.';
      }
    }
    syncKoppelNote();
    m.body.appendChild(koppelNote);
    var err = el('p', { class:'formerr' });
    if(DS.attachDocumentFile){
      /* golf uploads: ook demomodus — de PDF gaat dan als blob naar de
         browseropslag (IndexedDB) en het portaal downloadt hem echt */
      var upFile = el('input', { class:'input', type:'file', accept:'application/pdf', style:'max-width:320px;', 'aria-label':'Factuur-PDF' });

        upBtn.disabled = true;

    }

          detail:'Factuurdocument gegenereerd: ' + (invoice.invoiceNumber || invoice.label) });
      }).then(function(){
        printBtn.disabled = false;
        syncKoppelNote();

    m.body.appendChild(el('div', { class:'modal-actions' }, [
