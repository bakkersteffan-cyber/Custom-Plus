}
/* publiceerflow voor een conceptfactuur: dezelfde bewuste keuze als bij
   media/documenten — publiceer stil of publiceer + klantmail; het
   gekoppelde documentrecord flipt mee zodat betaalpad en documenten
   hetzelfde vertellen. Nooit automatisch. */
function openInvoicePublishModal(invoice, project, client){
  if(!(invoice.amountCents > 0)){
    var m0 = openModal('Eerst het bedrag invullen', 'Een factuur van € 0,00 publiceer je niet');
    m0.body.appendChild(el('p', { style:'font-size:14px;color:var(--gray-69);', text:
      'Deze conceptfactuur is automatisch aangemaakt toen de projectwaarde nog onbekend was. Vul eerst het bedrag in via Bewerk, daarna kun je publiceren.' }));
    m0.body.appendChild(el('div', { class:'modal-actions' }, [
      el('button', { type:'button', class:'btn ghost', text:'Sluiten', onclick:closeModal }),
      el('button', { type:'button', class:'btn', text:'Bewerk factuur', onclick:function(){
        openInvoiceModal(project.id, null, invoice);
      } })
    ]));
    return;
  }
  var due = invoiceDueOf(invoice);
  var m = openModal('Factuur publiceren', project.name + ' — de klant ziet de factuur daarna op zijn betaalpad');
  m.body.appendChild(el('div', { class:'card rowlist', style:'margin-bottom:16px;' },
    el('div', { class:'rowitem' }, [
      el('span', { class:'chip', text:'Concept' }),
      el('div', { class:'rowmain' }, [
        el('div', { class:'rowtitle', text:(invoice.invoiceNumber ? invoice.invoiceNumber + ' · ' : '') + invoice.label }),
        el('div', { class:'rowsub', text: stageLabel(invoice.stageKey) + ' · ' + fmtMoneyCur(due, invoice.currency)
          + (invoice.documentId ? ' · documentrecord gekoppeld' : ' · nog geen factuurdocument (kan ook later)') })
      ])
    ])));
  var mailOpts = (client && client.email) ? {
    client: client, projectName: project.name, projectCode: project.code,
    page:'kosten', portalLabel:'Bekijk de factuur', category:'factuur',
    subject:'Er staat een factuur voor je klaar — ' + project.name,
    bodyLine:'Factuur ' + (invoice.invoiceNumber || invoice.label) + ' (' + fmtMoneyCur(due, invoice.currency) + ') staat voor je klaar op het betaalpad.'
  } : null;
  if(mailOpts) m.body.appendChild(mailPreviewBlock(mailOpts));
  else m.body.appendChild(el('p', { style:'font-size:13px;color:var(--gray-69);', text:'Geen klantmailadres bekend — publiceren kan alleen stil.' }));
  var err = el('p', { class:'formerr' });
  m.body.appendChild(err);
  var silentBtn = el('button', { type:'button', class:'btn ghost', text:'Publiceer stil' });
  var sendBtn = el('button', { type:'button', class:'btn', text:'Publiceer + mail', disabled: !mailOpts });
  function run(withMail){
    err.classList.remove('show');
    silentBtn.disabled = true; sendBtn.disabled = true;
    DS.publishInvoice(invoice.id).then(function(){
      return invoice.documentId ? DS.publishDocument(invoice.documentId) : null;
    }).then(function(){
      return auditLog({ kind:'publicatie', clientId: project.clientId || null, projectId: project.id,
        detail:'Factuur gepubliceerd: ' + (invoice.invoiceNumber || invoice.label) });
    }).then(function(){
      return (withMail && mailOpts) ? notifyClient(mailOpts) : null;
    }).then(function(){
      closeModal();
      updateBadge();
      refresh();
    }).catch(function(ex){
      silentBtn.disabled = false; sendBtn.disabled = !mailOpts;
      err.textContent = ex.message||String(ex); err.classList.add('show');
    });
  }
  silentBtn.addEventListener('click', function(){ run(false); });
  sendBtn.addEventListener('click', function(){ run(true); });
  m.body.appendChild(el('div', { class:'modal-actions' }, [
    el('button', { type:'button', class:'btn ghost', text:'Annuleren', onclick:closeModal }),
    silentBtn, sendBtn
  ]));
}
/* de automaat (golf 8): betaalfase → 'wacht op akkoord' zet — als het
   vinkje aan staat en er nog géén factuur voor die fase bestaat — een
   conceptfactuur klaar. Bedrag = projectwaarde × fasepercentage; zonder
   projectwaarde blijft het bedrag leeg (badge 'bedrag invullen'). Het
   nummer komt uit de jaarteller. Een fout hier mag de fasewissel zelf
   nooit blokkeren. */
/* FIXRONDE R0-1: dubbel-guard tegen twee gelijktijdige automaat-ketens voor
   dezelfde fase. De invs.some-controle hieronder leest anders een verouderde
   lijst zolang de eerste keten nog loopt (twee snelle fasewissels achter
   elkaar) en maakt dan een tweede conceptfactuur voor dezelfde fase. */
var autoConceptInFlight = {};
function autoConceptInvoice(projectId, stageKey){
  var flightKey = projectId + '|' + stageKey;
  if(autoConceptInFlight[flightKey]) return Promise.resolve(null);
  autoConceptInFlight[flightKey] = true;
  return DS.getSettings().then(function(st){
    adminSettings = st;
    if(st.autoConceptFactuur===false) return null;
    return Promise.all([ DS.getProject(projectId), DS.listInvoices(projectId) ]).then(function(res){
      var p = res[0], invs = res[1] || [];
      if(!p) return null;
      var s = (p.stages||[]).find(function(x){ return x.stageKey===stageKey; });
      if(!s || !(s.paymentPct > 0)) return null;
      if(invs.some(function(i2){ return i2.stageKey===stageKey; })) return null;
      var hasValue = typeof p.valueCents==='number' && p.valueCents > 0;
      var cents = hasValue ? Math.round(p.valueCents * s.paymentPct / 100) : 0;
      var vatMode = (st.factuurStandaard && st.factuurStandaard.btwMode) || 'verlegd';
      var cur = p.valueCurrency || (st.factuurStandaard && st.factuurStandaard.valuta) || 'EUR';
      var vat = vatCentsFor(cents, vatMode);
      /* FIXRONDE R0-1/R1-1: het nummer komt uit de atomaire uitgifte; deze
         functie raakt de teller zelf niet meer aan (en slikt dus ook geen
         mislukte tellersave meer stil in) */
      return claimInvoiceNumber().then(function(claim){
        return DS.addInvoice(projectId, {
          label:'Fase ' + s.position + ' — ' + stageLabel(stageKey) + ', ' + s.paymentPct + '%',
          amountCents: cents, stageKey: stageKey, invoiceNumber: claim.text,
          currency: cur, vatMode: vatMode, vatCents: vat, totalCents: cents + vat,
          publishStatus:'concept'
        }).then(function(inv){
          return auditLog({ kind:'factuur', clientId: p.clientId || null, projectId: projectId,
            detail:'Conceptfactuur automatisch klaargezet: ' + claim.text + ' — ' + stageLabel(stageKey)
              + (hasValue ? '' : ' (bedrag nog invullen)') }).then(function(){
            updateBadge();
            return inv;
          });
        });
      });
    });
  }).then(function(inv){
    delete autoConceptInFlight[flightKey];
    return inv;
  }, function(){
    delete autoConceptInFlight[flightKey];
    return null;
  });
}

/* publiceer-flow (functies 42/44/61): selectie van concepten → één
   gebundelde klantmail ('Publiceer + mail') of stille publicatie */
function conceptTitle(item){
  if(item.kind==='media') return item.row.caption || 'Foto';
  return item.row.title || 'Document';
}
function conceptAgeDays(item){
  var d = daysSince(item.row.createdAt || item.row.capturedAt);
  return d==null ? null : d;
}
function publishItems(items){
  var chain = Promise.resolve();
  items.forEach(function(it){
    chain = chain.then(function(){
      return it.kind==='media' ? DS.publishMedia(it.row.id) : DS.publishDocument(it.row.id);
    });
  });
  return chain;
}
function bundleMailOpts(project, client, items){
  var photos = items.filter(function(it){ return it.kind==='media'; }).length;
  var docsN = items.length - photos;
  var bodyLine;
  if(items.length===1 && photos===1){
    bodyLine = 'Er staat een nieuwe foto bij ' + stageLabel(items[0].row.stageKey) + ': ' + (items[0].row.caption||'');
  } else if(items.length===1){
    bodyLine = 'Er is een nieuw document geplaatst: ' + (items[0].row.title||'') + '.';
  } else {
    var parts = [];
    if(photos) parts.push(photos + (photos===1 ? ' nieuwe foto' : ' nieuwe foto’s'));
    if(docsN) parts.push(docsN + (docsN===1 ? ' nieuw document' : ' nieuwe documenten'));
    bodyLine = 'Er staat een nieuwe update voor je klaar: ' + parts.join(' en ') + '.';
  }
  return {
    client: client, projectName: project.name, projectCode: project.code,
    page: (photos ? 'updates' : 'documenten'),
    portalLabel: (photos ? 'Bekijk de update' : 'Bekijk het document'),
    category:'publicatie',
    subject: mailSubject('publicatie', { project: project.name }),
    bodyLine: bodyLine
  };
}
function openPublishModal(project, client, concepts, preChecked){
  if(!concepts.length) return;
  var m = openModal('Publiceren', project.name + ' — de klant ziet dit nu nog niet', { wide:true });
  var checks = [];
  var listWrap = el('div', { class:'card rowlist', style:'margin-bottom:16px;' });
  concepts.forEach(function(it){
    var cb = el('input', { type:'checkbox' });
    cb.checked = !preChecked || preChecked.indexOf(it.row.id) > -1;
    checks.push({ cb: cb, item: it });
    var age = conceptAgeDays(it);
    listWrap.appendChild(el('label', { class:'rowitem', style:'cursor:pointer;' }, [
      cb,
      el('span', { class:'chip', text: it.kind==='media' ? 'Foto' : 'Document' }),
      el('div', { class:'rowmain' }, [
        el('div', { class:'rowtitle', text: conceptTitle(it) }),
        el('div', { class:'rowsub', text: stageLabel(it.row.stageKey)
          + (age!=null ? ' · staat ' + (age===0 ? 'sinds vandaag' : 'al ' + age + (age===1 ? ' dag' : ' dagen')) + ' klaar' : '') })
      ])
    ]));
  });
  m.body.appendChild(listWrap);
  var previewWrap = el('div');
  m.body.appendChild(previewWrap);
  var err = el('p', { class:'formerr' });
  m.body.appendChild(err);
  function selected(){
    return checks.filter(function(c2){ return c2.cb.checked; }).map(function(c2){ return c2.item; });
  }
  var currentOpts = null;
  function syncPreview(){
    clearNode(previewWrap);
    var sel = selected();
    if(!sel.length){ currentOpts = null; return; }
    currentOpts = bundleMailOpts(project, client, sel);
    previewWrap.appendChild(mailPreviewBlock(currentOpts));
  }
  checks.forEach(function(c2){ c2.cb.addEventListener('change', syncPreview); });
  syncPreview();
  var silentBtn = el('button', { type:'button', class:'btn ghost', text:'Publiceer stil' });
  var sendBtn = el('button', { type:'button', class:'btn', text:'Publiceer + mail' });
  function run(withMail){
    err.classList.remove('show');
    var sel = selected();
    if(!sel.length){ err.textContent = 'Vink minstens één concept aan.'; err.classList.add('show'); return; }
    silentBtn.disabled = true; sendBtn.disabled = true;
    publishItems(sel).then(function(){
      var after = (withMail && currentOpts) ? notifyClient(currentOpts) : Promise.resolve();
      return after;
    }).then(function(){
      closeModal();
      updateBadge();
      refresh();
    }).catch(function(ex){
      silentBtn.disabled = false; sendBtn.disabled = false;
      err.textContent = ex.message||String(ex); err.classList.add('show');
    });
  }
  silentBtn.addEventListener('click', function(){ run(false); });
  sendBtn.addEventListener('click', function(){ run(true); });

  /* geplande publicatie (functie 45): de selectie blijft concept en flipt
     op het gekozen moment, mét de bundelmail — voor 's nachts klaarzetten
     vanuit China-tijd wat de klant om 9:00 NL-tijd moet zien */
  var planDet = el('details', { style:'margin-top:14px;' });
  planDet.appendChild(el('summary', { class:'kicker', style:'cursor:pointer;', text:'Plan publicatie (later publiceren)' }));
  var planDate = smartDateField('', 'Publicatiedatum');
  var planTime = el('input', { class:'input', type:'time', value:'09:00', 'aria-label':'Publicatietijd' });
  var planBtn = el('button', { type:'button', class:'btn ghost small', text:'Plan publicatie' });
  var planErr = el('p', { class:'formerr' });
  planBtn.addEventListener('click', function(){
    planErr.classList.remove('show');
    var sel = selected();
    if(!sel.length){ planErr.textContent = 'Vink minstens één concept aan.'; planErr.classList.add('show'); return; }
    var iso = planDate.get();
    if(!iso){ planErr.textContent = planDate.invalid() ? 'Datum niet herkend — probeer vr, +3 of 12/9.' : 'Kies een publicatiedatum.'; planErr.classList.add('show'); return; }
    var when = new Date(iso + 'T' + (planTime.value || '09:00'));
    if(isNaN(when.getTime())){ planErr.textContent = 'Tijdstip niet herkend.'; planErr.classList.add('show'); return; }
    if(when.getTime() <= Date.now()){ planErr.textContent = 'Kies een moment in de toekomst — anders kun je net zo goed direct publiceren.'; planErr.classList.add('show'); return; }
    planBtn.disabled = true;
    var chain = Promise.resolve();
    sel.forEach(function(it){
      chain = chain.then(function(){ return DS.schedulePublish(it.kind, it.row.id, when.toISOString()); });
    });
    chain.then(function(){
      closeModal();
      updateBadge();
      refresh();
    }).catch(function(ex){
      planBtn.disabled = false;
      planErr.textContent = ex.message||String(ex); planErr.classList.add('show');
    });
  });
  planDet.appendChild(el('div', { style:'display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-top:10px;' }, [
    field('Datum', planDate.node), field('Tijd', planTime),
    el('div', { style:'padding-bottom:18px;' }, planBtn)
  ]));
  planDet.appendChild(el('p', { style:'font-size:12.5px;color:var(--gray-69);max-width:64ch;', text:
    'Eerlijk over het moment: de publicatie (en de bundelmail) flipt bij het eerstvolgende beheer-bezoek ná dit tijdstip'
    + (IS_DEMO ? '.' : ' — tenzij je de scheduled function uit het commentaar in 0005_admin.sql uitrolt.') }));
  planDet.appendChild(planErr);
  m.body.appendChild(planDet);

  m.body.appendChild(el('div', { class:'modal-actions' }, [
    el('button', { type:'button', class:'btn ghost', text:'Annuleren', onclick:closeModal }),
    silentBtn, sendBtn
  ]));
}
/* geplande publicatie (functie 45): de check bij laden. Elk concept met een
   verstreken publicatiemoment wordt gepubliceerd; per project gaat daarna
   één gebundelde klantmail uit (met de composer-tekst als die er is) via de
   bestaande mail-infra — dus inclusief mailvoorkeuren en mail-logboek. */
function checkScheduledPublications(){
  if(!DS || !DS.listConcepts) return Promise.resolve(false);
  var nowIso = new Date().toISOString();
  return DS.listConcepts().then(function(list){
    var due = (list||[]).filter(function(it){
      return it.row.scheduledAt && String(it.row.scheduledAt) <= nowIso;
    });
    if(!due.length) return false;
    return Promise.all([ DS.listAllProjects(), DS.listClients() ]).then(function(res){
      var pmap = {}, cmap = {};
      res[0].forEach(function(p){ pmap[p.id] = p; });
      res[1].forEach(function(c){ cmap[c.id] = c; });
      var byProject = {};
      due.forEach(function(it){
        (byProject[it.row.projectId] = byProject[it.row.projectId] || []).push(it);
      });
      var chain = Promise.resolve();
      Object.keys(byProject).forEach(function(pid){
        chain = chain.then(function(){
          var items = byProject[pid];
          return publishItems(items).then(function(){
            var p = pmap[pid];
            var c = p ? cmap[p.clientId] : null;
            if(!p || !c) return;
            var note = '';
            items.forEach(function(it){ if(!note && it.row.updateNote) note = it.row.updateNote; });
            var mailOpts = bundleMailOpts(p, c, items);
            if(note) mailOpts.bodyLine = note;
            return notifyClient(mailOpts);
          });
        });
      });
      return chain.then(function(){ return true; });
    });
  }).catch(function(){ return false; });
}
/* ============================================================
   golf 5 — update-composer (functie 43)
   Eén formulier dat een samenhangende update bouwt: conceptfoto's, een
   korte begeleidende tekst en optioneel een fasewissel. Opslaan koppelt
   alles via één update-id op de bestaande media-items; de portal toont
   het gegroepeerd met de tekst erboven en de klant krijgt er precies
   één mail over (publiceer-flow 44). Publiceren kan ook gepland (45) —
   dan zonder fasewissel: die zet je om op het moment zelf, zodat er
   nooit een statuswissel 'in de toekomst' klaarstaat die intussen door
   de werkelijkheid wordt ingehaald.
   ============================================================ */
function openUpdateComposer(project, client, media, factories){
  var concepts = (media||[]).filter(function(mr){ return isConcept(mr) && !mr.scheduledAt; });
  var m = openModal('Nieuwe update', 'Foto’s + tekst + optionele fasewissel — de klant krijgt er precies één mail over', { wide:true });

  var checks = [];
  var listWrap = el('div');
  if(!concepts.length){
    listWrap.appendChild(el('p', { style:'font-size:14px;color:var(--gray-69);margin-bottom:10px;max-width:64ch;', text:
      'Er staan nog geen conceptfoto’s klaar voor dit project. Voeg eerst foto’s toe als concept — daarna bundel je ze hier tot één samenhangende update.' }));
    listWrap.appendChild(el('button', { type:'button', class:'btn ghost small', text:'Foto’s toevoegen (als concept)', onclick:function(){
      closeModal();
      openMediaModal(project.id, factories, project, client, null, 'concept');
    } }));
  } else {
    concepts.forEach(function(mrow){
      var cb = el('input', { type:'checkbox', checked:true });
      checks.push({ cb: cb, row: mrow });
      var img = el('img', { alt:'' });
      DS.mediaUrl(mrow).then(function(u){ if(u) img.src = u; });
      var age = daysSince(mrow.createdAt || mrow.capturedAt);
      listWrap.appendChild(el('label', { class:'comp-row', style:'cursor:pointer;' }, [
        cb, img,
        el('div', { class:'rowmain' }, [
          el('div', { style:'font-weight:500;font-size:13.5px;', text: mrow.caption || 'Foto' }),
          el('div', { class:'rowsub', text: stageLabel(mrow.stageKey)
            + (age!=null ? ' · staat ' + (age===0 ? 'sinds vandaag' : 'al ' + age + (age===1 ? ' dag' : ' dagen')) + ' klaar' : '') })
        ])
      ]));
    });
    listWrap.appendChild(el('p', { class:'drophint', text:'Meer foto’s nodig? Voeg ze eerst als concept toe (Foto’s toevoegen → zichtbaarheid “concept”) en open de composer opnieuw.' }));
  }

  var note = el('textarea', { class:'input', required:'required', 'aria-label':'Begeleidende tekst',
    placeholder:'bv. De eerste productierun draait en de kwaliteit ziet er goed uit — hieronder de foto’s van de lijn.' });

  /* optionele fasewissel: dezelfde statusmotor als de fasebalk */
  var curStage = (project.stages||[]).find(function(s2){ return s2.status==='current' || s2.status==='awaiting_approval'; });
  var faseChk = el('input', { type:'checkbox' });
  var faseSel = stageSelect(curStage ? curStage.stageKey : 'concept');
  var faseStatusSel = el('select', { class:'input', 'aria-label':'Nieuwe fasestatus' });
  STAGE_STATUS.forEach(function(st){ faseStatusSel.appendChild(option(st.key, st.label, st.key==='done')); });
  var faseRow = el('div', { class:'formrow' }, [ field('Fase', faseSel), field('Nieuwe status', faseStatusSel) ]);
  faseRow.hidden = true;
  faseChk.addEventListener('change', function(){ faseRow.hidden = !faseChk.checked; });

  /* publicatiemoment: nu of gepland (functie 45) */
  var momentSel = el('select', { class:'input', 'aria-label':'Publicatiemoment' });
  momentSel.appendChild(option('nu', 'Nu publiceren', true));
  momentSel.appendChild(option('plan', 'Plan publicatie'));
  var planDate = smartDateField('', 'Publicatiedatum');
  var planTime = el('input', { class:'input', type:'time', value:'09:00', 'aria-label':'Publicatietijd' });
  var planRow = el('div', { class:'formrow' }, [ field('Datum', planDate.node), field('Tijd', planTime) ]);
  planRow.hidden = true;
  var planNote = el('p', { style:'font-size:12.5px;color:var(--gray-69);max-width:64ch;margin:-6px 0 12px;' });
  planNote.hidden = true;
  var faseLine = el('label', { class:'checkline' }, [ faseChk, el('span', { text:'Zet ook een fasestatus om (in dezelfde update)' }) ]);
  momentSel.addEventListener('change', function(){
    var plan = momentSel.value==='plan';
    planRow.hidden = !plan;
    planNote.hidden = !plan;
    planNote.textContent = 'De publicatie en de bundelmail flippen bij het eerstvolgende beheer-bezoek ná dit tijdstip'
      + (IS_DEMO ? '.' : ' — tenzij de scheduled function uit 0005_admin.sql draait.')
      + ' Een geplande update kan geen fasewissel meenemen: die zet je om op het moment zelf.';
    if(plan){ faseChk.checked = false; faseRow.hidden = true; }
    faseChk.disabled = plan;
    faseLine.style.opacity = plan ? '.45' : '';
  });

  var err = el('p', { class:'formerr' });

  momentSel.addEventListener('change', function(){
    submitBtn.textContent = momentSel.value==='plan' ? 'Plan update' : 'Publiceer update';
  });

  var form = el('form', { onsubmit:function(e){
    e.preventDefault();
    err.classList.remove('show');
    var sel = checks.filter(function(c2){ return c2.cb.checked; }).map(function(c2){ return c2.row; });
    if(!sel.length){
      err.textContent = concepts.length ? 'Vink minstens één conceptfoto aan.' : 'Voeg eerst conceptfoto’s toe — een update zonder beeld is een kale mail.';
      err.classList.add('show'); return;
    }
    var noteVal = note.value.trim();
    if(!noteVal){ err.textContent = 'Schrijf een korte begeleidende tekst — dat is het verhaal dat de losse foto’s tot één update maakt.'; err.classList.add('show'); return; }
    var planned = momentSel.value==='plan';
    var whenIso = null;
    if(planned){
      var iso = planDate.get();
      if(!iso){ err.textContent = planDate.invalid() ? 'Datum niet herkend — probeer vr, +3 of 12/9.' : 'Kies een publicatiedatum.'; err.classList.add('show'); return; }
      var when = new Date(iso + 'T' + (planTime.value || '09:00'));
      if(isNaN(when.getTime()) || when.getTime() <= Date.now()){
        err.textContent = 'Kies een publicatiemoment in de toekomst.'; err.classList.add('show'); return;
      }
      whenIso = when.toISOString();
    }
    submitBtn.disabled = true;
    var updateId = uid('upd');
    var ids = sel.map(function(r){ return r.id; });
    var chain = DS.assignMediaUpdate(ids, updateId, noteVal);
    if(planned){
      ids.forEach(function(id){

      chain.then(function(){

        closeModal(); updateBadge(); refresh();
      }).catch(function(ex){ submitBtn.disabled = false; err.textContent = ex.message||String(ex); err.classList.add('show'); });

    }
    chain = chain.then(function(){
      return publishItems(sel.map(function(r){ return { kind:'media', row:r }; }));
    });
    if(faseChk.checked){
      chain = chain.then(function(){ return DS.setStageStatus(project.id, faseSel.value, faseStatusSel.value); })
        /* golf 8: zelfde automatische conceptfactuur als bij de fasebalk */
        .then(function(){
          return faseStatusSel.value==='awaiting_approval' ? autoConceptInvoice(project.id, faseSel.value) : null;
        });
    }
    chain.then(function(){
      draft.clear();
      closeModal();
      updateBadge();
      refresh();
      /* publiceer-flow (44): één gebundelde klantmail met de composer-tekst */
      openMailChoiceModal({
        client: client, projectName: project.name, projectCode: project.code,
        page:'updates', portalLabel:'Bekijk de update', category:'publicatie',
        subject: mailSubject('publicatie', { project: project.name }),
        bodyLine: noteVal.length > 240 ? noteVal.slice(0, 237) + '…' : noteVal
      }, {
        title:'Klantmail bij deze update',
        kicker:'De update staat al live — kies of de klant de bundelmail krijgt',
        sendLabel:'Verstuur klantmail', silentLabel:'Publiceer stil (geen mail)'
      });
    }).catch(function(ex){ submitBtn.disabled = false; err.textContent = ex.message||String(ex); err.classList.add('show'); });
  } }, [
    field('Conceptfoto’s in deze update', listWrap),
    field('Begeleidende tekst (de klant ziet dit boven de foto’s)', note),
    faseLine,
    faseRow,
    field('Publicatiemoment', momentSel),
    planRow,
    planNote,
    err,
    el('div', { class:'modal-actions' }, [
      el('button', { type:'button', class:'btn ghost', text:'Annuleren', onclick:closeModal }),
      submitBtn
    ])
  ]);
  var actionsRow = form.querySelector('.modal-actions');
  actionsRow.insertBefore(missingHint(form, [
    { input:note, label:'begeleidende tekst' }

  m.body.appendChild(form);

/* ============================================================
   deel 0b — Aanvragen
   Alles wat nog geen project is. De herbestel-vragen uit de portal zijn
   de eerste bewoner; site-briefs krijgen hier hun inbox.

/* pijplijnstadia per herbestelaanvraag (functie 22): opgeslagen in de
   beheerinstellingen onder reorderPipeline[vraag-id] — zelfde patroon als
   itemState, identiek in demo- en Supabase-modus */
var REORDER_STAGES = [
  { key:'aanvraag', label:'Aanvraag' },
  { key:'offerte',  label:'Offerte' },
  { key:'akkoord',  label:'Akkoord' },
  { key:'project',  label:'Project' }
];
function saveReorderState(qid, patch){
  var blob = clone((adminSettings && adminSettings.reorderPipeline) || {});
  var cur = blob[qid] || {};
  Object.keys(patch).forEach(function(k){
    var v = patch[k];
    if(v===null || v===undefined || v==='') delete cur[k];
    else cur[k] = v;
  });
  blob[qid] = cur;
  if(adminSettings) adminSettings.reorderPipeline = blob;
  return DS.saveSetting('reorderPipeline', blob);
}
function renderAanvragen(){

  ]).then(function(res){
    var questions = res[0], projects = res[1], clients = res[2];
    var requests = res[3] || [], settings = res[4];
    adminSettings = settings;
    var pipeline = settings.reorderPipeline || {};
    var pmap = {}, cmap = {};
    projects.forEach(function(p){ pmap[p.id] = p; });

    content.appendChild(el('div', { class:'pagehead' }, [

        ]));

    /* --- herbestel-pijplijn (functie 22): Aanvraag → Offerte → Akkoord → Project --- */
    var reorders = questions.filter(function(q){ return isReorderQuestion(q) && !q.answeredAt; })
      .sort(function(a,b){ return String(b.askedAt).localeCompare(String(a.askedAt)); });

    reorders.forEach(function(q){

      var st = pipeline[q.id] || {};

      REORDER_STAGES.forEach(function(rs, i){ if(rs.key===stageKey) stageIdx = i; });

          DS.answerQuestion(q.id, a).then(function(){
            if(p && c){
              notifyClient({

          }).catch(function(ex){ send.disabled = false; err.textContent = ex.message||String(ex); err.classList.add('show'); });
        });
        area = el('div', { class:'inlineform' }, [

            send
          ])
        ]);

      }
      var cleanText = String(q.question||'').replace(/^HERBESTELLING:\s*/, '');
      /* pijplijnbalk: vier stadia, huidige zwart, gepasseerde groen */
      var pipe = el('div', { class:'pipesteps' });
      REORDER_STAGES.forEach(function(rs, i){
        if(i) pipe.appendChild(el('span', { class:'pipearrow', text:'→' }));
        var cls = i < stageIdx ? ' done' : (i===stageIdx ? ' current' : ' pending');
        pipe.appendChild(el('span', { class:'chip' + cls, text: rs.label }));
      });
      /* stap-acties: telkens precies de volgende klik van de pijplijn */
      var actions = [
        el('button', { type:'button', class:'btn ghost small', text:'Open project', onclick:function(){
          if(p) go({ name:'project', projectId:p.id, clientId:p.clientId });
        } }),
        el('button', { type:'button', class:'btn ghost small', text:'Beantwoord', onclick:openAnswer })
      ];
      if(stageKey==='aanvraag' && p){
        actions.push(el('button', { type:'button', class:'btn small', text:'Maak offerte', onclick:function(){
          /* één klik = een offerte-document (bestaand type quote) als
             concept: jij vult hem in de Wachtrij/het project verder in en
             publiceert bewust — de klant ziet tot die tijd niets */
          DS.addDocument(p.id, {
            title:'Offerte herbestelling — ' + p.name,
            stageKey:'concept', docType:'quote', version:1,
            publishStatus:'concept'
          }).then(function(d){
            return saveReorderState(q.id, { stage:'offerte', quoteDocId: d && d.id });
          }).then(function(){ updateBadge(); refresh(); }).catch(showError);
        } }));
      } else if(stageKey==='offerte'){
        actions.push(el('button', { type:'button', class:'btn small', text:'Akkoord ontvangen', onclick:function(){
          saveReorderState(q.id, { stage:'akkoord' }).then(refresh).catch(showError);
        } }));
      } else if(stageKey==='akkoord' && p && c){
        actions.push(el('button', { type:'button', class:'btn small', text:'Maak project (batch)', onclick:function(){
          openReorderProjectModal(q, p, c);
        } }));
      }
      var subLine = [c?c.company:null, p?p.name:null].filter(Boolean).join(' · ') + ' · ' + fmtDateTime(q.askedAt);
      if(stageKey==='offerte' && st.quoteDocId) subLine += ' · offerte staat als concept klaar';
      row = el('div', null, el('div', { class:'rowitem' }, [
        el('span', { class:'chip done', text:'Herbestelling' }),
        el('div', { class:'rowmain' }, [
          el('div', { class:'rowtitle', text: cleanText }),
          el('div', { class:'rowsub', text: subLine }),
          pipe
        ]),
        el('div', { class:'vd-actions' }, actions)
      ]));
      list.appendChild(row);
    });
    content.appendChild(sectionBlock('Uit "Mijn Producten" — pijplijn Aanvraag → Offerte → Akkoord → Project', 'Herbestellingen', null, list));
  });

/* herbestelling → project (functie 22): dupliceert de structuur van het
   vorige project als batch n+1 via de bestaande dupliceer-logica, zet de
   aanvraag op beantwoord en biedt één klantmail met voorbeeld (44) */
function openReorderProjectModal(q, sourceProject, client){
  var m = openModal('Herbestelling omzetten', 'Structuur van het vorige project reist mee — inhoud niet');
  var pname = el('input', { class:'input', type:'text', required:'required', value: nextBatchName(sourceProject.name) });
  var lang = clientMailLang(client);
  var answer = el('textarea', { class:'input', required:'required', 'aria-label':'Antwoord aan de klant' });
  answer.value = lang==='en'
    ? 'Your reorder has been converted into a new project: ' + nextBatchName(sourceProject.name) + '. You can follow it in your portal from now on.'
    : 'Je herbestelling is omgezet naar een nieuw project: ' + nextBatchName(sourceProject.name) + '. Je volgt hem vanaf nu in je portaal.';
  var err = el('p', { class:'formerr' });
  var submitBtn = el('button', { type:'submit', class:'btn', text:'Maak project' });
  var form = el('form', { onsubmit:function(e){
    e.preventDefault();
    err.classList.remove('show');
    submitBtn.disabled = true;
    var newP = null;
    /* 'Structuur reist mee' moet ook in Supabase-modus waar zijn: de
       aanvragenlijst laadt projecten ZONDER fases (listAllProjects), dus
       ontbreken ze hier, dan halen we ze alsnog op — anders zou
       stageSeedFrom stil terugvallen op het standaard-sjabloon en gaan
       afwijkende betaalpercentages van het bronproject verloren. */
    var stagesP = (Array.isArray(sourceProject.stages) && sourceProject.stages.length)
      ? Promise.resolve(sourceProject.stages)
      : DS.listClientProjects(sourceProject.clientId).then(function(list){
          var src = (list||[]).find(function(p){ return p.id===sourceProject.id; });
          return (src && src.stages) || [];
        });
    stagesP
      .then(function(stages){
        return DS.createProject(sourceProject.clientId, pname.value.trim(), '', { stages: stages });
      })
      .then(function(p){
        newP = p;
        return DS.answerQuestion(q.id, answer.value.trim());
      })
      .then(function(){ return saveReorderState(q.id, { stage:'project', projectId: newP.id }); })
      .then(function(){
        draft.clear();
        closeModal();
        updateBadge();
        openMailChoiceModal({
          client: client, projectName: newP.name, projectCode: newP.code || '',
          page:'producten', portalLabel: lang==='en' ? 'View your projects' : 'Bekijk je projecten',
          category:'update',
          subject:'Reactie op je herbestelaanvraag — ' + sourceProject.name,
          bodyLine: answer.value.trim().slice(0, 290)
        }, {
          title:'Klantmail bij de omzetting',
          kicker:'Het project staat al klaar — kies of de klant een mail krijgt',
          sendLabel:'Verstuur klantmail', silentLabel:'Geen mail (stil)',
          onDismiss:function(){ go({ name:'project', projectId: newP.id, clientId: sourceProject.clientId }); }
        });
      })
      .catch(function(ex){ submitBtn.disabled = false; err.textContent = ex.message||String(ex); err.classList.add('show'); });
  } }, [
    field('Projectnaam', pname),
    field('Antwoord aan de klant (sluit de aanvraag af)', answer),
    err,
    el('div', { class:'modal-actions' }, [
      el('button', { type:'button', class:'btn ghost', text:'Annuleren', onclick:closeModal }),
      submitBtn
    ])
  ]);
  var actionsRow = form.querySelector('.modal-actions');
  actionsRow.insertBefore(missingHint(form, [
    { input:pname, label:'projectnaam' },
    { input:answer, label:'antwoord' }
  ]), actionsRow.firstChild);
  m.body.appendChild(form);
  var draft = attachDraft(m, form, 'herbestel', q.id);
}

/* volgende actie van jou (functie 36): afgeleid uit de gedeelde
   signaalberekening (computeSignals) — de spiegel van de volgende-stap die
   de klant al ziet via de statusmotor. Zelfde functie voedt de kopregel op
   projectdetail; geen dubbele logica. */
function nextActionFor(projectId, sig, conceptCount){
  var i, it;
  for(i=0;i<sig.vragen.length;i++){
    if(sig.vragen[i].projectId===projectId){
      it = sig.vragen[i];
      return { rank:1, text:'Beantwoord de klantvraag' + (it.q._klok ? ' (' + it.q._klok.label + ')' : ''),
        crit: !!(it.q._klok && it.q._klok.state==='rood') };
    }
  }
  for(i=0;i<sig.eta.length;i++){
    if(sig.eta[i].projectId===projectId){
      return { rank:2, text: sig.eta[i].passed ? 'ETA verlopen — bijwerken of geleverd afvinken' : 'ETA loopt af — werk het venster bij', crit:true };
    }
  }
  for(i=0;i<sig.stil.length;i++){
    if(sig.stil[i].projectId===projectId){
      return { rank:3, text:'Zending ' + sig.stil[i].stilDays + ' dagen stil — najagen' };
    }
  }
  for(i=0;i<sig.geld.length;i++){
    if(sig.geld[i].projectId===projectId && sig.geld[i].age >= 30){
      return { rank:4, text:'Factuur ' + sig.geld[i].age + ' dagen open — stuur een herinnering', crit:true };
    }
  }
  if(conceptCount) return { rank:5, text:'Publiceer ' + conceptCount + (conceptCount===1 ? ' concept' : ' concepten') + ' uit de wachtrij' };
  for(i=0;i<sig.samples.length;i++){
    if(sig.samples[i].projectId===projectId){
      return { rank:6, text:'Bal bij klant — sample ' + sig.samples[i].sm.roundLabel + ' wacht op keuze' };
    }
  }
  for(i=0;i<sig.fases.length;i++){
    if(sig.fases[i].projectId===projectId){
      return { rank:7, text:'Bal bij klant — wacht op akkoord: ' + stageLabel(sig.fases[i].stage.stageKey) };
    }
  }
  return null;
}
function buildProjectsList(d, concepts){
  var cmap = {};
  d.clients.forEach(function(c){ cmap[c.id] = c; });
  var sig = computeSignals(d);
  var conceptsByProject = {};
  /* golf 8: het factuurdocument van een conceptfactuur telt hier niet mee
     (dat publiceert via de factuur, niet via de wachtrijbundel) */
  var invDocIds = {};
  (d.invoices||[]).forEach(function(inv){ if(isConcept(inv) && inv.documentId) invDocIds[inv.documentId] = true; });
  (concepts||[]).forEach(function(it){
    if(it.kind==='document' && invDocIds[it.row.id]) return;
    var pid = it.row.projectId;
    conceptsByProject[pid] = (conceptsByProject[pid]||0) + 1;
  });

  content.appendChild(el('div', { class:'pagehead' }, [
    el('div', null, [
      el('span', { class:'kicker', text:'Uitvoering, over alle klanten heen — met de volgende actie van jou' }),
      el('h1', { text:'Projecten' })
    ])
  ]));

  var rows = d.projects.map(function(p){
    return { p:p, act: p.status==='archived' ? null : nextActionFor(p.id, sig, conceptsByProject[p.id]||0) };
  });
  /* projecten zonder open actie zakken naar beneden; gearchiveerd onderaan */
  rows.sort(function(a,b){
    var aa = a.p.status==='archived' ? 2 : (a.act ? 0 : 1);
    var bb = b.p.status==='archived' ? 2 : (b.act ? 0 : 1);
    if(aa!==bb) return aa-bb;
    if(a.act && b.act && a.act.rank!==b.act.rank) return a.act.rank - b.act.rank;
    return String(b.p.createdAt||'').localeCompare(String(a.p.createdAt||''));
  });

  var list = el('div', { class:'card rowlist' });
  if(!rows.length){
    list.appendChild(el('div', { class:'empty', text:'Nog geen projecten. Maak een project aan vanaf een klantkaart.' }));
  }
  rows.forEach(function(r){
    var p = r.p;
    var c = cmap[p.clientId];
    var cur = (p.stages||[]).find(function(s){ return s.status==='current' || s.status==='awaiting_approval'; });
    var subParts = [];
    if(c) subParts.push(c.company);
    if(p.code) subParts.push(p.code);
    subParts.push(cur ? stageLabel(cur.stageKey) : 'Alle fases afgerond');
    var chips = [];
    if(p.status==='archived') chips.push(el('span', { class:'chip', text:'Gearchiveerd' }));
    else if(cur) chips.push(el('span', { class:'chip ' + (cur.status==='awaiting_approval' ? 'awaiting' : 'current'), text: stageStatusLabel(cur.status) }));
    var actLine;
    if(p.status==='archived') actLine = null;
    else if(r.act) actLine = el('div', { class:'nextact' + (r.act.crit ? '' : ''), style: r.act.crit ? 'color:var(--critical);' : '', text:'→ ' + r.act.text });
    else actLine = el('div', { class:'nextact none', text:'→ Geen open actie van jou' });
    var rowBtn = el('button', {
      type:'button', class:'rowitem link',
      onclick:function(){ go({ name:'project', projectId:p.id, clientId:p.clientId }); }
    }, [
      el('div', { class:'rowmain' }, [
        el('div', { class:'rowtitle', text:p.name }),
        el('div', { class:'rowsub', text: subParts.join(' · ') }),
        actLine
      ])
    ].concat(chips, [ el('span', { class:'rowmeta', text: fmtDate(p.createdAt) }) ]));
    kbRegister(rowBtn, { open:function(){ go({ name:'project', projectId:p.id, clientId:p.clientId }); } });
    list.appendChild(rowBtn);
  });
  content.appendChild(el('div', { class:'section' }, list));
}

/* ============================================================
   deel 0d — Wachtrij
   De veiligheidsklep van de conceptstand: alles wat de klant nog niet ziet.
   ============================================================ */
function renderWachtrij(){
  return Promise.all([ DS.listConcepts ? DS.listConcepts() : Promise.resolve([]), DS.listAllProjects(), DS.listClients(), DS.listAllInvoices() ]).then(function(res){
    var allConcepts = res[0], projects = res[1], clients = res[2];
    /* golf 8: conceptfacturen wachten hier ook — met hun eigen
       publiceerflow, los van de media/documenten-bundel */
    var conceptInvs = (res[3]||[]).filter(isConcept)
      .sort(function(a,b){ return String(a.createdAt||'').localeCompare(String(b.createdAt||'')); });
    /* het gegenereerde factuurdocument van zo'n concept hoort bij de
       factuurrij hieronder, niet dubbel in de algemene conceptenlijst —
       publiceren via de factuur flipt beide (en andersom, in de DS) */
    var invDocIds = {};
    conceptInvs.forEach(function(inv){ if(inv.documentId) invDocIds[inv.documentId] = true; });
    allConcepts = allConcepts.filter(function(it){ return !(it.kind==='document' && invDocIds[it.row.id]); });
    /* geplande publicaties (functie 45) horen bij 'Gepland', niet tussen de
       gewone concepten */
    var concepts = allConcepts.filter(function(it){ return !it.row.scheduledAt; });
    var scheduled = allConcepts.filter(function(it){ return !!it.row.scheduledAt; })
      .sort(function(a,b){ return String(a.row.scheduledAt).localeCompare(String(b.row.scheduledAt)); });
    var pmap = {}, cmap = {};
    projects.forEach(function(p){ pmap[p.id] = p; });
    clients.forEach(function(c){ cmap[c.id] = c; });

    var totalWait = concepts.length + conceptInvs.length;
    content.appendChild(el('div', { class:'pagehead' }, [
      el('div', null, [
        el('span', { class:'kicker', text: totalWait
          ? (totalWait===1 ? '1 concept wacht op publicatie' : totalWait + ' concepten wachten op publicatie')
          : 'Wat de klant nog niet ziet' }),
        el('h1', { text:'Wachtrij' })
      ])
    ]));

    /* --- concepten, gegroepeerd per project, oudste bovenaan --- */
    if(!concepts.length){
      content.appendChild(sectionBlock('De veiligheidsklep van de conceptstand', 'Concepten', null,
        el('div', { class:'card empty', text:'Geen concepten. Alles wat je in projecten hebt geplaatst, staat live voor de klant.' })));
    } else {
      var byProject = {};
      concepts.forEach(function(it){
        var pid = it.row.projectId;
        (byProject[pid] = byProject[pid] || []).push(it);
      });
      Object.keys(byProject).forEach(function(pid){
        var items = byProject[pid].slice().sort(function(a,b){
          return String(a.row.createdAt||a.row.capturedAt||'').localeCompare(String(b.row.createdAt||b.row.capturedAt||''));
        });
        var p = pmap[pid];
        var c = p ? cmap[p.clientId] : null;
        var list = el('div', { class:'card rowlist' });
        items.forEach(function(it){
          var age = conceptAgeDays(it);
          var rowBtns = [
            el('button', { type:'button', class:'btn ghost small', text:'Open project', onclick:function(){
              if(p) go({ name:'project', projectId:p.id, clientId:p.clientId });
            } }),
            el('button', { type:'button', class:'btn ghost small', text:'Verwijder', onclick:function(){
              var delP = it.kind==='media' ? DS.softDeleteMedia(it.row.id) : DS.softDeleteDocument(it.row.id);
              delP.then(function(entry){
                refresh();
                showUndoToast(it.kind==='media' ? 'Concept-foto verwijderd' : 'Concept-document verwijderd', function(){
                  return (entry ? DS.restoreTrash(entry.id) : Promise.resolve()).then(refresh);
                });
              }).catch(showError);
            } })
          ];
          if(p && c){
            rowBtns.push(el('button', { type:'button', class:'btn small', text:'Publiceer', onclick:function(){
              openPublishModal(p, c, items, [it.row.id]);
            } }));
          }
          list.appendChild(el('div', { class:'rowitem' }, [
            el('span', { class:'chip', text: it.kind==='media' ? 'Foto' : 'Document' }),
            el('div', { class:'rowmain' }, [
              el('div', { class:'rowtitle', text: conceptTitle(it) }),
              el('div', { class:'rowsub', text: stageLabel(it.row.stageKey)
                + (age!=null ? ' · staat ' + (age===0 ? 'sinds vandaag' : 'al ' + age + (age===1 ? ' dag' : ' dagen')) + ' klaar' : '') })
            ]),
            el('div', { class:'vd-actions' }, rowBtns)
          ]));
        });
        var headBtn = (p && c)
          ? el('button', { type:'button', class:'btn small', text:'Publiceer alles (' + items.length + ')', onclick:function(){
              openPublishModal(p, c, items);
            } })
          : null;
        content.appendChild(sectionBlock(c ? c.company : 'Onbekende klant', p ? p.name : 'Onbekend project', headBtn, list));
      });
    }

    /* --- golf 8: conceptfacturen — eigen publiceerflow --- */
    if(conceptInvs.length){
      var invL = el('div', { class:'card rowlist' });
      conceptInvs.forEach(function(inv){
        var p = pmap[inv.projectId];
        var c = p ? cmap[p.clientId] : null;
        var age = daysSince(inv.createdAt);
        var chips = [ el('span', { class:'chip', text:'Factuur' }) ];
        if(!(inv.amountCents > 0)) chips.push(el('span', { class:'chip awaiting', text:'Bedrag invullen' }));
        invL.appendChild(el('div', { class:'rowitem' }, chips.concat([
          el('div', { class:'rowmain' }, [
            el('div', { class:'rowtitle', text:(inv.invoiceNumber ? inv.invoiceNumber + ' · ' : '') + inv.label }),
            el('div', { class:'rowsub', text: [ c ? c.company : null, p ? p.name : null, stageLabel(inv.stageKey) ].filter(Boolean).join(' · ')
              + (inv.amountCents > 0 ? ' · ' + fmtMoneyCur(inv.amountCents, inv.currency) : '')
              + (age!=null ? ' · staat ' + (age===0 ? 'sinds vandaag' : 'al ' + age + (age===1 ? ' dag' : ' dagen')) + ' klaar' : '') })
          ]),
          el('div', { class:'vd-actions' }, [
            el('button', { type:'button', class:'btn ghost small', text:'Open project', onclick:function(){
              if(p) go({ name:'project', projectId:p.id, clientId:p.clientId });
            } }),
            p ? el('button', { type:'button', class:'btn ghost small', text:'Factuur-PDF', onclick:function(){
              openInvoiceDocModal(inv, p, c || null);
            } }) : null,
            p ? el('button', { type:'button', class:'btn small', text:'Publiceer', onclick:function(){
              openInvoicePublishModal(inv, p, c || null);
            } }) : null
          ])
        ])));
      });
      content.appendChild(sectionBlock('Automatisch klaargezet bij een betaalfase op akkoord — nooit vanzelf verstuurd', 'Conceptfacturen', null, invL));
    }

    /* --- gepland (functie 45): publicatiemoment zichtbaar, annuleerbaar --- */
    if(!scheduled.length){
      content.appendChild(sectionBlock('Publicatiemoment zichtbaar, annuleerbaar', 'Gepland', null,
        el('div', { class:'card empty', text:'Nog geen geplande publicaties. Plannen kan vanuit Publiceer of de update-composer.' })));
    } else {
      var schedList = el('div', { class:'card rowlist' });
      scheduled.forEach(function(it){
        var p = pmap[it.row.projectId];
        var c = p ? cmap[p.clientId] : null;
        var passed = String(it.row.scheduledAt) <= new Date().toISOString();
        var cancelBtn = el('button', { type:'button', class:'btn ghost small', text:'Annuleer planning' });
        cancelBtn.addEventListener('click', function(){
          cancelBtn.disabled = true;
          DS.cancelSchedule(it.kind, it.row.id).then(refresh).catch(function(ex){ cancelBtn.disabled = false; showError(ex); });
        });
        var rowBtns = [ cancelBtn ];
        if(p && c){
          rowBtns.push(el('button', { type:'button', class:'btn small', text:'Publiceer nu', onclick:function(){
            DS.cancelSchedule(it.kind, it.row.id).then(function(){
              openPublishModal(p, c, [it], [it.row.id]);
            }).catch(showError);
          } }));
        }
        schedList.appendChild(el('div', { class:'rowitem' }, [
          el('span', { class:'chip' + (passed ? ' awaiting' : ''), text: passed ? 'Moment verstreken' : 'Gepland' }),
          el('span', { class:'chip', text: it.kind==='media' ? 'Foto' : 'Document' }),
          el('div', { class:'rowmain' }, [
            el('div', { class:'rowtitle', text: conceptTitle(it) }),
            el('div', { class:'rowsub', text: [ c?c.company:null, p?p.name:null ].filter(Boolean).join(' · ')
              + ' · publiceert ' + fmtDateTime(it.row.scheduledAt)
              + (it.row.updateNote ? ' · onderdeel van een update' : '') })
          ]),
          el('div', { class:'vd-actions' }, rowBtns)
        ]));
      });
      content.appendChild(sectionBlock('Publicatiemoment zichtbaar, annuleerbaar', 'Gepland', null, schedList));
      content.appendChild(el('p', { style:'font-size:12.5px;color:var(--gray-69);max-width:72ch;', text:
        'Eerlijk over het moment: de flip (en de bundelmail) gebeurt bij het eerstvolgende beheer-bezoek ná het tijdstip'
        + (IS_DEMO ? '.' : ' — tenzij je de scheduled function uit het commentaar in supabase/portal/0005_admin.sql uitrolt.') }));
    }
  });
}

function renderSettings(){

    var settings = res[0], trash = res[1] || [];
    adminSettings = settings; /* synchrone lezers (fasesjabloon, AQL) meteen bij */
    content.appendChild(el('div', { class:'pagehead' }, [
      el('div', null, [
        el('span', { class:'kicker', text:'Standaarden en vangnet' }),
        el('h1', { text:'Instellingen' })
      ])
    ]));

    /* gedeeld opslaghulpje: bewaart één sleutel en houdt de cache bij */
    function saveSet(key, value, flashEl){
      return DS.saveSetting(key, value).then(function(){
        settings[key] = value;
        if(adminSettings) adminSettings[key] = value;
        if(flashEl){
          flashEl.classList.add('show');
          setTimeout(function(){ flashEl.classList.remove('show'); }, 1600);

      inp.addEventListener('change', function(){
        var next = clone(settings[objKey] || {});

      if(t.kind==='media'){ kindTxt = 'Foto'; titleTxt = (pl.media && pl.media.caption) || 'Foto'; }
      else if(t.kind==='document'){ kindTxt = 'Document'; titleTxt = (pl.document && pl.document.title) || 'Document'; }
      var restoreBtn = el('button', { type:'button', class:'btn ghost small', text:'Zet terug' });
      restoreBtn.addEventListener('click', function(){
        restoreBtn.disabled = true;
        DS.restoreTrash(t.id).then(refresh).catch(function(ex){ restoreBtn.disabled = false; showError(ex); });
      });
      trashList.appendChild(el('div', { class:'rowitem' }, [
        el('span', { class:'chip', text:kindTxt }),
        el('div', { class:'rowmain' }, [
          el('div', { class:'rowtitle', text:titleTxt }),
          el('div', { class:'rowsub', text:'Verwijderd ' + fmtDateTime(t.deletedAt) + ' · wordt na 7 dagen definitief' })
        ]),
        restoreBtn
      ]));
    });
    content.appendChild(sectionBlock('Undo-vangnet', 'Onlangs verwijderd', null, trashList));

    /* --- go-live-checklist (golf 6, functie 70) ---
       Concrete stappen naar live, met automatische statuschecks waar dat
       kan (config ingevuld? migratie-tabellen bereikbaar? functies online?)
       en eerlijke handmatige vinkjes waar het niet kan (RLS-controle,
       Resend-domeinverificatie). Ook bereikbaar via de modusbanner. */
    var glFlash = el('span', { class:'saveflash', text:'Opgeslagen' });
    function glManual(key, labelTxt){
      var chk = el('input', { type:'checkbox', checked: !!(settings.goLive && settings.goLive[key]) });
      chk.addEventListener('change', function(){
        var next = clone(settings.goLive || {});
        next[key] = chk.checked;
        saveSet('goLive', next, glFlash).then(function(){ runGoLiveChecks(); });
      });
      return el('label', { class:'checkline', style:'margin:8px 0 0;' }, [ chk, el('span', { text: labelTxt }) ]);
    }
    var glState = {};
    function glRow(key, titleTxt, subTxt, manualEl){
      var dot = el('span', { class:'gl-dot', 'aria-hidden':'true' });
      var status = el('div', { class:'kicker', 'aria-live':'polite', text:'Nog niet gecontroleerd' });
      glState[key] = { dot: dot, status: status };
      var main = el('div', { style:'flex:1;min-width:0;' }, [
        el('div', { style:'font-size:14.5px;font-weight:600;', text: titleTxt }),
        subTxt ? el('div', { style:'font-size:13px;color:var(--gray-69);margin:2px 0 4px;max-width:64ch;', text: subTxt }) : null,
        status,
        manualEl || null
      ]);
      return el('div', { class:'gl-row' }, [ dot, main ]);
    }
    function setGl(key, cls, txt){
      var s2 = glState[key];
      if(!s2) return;
      s2.dot.className = 'gl-dot' + (cls ? ' ' + cls : '');
      s2.status.textContent = txt;
    }
    function runGoLiveChecks(){
      /* 1. config */
      setGl('config', IS_DEMO ? 'warn' : 'ok', IS_DEMO
        ? 'Nog leeg — vul supabaseUrl en supabaseAnonKey in portal/config.js; de apps schakelen dan vanzelf om.'
        : 'Ingevuld — het beheer draait live op ' + String(CFG.supabaseUrl||'').replace(/^https?:\/\//,'') + '.');
      /* 2. migraties 0001–0005: per migratie één tabel/kolom aanprikken */
      if(!window.__cpSb){
        setGl('migraties', 'warn', 'Wacht op de config hierboven — daarna controleert deze stap zichzelf.');
      } else {
        setGl('migraties', '', 'Wordt gecontroleerd…');
        var probes = [
          ['0001', 'clients', 'id'], ['0002', 'shipments', 'id'], ['0003', 'factories_partners', 'city'],
          ['0004', 'invoices', 'document_id'], ['0005', 'doc_slots', 'id']
        ];
        Promise.all(probes.map(function(pr){
          return window.__cpSb.from(pr[1]).select(pr[2], { head:true, count:'exact' })
            .then(function(res2){ return { mig: pr[0], ok: !res2.error }; }, function(){ return { mig: pr[0], ok:false }; });
        })).then(function(results){
          var missing = results.filter(function(r2){ return !r2.ok; }).map(function(r2){ return r2.mig; });
          setGl('migraties', missing.length ? 'bad' : 'ok', missing.length
            ? 'Nog niet (volledig) gedraaid: ' + missing.join(', ') + ' — draai supabase/portal/000x in de SQL editor.'
            : 'Alle vijf migraties bereikbaar (0001 t/m 0005).');
        });
      }
      /* 3. RLS: niet automatisch controleerbaar vanaf de client — eerlijk handmatig */
      setGl('rls', (settings.goLive && settings.goLive.rls) ? 'ok' : 'warn',
        'Niet automatisch controleerbaar vanaf de browser — vink af na controle in het Supabase-dashboard.');
      /* 4. mailfunctie + Resend-domein: de functie antwoordt op GET met
         {configured:true/false}, dus een uitgerolde maar half-geconfigureerde
         functie (env vars missen) telt hier eerlijk NIET als klaar */
      setGl('resend', '', 'Wordt gecontroleerd…');
      fetch('/.netlify/functions/notify-client', { method:'GET' }).then(function(r2){
        if(r2.status===404){
          setGl('resend', 'bad', 'Mailfunctie niet gevonden — draait de site op Netlify met netlify/functions/notify-client.mjs?');
          return;
        }
        return r2.json().then(function(j){ return !(j && j.configured===false); }, function(){ return true; })
          .then(function(configured){
            var domainOk = !!(settings.goLive && settings.goLive.resendDomein);
            if(!configured){
              setGl('resend', 'bad', 'Mailfunctie bereikbaar, maar nog niet geconfigureerd — zet RESEND_API_KEY, RESEND_FROM en NOTIFY_SHARED_SECRET als env vars op Netlify.');
              return;
            }
            setGl('resend', domainOk ? 'ok' : 'warn',
              'Mailfunctie bereikbaar en geconfigureerd.'
              + (CFG.notifySharedSecret ? '' : ' Let op: notifySharedSecret is leeg — klantmails staan uit.')
              + (domainOk ? '' : ' Domeinverificatie nog afvinken.'));
          });
      }, function(){
        setGl('resend', 'bad', 'Mailfunctie niet bereikbaar — draait de site op Netlify?');
      });
      /* 5. portal-URL */
      setGl('portalurl', '', 'Wordt gecontroleerd…');
      fetch('portal.html', { method:'HEAD' }).then(function(r2){
        setGl('portalurl', r2.ok ? 'ok' : 'bad', r2.ok
          ? 'portal.html bereikbaar op deze host — dit is de link in klantmails.'
          : 'portal.html antwoordt met status ' + r2.status + '.');
      }, function(){
        setGl('portalurl', 'bad', 'portal.html niet bereikbaar vanaf deze pagina.');
      });
      /* 6. eerste echte klantaccount */
      if(IS_DEMO){
        setGl('klant', 'warn', 'In demomodus niet van toepassing — het demo-logboek telt niet als echte login.');
      } else {
        setGl('klant', '', 'Wordt gecontroleerd…');
        DS.listLog(null).then(function(rows2){
          var first = (rows2||[]).filter(function(r2){ return r2.actor==='client'; })
            .sort(function(a,b){ return String(a.createdAt).localeCompare(String(b.createdAt)); })[0];
          setGl('klant', first ? 'ok' : 'warn', first
            ? 'Eerste klantlogin gezien in het toegangslogboek (' + fmtDateTime(first.createdAt) + ').'
            : 'Nog geen klantregel in het toegangslogboek.');
        }, function(){ setGl('klant', 'warn', 'Toegangslogboek niet leesbaar.'); });
      }
    }
    var glCheckBtn = el('button', { type:'button', class:'btn small', text:'Controleer nu' });
    glCheckBtn.addEventListener('click', runGoLiveChecks);
    var glCard = el('div', { class:'card', style:'padding:6px 18px;' }, [
      glRow('config', '1. Supabase-project + config',
        'Maak het project aan op supabase.com en vul supabaseUrl + supabaseAnonKey in portal/config.js.'),
      glRow('migraties', '2. Migraties 0001 t/m 0005',
        'Draai supabase/portal/0001_portal_schema.sql t/m 0005_admin.sql één keer, op volgorde, in de SQL editor.'),
      glRow('rls', '3. RLS-policies', 'De migraties bevatten alle policies (is_staff() / owns_project). Controleer in het dashboard onder Database → Policies dat elke tabel RLS aan heeft staan.',
        glManual('rls', 'Gecontroleerd: RLS staat aan op alle tabellen')),
      glRow('resend', '4. Resend-domein + mailfunctie',
        'Verifieer het afzenderdomein in Resend (SPF + DKIM) en zet RESEND_API_KEY + NOTIFY_SHARED_SECRET als env vars op Netlify.',
        glManual('resendDomein', 'Domein geverifieerd in Resend (SPF + DKIM groen)')),
      glRow('portalurl', '5. Portal-URL', 'De links in klantmails wijzen naar portal.html op deze host.'),
      glRow('klant', '6. Eerste echte klantaccount',
        'Nodig de eerste klant uit via de klantkaart (Toegang & veiligheid); zodra de eerste login in het toegangslogboek staat, vinkt deze stap zichzelf af.',
        glManual('klantUitgenodigd', 'Account aangemaakt en uitnodiging verstuurd'))
    ]);
    var glSection = sectionBlock('De brug naar live — automatische checks waar het kan, eerlijke vinkjes waar het niet kan', 'Go-live',
      el('span', { style:'display:inline-flex;gap:8px;align-items:center;' }, [ glFlash, glCheckBtn ]), glCard);
    content.appendChild(glSection);
    runGoLiveChecks();
    if(settingsFocusGoLive){
      settingsFocusGoLive = false;
      setTimeout(function(){
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        glSection.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block:'start' });
      }, 0);
    }
  });
}

/* voorbeeld per automatische mailcategorie (functie 67): opgebouwd uit
   ECHTE records — bestaat er nog geen passend record, dan zegt de modal
   dat eerlijk in plaats van data te verzinnen */
function openCategoryPreviewModal(def){
  Promise.all([
    DS.listClients(), DS.listAllProjectsWithStages(), DS.listAllInvoices(),
    DS.listAllShipments(), DS.listAllSamples(), DS.listAllMedia(),
    DS.listAllDocuments(), DS.listQuestions(),
    DS.listAllInspections ? DS.listAllInspections() : Promise.resolve([])
  ]).then(function(res){
    var clients = res[0], projects = res[1], invoices = res[2], shipments = res[3];
    var samples = res[4], media = res[5], docs = res[6], questions = res[7], inspections = res[8];
    var cmap = {}, pmap = {};
    clients.forEach(function(c){ cmap[c.id] = c; });
    projects.forEach(function(p){ pmap[p.id] = p; });
    function ctxFor(projectId){
      var p = pmap[projectId];
      return { p: p || null, c: p ? (cmap[p.clientId] || null) : null };
    }
    function newest(arr, field){
      var best = null;
      (arr||[]).forEach(function(r){
        if(!best || String(r[field]||'') > String(best[field]||'')) best = r;
      });
      return best;
    }
    var SHIP = window.CP_SHIPPING;
    var ex = null, missing = '';
    if(def.key==='faseDone' || def.key==='faseAwaiting'){
      var want = def.key==='faseDone' ? 'done' : 'awaiting_approval';
      var hit = null;
      projects.forEach(function(p){
        (p.stages||[]).forEach(function(s){ if(!hit && s.status===want) hit = { p:p, s:s }; });
      });
      if(!hit && projects.length){
        var p0 = projects[projects.length-1];
        var s0 = (p0.stages||[])[0];
        if(s0) hit = { p:p0, s:s0 };
      }
      if(hit){
        var ctx1 = ctxFor(hit.p.id);
        if(ctx1.c) ex = {
          client: ctx1.c, projectName: hit.p.name, projectCode: hit.p.code,
          page:'mijlpalen', portalLabel:'Bekijk het mijlpalenpad', category:'fase',
          subject: mailSubject(def.key, { fase: stageLabel(hit.s.stageKey), project: hit.p.name }),
          bodyLine: window.CP_STATUS.fill(
            def.key==='faseDone' ? window.CP_STATUS.templates.stageDone : window.CP_STATUS.templates.stageAwaiting,
            { fase: stageLabel(hit.s.stageKey) })
        };
      }
      if(!ex) missing = 'project met fases';
    } else if(def.key==='antwoord'){
      var q = newest(questions.filter(function(q2){ return q2.answeredAt; }), 'answeredAt');
      if(q){
        var ctx2 = ctxFor(q.projectId);
        if(ctx2.p && ctx2.c) ex = {
          client: ctx2.c, projectName: ctx2.p.name, projectCode: ctx2.p.code,
          page:'updates', portalLabel:'Bekijk het antwoord', category:'update',
          subject: mailSubject('antwoord', { project: ctx2.p.name }),
          bodyLine:'Steffan heeft gereageerd op je vraag: “' + q.question + '”'
        };
      }
      if(!ex) missing = 'beantwoorde vraag';
    } else if(def.key==='publicatie'){
      var mrow = newest(media, 'capturedAt');
      if(mrow){
        var ctx3 = ctxFor(mrow.projectId);
        if(ctx3.p && ctx3.c) ex = {
          client: ctx3.c, projectName: ctx3.p.name, projectCode: ctx3.p.code,
          page:'updates', portalLabel:'Bekijk de update', category:'publicatie',
          subject: mailSubject('publicatie', { project: ctx3.p.name }),
          bodyLine:'Er staat een nieuwe foto bij ' + stageLabel(mrow.stageKey) + ': ' + (mrow.caption||'')
        };
      }
      if(!ex) missing = 'foto';
    } else if(def.key==='document'){
      var drow = newest(docs, 'createdAt');
      if(drow){
        var ctx4 = ctxFor(drow.projectId);
        if(ctx4.p && ctx4.c) ex = {
          client: ctx4.c, projectName: ctx4.p.name, projectCode: ctx4.p.code,
          page:'documenten', portalLabel:'Bekijk het document', category:'document',
          subject: mailSubject('document', { project: ctx4.p.name }),
          bodyLine:'Er is een nieuw document geplaatst: ' + (drow.title||'') + '.'
        };
      }
      if(!ex) missing = 'document';
    } else if(def.key==='sample'){
      var smp = newest(samples, 'roundDate');
      if(smp){
        var ctx5 = ctxFor(smp.projectId);
        if(ctx5.p && ctx5.c) ex = {
          client: ctx5.c, projectName: ctx5.p.name, projectCode: ctx5.p.code,
          page:'samples', portalLabel:'Bekijk de sample-ronde', category:'sample',
          subject: mailSubject('sample', { project: ctx5.p.name }),
          bodyLine:'Ronde ' + smp.roundLabel + ' is beschikbaar.'
        };
      }
      if(!ex) missing = 'sampleronde';
    } else if(def.key==='inspectie'){
      var insp = newest(inspections, 'reportDate');
      if(insp){
        var ctx6 = ctxFor(insp.projectId);
        if(ctx6.p && ctx6.c) ex = {
          client: ctx6.c, projectName: ctx6.p.name, projectCode: ctx6.p.code,
          page:'kwaliteit', portalLabel:'Bekijk het rapport', category:'inspectie',
          subject: mailSubject('inspectie', { project: ctx6.p.name }),
          bodyLine:'Het ' + String(insp.checkpoint||'').toUpperCase() + '-rapport staat klaar' + (insp.passed ? ', binnen norm.' : '.')
        };
      }
      if(!ex) missing = 'inspectierapport';
    } else if(def.key==='zending' || def.key==='mijlpaal' || def.key==='mijlpalen' || def.key==='eta'){
      var srow = def.key==='eta'
        ? newest(shipments.filter(function(s2){ return s2.etaWindowStart && s2.etaWindowEnd; }), 'createdAt')
        : newest(shipments, 'createdAt');
      if(srow){
        var ctx7 = ctxFor(srow.projectId);
        if(ctx7.p && ctx7.c){
          var msTpl = SHIP.milestonesFor(srow.type);
          if(def.key==='zending') ex = {
            client: ctx7.c, projectName: ctx7.p.name, projectCode: ctx7.p.code,
            page:'zendingen', portalLabel:'Volg je zending', category:'zending',
            subject: mailSubject('zending', { project: ctx7.p.name }),
            bodyLine:'Steffan heeft een ' + SHIP.typeLabel(srow.type) + ' aangemaakt. Je kunt de reis vanaf nu volgen in je portaal.'
          };
          else if(def.key==='mijlpaal') ex = {
            client: ctx7.c, projectName: ctx7.p.name, projectCode: ctx7.p.code,
            page:'zendingen', portalLabel:'Volg je zending', category:'zending',
            subject: mailSubject('mijlpaal', { mijlpaal: msTpl[0].label, project: ctx7.p.name }),
            bodyLine:'Nieuwe mijlpaal: ' + msTpl[0].label + '.'
          };
          else if(def.key==='mijlpalen') ex = {
            client: ctx7.c, projectName: ctx7.p.name, projectCode: ctx7.p.code,
            page:'zendingen', portalLabel:'Volg je zending', category:'zending',
            subject: mailSubject('mijlpalen', { n: 2, project: ctx7.p.name }),
            bodyLine:'2 stappen afgerond: ' + msTpl[0].label + ' (' + fmtDate(todayISO()) + ') · ' + msTpl[Math.min(1, msTpl.length-1)].label + ' (' + fmtDate(todayISO()) + ').'
          };
          else ex = {
            client: ctx7.c, projectName: ctx7.p.name, projectCode: ctx7.p.code,
            page:'zendingen', portalLabel:'Volg je zending', category:'zending',
            subject: mailSubject('eta', { project: ctx7.p.name }),
            bodyLine:'Het ETA-venster van je zending is bijgewerkt: ' + fmtDate(srow.etaWindowStart) + ' – ' + fmtDate(srow.etaWindowEnd) + '.'
          };
        }
      }
      if(!ex) missing = def.key==='eta' ? 'zending met ETA-venster' : 'zending';
    }
    if(!ex){
      var m2 = openModal('Mailvoorbeeld — ' + def.label, 'Geen echt voorbeeld beschikbaar');
      m2.body.appendChild(el('p', { style:'font-size:14px;color:var(--gray-69);', text:
        'Er is nog geen ' + (missing||'passend record') + ' in de data — en er wordt niets verzonnen. Zodra het eerste echte record bestaat, verschijnt het voorbeeld hier.' }));
      m2.body.appendChild(el('div', { class:'modal-actions' },
        el('button', { type:'button', class:'btn', text:'Sluiten', onclick:closeModal })));
      return;
    }
    openTestPreviewModal('Mailvoorbeeld — ' + def.label, ex,
      'Opgebouwd uit echte projectdata (' + ex.projectName + '). De testverzending gaat naar jezelf, nooit naar de klant.');
  }).catch(showError);
}
/* back-upbestand inlezen → bevestigen → terugzetten in demomodus + hersteltest */
function handleBackupFile(file){
  var reader = new FileReader();
  reader.onload = function(){
    var parsed;
    try{ parsed = JSON.parse(String(reader.result)); }
    catch(e){ showBackupResult(null, null, 'Dit bestand is geen geldige JSON.'); return; }
    var data = (parsed && parsed.format==='cp-backup' && parsed.data) ? parsed.data : parsed;
    if(!data || !Array.isArray(data.clients) || !Array.isArray(data.projects)){
      showBackupResult(null, null, 'Dit bestand mist de kern van een back-up (klanten en projecten).');
      return;
    }
    var meta = (parsed && parsed.format==='cp-backup') ? parsed : null;
    var m = openModal('Back-up herstellen', meta && meta.exportedAt ? 'Geëxporteerd ' + fmtDateTime(meta.exportedAt) : 'Zonder exportdatum');
    var lines = BACKUP_COLLECTIONS.map(function(k){
      var n = Array.isArray(data[k]) ? data[k].length : 0;
      return k + ': ' + n;
    }).join(' · ');
    m.body.appendChild(el('p', { style:'font-size:14px;color:var(--gray-69);margin-bottom:10px;', text:
      'Dit overschrijft de huidige demodata in deze browser. Inhoud van het bestand:' }));
    m.body.appendChild(el('p', { class:'kicker', style:'margin-bottom:14px;line-height:1.9;', text:lines }));
    m.body.appendChild(el('div', { class:'modal-actions' }, [
      el('button', { type:'button', class:'btn ghost', text:'Annuleren', onclick:closeModal }),
      el('button', { type:'button', class:'btn', text:'Zet terug in demomodus', onclick:function(){
        closeModal();
        restoreBackup(data);
      } })
    ]));
  };
  reader.onerror = function(){ showBackupResult(null, null, 'Het bestand kon niet worden gelezen.'); };
  reader.readAsText(file);
}
function restoreBackup(data){
  var writeOk = true;
  try{ localStorage.setItem(DEMO_KEY, JSON.stringify(data)); }
  catch(e){ writeOk = false; }
  if(!writeOk){
    showBackupResult(null, null, 'Terugzetten mislukte: de browseropslag weigerde het bestand (mogelijk te groot of geblokkeerd).');
    return;
  }
  /* hersteltest: direct terugLEZEN en de aantallen per collectie vergelijken */
  var report = [], allOk = true;
  try{
    var back = JSON.parse(localStorage.getItem(DEMO_KEY));
    BACKUP_COLLECTIONS.forEach(function(k){
      var want = Array.isArray(data[k]) ? data[k].length : 0;
      var got = (back && Array.isArray(back[k])) ? back[k].length : 0;
      if(want !== got) allOk = false;
      report.push({ name:k, want:want, got:got });
    });
  }catch(e){ allOk = false; }
  var demoActive = DS && DS.mode==='demo';
  if(demoActive){
    DS = makeDemoService();
    updateBadge();
    refresh();
  }
  showBackupResult(report, allOk, null, demoActive);
}
function showBackupResult(report, allOk, errorMsg, demoActive){
  var m = openModal('Hersteltest', errorMsg ? 'Niet hersteld' : (allOk ? 'Back-up hersteld en geverifieerd' : 'Hersteld, maar met afwijkingen'));
  if(errorMsg){
    m.body.appendChild(el('p', { style:'font-size:14px;color:var(--critical);', text:errorMsg }));
  } else {
    var wrap = el('div', { style:'margin-bottom:6px;' });
    (report||[]).forEach(function(r){
      wrap.appendChild(el('div', { class:'statusline' }, [
        el('span', { class:'kicker', text:r.name }),
        el('span', { class:'mono', style:'font-size:12.5px;' + (r.want===r.got ? 'color:var(--green);' : 'color:var(--critical);'),
          text: r.got + ' / ' + r.want + (r.want===r.got ? ' ✓' : ' ✗') })

      ? (demoActive

        : 'Alle collecties zijn teruggelezen met dezelfde aantallen. De herstelde data staat klaar in de demomodus van deze browser.')
      : 'Eén of meer collecties kwamen niet volledig terug. Vertrouw deze back-up niet blind — controleer het bestand.' }));
  }
  m.body.appendChild(el('div', { class:'modal-actions' },

/* klantgezondheid op kale feiten (functie 25): geen verzonnen score —
   uitsluitend feiten uit het toegangslogboek, de vragen, de facturen en de
   contactmomenten. NB: het portaal logt downloads, geen aparte logins; de
   jongste klant-logregel is dus eerlijk 'laatste portaalactiviteit'. */
function computeClientHealth(c, clientProjects, questions, invoices, logRows, moments, mailRows){
  var pidSet = {};
  (clientProjects||[]).forEach(function(p){ pidSet[p.id] = true; });
  var lastClientAct = null;
  (logRows||[]).forEach(function(r){
    if(r.actor==='client' && pidSet[r.projectId] && (!lastClientAct || String(r.createdAt) > String(lastClientAct))) lastClientAct = r.createdAt;
  });
  var lastContact = null;
  function bump(v){ if(v && (!lastContact || String(v) > String(lastContact))) lastContact = v; }
  (moments||[]).forEach(function(mnt){ if(mnt.clientId===c.id) bump(mnt.at); });
  (mailRows||[]).forEach(function(r){ if(r.clientId===c.id) bump(r.createdAt); });
  (questions||[]).forEach(function(q){ if(pidSet[q.projectId] && q.answeredAt) bump(q.answeredAt); });
  var oldQ = 0;
  (questions||[]).forEach(function(q){
    if(pidSet[q.projectId] && !q.answeredAt){
      var age = daysSince(q.askedAt);
      if(age!=null && age > 2) oldQ++;
    }
  });
  var inv30 = 0;
  var openSum = {};
  (invoices||[]).forEach(function(inv){
    /* conceptfacturen (golf 8) zijn nog niet verstuurd: geen openstaand geld */
    if(!pidSet[inv.projectId] || inv.status!=='open' || isConcept(inv)) return;
    var age = daysSince(inv.createdAt);
    if(age!=null && age >= 30) inv30++;
    var cur = CURRENCIES.indexOf(inv.currency) > -1 ? inv.currency : 'EUR';
    openSum[cur] = (openSum[cur]||0) + (inv.amountCents||0);
  });
  var loginDays = lastClientAct ? daysSince(lastClientAct) : null;
  var contactDays = lastContact ? daysSince(lastContact) : null;
  var level = 'ok';
  if(contactDays==null || contactDays > 30) level = 'let';
  if(oldQ > 0 || inv30 > 0) level = 'rood';
  function dagen(n, leeg){
    if(n==null) return leeg;
    if(n===0) return 'vandaag';
    return n + (n===1 ? ' dag geleden' : ' dagen geleden');
  }
  return {
    level: level,
    label: level==='rood' ? 'Actie nodig' : (level==='let' ? 'Aandacht' : 'OK'),
    chipCls: level==='rood' ? 'crit' : (level==='let' ? 'awaiting' : 'done'),
    facts: [
      ['Laatste portaalactiviteit (toegangslogboek)', dagen(loginDays, 'nog geen klantactiviteit gelogd')],
      ['Laatste contactmoment', dagen(contactDays, 'nog geen contactmoment vastgelegd')],
      ['Vragen ouder dan 2 dagen', String(oldQ)],
      ['Facturen 30+ dagen open', String(inv30)]
    ],
    oldQ: oldQ, inv30: inv30, loginDays: loginDays, contactDays: contactDays,
    lastClientAct: lastClientAct, lastContact: lastContact, openSum: openSum
  };
}
/* lifecycle voor één klant (functie 23): override uit instellingen wint */
function clientLifecycle(c, clientProjects, health, overrides){
  var ov = overrides && overrides[c.id];
  if(ov && lifecycleLabel(ov)) return { key:ov, manual:true };
  var lastAct = null;
  [health && health.lastClientAct, health && health.lastContact].forEach(function(v){
    if(v && (!lastAct || String(v) > String(lastAct))) lastAct = v;
  });
  (clientProjects||[]).forEach(function(p){
    if(p.archivedAt && (!lastAct || String(p.archivedAt) > String(lastAct))) lastAct = p.archivedAt;
  });
  return { key: lifecycleAuto(clientProjects, lastAct), manual:false };
}
function renderClients(){
  return Promise.all([
    DS.listClients(), DS.listAllProjects(), DS.listQuestions(), DS.listAllInvoices(),
    DS.listLog(null),
    DS.listContactMoments ? DS.listContactMoments() : Promise.resolve([]),
    DS.listMailLog ? DS.listMailLog() : Promise.resolve([]),
    DS.getSettings()
  ]).then(function(res){
    var clients = res[0], projects = res[1], questions = res[2], invoices = res[3];
    var logRows = res[4], moments = res[5], mailRows = res[6], settings = res[7];
    adminSettings = settings;
    var overrides = settings.lifecycleOverrides || {};
    var projByClient = {};
    projects.forEach(function(p){ (projByClient[p.clientId] = projByClient[p.clientId] || []).push(p); });

    var rows = clients.map(function(c){
      var projs = projByClient[c.id] || [];
      var health = computeClientHealth(c, projs, questions, invoices, logRows, moments, mailRows);
      var lc = clientLifecycle(c, projs, health, overrides);
      return { c:c, health:health, lc:lc };
    });

    content.appendChild(el('div', { class:'pagehead' }, [
      el('div', null, [
        el('span', { class:'kicker', text:'CRM' }),
        el('h1', { text:'Klanten' })
      ]),
      el('button', { type:'button', class:'btn', text:'Nieuwe klant', onclick:openNewClientModal })
    ]));

    /* lifecycle-filterchips (functie 23) */
    var chipBar = el('div', { class:'tabbar', role:'tablist', 'aria-label':'Filter op lifecycle' });
    function filterChip(key, labelTxt, count){
      return el('button', {
        type:'button', class:'tabbtn' + (clientsFilter===key ? ' active' : ''), role:'tab',
        'aria-selected': clientsFilter===key ? 'true' : 'false',
        text: labelTxt + (count!=null ? ' (' + count + ')' : ''),
        onclick:function(){ if(clientsFilter!==key){ clientsFilter = key; refresh(); } }
      });
    }
    chipBar.appendChild(filterChip('', 'Alle', rows.length));
    LIFECYCLES.forEach(function(lc){
      var n = rows.filter(function(r){ return r.lc.key===lc.key; }).length;
      if(n || clientsFilter===lc.key) chipBar.appendChild(filterChip(lc.key, lc.label, n));
    });
    content.appendChild(chipBar);

    var shown = rows.filter(function(r){ return !clientsFilter || r.lc.key===clientsFilter; });
    var list = el('div', { class:'card rowlist' });
    if(!shown.length){
      list.appendChild(el('div', { class:'empty', text: clients.length
        ? 'Geen klanten met deze lifecycle-status.'
        : 'Nog geen klanten. Voeg je eerste klant toe.' }));
    }
    shown.forEach(function(r){
      var c = r.c;
      /* slapende klanten (functie 34): geen dichte rij-knop maar een rij met
         een reactivatie-actie ernaast — de check-in-mail in één klik */
      if(r.lc.key==='slapend'){
        var lastProj = (projByClient[c.id]||[]).slice().sort(function(a,b){
          return String(b.createdAt||'').localeCompare(String(a.createdAt||''));
        })[0];
        var slRow = el('div', { class:'rowitem' }, [
          el('div', { class:'rowmain' }, [
            el('div', { class:'rowtitle', text:c.company }),
            el('div', { class:'rowsub', text:[c.contactName, c.email].filter(Boolean).join(' · ') })
          ]),
          el('span', { class:'chip', text: lifecycleLabel(r.lc.key) + (r.lc.manual ? ' ✎' : '') }),
          el('span', { class:'chip ' + r.health.chipCls, text: r.health.label }),
          el('div', { class:'vd-actions' }, [
            el('button', { type:'button', class:'btn ghost small', text:'Open klant', onclick:function(){ go({ name:'client', clientId:c.id }); } }),
            el('button', { type:'button', class:'btn small', text:'Check-in-mail', onclick:function(){
              openCheckinModal(c, lastProj ? lastProj.name : '');
            } })
          ])
        ]);
        kbRegister(slRow, { open:function(){ go({ name:'client', clientId:c.id }); } });
        list.appendChild(slRow);
        return;
      }
      var rowBtn = el('button', {
        type:'button', class:'rowitem link',
        onclick:function(){ go({ name:'client', clientId:c.id }); }
      }, [
        el('div', { class:'rowmain' }, [
          el('div', { class:'rowtitle', text:c.company }),
          el('div', { class:'rowsub', text:[c.contactName, c.email, c.phone].filter(Boolean).join(' · ') })
        ]),
        el('span', { class:'chip' + (r.lc.key==='actief' ? ' done' : ''), text: lifecycleLabel(r.lc.key) + (r.lc.manual ? ' ✎' : '') }),
        el('span', { class:'chip ' + r.health.chipCls, text: r.health.label }),
        el('span', { class:'chip', text: c.projectCount + (c.projectCount===1 ? ' project' : ' projecten') }),
        el('span', { class:'rowmeta', text: fmtDate(c.createdAt) })
      ]);
      kbRegister(rowBtn, { open:function(){ go({ name:'client', clientId:c.id }); } });
      list.appendChild(rowBtn);
    });
    content.appendChild(list);
  });
}
