<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CUSTOM+ Beheer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --black:#000; --white:#fff; --ink:#111;
  --gray-9:#999; --gray-69:#696969; --gray-a7:#a7a7a7; --gray-f9:#f9f9f9; --gray-f2:#f2f2f2;
  --line:rgba(228,224,219,.6); --line-dark:rgba(255,255,255,.14);
  --green:#1B6E45; --green-soft:rgba(27,110,69,.09);
  --critical:#d97654;
  --font: 'Hanken Grotesk', -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --mono: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
  color-scheme: light;
}
*{ box-sizing:border-box; margin:0; padding:0; }
html{ -webkit-text-size-adjust:100%; }
body{
  font-family:var(--font); font-size:15px; line-height:1.55; color:var(--ink);
  background:var(--gray-f9); min-height:100vh;
}
img{ max-width:100%; display:block; }
button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
input, textarea, select{ font:inherit; color:var(--ink); }
:focus{ outline:none; }
:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; border-radius:4px; }
[hidden]{ display:none !important; }

.kicker{
  font-family:var(--mono); font-size:11px; font-weight:500; letter-spacing:.14em;
  text-transform:uppercase; color:var(--gray-69);
}
.mono{ font-family:var(--mono); }

/* ---------- login ---------- */
.login-wrap{
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
}
.login-card{
  width:100%; max-width:400px; background:var(--white);
  border:1px solid var(--line); border-radius:12px; overflow:hidden;
}
.login-band{
  background:var(--black); color:var(--white); padding:26px 28px 22px;
}
.login-band .wordmark{ font-weight:800; font-size:19px; letter-spacing:.02em; }
.login-band .kicker{ color:var(--gray-a7); margin-top:4px; }
.login-body{ padding:26px 28px 30px; }
.login-body p{ color:var(--gray-69); font-size:14px; margin-bottom:18px; }
.login-error{
  font-size:13.5px; color:var(--critical); margin-top:14px; display:none;
}
.login-error.show{ display:block; }

/* ---------- shell ---------- */
.shell{ display:flex; min-height:100vh; }
.side{
  width:216px; flex:0 0 216px; background:var(--white);
  border-right:1px solid var(--line);
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh;
}
.side-head{ padding:24px 22px 18px; border-bottom:1px solid var(--line); }
.side-head .wordmark{ font-weight:800; font-size:17px; letter-spacing:.02em; }
.side-head .kicker{ margin-top:2px; }
.side nav{ padding:14px 12px; display:flex; flex-direction:column; gap:2px; }
.navbtn{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  width:100%; text-align:left; padding:9px 12px; border-radius:8px;
  font-weight:600; font-size:14.5px; color:var(--gray-69);
  transition:background .25s ease, color .25s ease;
}
.navbtn:hover{ background:var(--gray-f9); color:var(--ink); }
.navbtn.active{ background:var(--gray-f2); color:var(--ink); }
.navbadge{
  font-family:var(--mono); font-size:11px; font-weight:600;
  background:var(--black); color:var(--white); border-radius:999px;
  min-width:20px; height:20px; display:inline-flex; align-items:center; justify-content:center;
  padding:0 6px;
}
.side-foot{ margin-top:auto; padding:16px 22px 20px; border-top:1px solid var(--line); }
.side-foot .who{ font-size:13.5px; font-weight:600; }
.side-foot .who small{ display:block; font-weight:400; color:var(--gray-9); font-size:12.5px; }
.linkbtn{
  font-size:13.5px; color:var(--gray-69); text-decoration:underline;
  text-underline-offset:3px; margin-top:8px; padding:0; border-radius:2px;
  transition:color .25s ease;
}
.linkbtn:hover{ color:var(--ink); }

.main{ flex:1; min-width:0; }
.demobar{
  border-bottom:1px solid var(--line); background:var(--white);
  padding:8px 28px; font-family:var(--mono); font-size:11px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--gray-69);
  display:flex; align-items:center; gap:8px;
}
.demobar .dot{ width:6px; height:6px; border-radius:50%; background:var(--green); flex:0 0 6px; }
.content{ max-width:1080px; margin:0 auto; padding:34px 28px 90px; }

/* ---------- generic ---------- */
.pagehead{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap; }
.pagehead h1{ font-size:24px; font-weight:800; letter-spacing:-.01em; line-height:1.2; }
.pagehead .kicker{ margin-bottom:6px; display:block; }
.backbtn{
  font-family:var(--mono); font-size:11.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--gray-69); margin-bottom:14px; display:inline-block; padding:2px 0;
  transition:color .25s ease;
}
.backbtn:hover{ color:var(--ink); }

.btn{
  display:inline-flex; align-items:center; gap:8px;
  background:var(--black); color:var(--white); font-weight:600; font-size:14px;
  padding:9px 18px; border-radius:9px; border:1px solid var(--black);
  transition:opacity .25s ease;
}
.btn:hover{ opacity:.82; }
.btn:disabled{ opacity:.4; cursor:default; }
.btn.ghost{
  background:var(--white); color:var(--ink); border:1px solid var(--line);
  transition:border-color .25s ease, background .25s ease;
}
.btn.ghost:hover{ opacity:1; border-color:var(--gray-a7); background:var(--gray-f9); }
.btn.small{ font-size:13px; padding:6px 13px; border-radius:8px; }
.btn.danger{ background:var(--white); color:var(--critical); border:1px solid var(--line); }
.btn.danger:hover{ opacity:1; border-color:var(--critical); }
.btn.wide{ width:100%; justify-content:center; }

.card{
  background:var(--white); border:1px solid var(--line); border-radius:12px;
}
.section{ margin-bottom:34px; }
.sectionhead{
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  margin-bottom:12px;
}
.sectionhead h2{ font-size:16.5px; font-weight:700; }
.sectionhead .kicker{ display:block; margin-bottom:2px; }

.rowlist > *{ border-bottom:1px solid var(--line); }
.rowlist > *:last-child{ border-bottom:0; }
.rowitem{ display:flex; align-items:center; gap:14px; padding:14px 18px; }
.rowitem.link{ width:100%; text-align:left; transition:background .25s ease; border-radius:0; }
.rowitem.link:hover{ background:var(--gray-f9); }
.rowmain{ flex:1; min-width:0; }
.rowtitle{ font-weight:600; font-size:14.5px; }
.rowsub{ font-size:13px; color:var(--gray-69); margin-top:1px; }
.rowmeta{ font-family:var(--mono); font-size:11.5px; color:var(--gray-9); white-space:nowrap; }

.chip{
  font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:.1em;
  text-transform:uppercase; padding:3px 9px; border-radius:999px; white-space:nowrap;
  border:1px solid var(--line); color:var(--gray-69); background:var(--white);
}
.chip.done{ background:var(--green-soft); color:var(--green); border-color:transparent; }
.chip.current{ background:var(--black); color:var(--white); border-color:var(--black); }
.chip.awaiting{ color:var(--critical); border-color:var(--critical); }
.chip.crit{ color:var(--critical); border-color:var(--critical); }

.empty{
  padding:26px 18px; text-align:center; color:var(--gray-9); font-size:13.5px;
}

/* ---------- forms ---------- */
.field{ display:block; margin-bottom:14px; }
.flabel{
  display:block; font-family:var(--mono); font-size:10.5px; font-weight:500;
  letter-spacing:.12em; text-transform:uppercase; color:var(--gray-69); margin-bottom:6px;
}
.input, textarea.input, select.input{
  width:100%; background:var(--white); border:1px solid var(--line); border-radius:8px;
  padding:9px 12px; font-size:14.5px; transition:border-color .25s ease;
}
.input:focus-visible{ outline:2px solid var(--ink); outline-offset:1px; }
textarea.input{ resize:vertical; min-height:96px; }
.formrow{ display:flex; gap:12px; }
.formrow > *{ flex:1; }
.checkline{ display:flex; align-items:center; gap:9px; font-size:14px; margin-bottom:14px; cursor:pointer; }
.checkline input{ width:16px; height:16px; accent-color:var(--black); }
.formerr{ color:var(--critical); font-size:13.5px; margin:2px 0 12px; display:none; }
.formerr.show{ display:block; }
.saveflash{
  font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--green); opacity:0; transition:opacity .25s ease; margin-left:12px;
}
.saveflash.show{ opacity:1; }

/* ---------- modal ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(17,17,17,.4); z-index:60;
  display:flex; align-items:flex-start; justify-content:center;
  padding:6vh 18px 18px; overflow-y:auto;
}
.modal{
  background:var(--white); border-radius:12px; width:100%; max-width:520px;
  border:1px solid var(--line); padding:24px 26px 26px; margin-bottom:6vh;
}
.modal h2{ font-size:17px; font-weight:700; margin-bottom:4px; }
.modal .kicker{ margin-bottom:16px; display:block; }
.modal-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:20px; flex-wrap:wrap; }

/* ---------- klantdetail ---------- */
.contactgrid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:0; }
.contactcell{ padding:16px 18px; border-bottom:1px solid var(--line); }
.contactcell .kicker{ font-size:10px; margin-bottom:3px; display:block; }
.contactcell div{ font-size:14.5px; font-weight:500; word-break:break-word; }
.notesbox{ padding:18px; }

/* ---------- fasebalk ---------- */
.stagegrid{ display:flex; flex-direction:column; }
.stagerow{ display:flex; align-items:center; gap:14px; padding:12px 18px; }
.stagenum{ font-family:var(--mono); font-size:11px; color:var(--gray-9); width:20px; flex:0 0 20px; }
.stagename{ flex:1; font-weight:600; font-size:14px; min-width:0; }
.stagename small{ display:block; font-family:var(--mono); font-size:10.5px; font-weight:400; color:var(--gray-9); letter-spacing:.06em; }
.stagesel{ width:190px; flex:0 0 190px; }

/* ---------- media ---------- */
.mediagrid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:14px; }
.mediacard{ background:var(--white); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
.mediacard img{ width:100%; aspect-ratio:4/3; object-fit:cover; background:var(--gray-f2); }
.mediacard .mbody{ padding:12px 14px 13px; }
.mediacard .mcap{ font-size:13.5px; line-height:1.45; }
.mediastrip{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  font-family:var(--mono); font-size:10.5px; color:var(--gray-9); margin-top:9px;
  letter-spacing:.04em;
}
.mediastrip button{ color:var(--gray-9); text-decoration:underline; text-underline-offset:2px; transition:color .25s ease; }
.mediastrip button:hover{ color:var(--critical); }
.stagekick{ margin:18px 0 10px; }
.stagekick:first-child{ margin-top:0; }

/* beeldkeuze in modal */
.imgpickgrid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(86px, 1fr)); gap:8px; margin-bottom:6px; }
.imgpick{ border:2px solid transparent; border-radius:8px; overflow:hidden; padding:0; transition:border-color .25s ease; }
.imgpick img{ aspect-ratio:1; object-fit:cover; }
.imgpick[aria-pressed="true"]{ border-color:var(--black); }

/* ---------- inspecties ---------- */
.insp{ padding:16px 18px; }
.insphead{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.insphead .cp{ font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; }
.inspmeta{ font-size:13px; color:var(--gray-69); margin-top:4px; }
.defrow{ display:flex; align-items:baseline; gap:10px; font-size:13.5px; padding:7px 0; border-top:1px dashed var(--line); margin-top:7px; }
.defcount{ font-family:var(--mono); font-size:12px; color:var(--gray-69); }
.defform{ display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
.defform select{ width:110px; }
.defform .cnt{ width:70px; }
.defform .note{ flex:1; min-width:140px; }
.defform .rm{ color:var(--gray-9); font-size:18px; line-height:1; padding:4px 6px; border-radius:6px; }
.defform .rm:hover{ color:var(--critical); }

/* ---------- vragen ---------- */
.qcard{ padding:18px; }
.qhead{ display:flex; gap:14px; align-items:flex-start; }
.qthumb{ width:76px; height:76px; flex:0 0 76px; border-radius:8px; object-fit:cover; background:var(--gray-f2); border:1px solid var(--line); }
.qtext{ font-size:15.5px; font-weight:600; line-height:1.45; margin-top:5px; }
.qanswer{ margin-top:14px; }
.qanswered{ background:var(--gray-f9); border-radius:8px; padding:12px 14px; margin-top:12px; font-size:14px; }
details.answered summary{
  cursor:pointer; list-style:none; padding:14px 18px; font-weight:600; font-size:14px;
  display:flex; align-items:center; gap:8px;
}
details.answered summary::-webkit-details-marker{ display:none; }
details.answered summary::before{ content:'+'; font-family:var(--mono); color:var(--gray-9); }
details.answered[open] summary::before{ content:'\2013'; }

/* ---------- logboek ---------- */
.logrow{ display:flex; gap:14px; padding:11px 18px; font-size:13.5px; align-items:baseline; }
.logwhen{ font-family:var(--mono); font-size:11px; color:var(--gray-9); flex:0 0 150px; white-space:nowrap; }
.logactor{ flex:0 0 66px; }
.logdetail{ flex:1; min-width:0; }
.logproj{ font-family:var(--mono); font-size:11px; color:var(--gray-9); white-space:nowrap; }

/* ---------- zendingen ---------- */
details.shipdet summary{ list-style:none; cursor:pointer; }
details.shipdet summary::-webkit-details-marker{ display:none; }
.shiprow{
  display:flex; align-items:center; gap:10px; padding:9px 18px;
  border-top:1px dashed var(--line); font-size:13.5px;
}
.shiprow .ms-label{ flex:1; min-width:0; font-weight:600; }
.shiprow.openms .ms-label{ color:var(--gray-9); font-weight:500; }
.shiprow .ms-meta{ font-family:var(--mono); font-size:11px; color:var(--gray-9); white-space:nowrap; }
.shipcheck{
  display:flex; gap:8px; align-items:center; flex-wrap:wrap;
  padding:10px 18px; border-top:1px dashed var(--line); background:var(--gray-f9);
}
.shipcheck .input{ width:auto; }
.shipcheck .dt{ width:150px; }
.shipcheck .loc{ width:150px; }
.shipcheck .nt{ flex:1; min-width:140px; }
.shipfoot{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:10px 18px; border-top:1px solid var(--line);
}
.nrhint{
  font-family:var(--mono); font-size:11px; letter-spacing:.06em;
  color:var(--gray-69); margin:-6px 0 12px; min-height:1.2em;
}
.nrhint.ok{ color:var(--green); }
.nrhint.bad{ color:var(--critical); }

/* ---------- responsive ---------- */
@media (max-width:820px){
  .shipcheck .dt, .shipcheck .loc{ width:100%; }
  .shell{ flex-direction:column; }
  .side{ width:100%; flex:none; height:auto; position:static; border-right:0; border-bottom:1px solid var(--line); }
  .side-head{ padding:16px 18px 12px; border-bottom:0; }
  .side nav{ flex-direction:row; padding:0 12px 10px; overflow-x:auto; }
  .navbtn{ white-space:nowrap; width:auto; }
  .side-foot{ display:none; }
  .demobar{ padding:8px 18px; }
  .content{ padding:24px 16px 70px; }
  .formrow{ flex-direction:column; gap:0; }
  .stagerow{ flex-wrap:wrap; }
  .stagesel{ width:100%; flex:1 1 100%; margin-left:34px; }
  .logwhen{ flex-basis:118px; }
  .logrow{ flex-wrap:wrap; }
}
</style>
</head>
<body>

<!-- login -->
<div id="login" class="login-wrap">
  <div class="login-card">
    <div class="login-band">
      <div class="wordmark">CUSTOM+</div>
      <div class="kicker">Beheer &amp; CRM</div>
    </div>
    <div class="login-body" id="loginBody"></div>
  </div>
</div>

<!-- app -->
<div id="app" class="shell" hidden>
  <aside class="side">
    <div class="side-head">
      <div class="wordmark">CUSTOM+</div>
      <div class="kicker">Beheer</div>
    </div>
    <nav aria-label="Hoofdnavigatie">
      <button type="button" class="navbtn" data-nav="clients">Klanten</button>
      <button type="button" class="navbtn" data-nav="factories">Fabrieken</button>
      <button type="button" class="navbtn" data-nav="questions"><span>Vragen</span><span class="navbadge" id="qBadge" hidden>0</span></button>
      <button type="button" class="navbtn" data-nav="log">Logboek</button>
    </nav>
    <div class="side-foot">
      <div class="who"><span id="whoName">—</span><small id="whoMail"></small></div>
      <button type="button" class="linkbtn" id="logoutBtn">Uitloggen</button>
    </div>
  </aside>
  <div class="main">
    <div class="demobar" id="demoBar" hidden>
      <span class="dot" aria-hidden="true"></span>
      <span>Demomodus — wijzigingen blijven lokaal in deze browser</span>
    </div>
    <main class="content" id="content"></main>
  </div>
</div>

<script src="portal/config.js"></script>
<script src="portal/demo-data.js"></script>
<script src="portal/shipping.js"></script>
<script>
(function(){
'use strict';

/* ============================================================
   constanten en helpers
   ============================================================ */
var CFG = window.CP_PORTAL_CONFIG || {};
var IS_DEMO = !(CFG.supabaseUrl && CFG.supabaseAnonKey);
var DEMO_KEY = 'cp_portal_demo_v1';

var STAGES = [
  { key:'concept',    label:'Concept & Industrieel Ontwerp',       pct:25 },
  { key:'dfm',        label:'Ontwerp voor Produceerbaarheid',      pct:0  },
  { key:'sourcing',   label:'Fabriekssourcing & Screening',        pct:35 },
  { key:'tooling',    label:'Tooling, Sampling & Iteratie',        pct:25 },
  { key:'production', label:'Massaproductie & Kwaliteitscontrole', pct:0  },
  { key:'logistics',  label:'Compliance & Logistiek',              pct:15 }
];
function stageLabel(key){
  for(var i=0;i<STAGES.length;i++){ if(STAGES[i].key===key) return STAGES[i].label; }
  return key || '';
}
var STAGE_STATUS = [
  { key:'done',              label:'Afgerond' },
  { key:'current',           label:'Actief' },
  { key:'awaiting_approval', label:'Wacht op akkoord' },
  { key:'upcoming',          label:'Gepland' }
];
function stageStatusLabel(key){
  for(var i=0;i<STAGE_STATUS.length;i++){ if(STAGE_STATUS[i].key===key) return STAGE_STATUS[i].label; }
  return key || '';
}
var DOC_TYPES = [
  { key:'nnn',        label:'NNN' },
  { key:'quote',      label:'Offerte' },
  { key:'invoice',    label:'Factuur' },
  { key:'inspection', label:'Inspectie' },
  { key:'compliance', label:'Compliance' },
  { key:'shipping',   label:'Verzending' },
  { key:'other',      label:'Overig' }
];
function docTypeLabel(key){
  for(var i=0;i<DOC_TYPES.length;i++){ if(DOC_TYPES[i].key===key) return DOC_TYPES[i].label; }
  return key || '';
}
var SAMPLE_STATUS = [
  { key:'reviewed',   label:'Beoordeeld' },
  { key:'approved',   label:'Goedgekeurd' },
  { key:'superseded', label:'Vervangen' }
];
function sampleStatusLabel(key){
  for(var i=0;i<SAMPLE_STATUS.length;i++){ if(SAMPLE_STATUS[i].key===key) return SAMPLE_STATUS[i].label; }
  return key || '';
}
var CHECKPOINTS = [
  { key:'iqc',  label:'IQC — ingangscontrole' },
  { key:'ipqc', label:'IPQC — tijdens productie' },
  { key:'fqc',  label:'FQC — eindcontrole' }
];
var SEVERITIES = [
  { key:'minor',    label:'Klein' },
  { key:'major',    label:'Groot' },
  { key:'critical', label:'Kritiek' }
];
function severityLabel(key){
  for(var i=0;i<SEVERITIES.length;i++){ if(SEVERITIES[i].key===key) return SEVERITIES[i].label; }
  return key || '';
}
function actorLabel(a){
  if(a==='client') return 'Klant';
  if(a==='staff') return 'Beheer';
  if(a==='system') return 'Systeem';
  return a || '';
}
var DEMO_IMAGES = [
  'images/occ-anniversary.jpg','images/occ-christmas.jpg','images/occ-events.jpg',
  'images/occ-launch.jpg','images/occ-newclient.jpg','images/occ-newyear.jpg',
  'images/occ-opening.jpg','images/occ-renewal.jpg','images/occ-sinterklaas.jpg',
  'images/occ-thankyou.jpg'
];

function clone(o){
  return (typeof structuredClone==='function') ? structuredClone(o) : JSON.parse(JSON.stringify(o));
}
function uid(prefix){
  var r = Math.random().toString(36).slice(2,9);
  return prefix + '-' + Date.now().toString(36) + r;
}
function uuid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return uid('f').replace(/[^a-z0-9]/g,'');
}
function todayISO(){
  var d = new Date();
  var m = String(d.getMonth()+1); if(m.length<2) m='0'+m;
  var day = String(d.getDate()); if(day.length<2) day='0'+day;
  return d.getFullYear() + '-' + m + '-' + day;
}
function asDate(v){
  if(!v) return null;
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return new Date(v + 'T00:00:00');
  return new Date(v);
}
function fmtDate(v){
  var d = asDate(v);
  if(!d || isNaN(d.getTime())) return '';
  return d.toLocaleDateString('nl-NL', { day:'numeric', month:'long', year:'numeric' });
}
function fmtDateTime(v){
  var d = asDate(v);
  if(!d || isNaN(d.getTime())) return '';
  return d.toLocaleDateString('nl-NL', { day:'numeric', month:'short', year:'numeric' }) +
    ' ' + d.toLocaleTimeString('nl-NL', { hour:'2-digit', minute:'2-digit' });
}
var euroFmt = new Intl.NumberFormat('nl-NL', { style:'currency', currency:'EUR' });
function fmtMoney(cents){ return euroFmt.format((cents||0)/100); }

/* ============================================================
   klantmeldingen — mailt de klant bij een echte wijziging in zijn project
   ============================================================
   Alleen actief buiten demomodus (echte klantadressen bestaan pas dan) en
   alleen als notifySharedSecret in portal/config.js is ingevuld. Zonder een
   van beide slaat dit stil over — nooit een mail naar demodata of een
   halfgeconfigureerde omgeving. Zie netlify/functions/notify-client.mjs voor
   de kanttekening bij dat "gedeelde wachtwoord": het is een drempel tegen
   toevallig misbruik, geen echte authenticatie zoals een ingelogde sessie
   dat zou zijn — een latere stap is dit vervangen door verificatie van het
   Supabase-sessietoken van de ingelogde staf-gebruiker. */
var PORTAL_BASE = location.origin + '/portal.html';
function notifyClient(opts){
  if(IS_DEMO || !CFG.notifySharedSecret) return Promise.resolve();
  if(!opts || !opts.client || !opts.client.email) return Promise.resolve();
  return fetch('/.netlify/functions/notify-client', {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({
      secret: CFG.notifySharedSecret,
      to: opts.client.email,
      clientName: opts.client.contactName || '',
      subject: opts.subject,
      bodyLine: opts.bodyLine,
      portalUrl: PORTAL_BASE + '#/' + (opts.page || 'mijlpalen'),
      portalLabel: opts.portalLabel || 'Bekijk je project',
      projectName: opts.projectName || '',
      projectCode: opts.projectCode || ''
    })
  }).catch(function(){ /* een mislukte mail mag de eigenlijke actie nooit blokkeren */ });
}
function parseEuro(s){
  s = String(s==null?'':s).replace(/[€\s]/g,'');
  if(!s) return NaN;
  /* NL-notatie: punt is ALTIJD duizendtalscheiding, komma is de decimaal —
     dus punten strippen we altijd, ook zonder komma ("3.125" = 3125, niet 3,125). */
  s = s.replace(/\./g, '').replace(',', '.');
  var n = parseFloat(s);
  if(isNaN(n) || n < 0) return NaN;
  return Math.round(n*100);
}

/* DOM zonder innerHTML: veilig tegen XSS */
function el(tag, attrs, children){
  var n = document.createElement(tag);
  if(attrs){
    Object.keys(attrs).forEach(function(k){
      var v = attrs[k];
      if(v==null) return;
      if(k==='class'){ n.className = v; }
      else if(k==='text'){ n.textContent = v; }
      else if(k==='value'){ n.value = v; }
      else if(k==='checked'){ n.checked = !!v; }
      else if(k==='disabled'){ n.disabled = !!v; }
      else if(k.indexOf('on')===0 && typeof v==='function'){ n.addEventListener(k.slice(2), v); }
      else { n.setAttribute(k, v); }
    });
  }
  if(children!=null){
    (Array.isArray(children)?children:[children]).forEach(function(c){
      if(c==null) return;
      n.appendChild(typeof c==='string' ? document.createTextNode(c) : c);
    });
  }
  return n;
}
function option(value, label, selected){
  var o = el('option', { value:value, text:label });
  if(selected) o.selected = true;
  return o;
}
function field(labelText, input){
  return el('label', { class:'field' }, [ el('span', { class:'flabel', text:labelText }), input ]);
}
function clearNode(n){ while(n.firstChild) n.removeChild(n.firstChild); }

/* ============================================================
   modals
   ============================================================ */
var activeModal = null;
function closeModal(){
  if(activeModal){
    var onDismiss = activeModal.onDismiss;
    document.removeEventListener('keydown', activeModal.esc);
    if(activeModal.node.parentNode) activeModal.node.parentNode.removeChild(activeModal.node);
    activeModal = null;
    /* sluiten via Escape/overlay telt als annuleren voor wie op de uitkomst wacht */
    if(onDismiss) onDismiss();
  }
}
function openModal(title, kicker){
  closeModal();
  var body = el('div');
  var dlg = el('div', { class:'modal', role:'dialog', 'aria-modal':'true', 'aria-label':title }, [
    el('h2', { text:title }),
    kicker ? el('span', { class:'kicker', text:kicker }) : null,
    body
  ]);
  var overlay = el('div', { class:'overlay', onclick:function(e){ if(e.target===overlay) closeModal(); } }, dlg);
  function esc(e){ if(e.key==='Escape') closeModal(); }
  document.addEventListener('keydown', esc);
  document.body.appendChild(overlay);
  activeModal = { node:overlay, esc:esc, onDismiss:null };
  setTimeout(function(){
    var f = dlg.querySelector('input, textarea, select, button');
    if(f) f.focus();
  }, 30);
  return {
    body:body, close:closeModal,
    /* fn wordt aangeroepen als de modal sluit ZONDER expliciete knop
       (Escape of overlay-klik) — bv. om een confirm-Promise alsnog te settelen */
    onDismiss:function(fn){ if(activeModal) activeModal.onDismiss = fn; }
  };
}
function confirmDialog(title, message, confirmText){
  return new Promise(function(resolve){
    var settled = false;
    function settle(v){ if(settled) return; settled = true; resolve(v); }
    var m = openModal(title);
    m.onDismiss(function(){ settle(false); });
    m.body.appendChild(el('p', { text:message, style:'font-size:14px;color:var(--gray-69);' }));
    m.body.appendChild(el('div', { class:'modal-actions' }, [
      el('button', { type:'button', class:'btn ghost', text:'Annuleren', onclick:function(){ settle(false); closeModal(); } }),
      el('button', { type:'button', class:'btn', text:confirmText||'Bevestigen', onclick:function(){ settle(true); closeModal(); } })
    ]));
  });
}

function makeDemoService(){
  var state = null;
  try{
    var raw = localStorage.getItem(DEMO_KEY);
    if(raw) state = JSON.parse(raw);
  }catch(e){ state = null; }
  if(!state || !Array.isArray(state.clients) || !Array.isArray(state.projects)) state = clone(window.CP_DEMO);
  /* schema-drift over apps/versies heen: ontbrekende collecties altijd aanvullen
     in plaats van de hele state te laten crashen op de eerste .push()/.slice().
     Een collectie die pas in een latere versie is geïntroduceerd, vullen we
     vanuit de seed zodat een bestaande demo-opslag de nieuwe functie meteen toont. */
  ['media','documents','invoices','samples','inspections','questions','disclosures','accessLog','factories','shipments','shipmentEvents'].forEach(function(k){
    if(!Array.isArray(state[k])){
      state[k] = (window.CP_DEMO && Array.isArray(window.CP_DEMO[k])) ? clone(window.CP_DEMO[k]) : [];
    }
  });
  /* veld-aanvulling: 'city' (Fabriek op de Kaart) kan in oudere demo-opslag
     ontbreken; vul aan vanuit de seed, per id */
  (state.factories||[]).forEach(function(f){
    if(f.city===undefined){
      var sf = ((window.CP_DEMO && window.CP_DEMO.factories) || []).find(function(x){ return x.id===f.id; });
      f.city = (sf && sf.city) ? sf.city : '';
    }
  });
  function save(){
    try{ localStorage.setItem(DEMO_KEY, JSON.stringify(state)); }catch(e){}
  }
  function pushLog(projectId, entry){
    state.accessLog.push({
      id: uid('log'), projectId: projectId,
      actor: entry.actor, assetKind: entry.assetKind, assetId: entry.assetId || null,
      action: entry.action, detail: entry.detail || '',
      createdAt: new Date().toISOString()
    });
  }
  function findStage(projectId, stageKey){
    var p = state.projects.find(function(x){ return x.id===projectId; });
    if(!p) return null;
    return p.stages.find(function(s){ return s.stageKey===stageKey; }) || null;
  }
  return {
    mode: 'demo',
    staffName: (state.staff && state.staff.name) || 'Steffan Bakker',
    staffEmail: (state.staff && state.staff.email) || '',

    listFactories: function(){ return Promise.resolve(state.factories.slice()); },
    setFactoryCity: function(id, city){
      var f = state.factories.find(function(x){ return x.id===id; });
      if(f){ f.city = city || ''; save(); }
      return Promise.resolve();
    },

    listClients: function(){
      var counts = {};
      state.projects.forEach(function(p){ counts[p.clientId] = (counts[p.clientId]||0)+1; });
      return Promise.resolve(state.clients.map(function(c){
        var o = clone(c); o.projectCount = counts[c.id]||0; return o;
      }));
    },
    getClient: function(id){
      var c = state.clients.find(function(x){ return x.id===id; });
      return Promise.resolve(c ? clone(c) : null);
    },
    createClient: function(data){
      var c = {
        id: uid('cli'), company: data.company, contactName: data.contactName,
        email: data.email, phone: data.phone||'', notes: data.notes||'',
        createdAt: todayISO(), projects: []
      };
      state.clients.push(c); save();
      return Promise.resolve(clone(c));
    },
    saveClientNotes: function(id, notes){
      var c = state.clients.find(function(x){ return x.id===id; });
      if(c){ c.notes = notes; save(); }
      return Promise.resolve();
    },

    listClientProjects: function(clientId){
      return Promise.resolve(state.projects.filter(function(p){ return p.clientId===clientId; }).map(clone));
    },
    listAllProjects: function(){ return Promise.resolve(state.projects.map(clone)); },
    getProject: function(id){
      var p = state.projects.find(function(x){ return x.id===id; });
      return Promise.resolve(p ? clone(p) : null);
    },
    createProject: function(clientId, name, code){
      var p = {
        id: uid('prj'), clientId: clientId, name: name, code: code||'',
        status: 'active', createdAt: todayISO(),
        stages: STAGES.map(function(s, i){
          return { stageKey:s.key, position:i+1, status:(s.key==='concept'?'current':'upcoming'), paymentPct:s.pct, approvedAt:null };
        })
      };
      state.projects.push(p);
      var c = state.clients.find(function(x){ return x.id===clientId; });
      if(c && c.projects) c.projects.push(p.id);
      save();
      return Promise.resolve(clone(p));
    },
    setStageStatus: function(projectId, stageKey, status){
      var s = findStage(projectId, stageKey);
      if(s){
        s.status = status;
        s.approvedAt = (status==='done') ? todayISO() : null;
        pushLog(projectId, {
          actor:'staff', assetKind:'system', action:'update',
          detail:'Fasestatus gewijzigd: ' + stageLabel(stageKey) + ' → ' + stageStatusLabel(status)
        });
        save();
      }
      return Promise.resolve();
    },
    archiveProject: function(projectId){
      var p = state.projects.find(function(x){ return x.id===projectId; });
      if(p){
        p.status = 'archived';
        p.archivedAt = todayISO();
        pushLog(projectId, { actor:'staff', assetKind:'system', action:'archive', detail:'Project gearchiveerd' });
        save();
      }
      return Promise.resolve();
    },

    listMedia: function(projectId){
      return Promise.resolve(state.media.filter(function(m){ return m.projectId===projectId; }).map(clone));
    },
    listAllMedia: function(){ return Promise.resolve(state.media.map(clone)); },
    addMedia: function(projectId, data){
      var m = {
        id: uid('med'), projectId: projectId, stageKey: data.stageKey, kind: 'photo',
        src: data.src, caption: data.caption, factoryId: data.factoryId||null,
        capturedAt: data.capturedAt

      state.media.push(m);
      pushLog(projectId, {
        actor:'staff', assetKind:'media', assetId:m.id, action:'update',
        detail:'Media geplaatst: ' + data.caption
      });
      save();
      return Promise.resolve(clone(m));
    },
    deleteMedia: function(id){
      state.media = state.media.filter(function(m){ return m.id!==id; });
      save();
      return Promise.resolve();
    },
    mediaUrl: function(m){
      return Promise.resolve(m && m.src ? m.src : null);
    },

    listDocuments: function(projectId){
      return Promise.resolve(state.documents.filter(function(d){ return d.projectId===projectId; }).map(clone));
    },
    addDocument: function(projectId, data){
      var d = {
        id: uid('doc'), projectId: projectId, stageKey: data.stageKey,
        docType: data.docType, title: data.title, version: data.version||1,
        createdAt: todayISO()
      };
      state.documents.push(d); save();
      return Promise.resolve(clone(d));
    },
    deleteDocument: function(id){
      state.documents = state.documents.filter(function(d){ return d.id!==id; });
      save();
      return Promise.resolve();
    },

    listInvoices: function(projectId){
      return Promise.resolve(state.invoices.filter(function(i){ return i.projectId===projectId; }).map(clone));
    },
    addInvoice: function(projectId, data){
      var inv = {
        id: uid('inv'), projectId: projectId, stageKey: data.stageKey, label: data.label,
        amountCents: data.amountCents, currency:'EUR', status:'open', paidAt:null, documentId:null
      };
      state.invoices.push(inv); save();
      return Promise.resolve(clone(inv));
    },
    markInvoicePaid: function(id){
      var inv = state.invoices.find(function(i){ return i.id===id; });
      if(inv){ inv.status='paid'; inv.paidAt=todayISO(); save(); }
      return Promise.resolve();
    },

    listSamples: function(projectId){
      return Promise.resolve(state.samples.filter(function(s){ return s.projectId===projectId; }).map(clone));
    },
    addSample: function(projectId, data){
      if(data.status==='approved'){
        state.samples.forEach(function(s){
          if(s.projectId===projectId && s.status==='approved') s.status='superseded';
        });
      }
      var s = {
        id: uid('smp'), projectId: projectId, roundLabel: data.roundLabel,
        mediaId: data.mediaId||null, status: data.status, note: data.note||'',
        roundDate: data.roundDate
      };
      state.samples.push(s); save();
      return Promise.resolve(clone(s));
    },

    listInspections: function(projectId){
      return Promise.resolve(state.inspections.filter(function(i){ return i.projectId===projectId; }).map(clone));
    },
    addInspection: function(projectId, data){
      var r = {
        id: uid('insp'), projectId: projectId, stageKey:'production',
        checkpoint: data.checkpoint, aqlNorm: data.aqlNorm, sampleSize: data.sampleSize,
        defects: data.defects, contextLine: data.contextLine||'',
        reportDate: data.reportDate, passed: !!data.passed
      };
      state.inspections.push(r); save();
      return Promise.resolve(clone(r));
    },

    listDisclosures: function(projectId){
      return Promise.resolve(state.disclosures.filter(function(d){ return d.projectId===projectId; }).map(clone));
    },
    addDisclosure: function(projectId, data){
      var d = {
        id: uid('dis'), projectId: projectId, documentId:null,
        factoryId: data.factoryId, disclosedAt: data.disclosedAt,
        underNnn: !!data.underNnn, what: data.what
      };
      state.disclosures.push(d);
      var fac = state.factories.find(function(f){ return f.id===data.factoryId; });
      pushLog(projectId, {
        actor:'system', assetKind:'system', action:'share',
        detail: data.what + ' gedeeld met ' + (fac?fac.name:'partner') + (data.underNnn ? ' onder NNN' : '')
      });
      save();
      return Promise.resolve(clone(d));
    },

    listShipments: function(projectId){
      return Promise.resolve(state.shipments.filter(function(s){ return s.projectId===projectId; }).map(clone));
    },
    listShipmentEvents: function(shipmentIds){
      var set = {};
      (shipmentIds||[]).forEach(function(id){ set[id] = true; });
      return Promise.resolve(state.shipmentEvents.filter(function(ev){ return set[ev.shipmentId]; }).map(clone));
    },
    addShipment: function(projectId, data){
      var s = {
        id: uid('shp'), projectId: projectId, type: data.type,
        carrierCode: data.carrierCode||'', trackingNumber: data.trackingNumber||'',
        containerNumber: data.containerNumber||'', blNumber: data.blNumber||'',
        sampleRoundId: data.sampleRoundId||null,
        etaWindowStart: data.etaWindowStart||null, etaWindowEnd: data.etaWindowEnd||null,
        etaNote: data.etaNote||'',
        etaUpdatedAt: (data.etaWindowStart||data.etaWindowEnd) ? new Date().toISOString() : null,
        deliveredAt: null, createdAt: todayISO()
      };
      state.shipments.push(s);
      save();
      return Promise.resolve(clone(s));
    },
    addShipmentEvent: function(projectId, shipmentId, data){
      var ev = {
        id: uid('shev'), shipmentId: shipmentId, milestoneKey: data.milestoneKey,
        occurredAt: data.occurredAt, location: data.location||'', note: data.note||'',
        createdAt: new Date().toISOString()
      };
      state.shipmentEvents.push(ev);
      var s = state.shipments.find(function(x){ return x.id===shipmentId; });
      /* de door staff ingevulde (mogelijk teruggedateerde) mijlpaaldatum,
         niet het moment van aanklikken */
      if(s && data.milestoneKey==='geleverd') s.deliveredAt = (data.occurredAt || todayISO()) + 'T12:00:00Z';
      pushLog(projectId, {
        actor:'staff', assetKind:'system', action:'update',

      });

      if(s){

        s.etaWindowEnd = data.etaWindowEnd||null;
        s.etaNote = data.etaNote||'';

      }

    answerQuestion: function(id, answer){
      var q = state.questions.find(function(x){ return x.id===id; });
      if(q){ q.answer = answer; q.answeredAt = new Date().toISOString(); save(); }

    listLog: function(projectId){

      return Promise.resolve(rows.map(clone));
    }

/* ============================================================
   dataservice — Supabase-modus
   ============================================================ */
function loadSupabaseLib(){
  return new Promise(function(resolve, reject){
    if(window.supabase && window.supabase.createClient) return resolve();
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    s.onload = function(){ resolve(); };
    s.onerror = function(){ reject(new Error('Kon de Supabase-bibliotheek niet laden. Controleer je verbinding.')); };
    document.head.appendChild(s);
  });
}
function toCamelKey(k){ return k.replace(/_([a-z])/g, function(m, c){ return c.toUpperCase(); }); }
function camelRow(r){
  var out = {};
  Object.keys(r).forEach(function(k){ out[toCamelKey(k)] = r[k]; });
  return out;
}
function makeSupaService(sb, staffUser){
  function unwrap(res){
    if(res && res.error) throw new Error(res.error.message || 'Er ging iets mis bij het ophalen van gegevens.');
    return res ? res.data : null;
  }
  function rows(res){ return (unwrap(res)||[]).map(camelRow); }
  function row(res){ var d = unwrap(res); return d ? camelRow(d) : null; }
  function log(projectId, entry){
    return sb.from('access_log').insert({
      project_id: projectId, actor: entry.actor, asset_kind: entry.assetKind,
      asset_id: entry.assetId || null, action: entry.action, detail: entry.detail || ''
    }).then(function(){ /* een logfout mag de actie niet blokkeren */ }, function(){});
  }
  function fileExt(name){
    var i = String(name||'').lastIndexOf('.');
    var ext = i > -1 ? String(name).slice(i+1).toLowerCase().replace(/[^a-z0-9]/g,'') : '';
    return ext || 'bin';
  }
  return {
    mode: 'supabase',
    staffName: (staffUser && staffUser.email) || 'Beheer',
    staffEmail: (staffUser && staffUser.email) || '',

    listFactories: function(){
      return sb.from('factories_partners').select('*').order('name').then(rows);
    },
    setFactoryCity: function(id, city){
      /* kolom uit supabase/portal/0003_factory_city.sql */
      return sb.from('factories_partners').update({ city: city || '' }).eq('id', id).then(unwrap);
    },
    listClients: function(){
      return Promise.all([
        sb.from('clients').select('*').order('created_at').then(rows),
        sb.from('projects').select('id, client_id').then(rows)
      ]).then(function(res){
        var counts = {};
        res[1].forEach(function(p){ counts[p.clientId] = (counts[p.clientId]||0)+1; });
        return res[0].map(function(c){ c.projectCount = counts[c.id]||0; return c; });
      });
    },
    getClient: function(id){
      return sb.from('clients').select('*').eq('id', id).maybeSingle().then(row);
    },
    createClient: function(data){
      return sb.from('clients').insert({
        company: data.company, contact_name: data.contactName, email: data.email,
        phone: data.phone||'', notes: data.notes||''
      }).select().single().then(row);
    },
    saveClientNotes: function(id, notes){
      return sb.from('clients').update({ notes: notes }).eq('id', id).then(unwrap);
    },

    listClientProjects: function(clientId){
      return Promise.all([
        sb.from('projects').select('*').eq('client_id', clientId).order('created_at').then(rows),
        sb.from('project_stages').select('*').order('position').then(rows)
      ]).then(function(res){
        return res[0].map(function(p){
          p.stages = res[1].filter(function(s){ return s.projectId===p.id; });
          return p;
        });
      });
    },
    listAllProjects: function(){
      return sb.from('projects').select('*').order('created_at').then(rows);
    },
    getProject: function(id){
      return Promise.all([
        sb.from('projects').select('*').eq('id', id).maybeSingle().then(row),
        sb.from('project_stages').select('*').eq('project_id', id).order('position').then(rows)
      ]).then(function(res){
        if(!res[0]) return null;
        res[0].stages = res[1];
        return res[0];
      });
    },
    createProject: function(clientId, name, code){
      var project = null;
      return sb.from('projects').insert({ client_id: clientId, name: name, code: code||'' })
        .select().single().then(row)
        .then(function(p){
          project = p;
          return sb.from('project_stages').insert(STAGES.map(function(s, i){
            return {
              project_id: p.id, stage_key: s.key, position: i+1,
              status: (s.key==='concept'?'current':'upcoming'), payment_pct: s.pct
            };
          })).then(unwrap);
        })
        .then(function(){ return project; });
    },
    setStageStatus: function(projectId, stageKey, status){
      return sb.from('project_stages')
        .update({ status: status, approved_at: (status==='done' ? new Date().toISOString() : null) })
        .eq('project_id', projectId).eq('stage_key', stageKey)
        .then(unwrap)
        .then(function(){
          return log(projectId, {
            actor:'staff', assetKind:'system', action:'update',
            detail:'Fasestatus gewijzigd: ' + stageLabel(stageKey) + ' → ' + stageStatusLabel(status)
          });
        });
    },
    archiveProject: function(projectId){
      return sb.from('projects')
        .update({ status:'archived', archived_at: new Date().toISOString() })
        .eq('id', projectId).then(unwrap)
        .then(function(){
          return log(projectId, { actor:'staff', assetKind:'system', action:'archive', detail:'Project gearchiveerd' });
        });
    },

    listMedia: function(projectId){
      return sb.from('media_assets').select('*').eq('project_id', projectId).order('captured_at').then(rows);
    },
    listAllMedia: function(){
      return sb.from('media_assets').select('*').then(rows);
    },
    addMedia: function(projectId, data){
      var path = projectId + '/' + uuid() + '.' + fileExt(data.file && data.file.name);
      return sb.storage.from('project-media').upload(path, data.file)
        .then(function(res){
          if(res.error) throw new Error('Upload mislukt: ' + res.error.message);
          return sb.from('media_assets').insert({
            project_id: projectId, stage_key: data.stageKey, kind:'photo',
            storage_path: path, caption: data.caption,
            factory_id: data.factoryId||null, captured_at: data.capturedAt
          }).select().single().then(row);
        })
        .then(function(m){
          return log(projectId, {
            actor:'staff', assetKind:'media', assetId:m.id, action:'update',
            detail:'Media geplaatst: ' + data.caption
          }).then(function(){ return m; });
        });
    },
    deleteMedia: function(id){
      return sb.from('media_assets').delete().eq('id', id).then(unwrap);
    },
    mediaUrl: function(m){
      if(!m || !m.storagePath) return Promise.resolve(m && m.src ? m.src : null);
      return sb.storage.from('project-media').createSignedUrl(m.storagePath, 900)
        .then(function(res){ return res.data ? res.data.signedUrl : null; })
        .catch(function(){ return null; });
    },

    listDocuments: function(projectId){
      return sb.from('documents').select('*').eq('project_id', projectId).order('created_at').then(rows);
    },
    addDocument: function(projectId, data){
      var start = Promise.resolve('');
      if(data.file){
        var path = projectId + '/' + uuid() + '.' + fileExt(data.file.name);
        start = sb.storage.from('project-docs').upload(path, data.file).then(function(res){
          if(res.error) throw new Error('Upload mislukt: ' + res.error.message);
          return path;
        });
      }
      return start.then(function(storagePath){
        return sb.from('documents').insert({
          project_id: projectId, stage_key: data.stageKey, doc_type: data.docType,
          title: data.title, version: data.version||1, storage_path: storagePath
        }).select().single().then(row);
      });
    },
    deleteDocument: function(id){
      return sb.from('documents').delete().eq('id', id).then(unwrap);
    },

    listInvoices: function(projectId){
      return sb.from('invoices').select('*').eq('project_id', projectId).order('created_at').then(rows);
    },
    addInvoice: function(projectId, data){
      return sb.from('invoices').insert({
        project_id: projectId, stage_key: data.stageKey, label: data.label,
        amount_cents: data.amountCents, currency:'EUR', status:'open'
      }).select().single().then(row);
    },
    markInvoicePaid: function(id){
      return sb.from('invoices').update({ status:'paid', paid_at:new Date().toISOString() }).eq('id', id).then(unwrap);
    },

    listSamples: function(projectId){
      return sb.from('sample_rounds').select('*').eq('project_id', projectId).order('round_date').then(rows);
    },
    addSample: function(projectId, data){
      var start = Promise.resolve();
      if(data.status==='approved'){
        start = sb.from('sample_rounds').update({ status:'superseded' })
          .eq('project_id', projectId).eq('status','approved').then(unwrap);
      }
      return start.then(function(){
        return sb.from('sample_rounds').insert({
          project_id: projectId, round_label: data.roundLabel, media_id: data.mediaId||null,
          status: data.status, note: data.note||'', round_date: data.roundDate
        }).select().single().then(row);
      });
    },

    listInspections: function(projectId){
      return sb.from('inspection_reports').select('*').eq('project_id', projectId).order('report_date').then(rows);
    },
    addInspection: function(projectId, data){
      return sb.from('inspection_reports').insert({
        project_id: projectId, stage_key:'production', checkpoint: data.checkpoint,
        aql_norm: data.aqlNorm, sample_size: data.sampleSize, defects: data.defects,
        context_line: data.contextLine||'', report_date: data.reportDate, passed: !!data.passed
      }).select().single().then(row);
    },

    listDisclosures: function(projectId){
      return sb.from('file_disclosures').select('*').eq('project_id', projectId).order('disclosed_at').then(rows);
    },
    addDisclosure: function(projectId, data){
      /* NB: het schema bewaart de omschrijving ("wat") niet als losse kolom
         wanneer er geen document aan hangt; de logregel legt dit vast. */
      return sb.from('file_disclosures').insert({
        project_id: projectId, factory_id: data.factoryId,
        disclosed_at: data.disclosedAt, under_nnn: !!data.underNnn
      }).select().single().then(row)
        .then(function(d){
          return sb.from('factories_partners').select('name').eq('id', data.factoryId).maybeSingle()
            .then(function(res){
              var name = res.data ? res.data.name : 'partner';
              return log(projectId, {
                actor:'system', assetKind:'system', action:'share',
                detail: data.what + ' gedeeld met ' + name + (data.underNnn ? ' onder NNN' : '')
              });
            })
            .then(function(){ return d; });
        });
    },

    listShipments: function(projectId){
      return sb.from('shipments').select('*').eq('project_id', projectId).order('created_at').then(rows);
    },
    listShipmentEvents: function(shipmentIds){
      if(!shipmentIds || !shipmentIds.length) return Promise.resolve([]);
      return sb.from('shipment_events').select('*').in('shipment_id', shipmentIds).order('occurred_at').then(rows);
    },
    addShipment: function(projectId, data){
      return sb.from('shipments').insert({
        project_id: projectId, type: data.type, carrier_code: data.carrierCode||'',
        tracking_number: data.trackingNumber||'', container_number: data.containerNumber||'',
        bl_number: data.blNumber||'', sample_round_id: data.sampleRoundId||null,
        eta_window_start: data.etaWindowStart||null, eta_window_end: data.etaWindowEnd||null,
        eta_note: data.etaNote||'',
        eta_updated_at: (data.etaWindowStart||data.etaWindowEnd) ? new Date().toISOString() : null
      }).select().single().then(row);
    },
    addShipmentEvent: function(projectId, shipmentId, data){
      return sb.from('shipment_events').insert({
        shipment_id: shipmentId, milestone_key: data.milestoneKey,
        occurred_at: data.occurredAt, location: data.location||'', note: data.note||''
      }).select().single().then(row)
        .then(function(ev){
          var chain = Promise.resolve();
          if(data.milestoneKey==='geleverd'){
            chain = sb.from('shipments').update({ delivered_at: (data.occurredAt || todayISO()) + 'T12:00:00Z' })
              .eq('id', shipmentId).then(unwrap);
          }
          return chain.then(function(){
            return log(projectId, {
              actor:'staff', assetKind:'system', action:'update',
              detail:'Zendingmijlpaal afgevinkt: ' + (data.label || data.milestoneKey)
            });
          }).then(function(){ return ev; });
        });
    },
    updateShipmentEta: function(shipmentId, data){
      return sb.from('shipments').update({
        eta_window_start: data.etaWindowStart||null, eta_window_end: data.etaWindowEnd||null,
        eta_note: data.etaNote||'', eta_updated_at: new Date().toISOString()
      }).eq('id', shipmentId).then(unwrap);
    },

    listQuestions: function(){
      return sb.from('question_threads').select('*').then(rows);
    },
    answerQuestion: function(id, answer){
      return sb.from('question_threads')
        .update({ answer: answer, answered_at: new Date().toISOString() })
        .eq('id', id).then(unwrap);
    },

    listLog: function(projectId){
      var q = sb.from('access_log').select('*');
      if(projectId) q = q.eq('project_id', projectId);
      return q.order('created_at', { ascending:false }).limit(500).then(rows);
    }
  };
}

/* ============================================================
   app-state en navigatie
   ============================================================ */
var DS = null;
var view = { name:'clients' };
var logFilter = '';

var content = document.getElementById('content');
var qBadge = document.getElementById('qBadge');

function go(v){
  view = v;
  render().then(function(){ window.scrollTo(0, 0); });
}
function refresh(){
  var y = window.scrollY;
  return render().then(function(){ window.scrollTo(0, y); });
}
function setNavActive(){
  var name = view.name;
  var navKey = (name==='client' || name==='project') ? 'clients' : name;
  document.querySelectorAll('.navbtn').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-nav')===navKey);
  });
}
function updateBadge(){
  if(!DS) return;
  DS.listQuestions().then(function(qs){
    var open = qs.filter(function(q){ return !q.answeredAt; }).length;
    qBadge.textContent = String(open);
    qBadge.hidden = open===0;
  }).catch(function(){});
}
function showError(err){
  clearNode(content);
  content.appendChild(el('div', { class:'card', style:'padding:22px;' }, [
    el('span', { class:'kicker', text:'Er ging iets mis' }),
    el('p', { text: (err && err.message) || String(err), style:'margin-top:8px;font-size:14px;' }),
    el('div', { style:'margin-top:16px;' },
      el('button', { type:'button', class:'btn ghost small', text:'Opnieuw proberen', onclick:function(){ render(); } }))
  ]));
}
function render(){
  setNavActive();
  updateBadge();
  clearNode(content);
  var p;
  if(view.name==='clients') p = renderClients();
  else if(view.name==='client') p = renderClient(view.clientId);
  else if(view.name==='project') p = renderProject(view.projectId);
  else if(view.name==='factories') p = renderFactories();
  else if(view.name==='questions') p = renderQuestions();
  else if(view.name==='log') p = renderLog();
  else p = Promise.resolve();
  return p.catch(showError);
}

/* ============================================================
   deel 1b — klantdetail
   ============================================================ */
function renderClient(clientId){
  return Promise.all([ DS.getClient(clientId), DS.listClientProjects(clientId), DS.listQuestions() ]).then(function(res){
    var c = res[0], projects = res[1], questions = res[2] || [];
    if(!c){
      content.appendChild(el('p', { text:'Klant niet gevonden.' }));
      return;
    }
    /* openstaande herbestelaanvragen (uit "Mijn Producten" in de portal)
       per project van deze klant — groene badge op de klantkaart */
    var reorderByProject = {};
    var pidSet = {};
    projects.forEach(function(p){ pidSet[p.id] = true; });
    questions.forEach(function(q){
      if(pidSet[q.projectId] && !q.answeredAt && String(q.question||'').indexOf('HERBESTELLING:')===0){
        reorderByProject[q.projectId] = true;
      }
    });
    var hasReorder = Object.keys(reorderByProject).length > 0;

    content.appendChild(el('button', { type:'button', class:'backbtn', text:'← Alle klanten', onclick:function(){ go({ name:'clients' }); } }));
    content.appendChild(el('div', { class:'pagehead' }, [
      el('div', null, [
        el('span', { class:'kicker', text:'Klant sinds ' + fmtDate(c.createdAt) }),
        el('h1', { text:c.company })
      ]),
      hasReorder ? el('span', { class:'chip done', text:'Herbestelling' }) : null
    ]));

    /* contactkaart */
    var grid = el('div', { class:'card contactgrid' });
    [ ['Contact', c.contactName], ['E-mail', c.email], ['Telefoon', c.phone||'—'] ].forEach(function(pair){
      grid.appendChild(el('div', { class:'contactcell' }, [
        el('span', { class:'kicker', text:pair[0] }),
        el('div', { text:pair[1] })
      ]));
    });
    content.appendChild(el('div', { class:'section' }, grid));

    /* notities (CRM, alleen hier zichtbaar) */
    var flash = el('span', { class:'saveflash', text:'Opgeslagen' });
    var ta = el('textarea', { class:'input', 'aria-label':'Notities bij ' + c.company });
    ta.value = c.notes || '';
    ta.addEventListener('blur', function(){
      DS.saveClientNotes(clientId, ta.value).then(function(){
        flash.classList.add('show');
        setTimeout(function(){ flash.classList.remove('show'); }, 1600);
      });
    });
    content.appendChild(el('div', { class:'section' }, [
      el('div', { class:'sectionhead' }, [
        el('div', null, [
          el('span', { class:'kicker', text:'Alleen zichtbaar in het beheer' }),
          el('h2', { text:'Notities' })
        ]),
        flash
      ]),
      el('div', { class:'card notesbox' }, ta)
    ]));

    /* projecten */
    var plist = el('div', { class:'card rowlist' });
    if(!projects.length){
      plist.appendChild(el('div', { class:'empty', text:'Nog geen projecten voor deze klant.' }));
    }
    projects.forEach(function(p){
      var cur = (p.stages||[]).find(function(s){ return s.status==='current' || s.status==='awaiting_approval'; });
      var sub = p.code ? p.code + ' · ' : '';
      sub += cur ? stageLabel(cur.stageKey) : 'Alle fases afgerond';
      var chips = [];
      if(reorderByProject[p.id]) chips.push(el('span', { class:'chip done', text:'Herbestelling' }));
      if(p.status==='archived') chips.push(el('span', { class:'chip', text:'Gearchiveerd' }));
      else if(cur) chips.push(el('span', { class:'chip ' + (cur.status==='awaiting_approval'?'awaiting':'current'), text:stageStatusLabel(cur.status) }));
      plist.appendChild(el('button', {
        type:'button', class:'rowitem link',
        onclick:function(){ go({ name:'project', projectId:p.id, clientId:clientId }); }
      }, [
        el('div', { class:'rowmain' }, [
          el('div', { class:'rowtitle', text:p.name }),
          el('div', { class:'rowsub', text:sub })
        ])
      ].concat(chips, [ el('span', { class:'rowmeta', text:fmtDate(p.createdAt) }) ])));
    });
    content.appendChild(el('div', { class:'section' }, [
      el('div', { class:'sectionhead' }, [
        el('h2', { text:'Projecten' }),
        el('button', { type:'button', class:'btn small', text:'Nieuw project', onclick:function(){ openNewProjectModal(clientId); } })
      ]),
      plist
    ]));
  });
}

  var name = el('input', { class:'input', type:'text', required:'required' });

/* ============================================================
   deel 2 — projectdetail
   ============================================================ */
function renderProject(projectId){
  return Promise.all([
    DS.getProject(projectId),
    DS.listMedia(projectId),
    DS.listDocuments(projectId),
    DS.listInvoices(projectId),
    DS.listSamples(projectId),
    DS.listInspections(projectId),
    DS.listDisclosures(projectId),
    DS.listFactories(),
    DS.listShipments(projectId)
  ]).then(function(res){
    var project = res[0];
    if(!project){
      content.appendChild(el('p', { text:'Project niet gevonden.' }));
      return;
    }
    var media = res[1], docs = res[2], invoices = res[3], samples = res[4],
        inspections = res[5], disclosures = res[6], factories = res[7], shipments = res[8];
    return Promise.all([
      DS.getClient(project.clientId),
      DS.listShipmentEvents(shipments.map(function(s){ return s.id; }))
    ]).then(function(res2){
      buildProjectView(project, res2[0], media, docs, invoices, samples, inspections, disclosures, factories, shipments, res2[1]);
    });
  });
}
function factoryName(factories, id){
  if(!id) return null;
  var f = factories.find(function(x){ return x.id===id; });
  return f ? f.name : null;
}
function chipClassForStage(status){
  if(status==='done') return 'done';
  if(status==='current') return 'current';
  if(status==='awaiting_approval') return 'awaiting';
  return '';
}
function sectionBlock(kicker, title, actionBtn, body){
  var head = el('div', { class:'sectionhead' }, [
    el('div', null, [
      el('span', { class:'kicker', text:kicker }),
      el('h2', { text:title })
    ]),
    actionBtn
  ]);
  return el('div', { class:'section' }, [ head, body ]);
}
function buildProjectView(project, client, media, docs, invoices, samples, inspections, disclosures, factories, shipments, shipmentEvents){
  var pid = project.id;

  content.appendChild(el('button', {
    type:'button', class:'backbtn', text:'← ' + (client ? client.company : 'Klant'),
    onclick:function(){ go({ name:'client', clientId:project.clientId }); }
  }));
  var headChips = [];
  if(project.status==='archived') headChips.push(el('span', { class:'chip', text:'Gearchiveerd' }));
  /* herbestelling in één klik omzetten: naam + ' — batch 2' (of batch n+1),
     zelfde klant, verse fases, geen media of documenten mee */
  headChips.push(el('button', {
    type:'button', class:'btn ghost small', text:'Dupliceer als nieuw project',
    onclick:function(){ duplicateAsNewProject(project); }
  }));
  content.appendChild(el('div', { class:'pagehead' }, [
    el('div', null, [
      el('span', { class:'kicker', text:(project.code ? project.code + ' · ' : '') + 'Gestart ' + fmtDate(project.createdAt) }),
      el('h1', { text:project.name })
    ]),
    el('div', { style:'display:flex;gap:8px;align-items:center;flex-wrap:wrap;' }, headChips)
  ]));

  /* a. fasebalk */
  var stageCard = el('div', { class:'card rowlist stagegrid' });
  (project.stages||[]).slice().sort(function(a,b){ return a.position-b.position; }).forEach(function(s){
    var sel = el('select', { class:'input stagesel', 'aria-label':'Status van fase ' + stageLabel(s.stageKey) });
    STAGE_STATUS.forEach(function(st){ sel.appendChild(option(st.key, st.label, st.key===s.status)); });
    sel.addEventListener('change', function(){
      var newStatus = sel.value;
      DS.setStageStatus(pid, s.stageKey, newStatus).then(function(){
        if(newStatus === 'done' || newStatus === 'awaiting_approval'){
          notifyClient({
            client: client,
            projectName: project.name, projectCode: project.code,
            page: 'mijlpalen', portalLabel: 'Bekijk het mijlpalenpad',
            subject: (newStatus === 'done' ? stageLabel(s.stageKey) + ' is afgerond' : 'Jouw goedkeuring gevraagd') + ' — ' + project.name,
            bodyLine: newStatus === 'done'
              ? stageLabel(s.stageKey) + ' is afgerond.'
              : stageLabel(s.stageKey) + ' wacht op jouw goedkeuring.'
          });
        }
        refresh();
      }).catch(function(ex){
        sel.value = s.status;
        showError(ex);
      });
    });
    var subParts = [];
    if(s.paymentPct) subParts.push(s.paymentPct + '% betaalmoment');
    if(s.approvedAt) subParts.push('afgerond ' + fmtDate(s.approvedAt));
    stageCard.appendChild(el('div', { class:'stagerow' }, [
      el('span', { class:'stagenum', text:('0' + s.position).slice(-2) }),
      el('div', { class:'stagename' }, [
        document.createTextNode(stageLabel(s.stageKey)),
        el('small', { text: subParts.join(' · ') || ' ' })
      ]),
      el('span', { class:'chip ' + chipClassForStage(s.status), text:stageStatusLabel(s.status) }),
      sel
    ]));
  });
  content.appendChild(sectionBlock('Voortgang', 'Fases', null, stageCard));

  /* b. media */
  var mediaWrap = el('div');
  var anyMedia = false;
  STAGES.forEach(function(st){
    var items = media.filter(function(m){ return m.stageKey===st.key; });
    if(!items.length) return;
    anyMedia = true;
    mediaWrap.appendChild(el('div', { class:'kicker stagekick', text:st.label }));
    var grid = el('div', { class:'mediagrid' });
    items.forEach(function(m){
      var img = el('img', { alt:m.caption||'Projectfoto', loading:'lazy' });
      DS.mediaUrl(m).then(function(u){ if(u) img.src = u; });
      var fname = factoryName(factories, m.factoryId);
      grid.appendChild(el('div', { class:'mediacard' }, [
        img,
        el('div', { class:'mbody' }, [
          el('div', { class:'mcap', text:m.caption }),
          el('div', { class:'mediastrip' }, [

  /* d2. zendingen — De Reis: mijlpalen per zending, één knop per stap */

  }

    var evs = (shipmentEvents||[]).filter(function(ev){ return ev.shipmentId===s.id; });

  content.appendChild(sectionBlock('De reis van fabriek naar klant', 'Zendingen',

    shipWrap));

  /* e. samples */
  var smpWrap = el('div', { class:'card rowlist' });
  if(!samples.length) smpWrap.appendChild(el('div', { class:'empty', text:'Nog geen samplerondes.' }));
  samples.slice().sort(function(a,b){ return String(a.roundDate).localeCompare(String(b.roundDate)); }).forEach(function(s){
    var thumb = null;
    if(s.mediaId){

      }

    el('button', { type:'button', class:'btn small', text:'Ronde toevoegen', onclick:function(){ openSampleModal(pid, samples, media, project, client); } }),

  /* f. inspecties */

  if(!inspections.length) inspWrap.appendChild(el('div', { class:'empty', text:'Nog geen inspectierapporten.' }));
  inspections.slice().sort(function(a,b){ return String(a.reportDate).localeCompare(String(b.reportDate)); }).forEach(function(r){

    box.appendChild(el('div', { class:'insphead' }, [
      el('span', { class:'cp', text:r.checkpoint }),
      el('span', { class:'chip ' + (r.passed ? 'done' : 'crit'), text:r.passed ? 'Geslaagd' : 'Afgekeurd' }),
      el('span', { class:'rowmeta', text:fmtDate(r.reportDate) })
    ]));
    box.appendChild(el('div', { class:'inspmeta', text:(r.aqlNorm||'') + ' · steekproef ' + (r.sampleSize||0) + ' stuks' }));
    if(r.contextLine) box.appendChild(el('div', { style:'font-size:13.5px;margin-top:6px;', text:r.contextLine }));
    (r.defects||[]).forEach(function(d){

  content.appendChild(sectionBlock('Kwaliteitscontrole', 'Inspecties',
    el('button', { type:'button', class:'btn small', text:'Rapport toevoegen', onclick:function(){ openInspectionModal(pid, project, client); } }),
    inspWrap));

  /* g. disclosures */
  var disWrap = el('div', { class:'card rowlist' });
  if(!disclosures.length) disWrap.appendChild(el('div', { class:'empty', text:'Nog niets gedeeld met fabrieken.' }));
  disclosures.slice().sort(function(a,b){ return String(a.disclosedAt).localeCompare(String(b.disclosedAt)); }).forEach(function(d){
    var fname = factoryName(factories, d.factoryId) || 'Partner';

      el('div', { class:'rowmain' }, [
        el('div', { class:'rowtitle', text:d.what || 'Bestanden gedeeld' }),

    disWrap));

  /* h. archiveren */
  var archWrap = el('div', { style:'border-top:1px solid var(--line);padding-top:26px;margin-top:10px;' });
  if(project.status==='archived'){
    archWrap.appendChild(el('p', { class:'kicker', text:'Dit project is gearchiveerd' + (project.archivedAt ? ' op ' + fmtDate(project.archivedAt) : '') }));
  } else {
    archWrap.appendChild(el('button', { type:'button', class:'btn danger', text:'Project archiveren', onclick:function(){
      confirmDialog('Project archiveren', 'Het project verdwijnt uit de actieve lijst. Dit kun je later alleen handmatig terugdraaien.', 'Archiveren').then(function(ok){
        if(ok) DS.archiveProject(pid).then(refresh);
      });
    } }));
  }
  content.appendChild(archWrap);
}

/* ---------- dupliceren als nieuw project (herbestelling → batch 2) ---------- */
function duplicateAsNewProject(project){
  var base = project.name || 'Project';
  var mt = /^(.*) — batch (\d+)$/.exec(base);
  var newName = mt ? (mt[1] + ' — batch ' + (parseInt(mt[2],10)+1)) : (base + ' — batch 2');
  /* createProject zet de zes verse fases automatisch klaar; media en
     documenten gaan bewust niet mee — het dossier blijft bij batch 1 */
  DS.createProject(project.clientId, newName, '').then(function(p){
    go({ name:'project', projectId:p.id, clientId:project.clientId });
  }).catch(showError);
}

/* ---------- modals projectdetail ---------- */
function stageSelect(selected){
  var sel = el('select', { class:'input' });
  STAGES.forEach(function(s){ sel.appendChild(option(s.key, s.label, s.key===selected)); });
  return sel;
}
function openMediaModal(projectId, factories, project, client){
  var m = openModal('Foto toevoegen', IS_DEMO ? 'Demomodus: kies een sitebeeld' : 'Upload naar de beveiligde opslag');
  var chosenSrc = null;
  var fileInput = null;
  var form = el('form');

  if(IS_DEMO){
    var grid = el('div', { class:'imgpickgrid', role:'group', 'aria-label':'Beschikbare beelden' });
    DEMO_IMAGES.forEach(function(src){
      var b = el('button', { type:'button', class:'imgpick', 'aria-pressed':'false', 'aria-label':src.replace('images/','') },
        el('img', { src:src, alt:'' }));
      b.addEventListener('click', function(){
        chosenSrc = src;
        grid.querySelectorAll('.imgpick').forEach(function(x){ x.setAttribute('aria-pressed','false'); });
        b.setAttribute('aria-pressed','true');
      });
      grid.appendChild(b);
    });
    form.appendChild(field('Beeld', grid));
  } else {
    fileInput = el('input', { class:'input', type:'file', accept:'image/*', required:'required' });
    form.appendChild(field('Bestand', fileInput));
  }

  var caption = el('input', { class:'input', type:'text', required:'required' });
  var stage = stageSelect('concept');
  var fac = el('select', { class:'input' });
  fac.appendChild(option('', 'Geen fabriek (CUSTOM+)', true));
  factories.forEach(function(f){ fac.appendChild(option(f.id, f.name + (f.region ? ' — ' + f.region : ''))); });
  var date = el('input', { class:'input', type:'date', required:'required', value:todayISO() });
  var err = el('p', { class:'formerr' });

  form.appendChild(field('Onderschrift', caption));
  form.appendChild(el('div', { class:'formrow' }, [ field('Fase', stage), field('Fabriek', fac) ]));
  form.appendChild(field('Datum', date));
  form.appendChild(err);
  form.appendChild(el('div', { class:'modal-actions' }, [
    el('button', { type:'button', class:'btn ghost', text:'Annuleren', onclick:closeModal }),
    el('button', { type:'submit', class:'btn', text:'Toevoegen' })
  ]));
  form.addEventListener('submit', function(e){
    e.preventDefault();
    err.classList.remove('show');
    if(IS_DEMO && !chosenSrc){
      err.textContent = 'Kies eerst een beeld.'; err.classList.add('show'); return;
    }
    if(!IS_DEMO && !(fileInput.files && fileInput.files[0])){
      err.textContent = 'Kies eerst een bestand.'; err.classList.add('show'); return;
    }
    var payload = {
      stageKey: stage.value, caption: caption.value.trim(),
      factoryId: fac.value || null, capturedAt: date.value
    };
    if(IS_DEMO) payload.src = chosenSrc;
    else payload.file = fileInput.files[0];
    DS.addMedia(projectId, payload).then(function(){
      notifyClient({
        client: client, projectName: project.name, projectCode: project.code,
        page: 'updates', portalLabel: 'Bekijk de update',
        subject: 'Nieuwe update — ' + project.name,
        bodyLine: 'Er staat een nieuwe foto bij ' + stageLabel(payload.stageKey) + ': ' + payload.caption
      });
      closeModal(); refresh();
    }).catch(function(ex){ err.textContent = ex.message||String(ex); err.classList.add('show'); });
  });
  m.body.appendChild(form);
}

function nextRoundLabel(samples){
  var max = -1;
  samples.forEach(function(s){
    var mt = /^T(\d+)$/.exec(s.roundLabel||'');
    if(mt){ var n = parseInt(mt[1],10); if(n>max) max = n; }
  });
  return 'T' + (max+1);
}

function openInspectionModal(projectId, project, client){
  var m = openModal('Rapport toevoegen', 'Kwaliteitscontrole');

  CHECKPOINTS.forEach(function(c){ checkpoint.appendChild(option(c.key, c.label)); });
  var norm = el('input', { class:'input', type:'text', value:'ANSI/ASQ Z1.4 II' });
  var size = el('input', { class:'input', type:'number', min:'1', step:'1', required:'required' });
  var context = el('input', { class:'input', type:'text', placeholder:'Korte context voor de klant' });
  var date = el('input', { class:'input', type:'date', required:'required', value:todayISO() });
  var passed = el('input', { type:'checkbox', checked:true });
  var err = el('p', { class:'formerr' });

  var defWrap = el('div');
  function addDefectRow(){
    var sev = el('select', { class:'input', 'aria-label':'Ernst' });
    SEVERITIES.forEach(function(s){ sev.appendChild(option(s.key, s.label)); });
    var cnt = el('input', { class:'input cnt', type:'number', min:'1', step:'1', value:'1', 'aria-label':'Aantal' });
    var note = el('input', { class:'input note', type:'text', placeholder:'Notitie', 'aria-label':'Notitie bij afwijking' });
    var rowEl = el('div', { class:'defform' }, [
      sev, cnt, note,
      el('button', { type:'button', class:'rm', 'aria-label':'Rij verwijderen', text:'×', onclick:function(){ defWrap.removeChild(rowEl); } })
    ]);
    rowEl._get = function(){
      return { severity:sev.value, count:parseInt(cnt.value,10)||1, note:note.value.trim() };
    };
    defWrap.appendChild(rowEl);
  }

  var form = el('form', { onsubmit:function(e){
    e.preventDefault();
    var defects = [];
    defWrap.querySelectorAll('.defform').forEach(function(r){ if(r._get) defects.push(r._get()); });
    var checkpointVal = checkpoint.value;
    DS.addInspection(projectId, {
      checkpoint: checkpointVal, aqlNorm: norm.value.trim() || 'ANSI/ASQ Z1.4 II',
      sampleSize: parseInt(size.value,10)||0, defects: defects,
      contextLine: context.value.trim(), reportDate: date.value, passed: passed.checked
    }).then(function(){
      notifyClient({
        client: client, projectName: project.name, projectCode: project.code,
        page: 'kwaliteit', portalLabel: 'Bekijk het rapport',
        subject: 'Inspectierapport geplaatst — ' + project.name,
        bodyLine: 'Het ' + checkpointVal.toUpperCase() + '-rapport staat klaar' + (passed.checked ? ', binnen norm.' : '.')
      });
      closeModal(); refresh();
    }).catch(function(ex){ err.textContent = ex.message||String(ex); err.classList.add('show'); });
  } }, [
    el('div', { class:'formrow' }, [ field('Checkpoint', checkpoint), field('Datum', date) ]),
    el('div', { class:'formrow' }, [ field('Norm', norm), field('Steekproefgrootte', size) ]),
    field('Afwijkingen', el('div', null, [
      defWrap,
      el('button', { type:'button', class:'btn ghost small', text:'Rij toevoegen', onclick:addDefectRow })
    ])),
    field('Contextregel', context),
    el('label', { class:'checkline' }, [ passed, document.createTextNode('Geslaagd') ]),
    err,
    el('div', { class:'modal-actions' }, [
      el('button', { type:'button', class:'btn ghost', text:'Annuleren', onclick:closeModal }),
      el('button', { type:'submit', class:'btn', text:'Rapport opslaan' })
    ])
  ]);
  m.body.appendChild(form);
}
