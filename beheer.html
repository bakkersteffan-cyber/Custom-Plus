<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CUSTOM+ Beheer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --black:#000; --white:#fff; --ink:#111;
  --gray-9:#999; --gray-33:#333; --gray-69:#696969; --gray-a7:#a7a7a7; --gray-f9:#f9f9f9; --gray-f2:#f2f2f2;
  --line:rgba(228,224,219,.6); --line-dark:rgba(255,255,255,.14);
  --green:#1B6E45; --green-soft:rgba(27,110,69,.09);
  --critical:#d97654;
  --paper:#faf8f5;
  --card-shadow:0 1px 2px rgba(20,16,8,.04), 0 10px 28px rgba(20,16,8,.05);
  --card-shadow-hover:0 2px 6px rgba(20,16,8,.06), 0 16px 36px rgba(20,16,8,.08);
  --ease-fl:cubic-bezier(.83,0,.17,1);
  --font: 'Hanken Grotesk', -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --mono: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
  color-scheme: light;
}
*{ box-sizing:border-box; margin:0; padding:0; }
html{ -webkit-text-size-adjust:100%; }
body{
  font-family:var(--font); font-size:15px; line-height:1.55; color:var(--ink);
  background:var(--paper); min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
img{ max-width:100%; display:block; }
button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
input, textarea, select{ font:inherit; color:var(--ink); }
:focus{ outline:none; }
:focus-visible{ outline:2px solid var(--green); outline-offset:2px; border-radius:4px; }
[hidden]{ display:none !important; }

/* sectiekickers exact als op het klantportaal: Hanken, 11px, .44px —
   mono blijft gereserveerd voor codes, bedragen en datums */
.kicker{
  font-size:11px; font-weight:500; letter-spacing:.44px;
  text-transform:uppercase; color:var(--gray-9);
}
.mono{ font-family:var(--mono); }

/* ---------- login ---------- */
.login-wrap{
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
}
.login-card{
  width:100%; max-width:400px; background:var(--white);
  border:1px solid var(--line); border-radius:16px; overflow:hidden;
  box-shadow:var(--card-shadow);
}
.login-band{
  background:var(--black); color:var(--white); padding:26px 28px 22px;
}
.login-band .wordmark{ font-weight:800; font-size:19px; letter-spacing:.02em; }
.login-band .kicker{ color:var(--gray-a7); margin-top:4px; }
.login-body{ padding:26px 28px 30px; }
.login-body p{ color:var(--gray-69); font-size:14px; margin-bottom:18px; }
.login-error{
  font-size:13.5px; color:var(--critical); margin-top:14px; display:none;
}
.login-error.show{ display:block; }

/* ---------- shell ---------- */
.shell{ display:flex; min-height:100vh; }
.side{
  width:232px; flex:0 0 232px; background:var(--white);
  border-right:1px solid var(--line);
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh; overflow-y:auto;
}
.side-head{ padding:26px 26px 18px; }
.side-head .wordmark{ font-weight:800; font-size:17px; letter-spacing:.02em; }
.side-head .kicker{ margin-top:2px; }
.side nav{ padding:0 14px 14px; display:flex; flex-direction:column; gap:2px; }
.navbtn{
  display:flex; align-items:center; gap:12px;
  width:100%; text-align:left; padding:10px 12px; border-radius:12px;
  font-weight:500; font-size:14px; color:var(--gray-33);
  transition:background .2s ease, color .2s ease;
}
.navbtn:hover{ background:var(--gray-f9); color:var(--ink); }
.navbtn.active{ background:var(--gray-f2); color:var(--ink); font-weight:600; }
.navbtn svg{
  width:17px; height:17px; flex:none; fill:none; stroke:currentColor;
  stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; opacity:.75;
}
.navbtn.active svg{ opacity:1; stroke:var(--green); }
.navbtn .nl{ flex:1; min-width:0; }
.navbadge{
  font-family:var(--mono); font-size:10px; font-weight:600;
  background:var(--green-soft); color:var(--green); border-radius:999px;
  min-width:20px; height:20px; display:inline-flex; align-items:center; justify-content:center;
  padding:0 6px; font-variant-numeric:tabular-nums;
}
.side-foot{ margin-top:auto; padding:14px 18px 20px; border-top:1px solid var(--line); }
.side-foot .who{ font-size:13.5px; font-weight:600; }
.side-foot .who small{ display:block; font-weight:400; color:var(--gray-9); font-size:12.5px; }
.linkbtn{
  font-size:13.5px; color:var(--gray-69); text-decoration:underline;
  text-underline-offset:3px; margin-top:8px; padding:0; border-radius:2px;
  transition:color .25s ease;
}
.linkbtn:hover{ color:var(--ink); }

.main{ flex:1; min-width:0; }
/* stille demo/live-regel in de mono-hintstijl van het portaal, direct op het papier */
.demobar{
  border-bottom:1px solid var(--line); background:transparent;
  padding:10px 28px; font-family:var(--mono); font-size:10.5px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--gray-69);
  display:flex; align-items:center; gap:8px;
}
.demobar .dot{ width:6px; height:6px; border-radius:50%; background:var(--green); flex:0 0 6px; }
.content{ max-width:1080px; margin:0 auto; padding:36px clamp(20px,3vw,44px) 90px; }

/* ---------- generic ---------- */
.pagehead{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:26px; flex-wrap:wrap; }
/* paginakoppen in het lichte grote register van het portaal (.sec-head h2) */
.pagehead h1{
  font-size:clamp(26px,2.2vw + 12px,40px); font-weight:300;
  letter-spacing:-.01em; line-height:1.15; text-wrap:balance;
}
.pagehead .kicker{ margin-bottom:8px; display:block; }
.backbtn{
  font-family:var(--mono); font-size:11.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--gray-69); margin-bottom:14px; display:inline-block; padding:2px 0;
  transition:color .25s ease;
}
.backbtn:hover{ color:var(--ink); }

/* knopstijl van de site (.fl-btn): uppercase, 11px, .44px, pilvorm */
.btn{
  display:inline-flex; align-items:center; gap:8px; justify-content:center;
  background:var(--black); color:var(--white); font-weight:500; font-size:11px;
  letter-spacing:.44px; text-transform:uppercase; line-height:normal;
  padding:13px 26px; border-radius:50px; border:1px solid var(--black);
  transition:opacity .25s ease, transform .3s var(--ease-fl);
}
.btn:hover{ opacity:.82; }
.btn:active{ transform:scale(.98); }
.btn:disabled{ opacity:.4; cursor:default; }
.btn.ghost{
  background:var(--white); color:var(--ink); border:1px solid var(--line);
  transition:border-color .25s ease, background .25s ease;
}
.btn.ghost:hover{ opacity:1; border-color:var(--gray-a7); background:var(--gray-f9); }
.btn.small{ font-size:10px; padding:8px 16px; border-radius:50px; }
.btn.danger{ background:var(--white); color:var(--critical); border:1px solid var(--line); }
.btn.danger:hover{ opacity:1; border-color:var(--critical); }
.btn.wide{ width:100%; justify-content:center; }

.card{
  background:var(--white); border:1px solid var(--line); border-radius:16px;
  box-shadow:var(--card-shadow);
}
.section{ margin-bottom:36px; }
.sectionhead{
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  margin-bottom:12px;
}
.sectionhead h2{ font-size:15px; font-weight:600; letter-spacing:-.005em; }
.sectionhead .kicker{ display:block; margin-bottom:2px; }

.rowlist > *{ border-bottom:1px solid var(--line); }
.rowlist > *:last-child{ border-bottom:0; }
.rowitem{ display:flex; align-items:center; gap:14px; padding:14px 20px; }
.rowitem.link{ width:100%; text-align:left; transition:background .25s ease; border-radius:0; }
.rowitem.link:hover{ background:var(--gray-f9); }
.rowmain{ flex:1; min-width:0; }
.rowtitle{ font-weight:600; font-size:15px; }
.rowsub{ font-size:13px; color:var(--gray-69); margin-top:1px; }
.rowmeta{ font-family:var(--mono); font-size:11px; color:var(--gray-9); white-space:nowrap; font-variant-numeric:tabular-nums; }

/* chips exact het portaalchip-patroon (.badge): mono uppercase, 100px radius,
   tonen in groen-soft of gray-f2; rand alleen voor kritieke staten */
.chip{
  font-family:var(--mono); font-size:10.5px; font-weight:500; letter-spacing:.1em;
  text-transform:uppercase; padding:4px 11px; border-radius:100px; white-space:nowrap;
  border:1px solid transparent; color:var(--gray-69); background:var(--gray-f2);
}
.chip.done{ background:var(--green-soft); color:var(--green); }
.chip.current{ background:var(--ink); color:var(--white); }
.chip.awaiting{ background:var(--white); color:var(--critical); border-color:var(--critical); }
.chip.crit{ background:var(--white); color:var(--critical); border-color:var(--critical); }

.empty{
  padding:30px 20px; text-align:center; color:var(--gray-9); font-size:13.5px;
}

/* ---------- forms ---------- */
.field{ display:block; margin-bottom:14px; }
.flabel{
  display:block; font-family:var(--mono); font-size:10.5px; font-weight:500;
  letter-spacing:.12em; text-transform:uppercase; color:var(--gray-69); margin-bottom:6px;
}
.input, textarea.input, select.input{
  width:100%; background:var(--white); border:1px solid var(--line); border-radius:10px;
  padding:10px 12px; font-size:14.5px; transition:border-color .25s ease;
}
/* veldfocus zoals het portaal: de rand wordt zwart, geen extra ring */
.input:focus{ border-color:var(--ink); }
.input:focus-visible{ outline:none; border-color:var(--ink); }
textarea.input{ resize:vertical; min-height:96px; }
.formrow{ display:flex; gap:12px; }
.formrow > *{ flex:1; }
.checkline{ display:flex; align-items:center; gap:9px; font-size:14px; margin-bottom:14px; cursor:pointer; }
.checkline input{ width:16px; height:16px; accent-color:var(--black); }
.formerr{ color:var(--critical); font-size:13.5px; margin:2px 0 12px; display:none; }
.formerr.show{ display:block; }
.saveflash{
  font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--green); opacity:0; transition:opacity .25s ease; margin-left:12px;
}
.saveflash.show{ opacity:1; }

/* ---------- modal ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(17,17,17,.45); z-index:60;
  display:flex; align-items:flex-start; justify-content:center;
  padding:6vh 18px 18px; overflow-y:auto;
}
.modal{
  background:var(--white); border-radius:16px; width:100%; max-width:520px;
  border:1px solid var(--line); padding:24px 26px 26px; margin-bottom:6vh;
  box-shadow:var(--card-shadow);
}
.modal h2{ font-size:16px; font-weight:700; margin-bottom:4px; }
.modal .kicker{ margin-bottom:16px; display:block; }
.modal-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:20px; flex-wrap:wrap; }

/* ---------- klantdetail ---------- */
.contactgrid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:0; }
.contactcell{ padding:16px 20px; border-bottom:1px solid var(--line); }
/* microlabels boven data blijven mono, zoals .ccard-l in het portaal */
.contactcell .kicker{
  font-family:var(--mono); font-size:10px; letter-spacing:.14em;
  color:var(--gray-69); margin-bottom:3px; display:block;
}
.contactcell div{ font-size:14.5px; font-weight:500; word-break:break-word; }
.notesbox{ padding:20px; }

/* ---------- fasebalk ---------- */
.stagegrid{ display:flex; flex-direction:column; }
.stagerow{ display:flex; align-items:center; gap:14px; padding:13px 20px; }
.stagenum{ font-family:var(--mono); font-size:11px; color:var(--gray-9); width:20px; flex:0 0 20px; }
.stagename{ flex:1; font-weight:600; font-size:14px; min-width:0; }
.stagename small{ display:block; font-family:var(--mono); font-size:10.5px; font-weight:400; color:var(--gray-9); letter-spacing:.06em; }
.stagesel{ width:190px; flex:0 0 190px; }

/* ---------- media ---------- */
.mediagrid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:16px; }
.mediacard{
  background:var(--white); border:1px solid var(--line); border-radius:16px; overflow:hidden;
  box-shadow:var(--card-shadow);
}
.mediacard img{ width:100%; aspect-ratio:4/3; object-fit:cover; background:var(--gray-f2); }
.mediacard .mbody{ padding:12px 14px 13px; }
.mediacard .mcap{ font-size:13.5px; line-height:1.45; }
.mediastrip{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  font-family:var(--mono); font-size:10.5px; color:var(--gray-9); margin-top:9px;
  letter-spacing:.04em;
}
.mediastrip button{ color:var(--gray-9); text-decoration:underline; text-underline-offset:2px; transition:color .25s ease; }
.mediastrip button:hover{ color:var(--critical); }
.stagekick{ margin:18px 0 10px; }
.stagekick:first-child{ margin-top:0; }

/* beeldkeuze in modal */
.imgpickgrid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(86px, 1fr)); gap:8px; margin-bottom:6px; }
.imgpick{ border:2px solid transparent; border-radius:8px; overflow:hidden; padding:0; transition:border-color .25s ease; }
.imgpick img{ aspect-ratio:1; object-fit:cover; }
.imgpick[aria-pressed="true"]{ border-color:var(--black); }

/* ---------- inspecties ---------- */
.insp{ padding:16px 20px; }
.insphead{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.insphead .cp{ font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; }
.inspmeta{ font-size:13px; color:var(--gray-69); margin-top:4px; }
.defrow{ display:flex; align-items:baseline; gap:10px; font-size:13.5px; padding:7px 0; border-top:1px dashed var(--line); margin-top:7px; }
.defcount{ font-family:var(--mono); font-size:12px; color:var(--gray-69); }
.defform{ display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
.defform select{ width:110px; }
.defform .cnt{ width:70px; }
.defform .note{ flex:1; min-width:140px; }
.defform .rm{ color:var(--gray-9); font-size:18px; line-height:1; padding:4px 6px; border-radius:6px; }
.defform .rm:hover{ color:var(--critical); }

/* ---------- vragen ---------- */
.qcard{ padding:20px; }
.qhead{ display:flex; gap:14px; align-items:flex-start; }
.qthumb{ width:76px; height:76px; flex:0 0 76px; border-radius:8px; object-fit:cover; background:var(--gray-f2); border:1px solid var(--line); }
.qtext{ font-size:15.5px; font-weight:600; line-height:1.45; margin-top:5px; }
.qanswer{ margin-top:14px; }
.qanswered{ background:var(--gray-f9); border-radius:8px; padding:12px 14px; margin-top:12px; font-size:14px; }
details.answered summary{
  cursor:pointer; list-style:none; padding:14px 18px; font-weight:600; font-size:14px;
  display:flex; align-items:center; gap:8px;
}
details.answered summary::-webkit-details-marker{ display:none; }
details.answered summary::before{ content:'+'; font-family:var(--mono); color:var(--gray-9); }
details.answered[open] summary::before{ content:'\2013'; }

/* ---------- logboek ---------- */
.logrow{ display:flex; gap:14px; padding:12px 20px; font-size:13.5px; align-items:baseline; }
.logwhen{ font-family:var(--mono); font-size:11px; color:var(--gray-9); flex:0 0 150px; white-space:nowrap; }
.logactor{ flex:0 0 66px; }
.logdetail{ flex:1; min-width:0; }
.logproj{ font-family:var(--mono); font-size:11px; color:var(--gray-9); white-space:nowrap; }

/* ---------- zendingen ---------- */
details.shipdet summary{ list-style:none; cursor:pointer; }
details.shipdet summary::-webkit-details-marker{ display:none; }
.shiprow{
  display:flex; align-items:center; gap:10px; padding:9px 18px;
  border-top:1px dashed var(--line); font-size:13.5px;
}
.shiprow .ms-label{ flex:1; min-width:0; font-weight:600; }
.shiprow.openms .ms-label{ color:var(--gray-9); font-weight:500; }
.shiprow .ms-meta{ font-family:var(--mono); font-size:11px; color:var(--gray-9); white-space:nowrap; }
.shipcheck{
  display:flex; gap:8px; align-items:center; flex-wrap:wrap;
  padding:10px 18px; border-top:1px dashed var(--line); background:var(--gray-f9);
}
.shipcheck .input{ width:auto; }
.shipcheck .dt{ width:150px; }
.shipcheck .loc{ width:150px; }
.shipcheck .nt{ flex:1; min-width:140px; }
.shipfoot{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:10px 18px; border-top:1px solid var(--line);
}
.nrhint{
  font-family:var(--mono); font-size:11px; letter-spacing:.06em;
  color:var(--gray-69); margin:-6px 0 12px; min-height:1.2em;
}
.nrhint.ok{ color:var(--green); }
.nrhint.bad{ color:var(--critical); }

/* ---------- tabbladen (Logboek e.a.) ---------- */
.tabbar{ display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
.tabbtn{
  font-family:var(--mono); font-size:11px; font-weight:500; letter-spacing:.1em;
  text-transform:uppercase; padding:7px 14px; border-radius:999px;
  border:1px solid var(--line); color:var(--gray-69); background:var(--white);
  transition:border-color .25s ease, color .25s ease;
}
.tabbtn:hover{ color:var(--ink); border-color:var(--gray-a7); }
.tabbtn.active{ background:var(--black); color:var(--white); border-color:var(--black); }

/* ---------- modusbanner (demo/live + health-stip) ---------- */
.demobar{ width:100%; text-align:left; cursor:pointer; transition:color .25s ease; }
.demobar:hover{ color:var(--ink); }
.dot.ok{ background:var(--green); }
.dot.warn{ background:#c08a1d; }
.dot.bad{ background:var(--critical); }

/* ---------- go-live-checklist (golf 6, functie 70) ---------- */
.gl-row{ display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); align-items:flex-start; }
.gl-row:last-child{ border-bottom:0; }
.gl-dot{ width:10px; height:10px; border-radius:50%; background:var(--gray-a7); flex:0 0 10px; margin-top:5px; }
.gl-dot.ok{ background:var(--green); }
.gl-dot.warn{ background:#c08a1d; }
.gl-dot.bad{ background:var(--critical); }

/* ---------- Vandaag-cockpit ---------- */
.chip.klok-groen{ color:var(--green); border-color:rgba(27,110,69,.45); }
.chip.klok-oranje{ color:#8a5a00; border-color:#c99a2e; }
.chip.klok-rood{ background:var(--critical); color:var(--white); border-color:var(--critical); }
.vd-actions{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
.inlineform{ padding:12px 18px 16px; border-top:1px dashed var(--line); background:var(--gray-f9); }
.inlineform .modal-actions{ margin-top:10px; }
.copyblock{ margin-bottom:16px; }
.copyblock textarea{ min-height:130px; font-size:13.5px; font-family:var(--mono); }
.statusline{
  display:flex; justify-content:space-between; align-items:baseline; gap:14px;
  padding:9px 0; border-bottom:1px solid var(--line); font-size:14px;
}
.statusline:last-child{ border-bottom:0; }

.navsep{ height:1px; background:var(--line); margin:8px 6px; }

/* ---------- golf 2 — invoer-versnellers ---------- */
/* undo-toast (functie 15) */
.undotoast{
  position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:80;
  display:flex; align-items:center; gap:14px; max-width:calc(100vw - 32px);
  background:var(--black); color:var(--white); border-radius:50px;
  padding:10px 12px 10px 22px; font-size:13.5px; box-shadow:0 10px 30px rgba(0,0,0,.28);
}
.undotoast .undocount{ font-family:var(--mono); font-size:11px; color:var(--gray-a7); white-space:nowrap; }
.undotoast .undobtn{
  background:var(--white); color:var(--ink); border-radius:50px; padding:8px 16px;
  font-size:10px; font-weight:600; letter-spacing:.44px; text-transform:uppercase; white-space:nowrap;
}
.undotoast .undobtn:disabled{ opacity:.5; }
/* conceptbehoud (functie 17): stille terugzet-balk in de portaal-hintstijl */
.draftbar{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:var(--gray-f9); border:1px solid var(--line); border-radius:10px;
  padding:9px 12px; margin-bottom:14px; font-size:13px;
}
.draftbar .draftmsg{ flex:1; min-width:140px; }
.draftbar button{ font-size:12.5px; text-decoration:underline; text-underline-offset:3px; color:var(--ink); white-space:nowrap; }
.draftbar button:hover{ opacity:.7; }
/* live veldvalidatie + plausibiliteit (functies 18/49) */
.misshint{ font-family:var(--mono); font-size:11px; letter-spacing:.06em; color:var(--gray-69); margin-right:auto; align-self:center; }
.warnhint{ font-size:12.5px; color:#8a5a00; margin:-8px 0 12px; display:none; }
.warnhint.show{ display:block; }
.escnote{ font-size:12.5px; color:var(--gray-69); margin-top:10px; text-align:right; }
/* slimme datumvelden (functie 20) */
.sdhint{ display:block; font-family:var(--mono); font-size:11px; letter-spacing:.04em; color:var(--gray-69); margin-top:4px; min-height:1.2em; }
.sdhint.ok{ color:var(--green); }
.sdhint.bad{ color:var(--critical); }
/* batchupload + dropzone (functies 47/48/49) */
.modal.wide{ max-width:700px; }
.dropzone.drag{ outline:2px dashed var(--gray-a7); outline-offset:6px; border-radius:12px; background:var(--gray-f9); }
.drophint{ font-family:var(--mono); font-size:11px; letter-spacing:.06em; color:var(--gray-9); margin-top:10px; }
.batchrow{ display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-top:1px dashed var(--line); }
.batchrow:first-child{ border-top:0; }
.batchthumb{ width:56px; height:56px; flex:0 0 56px; border-radius:8px; object-fit:cover; background:var(--gray-f2); border:1px solid var(--line); }
.batchfields{ flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
.batchmeta{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.batchmeta .input{ width:150px; }
.batchtag{ font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--gray-9); }
.batchwarn{ font-size:12px; color:#8a5a00; }
.batchrm{ color:var(--gray-9); font-size:18px; line-height:1; padding:2px 6px; border-radius:6px; }
.batchrm:hover{ color:var(--critical); }
/* defectrij dupliceren (functie 55) */
.defform .dup{ font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--gray-69); padding:4px 6px; border-radius:6px; }
.defform .dup:hover{ color:var(--ink); background:var(--gray-f2); }

/* ---------- golf 4 — dagritme + klant in één oogopslag ---------- */
/* samenvattingskop (functie 7) */
.statgrid{ display:flex; gap:0; flex-wrap:wrap; margin-bottom:18px; }
.statbtn{
  flex:1 1 140px; text-align:left; padding:16px 20px; border-right:1px solid var(--line);
  transition:background .25s ease;
}
.statbtn:last-child{ border-right:0; }
.statbtn:hover{ background:var(--gray-f9); }
/* cijfers zijn data: mono met tabular-nums, zoals .cost-num in het portaal */
.statbtn .num{ font-family:var(--mono); font-size:21px; font-weight:700; line-height:1.1; letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
.statbtn .num.crit{ color:var(--critical); }
.statbtn .lbl{ font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--gray-69); margin-top:3px; }
/* mini-knoppen per Vandaag-rij (functies 5/6/12) */
.vd-mini{
  font-family:var(--mono); font-size:9.5px; font-weight:600; letter-spacing:.08em;
  text-transform:uppercase; color:var(--gray-69); border:1px solid var(--line);
  border-radius:999px; padding:5px 10px; background:var(--white);
  transition:border-color .25s ease, color .25s ease;
}
.vd-mini:hover{ color:var(--ink); border-color:var(--gray-a7); }
.vd-mini.on{ background:var(--black); color:var(--white); border-color:var(--black); }
/* select.input wint qua specificiteit van .ownersel — daarom hier expliciet,
   anders rekt de eigenaar-keuze zich tot de volle rijbreedte op */
select.input.ownersel{ width:auto; font-size:12px; padding:5px 8px; border-radius:999px; }
/* deze-week-planbord (functie 8) */
.weekgrid{ display:grid; grid-template-columns:repeat(7, 1fr); gap:10px; }
.weekday{ background:var(--white); border:1px solid var(--line); border-radius:14px; padding:12px 12px 13px; min-height:120px; box-shadow:var(--card-shadow); }
.weekday.today{ border-color:var(--ink); }
.weekday .wd-head{ font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--gray-69); margin-bottom:8px; }
.weekday.today .wd-head{ color:var(--ink); font-weight:600; }
.weekitem{
  display:block; width:100%; text-align:left; font-size:12.5px; line-height:1.4;
  padding:6px 8px; border-radius:6px; margin-bottom:4px; background:var(--gray-f9);
  transition:background .25s ease;
}
.weekitem:hover{ background:var(--gray-f2); }
.weekitem .wi-kind{ display:block; font-family:var(--mono); font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--gray-9); }
.weekitem.crit .wi-kind{ color:var(--critical); }
/* lijstsneltoetsen (functie 14): geselecteerde rij */
.kbsel{ outline:2px solid var(--ink); outline-offset:-2px; border-radius:8px; }
/* springbalk (functie 14) */
.jumprow{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:10px 12px; border-radius:10px; transition:background .2s ease;
}
.jumprow:hover, .jumprow.sel{ background:var(--gray-f2); }
.jumprow .jr-main{ flex:1; min-width:0; font-weight:600; font-size:14px; }
.jumprow .jr-sub{ font-size:12.5px; color:var(--gray-69); font-weight:400; }
/* volgende actie (functie 36) */
.nextact{ font-size:13px; color:var(--ink); margin-top:2px; }
.nextact.none{ color:var(--gray-9); }
/* klantkop (functie 24) */
.statgrid.klantkop .statbtn{ flex:1 1 160px; }
/* gezondheid (functie 25) */
.hfact{ display:flex; justify-content:space-between; gap:14px; padding:8px 0; border-bottom:1px dashed var(--line); font-size:13.5px; }
.hfact:last-child{ border-bottom:0; }
/* tijdlijn (functie 27) */
.tlrow{ display:flex; gap:12px; padding:11px 20px; font-size:13.5px; align-items:baseline; border-bottom:1px solid var(--line); }
.tlrow:last-child{ border-bottom:0; }
.tlwhen{ font-family:var(--mono); font-size:11px; color:var(--gray-9); flex:0 0 120px; white-space:nowrap; }
.tlkind{ flex:0 0 96px; }
.tldetail{ flex:1; min-width:0; }
@media (max-width:1100px){ .weekgrid{ grid-template-columns:repeat(4, 1fr); } }
@media (max-width:820px){ .weekgrid{ grid-template-columns:repeat(2, 1fr); } .statbtn{ border-right:0; border-bottom:1px solid var(--line); } .tlwhen{ flex-basis:96px; } }

/* ---------- golf 5 — instroom, communicatie en het grote publiceren ---------- */
/* herbestel-pijplijn (functie 22): vier stadia als chips */
.pipesteps{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:7px; }
.pipesteps .chip.pending{ opacity:.4; }
.pipesteps .pipearrow{ font-family:var(--mono); font-size:10px; color:var(--gray-a7); }
/* update-composer (functie 43): conceptrijen met miniatuur */
.comp-row{ display:flex; gap:10px; align-items:center; padding:9px 0; border-top:1px dashed var(--line); }
.comp-row:first-child{ border-top:0; }
.comp-row img{ width:48px; height:48px; border-radius:8px; object-fit:cover; background:var(--gray-f2); border:1px solid var(--line); flex:0 0 48px; }
.comp-row .rowmain{ min-width:0; }
/* mailvoorkeuren (functie 29): compacte togglelijst */
.preflist .checkline{ margin-bottom:8px; }
/* sjabloneneditor (functie 66) */
.tpl-body{ min-height:110px; }

/* ---------- golf 8 — automatische factuurmaker ---------- */
/* het factuurdocument: huisstijl van de site (zwart/wit/groen, Hanken +
   JetBrains Mono voor kickers en bedragen), als verborgen printcontainer
   én — met kaderrand — als voorvertoning in de modal */
#invoiceprint{ display:none; }
.invdoc{
  background:var(--white); color:var(--ink); font-family:var(--font);
  padding:52px 56px; max-width:760px; margin:0 auto;
}
/* het factuurdocument houdt zijn mono-microlabels (documentregister) */
.invdoc .kicker{
  font-family:var(--mono); font-size:10.5px; font-weight:500;
  letter-spacing:.12em; color:var(--gray-69);
}
.invdoc .inv-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:40px; }
.invdoc .inv-mark{ font-weight:800; font-size:21px; letter-spacing:.02em; }
.invdoc .inv-mark em{ font-style:normal; color:var(--green); }
.invdoc .inv-doctype{ font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:.2em; text-transform:uppercase; text-align:right; }
.invdoc .inv-doctype small{ display:block; font-weight:400; font-size:10.5px; letter-spacing:.14em; color:var(--gray-69); margin-top:4px; }
.invdoc .inv-parties{ display:flex; gap:32px; justify-content:space-between; margin-bottom:34px; flex-wrap:wrap; }
.invdoc .inv-party{ font-size:13.5px; line-height:1.6; min-width:200px; }
.invdoc .inv-party .kicker{ margin-bottom:6px; display:block; }
.invdoc .inv-party strong{ display:block; font-size:14.5px; }
.invdoc .inv-meta{ display:flex; gap:28px; flex-wrap:wrap; border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:14px 0; margin-bottom:30px; }
.invdoc .inv-meta > div{ font-size:13.5px; }
.invdoc .inv-meta .kicker{ display:block; margin-bottom:3px; }
.invdoc table{ width:100%; border-collapse:collapse; margin-bottom:8px; }
.invdoc th{ font-family:var(--mono); font-size:10.5px; font-weight:500; letter-spacing:.12em; text-transform:uppercase; color:var(--gray-69); text-align:left; padding:0 0 9px; border-bottom:1px solid var(--ink); }
.invdoc th.num, .invdoc td.num{ text-align:right; white-space:nowrap; }
.invdoc td{ padding:13px 0; border-bottom:1px solid var(--line); font-size:14px; vertical-align:top; }
.invdoc td small{ display:block; color:var(--gray-69); font-size:12.5px; margin-top:2px; }
.invdoc td.num{ font-family:var(--mono); font-size:13px; }
.invdoc .inv-totals{ margin-left:auto; max-width:300px; margin-top:14px; }
.invdoc .inv-totals .trow{ display:flex; justify-content:space-between; gap:18px; font-size:13.5px; padding:5px 0; }
.invdoc .inv-totals .trow .num{ font-family:var(--mono); font-size:13px; }
.invdoc .inv-totals .trow.grand{ border-top:1px solid var(--ink); margin-top:6px; padding-top:10px; font-weight:700; }
.invdoc .inv-totals .trow.grand .num{ font-size:14.5px; font-weight:600; color:var(--green); }
.invdoc .inv-foot{ margin-top:44px; border-top:1px solid var(--line); padding-top:16px; font-size:12.5px; color:var(--gray-69); line-height:1.7; }
.invdoc .inv-foot p{ margin:0; }
/* voorvertoning in de modal: hetzelfde document, compact in een kader */
.invpreview{ border:1px solid var(--line); border-radius:12px; overflow:auto; max-height:52vh; margin-bottom:16px; background:var(--gray-f9); padding:14px; }
.invpreview .invdoc{ border:1px solid var(--line); border-radius:8px; padding:34px 38px; }
@media print{
  /* de printopdracht toont ALLEEN de factuur (het id wint van de universele regel) */
  body.print-invoice > *{ display:none !important; }
  body.print-invoice #invoiceprint{ display:block !important; }
  body.print-invoice{ background:var(--white); }
  #invoiceprint .invdoc{ max-width:none; padding:0; }
}

/* ---------- cijfer-finish: alle datum- en cijferkolommen lijnen verticaal
   uit en verspringen niet bij updates — de portaalconventie, beheerbreed */
.logwhen,.logproj,.mediastrip,.defcount,.nrhint,.sdhint,.inspmeta,
.tlwhen,.shiprow .ms-meta,.undotoast .undocount{ font-variant-numeric:tabular-nums; }

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    transition-duration:.01ms !important;
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
  }
}

/* ---------- responsive ---------- */
@media (max-width:820px){
  .shipcheck .dt, .shipcheck .loc{ width:100%; }
  .navsep{ display:none; }
  .shell{ flex-direction:column; }
  .side{ width:100%; flex:none; height:auto; position:static; border-right:0; border-bottom:1px solid var(--line); }
  .side-head{ padding:16px 18px 12px; border-bottom:0; }
  .side nav{ flex-direction:row; padding:0 12px 10px; overflow-x:auto; }
  .navbtn{ white-space:nowrap; width:auto; }
  .side-foot{ display:none; }
  .demobar{ padding:8px 18px; }
  .content{ padding:24px 16px 70px; }
  /* rijen met actieknoppen: acties vallen op smal scherm onder de tekst,
     zodat de rijtitel nooit tot een smalle kolom wordt geknepen */
  .rowitem{ flex-wrap:wrap; }
  .rowmain{ flex:1 1 200px; }
  .vd-actions{ width:100%; justify-content:flex-start; }
  .formrow{ flex-direction:column; gap:0; }
  .stagerow{ flex-wrap:wrap; }
  .stagesel{ width:100%; flex:1 1 100%; margin-left:34px; }
  .logwhen{ flex-basis:118px; }
  .logrow{ flex-wrap:wrap; }
}
</style>
</head>

<script>
(function(){
'use strict';

/* ============================================================
   constanten en helpers
   ============================================================ */
var CFG = window.CP_PORTAL_CONFIG || {};
var IS_DEMO = !(CFG.supabaseUrl && CFG.supabaseAnonKey);
var DEMO_KEY = 'cp_portal_demo_v1';

var STAGES = [
  { key:'concept',    label:'Concept & Industrieel Ontwerp',       pct:25 },
  { key:'dfm',        label:'Ontwerp voor Produceerbaarheid',      pct:0  },
  { key:'sourcing',   label:'Fabriekssourcing & Screening',        pct:35 },
  { key:'tooling',    label:'Tooling, Sampling & Iteratie',        pct:25 },
  { key:'production', label:'Massaproductie & Kwaliteitscontrole', pct:0  },
  { key:'logistics',  label:'Compliance & Logistiek',              pct:15 }
];
function stageLabel(key){
  for(var i=0;i<STAGES.length;i++){ if(STAGES[i].key===key) return STAGES[i].label; }
  return key || '';
}
var STAGE_STATUS = [
  { key:'done',              label:'Afgerond' },
  { key:'current',           label:'Actief' },
  { key:'awaiting_approval', label:'Wacht op akkoord' },
  { key:'upcoming',          label:'Gepland' }
];
function stageStatusLabel(key){
  for(var i=0;i<STAGE_STATUS.length;i++){ if(STAGE_STATUS[i].key===key) return STAGE_STATUS[i].label; }
  return key || '';
}
var DOC_TYPES = [
  { key:'nnn',        label:'NNN' },
  { key:'quote',      label:'Offerte' },
  { key:'invoice',    label:'Factuur' },
  { key:'inspection', label:'Inspectie' },
  { key:'compliance', label:'Compliance' },
  { key:'shipping',   label:'Verzending' },
  { key:'other',      label:'Overig' }
];
function docTypeLabel(key){
  for(var i=0;i<DOC_TYPES.length;i++){ if(DOC_TYPES[i].key===key) return DOC_TYPES[i].label; }
  return key || '';
}
var SAMPLE_STATUS = [
  { key:'reviewed',   label:'Beoordeeld' },
  { key:'approved',   label:'Goedgekeurd' },
  { key:'superseded', label:'Vervangen' }
];
function sampleStatusLabel(key){
  for(var i=0;i<SAMPLE_STATUS.length;i++){ if(SAMPLE_STATUS[i].key===key) return SAMPLE_STATUS[i].label; }
  return key || '';
}
var CHECKPOINTS = [
  { key:'iqc',  label:'IQC — ingangscontrole' },
  { key:'ipqc', label:'IPQC — tijdens productie' },
  { key:'fqc',  label:'FQC — eindcontrole' }
];
var SEVERITIES = [
  { key:'minor',    label:'Klein' },
  { key:'major',    label:'Groot' },
  { key:'critical', label:'Kritiek' }
];
function severityLabel(key){
  for(var i=0;i<SEVERITIES.length;i++){ if(SEVERITIES[i].key===key) return SEVERITIES[i].label; }
  return key || '';
}
function actorLabel(a){
  if(a==='client') return 'Klant';
  if(a==='staff') return 'Beheer';
  if(a==='system') return 'Systeem';
  return a || '';
}
var DEMO_IMAGES = [
  'images/occ-anniversary.jpg','images/occ-christmas.jpg','images/occ-events.jpg',
  'images/occ-launch.jpg','images/occ-newclient.jpg','images/occ-newyear.jpg',
  'images/occ-opening.jpg','images/occ-renewal.jpg','images/occ-sinterklaas.jpg',
  'images/occ-thankyou.jpg'
];

function clone(o){
  return (typeof structuredClone==='function') ? structuredClone(o) : JSON.parse(JSON.stringify(o));
}
function uid(prefix){
  var r = Math.random().toString(36).slice(2,9);
  return prefix + '-' + Date.now().toString(36) + r;
}
function uuid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return uid('f').replace(/[^a-z0-9]/g,'');
}
function todayISO(){
  var d = new Date();
  var m = String(d.getMonth()+1); if(m.length<2) m='0'+m;
  var day = String(d.getDate()); if(day.length<2) day='0'+day;
  return d.getFullYear() + '-' + m + '-' + day;
}
function asDate(v){
  if(!v) return null;
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return new Date(v + 'T00:00:00');
  return new Date(v);
}
function fmtDate(v){
  var d = asDate(v);
  if(!d || isNaN(d.getTime())) return '';
  return d.toLocaleDateString('nl-NL', { day:'numeric', month:'long', year:'numeric' });
}
function fmtDateTime(v){
  var d = asDate(v);
  if(!d || isNaN(d.getTime())) return '';
  return d.toLocaleDateString('nl-NL', { day:'numeric', month:'short', year:'numeric' }) +
    ' ' + d.toLocaleTimeString('nl-NL', { hour:'2-digit', minute:'2-digit' });
}

/* antwoordklok (1-werkdag-belofte): ontvangst + 1 dag, weekend overslaand.
   Volledig berekend uit de bestaande timestamp, geen nieuwe opslag. */
function answerDeadline(askedAt){
  var d = asDate(askedAt);
  if(!d || isNaN(d.getTime())) return null;
  var t = new Date(d.getTime());
  t.setDate(t.getDate()+1);
  while(t.getDay()===0 || t.getDay()===6) t.setDate(t.getDate()+1);
  return t;
}
function klokInfo(askedAt){
  var dl = answerDeadline(askedAt);
  if(!dl) return null;
  var ms = dl.getTime() - Date.now();
  var abs = Math.abs(ms);
  var hours = Math.round(abs/3600000);
  var span;
  if(hours < 1) span = Math.max(1, Math.round(abs/60000)) + ' min';
  else if(hours < 48) span = hours + ' u';
  else span = Math.round(hours/24) + ' d';
  if(ms < 0) return { state:'rood', cls:'klok-rood', label: span + ' te laat', sort: ms };
  if(ms < 4*3600000) return { state:'oranje', cls:'klok-oranje', label:'nog ' + span, sort: ms };
  return { state:'groen', cls:'klok-groen', label:'nog ' + span, sort: ms };
}

   schrijft sinds deze golf ' — apparaat: Browser · OS · Tijdzone' achter
   het detail van klant-logregels; hier de parser + de nieuw-apparaat-
   analyse. Regels van vóór deze golf hebben geen apparaatinfo en worden
   eerlijk overgeslagen — er wordt niets verzonnen. */
var DEVICE_TAG_RE = / — apparaat: ([^—]+)$/;
function deviceTagOf(row){
  var mt = DEVICE_TAG_RE.exec(String((row && row.detail)||''));
  return mt ? mt[1].trim() : null;
}
function stripDeviceTag(detail){
  return String(detail==null?'':detail).replace(DEVICE_TAG_RE, '');
}
/* per klant: welke logregels tonen een combinatie die deze klant nog niet
   eerder gebruikte (de allereerste combinatie is de basislijn en telt niet
   als signaal). Retour: { flaggedRowIds:{rowId:true},
   perClient:{clientId:{combo, at}} } met alleen signalen van de laatste
   14 dagen op de klantkaart. */
function computeNewDevices(logRows, projects){
  var pClient = {};
  (projects||[]).forEach(function(p){ pClient[p.id] = p.clientId; });
  var rows = (logRows||[]).filter(function(r){
    return r.actor==='client' && pClient[r.projectId] && deviceTagOf(r);
  }).sort(function(a,b){ return String(a.createdAt).localeCompare(String(b.createdAt)); });
  var seen = {}, flagged = {}, perClient = {};
  var recentLimit = new Date(Date.now() - 14*86400000).toISOString();
  rows.forEach(function(r){
    var cid = pClient[r.projectId];
    var combo = deviceTagOf(r);
    var set = seen[cid] = seen[cid] || {};
    if(!set[combo]){
      var isFirstEver = !Object.keys(set).length;
      set[combo] = true;
      if(!isFirstEver){
        flagged[r.id] = true;
        if(String(r.createdAt) >= recentLimit){
          perClient[cid] = { combo: combo, at: r.createdAt };
        }
      }
    }
  });
  return { flaggedRowIds: flagged, perClient: perClient };
}

function parseEuro(s){
  s = String(s==null?'':s).replace(/[€\s]/g,'');

     dus punten strippen we altijd, ook zonder komma ("3.125" = 3125, niet 3,125). */
  s = s.replace(/\./g, '').replace(',', '.');

/* DOM zonder innerHTML: veilig tegen XSS */
function el(tag, attrs, children){
  var n = document.createElement(tag);

      if(v==null) return;
      if(k==='class'){ n.className = v; }
      else if(k==='text'){ n.textContent = v; }
      else if(k==='value'){ n.value = v; }
      else if(k==='checked'){ n.checked = !!v; }
      else if(k==='disabled'){ n.disabled = !!v; }
      else if(k.indexOf('on')===0 && typeof v==='function'){ n.addEventListener(k.slice(2), v); }
      else { n.setAttribute(k, v); }
    });
  }
  if(children!=null){
    (Array.isArray(children)?children:[children]).forEach(function(c){
      if(c==null) return;

   golf 2 — gedeelde invoer-versnellers
   ============================================================ */

/* slimme datumvelden (functie 20): 'vr' = de eerstvolgende vrijdag (vandaag
   telt mee), '+3' = over drie dagen, '12/9' = 12 september (rolt naar volgend
   jaar als die datum al >90 dagen voorbij is), '12' = de 12e van deze maand
   (of de volgende als die al voorbij is), 'vandaag'/'morgen', en volledige
   datums als 12/9/2026 of 2026-09-12. */
var SD_WEEKDAYS = { zo:0, ma:1, di:2, wo:3, do:4, vr:5, za:6 };
var SD_WEEKDAY_FULL = ['maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag','zondag'];
function sdMakeDate(y, mth, d){
  var dt = new Date(y, mth-1, d);
  if(dt.getFullYear()!==y || dt.getMonth()!==mth-1 || dt.getDate()!==d) return null; /* 31/2 bestaat niet */
  return dt;
}
function sdToIso(dt){
  var m = String(dt.getMonth()+1); if(m.length<2) m='0'+m;
  var day = String(dt.getDate()); if(day.length<2) day='0'+day;
  return dt.getFullYear() + '-' + m + '-' + day;
}
function addDaysISO(iso, n){
  var d = asDate(iso);
  if(!d || isNaN(d.getTime())) return null;
  d.setDate(d.getDate() + n);
  return sdToIso(d);
}
function parseSmartDate(raw){
  var s = String(raw==null?'':raw).trim().toLowerCase();
  if(!s) return null;
  var today = new Date(); today.setHours(0,0,0,0);
  var mt, t;
  if(s==='vandaag' || s==='nu') return sdToIso(today);
  if(s==='morgen'){ t = new Date(today); t.setDate(t.getDate()+1); return sdToIso(t); }
  if(/^[a-z]+$/.test(s)){
    var wd = SD_WEEKDAYS[s.slice(0,2)];
    if(wd!==undefined && (s.length===2 || SD_WEEKDAY_FULL.indexOf(s)>-1)){
      t = new Date(today);
      t.setDate(t.getDate() + ((wd - today.getDay() + 7) % 7));
      return sdToIso(t);
    }
    return null;
  }
  mt = /^\+(\d{1,3})$/.exec(s);
  if(mt){ t = new Date(today); t.setDate(t.getDate()+parseInt(mt[1],10)); return sdToIso(t); }
  mt = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s);
  if(mt){ t = sdMakeDate(+mt[1], +mt[2], +mt[3]); return t ? sdToIso(t) : null; }
  mt = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/.exec(s);
  if(mt){
    var yr = parseInt(mt[3],10); if(yr<100) yr += 2000;
    t = sdMakeDate(yr, +mt[2], +mt[1]);
    return t ? sdToIso(t) : null;
  }
  mt = /^(\d{1,2})[\/\-.](\d{1,2})$/.exec(s);
  if(mt){
    t = sdMakeDate(today.getFullYear(), +mt[2], +mt[1]);
    if(!t) return null;
    /* zonder jaartal: >90 dagen geleden = vrijwel zeker volgend jaar bedoeld */
    if(today.getTime() - t.getTime() > 90*86400000){
      t = sdMakeDate(today.getFullYear()+1, +mt[2], +mt[1]);
      if(!t) return null;
    }
    return sdToIso(t);
  }
  mt = /^(\d{1,2})$/.exec(s);
  if(mt){
    var dayN = +mt[1];
    if(dayN<1 || dayN>31) return null;
    t = sdMakeDate(today.getFullYear(), today.getMonth()+1, dayN);
    if(t && t.getTime() >= today.getTime()) return sdToIso(t);
    var mth2 = today.getMonth()+2, yr2 = today.getFullYear();
    if(mth2>12){ mth2=1; yr2++; }
    t = sdMakeDate(yr2, mth2, dayN);
    return t ? sdToIso(t) : null;
  }
  return null;
}
function fmtDateHint(iso){
  var d = asDate(iso);
  if(!d || isNaN(d.getTime())) return '';
  return d.toLocaleDateString('nl-NL', { weekday:'short', day:'numeric', month:'long', year:'numeric' });
}
function smartDateField(initialIso, ariaLabel){
  var input = el('input', { class:'input', type:'text', autocomplete:'off',
    placeholder:'bv. vr, +3, 12/9 of 2026-09-12', 'aria-label': ariaLabel || 'Datum' });
  var hint = el('span', { class:'sdhint', 'aria-live':'polite' });
  var value = null;
  function sync(){
    var rawv = input.value.trim();
    hint.classList.remove('ok'); hint.classList.remove('bad');
    if(!rawv){ value = null; hint.textContent = ''; return; }
    var iso = parseSmartDate(rawv);
    if(iso){ value = iso; hint.textContent = '→ ' + fmtDateHint(iso); hint.classList.add('ok'); }
    else { value = null; hint.textContent = 'Niet herkend — probeer vr, +3, 12/9 of 2026-09-12'; hint.classList.add('bad'); }
  }
  input.addEventListener('input', sync);
  var api = {
    node: el('div', null, [ input, hint ]),
    input: input,
    get: function(){ return value; },
    set: function(iso){ input.value = iso || ''; sync(); },
    invalid: function(){ return input.value.trim()!=='' && !value; }
  };
  if(initialIso) api.set(initialIso);
  return api;
}

/* EXIF-datum (functie 49): minimale eigen parser voor DateTimeOriginal
   (tag 0x9003) in JPEG/EXIF. Faalt STIL naar null — de aanroeper valt dan
   terug op vandaag / de gedeelde batchdatum. */
function exifDateFromTiff(v, tiff, end){
  if(tiff + 8 > end) return null;
  var bo = v.getUint16(tiff);
  var little;
  if(bo === 0x4949) little = true;
  else if(bo === 0x4D4D) little = false;
  else return null;
  function u16(p){ return v.getUint16(p, little); }
  function u32(p){ return v.getUint32(p, little); }
  if(u16(tiff+2) !== 42) return null;
  function findTag(dirStart, tag){
    if(dirStart < tiff || dirStart + 2 > end) return null;
    var n = u16(dirStart);
    for(var i=0;i<n;i++){
      var e = dirStart + 2 + i*12;
      if(e + 12 > end) return null;
      if(u16(e) === tag) return e;
    }
    return null;
  }
  var exifPtr = findTag(tiff + u32(tiff+4), 0x8769);
  if(!exifPtr) return null;
  var dt = findTag(tiff + u32(exifPtr+8), 0x9003);
  if(!dt) return null;
  if(u16(dt+2) !== 2) return null; /* type 2 = ASCII */
  var cnt = u32(dt+4);
  if(cnt < 10) return null;
  var strOff = (cnt <= 4) ? dt+8 : tiff + u32(dt+8);
  if(strOff + 10 > end) return null;
  var s = '';
  for(var j=0;j<Math.min(cnt,19) && strOff+j<end;j++){
    var ch = v.getUint8(strOff+j);
    if(!ch) break;
    s += String.fromCharCode(ch);
  }
  var mt = /^(\d{4}):(\d{2}):(\d{2})/.exec(s); /* 'YYYY:MM:DD HH:MM:SS' */
  if(!mt || mt[1]==='0000') return null;
  return mt[1] + '-' + mt[2] + '-' + mt[3];
}
function exifDateFromBuffer(buf){
  var v = new DataView(buf);
  if(v.byteLength < 14 || v.getUint16(0) !== 0xFFD8) return null;
  var off = 2;
  while(off + 4 <= v.byteLength){
    if(v.getUint8(off) !== 0xFF) return null;
    var marker = v.getUint8(off+1);
    if(marker === 0xDA || marker === 0xD9) return null; /* beelddata begint: geen EXIF meer */
    var size = v.getUint16(off+2);
    if(size < 2) return null;
    if(marker === 0xE1 && off + 10 <= v.byteLength &&
       v.getUint32(off+4) === 0x45786966 && v.getUint16(off+8) === 0){ /* 'Exif\0\0' */
      return exifDateFromTiff(v, off + 10, Math.min(v.byteLength, off + 2 + size));
    }
    off += 2 + size;
  }
  return null;
}
function readExifDate(file){
  return new Promise(function(resolve){
    try{
      if(!file || !file.type || !/jpe?g/i.test(file.type)) return resolve(null);
      var fr = new FileReader();
      fr.onerror = function(){ resolve(null); };
      fr.onload = function(){
        try{ resolve(exifDateFromBuffer(fr.result)); }catch(e){ resolve(null); }
      };
      fr.readAsArrayBuffer(file.slice(0, 262144));
    }catch(e){ resolve(null); }
  });
}

/* demomodus (functie 48, golf uploads): echte foto's worden client-side
   verkleind (max 1800px lange zijde, JPEG ~0.85) en als blob in IndexedDB
   bewaard via CP_FILES (portal/demo-files.js) — localStorage is daarvoor te
   klein. Het mediarecord draagt alleen een fileRef; EXIF wordt vóór het
   verkleinen van het ORIGINELE bestand gelezen (readExifDate in addRow). */
function fileToDemoBlob(file){
  return new Promise(function(resolve){
    var url;
    try{ url = URL.createObjectURL(file); }catch(e){ return resolve(null); }
    var img = new Image();
    img.onload = function(){
      try{
        var w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(1, 1800 / Math.max(w, h, 1));
        var cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(w*scale));
        cv.height = Math.max(1, Math.round(h*scale));
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        cv.toBlob(function(blob){
          URL.revokeObjectURL(url);
          resolve(blob || null);
        }, 'image/jpeg', .85);
      }catch(e){
        URL.revokeObjectURL(url);
        resolve(null);
      }
    };
    img.onerror = function(){ URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}

/* conceptbehoud in alle modals (functie 17): veldwaarden gaan per wijziging
   naar localStorage (sleutel per scope + formuliertype); bij heropenen
   verschijnt een gele terugzet-balk. Na opslaan wist het formulier zijn
   concept. Bestandskiezers zijn bewust uitgezonderd (niet herstelbaar). */
var DRAFT_PREFIX = 'cp_beheer_draft_v1:';
function attachDraft(m, form, formType, scopeId, opts){
  opts = opts || {};
  var key = DRAFT_PREFIX + formType + ':' + (scopeId || 'algemeen');
  function fields(){ return form.querySelectorAll('input, textarea, select'); }
  function serialize(){
    var out = [];
    Array.prototype.forEach.call(fields(), function(f){
      var tp = (f.type||'').toLowerCase();
      if(tp==='file' || tp==='button' || tp==='submit' || tp==='hidden') return;
      if(tp==='checkbox' || tp==='radio') out.push({ c: f.checked ? 1 : 0 });
      else out.push({ v: String(f.value==null?'':f.value) });
    });
    return out;
  }
  var initial = JSON.stringify(serialize());
  var timer = null;
  function persist(){
    timer = null;
    var cur = JSON.stringify(serialize());
    try{
      if(cur === initial) localStorage.removeItem(key);
      else localStorage.setItem(key, JSON.stringify({
        at: new Date().toISOString(),
        meta: (opts.meta ? opts.meta() : null),
        fields: JSON.parse(cur)
      }));
    }catch(e){ /* volle of geblokkeerde opslag mag invoeren nooit hinderen */ }
  }
  function onEdit(){ if(timer) clearTimeout(timer); timer = setTimeout(persist, 250); }
  form.addEventListener('input', onEdit);
  form.addEventListener('change', onEdit);

  var saved = null;
  try{ saved = JSON.parse(localStorage.getItem(key)); }catch(e){ saved = null; }
  if(saved && Array.isArray(saved.fields)){
    var when = '';
    var at = saved.at ? new Date(saved.at) : null;
    if(at && !isNaN(at.getTime())){
      when = (sdToIso(at)===todayISO())
        ? at.toLocaleTimeString('nl-NL', { hour:'2-digit', minute:'2-digit' })
        : fmtDateTime(saved.at);
    }
    var bar = el('div', { class:'draftbar' });
    var restoreBtn = el('button', { type:'button', text:'Zet terug' });
    var dropBtn = el('button', { type:'button', text:'Verwijder concept' });
    bar.appendChild(el('span', { class:'draftmsg', text:'Concept van ' + (when || 'eerder') + ' gevonden — terugzetten?' }));
    bar.appendChild(restoreBtn);
    bar.appendChild(dropBtn);
    restoreBtn.addEventListener('click', function(){
      if(opts.prepare) opts.prepare(saved.meta);
      var fs = fields(), i = 0;
      Array.prototype.forEach.call(fs, function(f){
        var tp = (f.type||'').toLowerCase();
        if(tp==='file' || tp==='button' || tp==='submit' || tp==='hidden') return;
        var d = saved.fields[i++];
        if(!d) return;
        if(tp==='checkbox' || tp==='radio') f.checked = !!d.c;
        else if(d.v!==undefined) f.value = d.v;
        /* laat hints/afgeleiden live meebewegen */
        f.dispatchEvent(new Event('input', { bubbles:true }));
        f.dispatchEvent(new Event('change', { bubbles:true }));
      });
      if(bar.parentNode) bar.parentNode.removeChild(bar);
    });
    dropBtn.addEventListener('click', function(){
      try{ localStorage.removeItem(key); }catch(e){}
      if(bar.parentNode) bar.parentNode.removeChild(bar);
    });
    form.insertBefore(bar, form.firstChild);
  }

  var api = {
    clear: function(){ try{ localStorage.removeItem(key); }catch(e){} },
    dirty: function(){ return JSON.stringify(serialize()) !== initial; }
  };
  if(m && m.setDirty) m.setDirty(api.dirty);
  return api;
}

/* live veldvalidatie (functie 18): de opslaanknop vertelt wat er nog mist.
   items: [{ input, label }] of [{ get, label }] */
function missingHint(form, items){
  var span = el('span', { class:'misshint', 'aria-live':'polite' });
  function read(it){
    if(it.get) return it.get();
    var f = it.input;
    if(!f) return '';
    if((f.type||'')==='checkbox') return f.checked ? 'x' : '';
    return f.value;
  }
  function calc(){
    var miss = [];
    items.forEach(function(it){
      var v = read(it);
      if(!String(v==null?'':v).trim()) miss.push(it.label);
    });
    span.textContent = miss.length
      ? ('Nog ' + miss.length + (miss.length===1 ? ' veld: ' : ' velden: ') + miss.join(', '))
      : '';
  }
  form.addEventListener('input', calc);
  form.addEventListener('change', calc);
  calc();
  return span;
}
function warnHint(){
  return el('p', { class:'warnhint', 'aria-live':'polite' });
}
function setWarn(node, msg){
  node.textContent = msg || '';
  node.classList.toggle('show', !!msg);
}

/* undo-toast (functie 15): 15 seconden de kans om een destructieve actie
   terug te draaien; het vangnet 'Onlangs verwijderd' (7 dagen) staat onder
   Instellingen. Geen van de huidige destructieve acties stuurt zelf een
   klantmail, dus er hoeft ook geen mail te wachten. */
var undoToastEl = null, undoTicker = null;
function dismissUndoToast(){
  if(undoTicker){ clearInterval(undoTicker); undoTicker = null; }
  if(undoToastEl && undoToastEl.parentNode) undoToastEl.parentNode.removeChild(undoToastEl);
  undoToastEl = null;
}
function showUndoToast(message, onUndo){
  dismissUndoToast();
  var secs = 15;
  var count = el('span', { class:'undocount', text: secs + ' s' });
  var btn = el('button', { type:'button', class:'undobtn', text:'Maak ongedaan' });
  btn.addEventListener('click', function(){
    btn.disabled = true;
    Promise.resolve().then(onUndo).then(dismissUndoToast, function(ex){
      dismissUndoToast();
      showError(ex);
    });
  });
  undoToastEl = el('div', { class:'undotoast', role:'status' }, [
    el('span', { text: message }), count, btn
  ]);
  document.body.appendChild(undoToastEl);
  undoTicker = setInterval(function(){
    secs--;
    if(secs<=0) dismissUndoToast();
    else count.textContent = secs + ' s';
  }, 1000);
}

/* fase-structuur voor een nieuw project: uit een sjabloon (functie 41 —
   'zelfde als vorige keer' — of de dupliceerknop) of de standaard zes fases */
function stageSeedFrom(tpl){
  var src = (tpl && Array.isArray(tpl.stages) && tpl.stages.length)
    ? tpl.stages.slice().sort(function(a,b){ return (a.position||0)-(b.position||0); })
    : null;
  if(!src){
    /* functie 64: het standaard fasesjabloon is bewerkbaar onder
       Instellingen → Bedrijf & standaarden; zonder instelling geldt
       de vaste 25/0/35/25/0/15 */
    var pct = (adminSettings && Array.isArray(adminSettings.faseSjabloonPct) && adminSettings.faseSjabloonPct.length===STAGES.length)
      ? adminSettings.faseSjabloonPct : null;
    return STAGES.map(function(s, i){
      return { stageKey:s.key, position:i+1, paymentPct: pct ? (parseInt(pct[i],10)||0) : s.pct };
    });
  }
  return src.map(function(s, i){
    return { stageKey:s.stageKey, position:i+1, paymentPct:(typeof s.paymentPct==='number' ? s.paymentPct : 0) };
  });
}

/* ============================================================
   modals
   ============================================================ */
var activeModal = null;
function closeModal(){
  if(activeModal){
    var onDismiss = activeModal.onDismiss;
    document.removeEventListener('keydown', activeModal.esc);
    if(activeModal.node.parentNode) activeModal.node.parentNode.removeChild(activeModal.node);
    activeModal = null;
    /* sluiten via Escape/overlay telt als annuleren voor wie op de uitkomst wacht */
    if(onDismiss) onDismiss();
  }
}
function openModal(title, kicker, opts){
  closeModal();
  opts = opts || {};
  var body = el('div');
  var escNote = el('p', { class:'escnote' });
  escNote.hidden = true;
  var dlg = el('div', { class:'modal' + (opts.wide ? ' wide' : ''), role:'dialog', 'aria-modal':'true', 'aria-label':title }, [
    el('h2', { text:title }),
    kicker ? el('span', { class:'kicker', text:kicker }) : null,
    body,
    escNote
  ]);
  /* modal-focusstroom (functie 19): Esc met niet-opgeslagen invoer vraagt
     eerst een tweede Esc/klik i.p.v. de invoer stil weg te gooien (het
     conceptbehoud bewaart hem intussen toch) */
  function guardClose(){
    if(activeModal && activeModal.dirty && activeModal.dirty() && !activeModal.escArmed){
      activeModal.escArmed = true;
      escNote.textContent = 'Nog niet opgeslagen — druk nogmaals op Esc of klik nogmaals buiten het venster om te sluiten.';
      escNote.hidden = false;
      return;
    }
    closeModal();
  }
  var overlay = el('div', { class:'overlay', onclick:function(e){ if(e.target===overlay) guardClose(); } }, dlg);
  function esc(e){
    if(e.key==='Escape'){ guardClose(); return; }
    /* Cmd/Ctrl+Enter = opslaan (functie 19) */
    if(e.key==='Enter' && (e.metaKey || e.ctrlKey)){
      var f = dlg.querySelector('form');
      if(f){
        e.preventDefault();
        if(f.requestSubmit) f.requestSubmit();
        else f.dispatchEvent(new Event('submit', { cancelable:true }));
      }
    }
  }
  dlg.addEventListener('input', function(){
    if(activeModal) activeModal.escArmed = false;
    escNote.hidden = true;
  });
  document.addEventListener('keydown', esc);
  document.body.appendChild(overlay);
  activeModal = { node:overlay, esc:esc, onDismiss:null, dirty:null, escArmed:false };
  setTimeout(function(){
    var f = dlg.querySelector('input, textarea, select, button');
    if(f) f.focus();
  }, 30);
  return {
    body:body, close:closeModal,
    /* fn wordt aangeroepen als de modal sluit ZONDER expliciete knop
       (Escape of overlay-klik) — bv. om een confirm-Promise alsnog te settelen */
    onDismiss:function(fn){ if(activeModal) activeModal.onDismiss = fn; },
    /* functie 19: alleen bij daadwerkelijke invoer vraagt Esc bevestiging */
    setDirty:function(fn){ if(activeModal) activeModal.dirty = fn; }
  };
}
function confirmDialog(title, message, confirmText){
  return new Promise(function(resolve){
    var settled = false;
    function settle(v){ if(settled) return; settled = true; resolve(v); }
    var m = openModal(title);
    m.onDismiss(function(){ settle(false); });
    m.body.appendChild(el('p', { text:message, style:'font-size:14px;color:var(--gray-69);' }));
    m.body.appendChild(el('div', { class:'modal-actions' }, [
      el('button', { type:'button', class:'btn ghost', text:'Annuleren', onclick:function(){ settle(false); closeModal(); } }),
      el('button', { type:'button', class:'btn', text:confirmText||'Bevestigen', onclick:function(){ settle(true); closeModal(); } })
    ]));
  });
}

/* ============================================================
   dataservice — demomodus
   ============================================================ */
function makeDemoService(){
  var state = null;
  try{
    var raw = localStorage.getItem(DEMO_KEY);
    if(raw) state = JSON.parse(raw);
  }catch(e){ state = null; }
  if(!state || !Array.isArray(state.clients) || !Array.isArray(state.projects)) state = clone(window.CP_DEMO);
  /* schema-drift over apps/versies heen: ontbrekende collecties altijd aanvullen
     in plaats van de hele state te laten crashen op de eerste .push()/.slice().
     Een collectie die pas in een latere versie is geïntroduceerd, vullen we
     vanuit de seed zodat een bestaande demo-opslag de nieuwe functie meteen toont. */
  /* 'trash' (functie 15) is beheer-only: de portal leest hem nooit, dus de
     guard hoeft alleen hier te staan */
  /* 'mailLog' (functie 62) is net als 'trash' beheer-only: de portal leest
     hem nooit, dus de guard hoeft alleen hier te staan */
  /* 'contactMoments' (functie 27) is eveneens beheer-only: de tijdlijn en
     follow-up-herinneringen zijn CRM-data die de klant nooit ziet */
  /* 'aanvragen' (functie 21) en 'contacts' (functie 26) zijn ook beheer-only:
     site-briefs en contactpersonen leest de portal nooit */
  /* 'docSlots' (functie 52) leest de portal WEL ("wordt verwacht in fase X"),
     dus die guard staat ook in portal.html; 'auditLog' (functie 63) is
     beheer-only */
  ['media','documents','invoices','samples','inspections','questions','disclosures','accessLog','factories','shipments','shipmentEvents','trash','mailLog','contactMoments','aanvragen','contacts','docSlots','auditLog'].forEach(function(k){
    if(!Array.isArray(state[k])){
      state[k] = (window.CP_DEMO && Array.isArray(window.CP_DEMO[k])) ? clone(window.CP_DEMO[k]) : [];
    }
  });
  /* veld-aanvulling: 'city' (Fabriek op de Kaart) kan in oudere demo-opslag
     ontbreken; vul aan vanuit de seed, per id */
  (state.factories||[]).forEach(function(f){
    if(f.city===undefined){
      var sf = ((window.CP_DEMO && window.CP_DEMO.factories) || []).find(function(x){ return x.id===f.id; });
      f.city = (sf && sf.city) ? sf.city : '';
    }
  });
  /* beheerinstellingen (golf 1 + 3): klein object, met defaults aangevuld
     zodat oudere demo-opslag nieuwe instellingen meteen kent. De portal
     leest dit niet, dus geen guard aan die kant nodig. */
  if(!state.settings || typeof state.settings!=='object' || Array.isArray(state.settings)) state.settings = {};
  fillSettingsDefaults(state.settings);
  function save(){
    /* tweetabs-veilig: de portal-tab kan intussen een vraag of logregel
       hebben toegevoegd onder dezelfde sleutel. Union die per id in vóór
       we de hele staat terugschrijven, anders overschrijft een simpele
       notitie-blur hier de klantvraag daar — permanent. */
    try{
      var raw = localStorage.getItem(DEMO_KEY);
      if(raw){
        var latest = JSON.parse(raw);
        if(latest && Array.isArray(latest.questions)){
          ['questions','accessLog'].forEach(function(k){
            var have = {};
            (state[k] = state[k] || []).forEach(function(it){ have[it.id] = true; });
            (latest[k] || []).forEach(function(it){ if(!have[it.id]) state[k].push(it); });
          });
        }
      }
    }catch(e){ /* onleesbaar: schrijf de eigen staat */ }
    try{ localStorage.setItem(DEMO_KEY, JSON.stringify(state)); }catch(e){}
  }
  function pushLog(projectId, entry){
    state.accessLog.push({
      id: uid('log'), projectId: projectId,
      actor: entry.actor, assetKind: entry.assetKind, assetId: entry.assetId || null,
      action: entry.action, detail: entry.detail || '',
      createdAt: new Date().toISOString()
    });
  }
  function findStage(projectId, stageKey){
    var p = state.projects.find(function(x){ return x.id===projectId; });
    if(!p) return null;
    return p.stages.find(function(s){ return s.stageKey===stageKey; }) || null;
  }
  /* golf uploads: blob dupliceren onder een nieuwe fileRef (kopieerflows) —
     twee records mogen nooit één blob delen. Geen blob (andere browser) of
     geen CP_FILES → null, de kopie reist dan zonder bestand. */
  function dupFileRef(fileRef, kind){
    if(!fileRef || !window.CP_FILES) return Promise.resolve(null);
    return window.CP_FILES.getFile(fileRef).then(function(rec){
      if(!rec) return null;
      var ref = uid('file');
      var meta = rec.meta || {};
      return window.CP_FILES.putFile(ref, rec.blob, {
        kind: meta.kind || kind, name: meta.name || '', type: meta.type || rec.blob.type || '', size: meta.size || rec.blob.size || 0
      }).then(function(){ return ref; });
    });
  }
  /* FIXRONDE R1-2 — het gekoppelde factuurdocument mag na een factuur-
     bewerking niet met de oude titel en de oude fase achterblijven.
     De titel volgt alleen zolang hij nog het gegenereerde patroon
     'Factuur <nummer>' heeft; een zelf getypte titel blijft van de
     beheerder. De PDF-inhoud kunnen we niet herschrijven — hangt er een
     bestand, dan markeren we het record als verouderd (fileStale) zodat de
     beheerlijst dat eerlijk toont, in plaats van stil te doen alsof de
     oude PDF nog klopt. */
  function syncInvoiceDoc(inv, prevNum, prevStage){
    if(!inv || !inv.documentId) return null;
    var d = state.documents.find(function(x){ return x.id===inv.documentId; });
    if(!d) return null;
    var numChanged = (inv.invoiceNumber||'') !== (prevNum||'');
    var stageChanged = inv.stageKey !== prevStage;
    if(!numChanged && !stageChanged) return null;
    var changed = [];
    if(numChanged && /^Factuur(\s|$)/.test(String(d.title||''))){
      d.title = 'Factuur ' + (inv.invoiceNumber || inv.label || '');
      changed.push('titel');
    }
    if(stageChanged){ d.stageKey = inv.stageKey; changed.push('fase'); }
    if(!changed.length) return null;
    var stale = numChanged && !!d.fileRef;
    if(stale) d.fileStale = true;
    save();
    return { docSynced: changed, docStale: stale };
  }
  return {
    mode: 'demo',
    staffName: (state.staff && state.staff.name) || 'Steffan Bakker',
    staffEmail: (state.staff && state.staff.email) || '',

    /* leest toevoegingen van de portal-tab (vragen, logregels) in de
       eigen staat in — aangeroepen door de storage-listener zodat de
       vragenbadge live meebeweegt zonder heruitloggen */
    absorbExternal: function(){
      try{
        var raw = localStorage.getItem(DEMO_KEY);
        if(!raw) return Promise.resolve(false);
        var latest = JSON.parse(raw);
        var changed = false;
        ['questions','accessLog'].forEach(function(k){
          var have = {};
          (state[k] = state[k] || []).forEach(function(it){ have[it.id] = true; });
          (latest && latest[k] || []).forEach(function(it){
            if(!have[it.id]){ state[k].push(it); changed = true; }
          });
        });
        return Promise.resolve(changed);
      }catch(e){ return Promise.resolve(false); }
    },

    listFactories: function(){ return Promise.resolve(state.factories.slice()); },
    setFactoryCity: function(id, city){
      var f = state.factories.find(function(x){ return x.id===id; });
      if(f){ f.city = city || ''; save(); }
      return Promise.resolve();
    },
    /* golf 7 — bewerk-alles: naam/regio (de stad houdt haar eigen kiezer) */
    updateFactory: function(id, data){
      var f = state.factories.find(function(x){ return x.id===id; });
      if(f){
        if(data.name!==undefined) f.name = data.name;
        if(data.region!==undefined) f.region = data.region || '';
        if(data.city!==undefined) f.city = data.city || '';
        save();
      }
      return Promise.resolve();
    },

    listClients: function(){
      var counts = {};
      state.projects.forEach(function(p){ counts[p.clientId] = (counts[p.clientId]||0)+1; });
      return Promise.resolve(state.clients.map(function(c){
        var o = clone(c); o.projectCount = counts[c.id]||0; return o;
      }));
    },
    getClient: function(id){
      var c = state.clients.find(function(x){ return x.id===id; });
      return Promise.resolve(c ? clone(c) : null);
    },
    createClient: function(data){

    /* FIXRONDE R0-1/R1-1 — factuurnummer: ÉÉN atomaire uitgifte.
       Lezen, ophogen en terugschrijven gebeurt hier in één synchrone
       beweging, zónder await ertussen; de teller wordt bovendien vers uit
       localStorage gelezen zodat een tweede beheertab die net een nummer
       trok niet wordt overschreven. Een nummer dat (handmatig) al op een
       factuur staat wordt overgeslagen — de teller kan nooit een duplicaat
       uitgeven. Alleen de teller wordt teruggeschreven, niet de hele
       staat: een volledige save() zou een factuur uit de andere tab
       kunnen wissen. */
    claimInvoiceNumber: function(){
      var blob = null;
      try{
        var raw = localStorage.getItem(DEMO_KEY);
        if(raw) blob = JSON.parse(raw);
      }catch(e){ blob = null; }
      if(blob && blob.settings && blob.settings.factuurReeks) state.settings.factuurReeks = blob.settings.factuurReeks;
      var used = {};
      function markUsed(list){
        (list||[]).forEach(function(i){ if(i && i.invoiceNumber) used[i.invoiceNumber] = true; });
      }
      markUsed(state.invoices);
      if(blob) markUsed(blob.invoices);
      var claim = invoiceNumberFor(state.settings.factuurReeks);
      var guard = 0;
      while(used[claim.text] && guard++ < 10000){
        claim = invoiceNumberFor({ prefix: claim.prefix, jaar: claim.jaar, volgende: claim.volgende + 1 });
      }
      var next = { prefix: claim.prefix, jaar: claim.jaar, volgende: claim.volgende + 1 };
      state.settings.factuurReeks = next;
      if(blob){
        try{
          blob.settings = blob.settings || {};
          blob.settings.factuurReeks = next;
          localStorage.setItem(DEMO_KEY, JSON.stringify(blob));
        }catch(e){ save(); }
      } else save();
      return Promise.resolve(claim);
    },

    /* soft-deletes (functie 15): het record verhuist naar state.trash en is
       15 s via de toast en 7 dagen via Instellingen → Onlangs verwijderd
       terug te halen. De portal leest 'trash' nooit, dus de klant ziet het
       item direct niet meer. */
    softDeleteMedia: function(id){
      var i = state.media.findIndex(function(x){ return x.id===id; });
      if(i<0) return Promise.resolve(null);
      var mrow = state.media.splice(i,1)[0];
      var entry = { id: uid('trash'), kind:'media', deletedAt: new Date().toISOString(), payload:{ media: mrow } };
      state.trash.push(entry);
      save();
      return Promise.resolve(clone(entry));
    },
    softDeleteDocument: function(id){
      var i = state.documents.findIndex(function(x){ return x.id===id; });
      if(i<0) return Promise.resolve(null);
      var d = state.documents.splice(i,1)[0];
      /* facturen die naar dit document wezen: koppeling losmaken maar
         onthouden, zodat terugzetten hem ook herstelt */
      var invoiceIds = [];
      state.invoices.forEach(function(inv){
        if(inv.documentId===id){ invoiceIds.push(inv.id); inv.documentId = null; }
      });
      /* documentslots (functie 52): net als bij de harde delete valt een
         gevuld slot terug naar 'verwacht' — anders bleef het slot met een
         dode documentId hangen en sloeg de automatische slotvulling het
         over. De ids reizen mee zodat terugzetten het slot weer vult. */
      var slotIds = [];
      (state.docSlots||[]).forEach(function(sl){
        if(sl.documentId===id){ slotIds.push(sl.id); sl.documentId = null; sl.status = 'verwacht'; }
      });
      var entry = { id: uid('trash'), kind:'document', deletedAt: new Date().toISOString(), payload:{ document: d, invoiceIds: invoiceIds, slotIds: slotIds } };
      state.trash.push(entry);
      save();
      return Promise.resolve(clone(entry));
    },
    restoreTrash: function(trashId){
      var i = state.trash.findIndex(function(t){ return t.id===trashId; });
      if(i<0) return Promise.resolve();
      var t = state.trash.splice(i,1)[0];
      var pl = t.payload || {};
      if(t.kind==='media' && pl.media){
        state.media.push(pl.media);
      } else if(t.kind==='document' && pl.document){
        state.documents.push(pl.document);
        (pl.invoiceIds||[]).forEach(function(iid){
          var inv = state.invoices.find(function(x){ return x.id===iid; });
          if(inv) inv.documentId = pl.document.id;
        });
        /* documentslots (functie 52): terugzetten vult het slot weer */
        (pl.slotIds||[]).forEach(function(sid){
          var sl = (state.docSlots||[]).find(function(x){ return x.id===sid; });
          if(sl && !sl.documentId){ sl.documentId = pl.document.id; sl.status = 'gevuld'; }
        });
      }
      save();
      return Promise.resolve();
    },
    listTrash: function(){
      /* ouder dan 7 dagen = definitief weg — inclusief de blob in
         IndexedDB, anders blijft die eeuwig wees achter */
      var limit = Date.now() - 7*86400000;
      var before = state.trash.length;
      state.trash = state.trash.filter(function(t){
        var d = asDate(t.deletedAt);
        var keep = d && !isNaN(d.getTime()) && d.getTime() > limit;
        if(!keep && window.CP_FILES){
          var pl = t.payload || {};
          var ref = (pl.media && pl.media.fileRef) || (pl.document && pl.document.fileRef) || null;
          if(ref) window.CP_FILES.deleteFile(ref);
        }
        return keep;
      });
      if(state.trash.length !== before) save();
      return Promise.resolve(state.trash.slice().sort(function(a,b){
        return String(b.deletedAt).localeCompare(String(a.deletedAt));
      }).map(clone));
    },

      var ref = uid('file');
      return window.CP_FILES.putFile(ref, file, {
        kind:'document', name: file.name || '', type: file.type || '', size: file.size || 0
      }).then(function(){
        var oldRef = d.fileRef || null;
        d.fileRef = ref;
        d.fileName = file.name || null;
        d.fileSize = file.size || null;
        d.mimeType = file.type || null;
        d.fileStale = false; /* FIXRONDE R1-2: verse PDF = niet meer verouderd */
        save();
        if(oldRef) window.CP_FILES.deleteFile(oldRef);
      });
    },

    /* kopieer naar ander project (functie 51): de kopie landt als CONCEPT
       in het doelproject zodat je bewust publiceert; herkomstmetadata
       (fabriek, datum, onderschrift) reist mee, plus een bronverwijzing.
       Golf uploads: een echt bestand (fileRef) wordt GEDUPLICEERD in de
       blob-opslag — twee records mogen nooit één blob delen, anders
       verdwijnt het beeld bij het bronproject zodra de kopie (of de bron)
       definitief wordt verwijderd. Ontbreekt de blob, dan reist er geen
       fileRef mee en toont de kopie de nette terugvaltegel. */
    copyMediaToProject: function(mediaId, targetProjectId){
      var src = state.media.find(function(x){ return x.id===mediaId; });
      if(!src) return Promise.resolve(null);
      return dupFileRef(src.fileRef, 'media').then(function(newRef){
        var copy = clone(src);
        copy.id = uid('med');
        copy.projectId = targetProjectId;
        copy.publishStatus = 'concept';
        copy.scheduledAt = null;
        copy.updateId = ''; copy.updateNote = '';
        copy.fileRef = newRef;
        copy.copiedFrom = { projectId: src.projectId, id: src.id };
        copy.createdAt = new Date().toISOString();
        state.media.push(copy);
        save();
        return clone(copy);
      });
    },
    copyDocumentToProject: function(docId, targetProjectId){
      var src = state.documents.find(function(x){ return x.id===docId; });

        var copy = clone(src);
        copy.id = uid('doc');
        copy.projectId = targetProjectId;
        copy.publishStatus = 'concept';
        copy.scheduledAt = null;
        copy.shipmentId = null; /* een zending hoort bij het bronproject */
        copy.fileRef = newRef;
        copy.copiedFrom = { projectId: src.projectId, id: src.id };

        state.documents.push(copy);

    listInvoices: function(projectId){

    },
    addInvoice: function(projectId, data){
      /* FIXRONDE R1-1: nooit twee facturen met hetzelfde nummer. De
         jaarteller is atomair (claimInvoiceNumber); dit is het vangnet voor
         een handmatig getypt nummer — live doet de unique index in
         0005_admin.sql precies hetzelfde. */
      var wantedNr = data.invoiceNumber || '';
      if(wantedNr && state.invoices.some(function(i){ return i.invoiceNumber===wantedNr; })){
        return Promise.reject(new Error('Factuurnummer ' + wantedNr + ' staat al op een andere factuur. Kies een ander nummer, of laat het veld leeg voor het eerstvolgende vrije nummer uit de reeks.'));
      }
      var inv = {
        id: uid('inv'), projectId: projectId, stageKey: data.stageKey, label: data.label,
        amountCents: data.amountCents,
        currency: CURRENCIES.indexOf(data.currency) > -1 ? data.currency : 'EUR',
        /* functie 65: nummer uit de jaarteller + berekende btw-regel */
        invoiceNumber: data.invoiceNumber || '',
        vatMode: data.vatMode || 'verlegd',
        vatCents: data.vatCents || 0,
        totalCents: data.totalCents || data.amountCents,
        /* golf 8: conceptstand ook op facturen — een concept bestaat voor
           de klant niet (de portal filtert hem aan de bron weg) */
        publishStatus: data.publishStatus==='concept' ? 'concept' : 'published',
        /* FIXRONDE R1-4: publicatiemoment, net als media/documenten — de
           portal gebruikt dit als meldingstijd. Een concept krijgt hem pas
           bij publishInvoice. */
        publishedAt: data.publishStatus==='concept' ? null : new Date().toISOString(),
        status:'open', paidAt:null, documentId:null,
        createdAt: todayISO()
      };
      state.invoices.push(inv); save();
      return Promise.resolve(clone(inv));
    },
    /* golf 8: conceptfactuur publiceren — daarna ziet de klant hem op zijn
       betaalpad; het eventueel gekoppelde documentrecord flipt de UI apart */
    publishInvoice: function(id){
      var inv = state.invoices.find(function(i){ return i.id===id; });
      if(inv && inv.publishStatus==='concept'){
        inv.publishStatus = 'published';
        inv.publishedAt = new Date().toISOString(); /* FIXRONDE R1-4 */

       open); de bevestigingsvraag zit in de UI */
    markInvoiceUnpaid: function(id){

       en de documentKOPPELING blijven onaangeroerd. FIXRONDE R1-2: het
       gekoppelde documentRECORD loopt wél mee (titel + fase), anders staan
       er twee nummers voor één factuur in het portaal. */
    updateInvoice: function(id, data){
      var inv = state.invoices.find(function(i){ return i.id===id; });
      if(!inv) return Promise.resolve(null);
      var wantedNr = (data.invoiceNumber!==undefined) ? (data.invoiceNumber||'') : (inv.invoiceNumber||'');
      if(wantedNr && state.invoices.some(function(i){ return i.id!==id && i.invoiceNumber===wantedNr; })){
        return Promise.reject(new Error('Factuurnummer ' + wantedNr + ' staat al op een andere factuur. Kies een ander nummer.'));
      }
      var prevNum = inv.invoiceNumber || '', prevStage = inv.stageKey;
      if(data.label!==undefined) inv.label = data.label;
      if(data.amountCents!==undefined) inv.amountCents = data.amountCents;
      if(data.stageKey!==undefined) inv.stageKey = data.stageKey;
      if(data.currency!==undefined) inv.currency = CURRENCIES.indexOf(data.currency) > -1 ? data.currency : 'EUR';
      if(data.invoiceNumber!==undefined) inv.invoiceNumber = data.invoiceNumber || '';
      if(data.vatMode!==undefined) inv.vatMode = data.vatMode || 'verlegd';
      if(data.vatCents!==undefined) inv.vatCents = data.vatCents || 0;
      if(data.totalCents!==undefined) inv.totalCents = data.totalCents || inv.amountCents;
      save();
      return Promise.resolve(syncInvoiceDoc(inv, prevNum, prevStage));
    },

    addSample: function(projectId, data){

        state.samples.forEach(function(s){
          if(s.projectId===projectId && s.status==='approved') s.status='superseded';
        });
      }
      var s = {
        id: uid('smp'), projectId: projectId, roundLabel: data.roundLabel,
        mediaId: data.mediaId||null, status: data.status, note: data.note||'',
        roundDate: data.roundDate
      };
      state.samples.push(s); save();
      return Promise.resolve(clone(s));
