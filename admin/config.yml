  - name: "blog"
    label: "Blog articles"
    label_singular: "Article"
    folder: "content/blog"
    create: true
    format: "json"
    extension: "json"
    slug: "{{fields.slug}}"
    summary: "{{title}}"
    media_folder: "/images/blog"
    public_folder: "images/blog"
    fields:
      - { label: "Title", name: title, widget: string }
      - { label: "Slug (technical)", name: slug, widget: string, hint: "Same as the file name: lower case, words separated by hyphens. Do not change after publishing." }
      - { label: "Language", name: lang, widget: select, options: ["nl", "en"], default: "nl" }
      - { label: "Date", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Updated (optional)", name: updated, widget: string, required: false, default: "", hint: "YYYY-MM-DD. Leave empty until the article gets a real revision." }
      - label: "Category"
        name: category
        widget: select
        options:
          - { label: "Design", value: "ontwerp" }
          - { label: "Sourcing", value: "sourcing" }
          - { label: "Sampling", value: "sampling" }
          - { label: "Production", value: "productie" }
          - { label: "Quality", value: "kwaliteit" }
          - { label: "Logistics", value: "logistiek" }
          - { label: "Running the business", value: "ondernemen" }
      - { label: "Dek (one or two sentences that honestly summarise the piece)", name: dek, widget: text }
      - { label: "Card photo (optional — full bleed on the blog overview card)", name: photo, widget: image, required: false }
      - { label: "OG image (optional — social share preview)", name: ogImage, widget: image, required: false }
      - { label: "Series name (optional)", name: series, widget: string, required: false, default: "" }
      - { label: "Series part (0 when not in a series)", name: seriesPart, widget: number, default: 0, value_type: int, required: false }
      - { label: "Series total (0 when not in a series)", name: seriesTotal, widget: number, default: 0, value_type: int, required: false }
      - { label: "Closing CTA", name: ctaPath, widget: select, options: ["scope", "brief", "download"], default: "brief" }
      - label: "Related glossary terms (optional)"
        name: relatedTerms
        widget: list
        required: false
        hint: "Exact glossary term names, e.g. MOQ."
        field: { label: "Term", name: term, widget: string }
      - { label: "Related service (technical)", name: relatedService, widget: number, default: -1, value_type: int, hint: "Index in the services list. Leave -1 for automatic (based on the category)." }
      - label: "Body"
        name: body
        widget: list
        types:
          - label: "Paragraph"
            name: p
            widget: object
            fields:
              - { label: "Text", name: text, widget: text }
          - label: "Section heading (H2)"
            name: h2
            widget: object
            fields:
              - { label: "Text", name: text, widget: string }
          - label: "Subheading (H3)"
            name: h3
            widget: object
            fields:
              - { label: "Text", name: text, widget: string }
          - label: "Bullet list"
            name: ul
            widget: object
            fields:
              - label: "Items"
                name: items
                widget: list
                field: { label: "Item", name: item, widget: string }
          - label: "Quote"
            name: quote
            widget: object
            fields:
              - { label: "Text", name: text, widget: text }
          - label: "Stat"
            name: stat
            widget: object
            fields:
              - { label: "Value (e.g. 38%)", name: value, widget: string }
              - { label: "Label", name: label, widget: string }
              - { label: "Source", name: source, widget: string, hint: "Required. A stat without a source is not shown on the site." }
          - label: "Image"
            name: img
            widget: object
            fields:
              - { label: "Image", name: src, widget: image }
              - { label: "Caption (required)", name: caption, widget: string }
              - { label: "Credit (optional)", name: credit, widget: string, required: false }
              - { label: "Width", name: width, widget: select, options: ["text", "wide", "full"], default: "text" }
